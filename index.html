<style>
:root{--ink:#2b2622;--muted:#6f655c;--ochre:#c9772b;--blue:#2a5c8a;--paper:#fbf6ee;--line:#eadfce;--love:#c2185b}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{font:16px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;color:var(--ink);background:var(--paper);display:flex;flex-direction:column}
header{background:#1d3f61;color:#fff;padding:10px 12px 0}
header h1{font-size:17px;margin:0 0 8px;font-weight:600}
.tabs{display:flex;gap:6px;overflow-x:auto}
.tabs button{flex:0 0 auto;border:0;border-radius:10px 10px 0 0;padding:8px 14px;font-size:15px;background:#2a5c8a;color:#dfe9f3}
.tabs button.on{background:var(--paper);color:var(--ink);font-weight:600}
#map{height:42vh;min-height:250px;flex:0 0 auto}
.mapbtns{position:absolute;right:10px;top:10px;z-index:900;display:flex;flex-direction:column;gap:6px}
.mapbtns button{border:0;border-radius:10px;padding:8px 10px;font-size:14px;background:#fff;box-shadow:0 1px 5px rgba(0,0,0,.3)}
.mapbtns button.on{background:var(--blue);color:#fff}
#mapwrap{position:relative}
#list{flex:1 1 auto;overflow-y:auto;padding:8px 10px 120px}
.daytitle{font-weight:600;margin:6px 2px 8px;color:var(--ochre)}
.step{display:flex;gap:10px;background:#fff;border:1px solid var(--line);border-radius:12px;padding:10px;margin-bottom:8px}
.step{cursor:pointer}
.step.cur{border-color:var(--blue);box-shadow:0 0 0 2px rgba(42,92,138,.25);background:#f2f7fc}
.step.done{opacity:.55}
.badge{flex:0 0 34px;height:34px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:700;font-size:15px}
.k-audio{background:var(--ochre)} .k-food{background:#7a4b9c} .k-ferry{background:#555} .k-move{background:#888} .k-hotel{background:#2a8a5c} .k-kids{background:#1f8a9e} .k-walk{background:#5d7b2f} .k-love{background:var(--love)}
.body{flex:1;min-width:0}
.time{font-size:13px;color:var(--muted)}
.ttl{font-weight:600;margin:1px 0 3px}
.txt{font-size:14.5px}
.kid{font-size:14px;background:#fff4e0;border-radius:8px;padding:5px 8px;margin-top:6px}
.acts{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.acts button,.acts a{border:1px solid var(--line);background:#f6f1e9;border-radius:8px;padding:6px 10px;font-size:14px;color:var(--ink);text-decoration:none}
.acts .play{background:var(--ochre);border-color:var(--ochre);color:#fff;font-weight:600}
.pin{border-radius:50%;width:28px;height:28px;display:flex;align-items:center;justify-content:center;color:#fff;font:bold 13px sans-serif;border:2px solid #fff;box-shadow:0 1px 4px rgba(0,0,0,.45)}
.pin.sel{transform:scale(1.25)}
.me{width:18px;height:18px;border-radius:50%;background:#1a73e8;border:3px solid #fff;box-shadow:0 0 0 2px rgba(26,115,232,.4)}
#player{position:fixed;left:0;right:0;bottom:0;z-index:1000;background:#1d3f61;color:#fff;padding:8px 12px calc(8px + env(safe-area-inset-bottom));display:none}
#player .row{display:flex;align-items:center;gap:10px}
#player button{border:0;background:#fff;color:#1d3f61;border-radius:50%;width:42px;height:42px;font-size:18px;flex:0 0 42px}
#ptitle{flex:1;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#pbar{height:4px;background:rgba(255,255,255,.25);border-radius:2px;margin-top:6px}
#pbar div{height:4px;background:var(--ochre);border-radius:2px;width:0}
#near{position:fixed;left:10px;right:10px;bottom:76px;z-index:1001;background:#fff;border:2px solid var(--ochre);border-radius:14px;padding:10px 12px;box-shadow:0 4px 14px rgba(0,0,0,.25);display:none}
#near .acts{margin-top:6px}
.allaudio .step{align-items:center}
.small{font-size:13px;color:var(--muted);margin:10px 2px}
#show{position:fixed;inset:0;z-index:3000;background:#000;color:#fff;display:none;overflow:hidden}
#show .bg{position:absolute;inset:-4%;background-size:cover;background-position:center;opacity:0;transition:opacity 1.2s}
#show .bg.on{opacity:1;animation:kb var(--d,30s) linear forwards}
@keyframes kb{from{transform:scale(1) translate(0,0)}to{transform:scale(1.14) translate(-2%,-2%)}}
#show video.bg{object-fit:cover;width:108%;height:108%}
#show .shade{position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,.55) 0,rgba(0,0,0,0) 22%,rgba(0,0,0,0) 50%,rgba(0,0,0,.8) 100%)}
#show .bars{position:absolute;top:calc(8px + env(safe-area-inset-top));left:8px;right:8px;display:flex;gap:3px}
#show .bars i{flex:1;height:3px;background:rgba(255,255,255,.3);border-radius:2px;overflow:hidden}
#show .bars i b{display:block;height:100%;width:0;background:#fff}
#show .top{position:absolute;top:calc(18px + env(safe-area-inset-top));left:12px;right:12px;display:flex;align-items:center;gap:8px;font-size:14px}
#show .top .t{flex:1;opacity:.9;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#show .top button{border:0;background:rgba(0,0,0,.35);color:#fff;border-radius:50%;width:38px;height:38px;font-size:18px}
#show .big{position:absolute;left:0;right:0;top:30%;text-align:center;font-weight:800;font-size:min(16vw,84px);text-shadow:0 3px 18px rgba(0,0,0,.7);opacity:0;transform:translateY(12px);transition:all .8s}
#show .big.on{opacity:1;transform:none}
#show .cap{position:absolute;left:14px;right:14px;bottom:calc(92px + env(safe-area-inset-bottom));font-size:21px;font-weight:700;line-height:1.25;text-shadow:0 2px 10px rgba(0,0,0,.8)}
#show .sub{position:absolute;left:14px;right:14px;bottom:calc(64px + env(safe-area-inset-bottom));font-size:13.5px;opacity:.85;max-height:24px;overflow:hidden}
#show .cred{position:absolute;right:10px;bottom:calc(46px + env(safe-area-inset-bottom));font-size:10px;opacity:.6;max-width:70%;text-align:right}
#show .ctl{position:absolute;left:0;right:0;bottom:calc(6px + env(safe-area-inset-bottom));display:flex;justify-content:center;gap:22px}
#show .ctl button{border:0;background:rgba(255,255,255,.18);color:#fff;border-radius:50%;width:44px;height:44px;font-size:18px}
#show .tapl,#show .tapr{position:absolute;top:70px;bottom:120px;width:30%}
#show .tapl{left:0} #show .tapr{right:0}
#show .chapter{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;background:rgba(0,0,0,.45);font-size:30px;font-weight:800;padding:20px;opacity:0;transition:opacity .8s;pointer-events:none}
#show .chapter.on{opacity:1}
#show .chapter small{font-size:15px;font-weight:500;opacity:.8;margin-top:10px}
.thumbs{display:flex;gap:6px;overflow-x:auto;margin-top:8px}
.thumbs img{height:70px;border-radius:8px;flex:0 0 auto}
.film{background:linear-gradient(135deg,#1d3f61,#2a5c8a);color:#fff;border:0}
.film .txt,.film .time{color:#e6eef6}
.acts .watch{background:#1d3f61;border-color:#1d3f61;color:#fff;font-weight:600}

<script>
const DATA={"pres": {"intro": {"title": "Добро пожаловать в Колонию", "kid": "Слушай внимательно: на каждой остановке тебя ждёт задание.", "segs": [{"audio": "pres/intro-01.mp3", "text": "Добро пожаловать в Колонию-дель-Сакраменто, самый старый город Уругвая. Сегодня здесь живёт около тридцати двух тысяч человек. Если вы приплыли на пароме из Буэнос-Айреса, а он идёт сюда примерно полтора часа, то только что пересекли реку Ла-Плата. Её называют самой широкой рекой мира: в самом широком месте от берега до берега больше двухсот километров. Поэтому с набережной кажется, что перед вами море. А теперь послушайте, как здесь появился город.", "caption": "Колония-дель-Сакраменто: самый старый город Уругвая", "big": "самый старый", "img": "img/intro-2.jpg", "credit": "Germanramos, CC BY-SA 4.0"}, {"audio": "pres/intro-02.mp3", "text": "В январе тысяча шестьсот восьмидесятого года к острову Сан-Габриэль подошли корабли португальского командира Мануэла Лобу. С ним было около четырёхсот солдат и восемнадцать пушек. Они назвали своё поселение Новой колонией Святейшего Таинства, отсюда и имя города. Крепость построили на берегу, прямо напротив Буэнос-Айреса, а Буэнос-Айрес принадлежал Испании. Это было смелое и очень хитрое решение. Испания не разрешала чужакам торговать в своих колониях, а отсюда, через реку, можно было возить товары в обход запретов. Купцы из Рио-де-Жанейро помогли собрать эту экспедицию, потому что ждали хорошей прибыли. Колония быстро стала городом контрабандистов.", "caption": "Январь 1680: Мануэл Лобу основал крепость напротив Буэнос-Айреса", "big": "1680", "img": "img/intro-1.jpg", "credit": "Franco. Rodrigz. y Cardoso (digitized by Bibliothèque nationale de France, Gallica), Public domain"}, {"audio": "pres/intro-03.mp3", "text": "Испанцам это очень не понравилось. Седьмого августа того же года войско из Буэнос-Айреса, испанцы и около трёх тысяч индейцев-гуарани, взяло крепость. Её переименовали в Форт-дель-Росарио. Лобу попал в плен и умер в Буэнос-Айресе. Но по договору город всё равно вернули португальцам, и всё началось сначала.", "caption": "7 августа 1680: испанцы взяли крепость, Лобу попал в плен", "big": "7 августа", "img": "img/intro-3.jpg", "credit": "Unknown author, Public domain"}, {"audio": "pres/intro-04.mp3", "text": "Дальше почти сто лет шло перетягивание каната. Испанцы осаждали Колонию, португальцы возвращались. Одна осада тянулась почти два года. По договору тысяча семьсот пятидесятого года город собирались отдать Испании, но договор так и не выполнили. В тысяча семьсот шестьдесят втором году испанцы снова взяли Колонию, а по мирному договору её опять вернули Португалии. Окончательно город стал испанским в тысяча семьсот семьдесят седьмом году. В тысяча восемьсот седьмом году сюда на время вошли англичане, потом пришли португальско-бразильские войска. А в тысяча восемьсот двадцать восьмом году Колония вошла в состав нового государства Уругвай.", "caption": "Почти сто лет город переходил из рук в руки: до 1828 года", "big": "1680 → 1828", "img": "img/intro-4.jpg", "credit": "Embajada de los Estados Unidos en Uruguay from Montevideo, Uruguay, Public domain"}, {"audio": "pres/intro-05.mp3", "text": "Старый квартал совсем небольшой, меньше двадцати гектаров. Зато из-за такой судьбы он получился необычным. Португальцы подгоняли улицы под рельеф, и они вышли узкими и неровными. Чарльз Дарвин, побывав здесь в начале тридцатых годов девятнадцатого века, записал, что неправильность улиц и рощи старых апельсиновых и персиковых деревьев придают городу милый вид. Об этом мы ещё поговорим у ворот.", "caption": "Кривые португальские улочки: Дарвин назвал их милыми", "big": "", "img": "img/intro-5.jpg", "credit": "William Elliott, Public domain"}, {"audio": "pres/intro-06.mp3", "text": "К середине двадцатого века от крепостной стены почти ничего не осталось. В тысяча девятьсот шестьдесят восьмом году президент Уругвая подписал указ, с которого началось восстановление старого квартала. Заново поднялись стена и ворота, открылись музеи. А в тысяча девятьсот девяносто пятом году квартал внесли в список Всемирного наследия ЮНЕСКО. Там отметили, что план города подстроен под местность и не повторяет правил, по которым Испания строила свои колониальные города.", "caption": "1968: восстановление квартала. 1995: список ЮНЕСКО", "big": "1995", "img": "img/intro-4.jpg", "credit": "Embajada de los Estados Unidos en Uruguay from Montevideo, Uruguay, Public domain"}, {"audio": "pres/intro-07.mp3", "text": "Наша прогулка начнётся у старых городских ворот. Мы пройдём по улице Вздохов, постоим на главной площади, посмотрим на маяк, на реку и на остров, встретим закат на мысу, а закончим у самой старой церкви Уругвая. И вот что важно для самого юного путешественника: на каждой остановке тебя ждёт задание. Слушай внимательно!", "caption": "Маршрут: ворота, улица Вздохов, площадь, маяк, набережная, закат, церковь", "big": "", "img": "img/intro-1.jpg", "credit": "Franco. Rodrigz. y Cardoso (digitized by Bibliothèque nationale de France, Gallica), Public domain"}]}, "porton": {"title": "Ворота Портон-де-Кампо", "kid": "Представь, что ты стражник. Найди ров и мост. Как думаешь, зачем мост делали подъёмным? И найди самый большой камень в стене.", "segs": [{"audio": "pres/porton-01.mp3", "text": "Перед вами ворота Портон-де-Кампо, главный вход в старый город. Посмотрите вперёд, на толстую каменную стену. Потом вниз: перед воротами тянется ров, а над ним переброшен деревянный подъёмный мост. Эти ворота называют ещё Пуэрта-де-ла-Сьюдаделья, воротами цитадели. Через них из крепости выходили в поле, а враги, наоборот, мечтали пройти внутрь. От ворот стена уходит к реке, вдоль улицы Пасео-де-Сан-Мигель, а на травянистом берегу у её подножия удобно отдохнуть.", "caption": "Портон-де-Кампо: ворота, ров и деревянный подъёмный мост", "big": "", "img": "img/porton-1.jpg", "credit": "Liam Quinn from Canada, CC BY-SA 2.0"}, {"audio": "pres/porton-02.mp3", "text": "Построили их примерно в тысяча семьсот сорок пятом году, при португальском губернаторе Антониу Педру ди Васконселуше. Он управлял Колонией с тысяча семьсот двадцать второго года и сделал её самым богатым и самым укреплённым городом на берегах Ла-Платы. И укрепления ему пригодились.", "caption": "Примерно 1745 год: ворота при губернаторе Васконселуше", "big": "1745", "img": "img/porton-2.jpg", "credit": "Photograph by Mike Peel (www.mikepeel.net), CC BY-SA 4.0"}, {"audio": "pres/porton-03.mp3", "text": "В тысяча семьсот тридцать пятом году к городу подошла испанская армия из Буэнос-Айреса. Её вёл губернатор Мигель де Сальседо. Четыре тысячи триста человек, из них три тысячи индейцев-гуарани, против восьмисот сорока защитников крепости. Девятого декабря испанцы обрушили на стены две тысячи четыреста сорок ядер и шестьдесят шесть бомб и пробили брешь. Но все атаки через неё отбили. Осада тянулась почти два года и кончилась только тогда, когда из Европы приплыл корабль с вестью о перемирии.", "caption": "1735–1737: осада почти в два года, 840 защитников против 4300", "big": "почти 2 года", "img": "img/porton-3.jpg", "credit": "Liam Quinn from Canada, CC BY-SA 2.0"}, {"audio": "pres/porton-04.mp3", "text": "Прошло двадцать семь лет, и осенью тысяча семьсот шестьдесят второго года под стенами встал генерал Педро де Севальос. С ним было около двух тысяч семисот солдат и обоз из ста тринадцати повозок с тяжёлыми пушками, пришедший по суше из Монтевидео. Осада длилась пять недель. К двадцатому октября в стене было уже два пролома. Раненый португальский командир Висенте да Силва да Фонсека не стал ждать штурма и начал переговоры. Гарнизон вышел из города с воинскими почестями, а вместе с ним вышли тысяча шестьсот жителей.", "caption": "1762: пять недель осады, два пролома, сдача города", "big": "5 недель", "img": "img/porton-1.jpg", "credit": "Liam Quinn from Canada, CC BY-SA 2.0"}, {"audio": "pres/porton-05.mp3", "text": "В тысяча семьсот семьдесят седьмом году испанцы разобрали большую часть стен. Так что стена, которую вы видите, почти целиком восстановлена. Работы шли после тысяча девятьсот шестьдесят восьмого года, и ворота тоже собрали заново, частью из старых камней, частью из новых. С тысяча девятьсот семьдесят шестого года стена, ров и ворота охраняются государством как национальный памятник.", "caption": "Стену разобрали в 1777-м, восстановили после 1968 года", "big": "1968", "img": "img/porton-2.jpg", "credit": "Photograph by Mike Peel (www.mikepeel.net), CC BY-SA 4.0"}, {"audio": "pres/porton-06.mp3", "text": "И ещё одна любопытная деталь. Постойте у ворот и сравните два города. Внутри стен улочки узкие и кривые: португальцы подгоняли их под рельеф. А за линией бывшей стены кварталы расчерчены ровно, как клетки в тетради: так строили испанцы. Два разных города стоят вплотную друг к другу.", "caption": "Два города рядом: кривые улочки и ровные испанские кварталы", "big": "2 города", "img": "img/porton-1.jpg", "credit": "Liam Quinn from Canada, CC BY-SA 2.0"}, {"audio": "pres/porton-07.mp3", "text": "Задание для юного путешественника: представь, что ты стражник на воротах. Найди ров и мост. Как думаешь, зачем мост сделали подъёмным? А потом найди в стене самый большой камень. Взрослым вопрос: почему в крепости кривые улочки могли быть удобнее прямых? Рядом с воротами есть детская площадка, так что после задания можно побегать.", "caption": "Задание: стражник на воротах. Найди ров и мост. Зачем мост подъёмный?", "big": "Задание", "img": "img/porton-2.jpg", "credit": "Photograph by Mike Peel (www.mikepeel.net), CC BY-SA 4.0"}]}, "suspiros": {"title": "Улица Вздохов", "kid": "Встань в желобок посередине улицы. Куда побежит вода, если пойдёт дождь: вверх или вниз, к реке? Потом передай маме «телеграмму»: коротко «ти», долго «таа».", "segs": [{"audio": "pres/suspiros-01.mp3", "text": "Вы на Калье-де-лос-Суспирос, на улице Вздохов. Она начинается от главной площади и спускается к реке. Вместе с воротами Портон-де-Кампо её считают одним из самых характерных мест квартала. Остановитесь и посмотрите под ноги. Улица узкая, по ней ходят пешком. Мостовая выложена камнями-клиньями, тротуаров нет, а с обеих сторон она слегка наклонена к середине. Там получается желобок, по которому после дождя стекает вода. Теперь поднимите глаза. На стене табличка с названием улицы из португальской глазурованной плитки, она называется азулежу, а рядом висят фонари.", "caption": "Калье-де-лос-Суспирос: мостовая с желобом посередине", "big": "", "img": "img/suspiros-1.jpg", "credit": "Fredlyfish4, CC BY-SA 4.0"}, {"audio": "pres/suspiros-02.mp3", "text": "Дома вдоль улицы построили в первой половине восемнадцатого века. Стены каменные, крыши черепичные, а двери и окна маленькие и деревянные. Внутри, по описаниям, полы керамические. Присмотритесь к крышам: у всех они двускатные. Раньше встречались и трёхскатные, и четырёхскатные, но сохранились только двускатные. Эта улица одна из немногих, которые остались почти такими, какими были.", "caption": "Дома первой половины XVIII века, у всех крыши двускатные", "big": "XVIII век", "img": "img/suspiros-2.jpg", "credit": "Ypsilon from Finland, CC0"}, {"audio": "pres/suspiros-03.mp3", "text": "Почему же она улица Вздохов? Точно не знает никто. До тысяча девятьсот сороковых годов она называлась Ансина. Зато есть три легенды. Говорят, здесь стояли таверны, куда после долгих плаваний приходили и португальские, и испанские моряки, и они вздыхали по местным красавицам. По другой легенде, по этой улице к реке вели приговорённых, и они вздыхали в последний раз. А по третьей, самой романтичной, в лунную ночь здесь ждала возлюбленного девушка, но эта история кончилась печально. Выбирайте ту, что вам больше нравится.", "caption": "Откуда имя? Три легенды о вздохах", "big": "3 легенды", "img": "img/suspiros-3.jpg", "credit": "Diego Delso, CC BY-SA 3.0"}, {"audio": "pres/suspiros-04.mp3", "text": "А теперь история настоящая. На углу с улицей Сан-Педро стоит дом в португальском стиле, номер сто сорок два. Здесь работала телеграфная компания «Ривер-Плейт Телеграф». В октябре тысяча восемьсот шестьдесят шестого года британская фирма проложила по дну Ла-Платы кабель от Колонии до Пунта-Лара на аргентинском берегу, больше сорока километров. Это был первый телеграфный кабель Южной Америки. Телеграф похож на письмо, только оно бежит по проводу и очень быстро. По кабелю бежали короткие и длинные сигналы, а с ними деловые вести с того берега. Второй конец кабеля прятался в хлипком домике на берегу Пунта-Лара. В тысяча восемьсот семьдесят четвёртом году компанию купила другая, «Вестерн Телеграф». Часть этого кабеля работала до тысяча девятьсот семидесятого года. А историю телеграфа рассказывает небольшой музей на улице Дель-Колехио, детям там обычно интересно.", "caption": "1866: первый телеграфный кабель Южной Америки, Колония – Пунта-Лара", "big": "1866", "img": "img/suspiros-1.jpg", "credit": "Fredlyfish4, CC BY-SA 4.0"}, {"audio": "pres/suspiros-05.mp3", "text": "Задание для юного путешественника: встань в желобок посередине улицы. Если пойдёт дождь, куда побежит вода: вверх или вниз, к реке? А потом сыграем в телеграф. Скажи один раз коротко «ти», а потом долго «таа», и пусть мама или папа повторят. Это и есть сигналы, которые бежали по кабелю. Взрослым вопрос: какая из трёх легенд нравится вам больше всех?", "caption": "Задание: встань в желобок. Куда побежит дождевая вода?", "big": "Задание", "img": "img/suspiros-3.jpg", "credit": "Diego Delso, CC BY-SA 3.0"}]}, "plaza": {"title": "Пласа-Майор и музеи", "kid": "Сосчитай деревья на площади. А в музее найди старинную карту и покажи на ней реку.", "segs": [{"audio": "pres/plaza-01.mp3", "text": "Вы на Пласа-Майор, главной площади старого города. Оглядитесь. Площадь обсажена деревьями, вокруг стоят старые португальские дома, а в дальнем углу из руин монастыря вырастает маяк, к нему мы пойдём дальше. Здесь же, в нескольких шагах, три небольших музея: Эспасио Ребуффо и Вивьенда-Португеса на улице Дель-Комерсио и Эспасио Португес напротив площади. Заходить необязательно, но заглянуть в дверь стоит. Билеты в музеи продают только в Эспасио Ребуффо, а дни работы у музеев разные, расписание смотрите в приложении.", "caption": "Пласа-Майор: деревья, старые дома и маяк в углу", "big": "", "img": "img/plaza-1.jpg", "credit": "Fulviusbsas, CC BY-SA 3.0"}, {"audio": "pres/plaza-02.mp3", "text": "Давайте представим эту площадь пустой. Такой она могла стать в тысяча семьсот пятом году, когда долгая осада кончилась. Жителей увезли на португальских кораблях, а испанский командир Алонсо де Вальдес-и-Инклан приказал снести укрепления. Город опустел. Лишь после Утрехтского договора, который вернул Колонию Португалии, сюда снова приплыли больше тысячи колонистов и начали всё заново.", "caption": "1705: город опустел. После Утрехтского договора вернулись колонисты", "big": "1705", "img": "img/plaza-2.jpg", "credit": "Nicolas Barriola, CC BY-SA 3.0"}, {"audio": "pres/plaza-03.mp3", "text": "Правили городом португальские губернаторы. Их дом, Каса-де-лос-Гобернадорес, стоял у церкви, на другой площади, Пласа-де-Армас. Вместе с церковью это было главное здание города. От дома остались только фундаменты, их нашли при раскопках, как пишут, в семидесятых годах двадцатого века. Мы увидим их на последней остановке. А находки из этого дома показывают в Португальском музее, рядом с мебелью, старинными картами, оружием и военной одеждой. Сам дом считается образцовым примером португальского жилья, так что можно заглянуть и в комнаты. Городские власти пишут, что музей очень интересен детям и всей семье.", "caption": "Каса-де-лос-Гобернадорес: от дома остались фундаменты", "big": "фундаменты", "img": "img/plaza-3.jpg", "credit": "Fulviusbsas, CC BY-SA 3.0"}, {"audio": "pres/plaza-04.mp3", "text": "Эспасио Ребуффо назван в честь доктора Баутисты Ребуффо. Он основал музей Колонии и был его почётным директором. Этот зал открылся первым, в тысяча девятьсот пятьдесят первом году. Здесь рассказывают историю края от древних времён до наших дней, а вещи в залах принадлежали предкам нынешних жителей. А сам дом намного старше. Его построили в первой половине восемнадцатого века для португальских секретарей, как государственную контору. В разные времена в нём жили богатые горожане, работала больница, ютились многие семьи в одном доме и торговал магазин. Когда пришли испанцы, дом получил плоскую крышу и фасад в классическом стиле. Вот сколько жизней прожил один дом.", "caption": "Эспасио Ребуффо: первый музей города, 1951 год", "big": "1951", "img": "img/plaza-2.jpg", "credit": "Nicolas Barriola, CC BY-SA 3.0"}, {"audio": "pres/plaza-05.mp3", "text": "Рядом дом, который называют Вивьенда-Португеса или Каса-де-Накарелло. Он есть на планах города с тысяча семьсот тридцать второго года. Сохранились каменные стены и часть пола, а внутри показана повседневная жизнь по обычаям разных областей Португалии: Траз-уж-Монтиш, Миньу и Алентежу. Откуда имя Накарелло, мы надёжно не выяснили. Путеводители говорят, что так звали одного из хозяев.", "caption": "Вивьенда-Португеса: дом с плана 1732 года", "big": "1732", "img": "img/plaza-3.jpg", "credit": "Fulviusbsas, CC BY-SA 3.0"}, {"audio": "pres/plaza-06.mp3", "text": "Задание для юного путешественника: пока мы на площади, сосчитай деревья. А если зайдёте в Португальский музей, найди там старинную карту и покажи на ней реку. Взрослым вопрос: какую вещь из вашего дома вы хотели бы увидеть в музее через триста лет?", "caption": "Задание: посчитай деревья и найди в музее старинную карту", "big": "Задание", "img": "img/plaza-1.jpg", "credit": "Fulviusbsas, CC BY-SA 3.0"}]}, "faro": {"title": "Маяк и руины монастыря", "kid": "Где маяк квадратный, а где круглый? Сосчитай красные полосы и придумай историю про монаха из монастыря.", "segs": [{"audio": "pres/faro-01.mp3", "text": "Перед вами маяк и руины монастыря Сан-Франсиско, в юго-западном углу площади Пласа-Майор. Присмотритесь к самому маяку. Снизу у него каменное основание с четырьмя углами, то есть квадратное. А выше круглая башня с красными и белыми полосами. Вокруг стоят остатки монастырских стен, и вместе со всем старым кварталом они находятся под охраной ЮНЕСКО. С тысяча девятьсот семьдесят шестого года и маяк, и руины охраняются государством как национальный памятник.", "caption": "Маяк на руинах монастыря: снизу квадрат, сверху круг", "big": "", "img": "img/faro-1.jpg", "credit": "Diego Delso, CC BY-SA 3.0"}, {"audio": "pres/faro-02.mp3", "text": "Монастырь Сан-Франсиско-Хавьер, посвящённый святому Франциску Ксаверию, построили францисканцы в конце семнадцатого века. Когда-то здесь жили монахи. Потом случился большой пожар, и монастырь превратился в руины. Когда именно, источники спорят: называют тысяча семьсот четвёртый год и конец восемнадцатого века. Стены остались, а в середине девятнадцатого века на одной из старых монастырских башен вырос маяк. Поэтому у него и квадратное основание.", "caption": "Монастырь францисканцев XVII века: пожар и руины", "big": "XVII век", "img": "img/faro-2.jpg", "credit": "Huguitoportal, CC BY-SA 3.0"}, {"audio": "pres/faro-03.mp3", "text": "Строить его начали в тысяча восемьсот сорок пятом году солдаты армии Хуана Мануэля де Росаса, правителя Буэнос-Айреса, то есть соседа через реку. Потом началась долгая Великая война, как её называют в Уругвае, и работы встали. Их возобновили в тысяча восемьсот пятьдесят пятом году, а двадцать четвёртого января тысяча восемьсот пятьдесят седьмого года, при правлении Габриэля Перейры, маяк открыли. Всего на стройку ушло двенадцать лет.", "caption": "1845: начали строить. 24 января 1857: маяк открыт", "big": "1857", "img": "img/faro-3.jpg", "credit": "Diego Delso, CC BY-SA 3.0"}, {"audio": "pres/faro-04.mp3", "text": "Деньги на достройку собрали необычным способом. Всем кораблям, которые заходили в порты Колонии и Монтевидео, ввели налог. Получается, что свет для моряков оплатили сами корабли. Сначала в лампе горел керосин. Потом его заменили ацетиленовым газом, а затем электричеством. А с тысяча девятьсот девяносто седьмого года маяк питают солнечные батареи, и он светит до сих пор. Его свет виден примерно за четырнадцать километров. Сегодня маяк принадлежит военно-морскому флоту Уругвая.", "caption": "Налог на корабли, керосин, электричество, солнечные батареи с 1997", "big": "1997", "img": "img/faro-1.jpg", "credit": "Diego Delso, CC BY-SA 3.0"}, {"audio": "pres/faro-05.mp3", "text": "Городские власти пишут, что в этом каменном часовом спрятано много легенд. Ни одну из них мы не нашли в надёжных записях, поэтому пересказывать не будем. Зато у вас есть шанс придумать свою: кто жил в этом монастыре и что он видел с башни?", "caption": "Легенды маяка: придумайте свою", "big": "легенда", "img": "img/faro-3.jpg", "credit": "Diego Delso, CC BY-SA 3.0"}, {"audio": "pres/faro-06.mp3", "text": "Наверх ведут сто восемнадцать ступеней. Детей младше восьми лет туда не пускают, поэтому идите по очереди: один взрослый поднимается, а второй остаётся с детьми внизу. Говорят, сверху открывается невероятный вид на город и реку. А если вам интересны корабли, рядом есть военно-морской музей. Он рассказывает, почему этот маленький полуостров был таким важным.", "caption": "118 ступеней. Детей младше 8 лет наверх не пускают", "big": "118 ступеней", "img": "img/faro-2.jpg", "credit": "Huguitoportal, CC BY-SA 3.0"}, {"audio": "pres/faro-07.mp3", "text": "Задание для юного путешественника: найди, где маяк квадратный, а где круглый. Сосчитай красные полосы. А потом придумай историю про монаха, который жил в этом монастыре, и скажи, что выше: маяк или ближайший дом. Взрослым вопрос: почему маяк построили именно на старой башне?", "caption": "Задание: квадрат или круг? Сосчитай красные полосы", "big": "Задание", "img": "img/faro-1.jpg", "credit": "Diego Delso, CC BY-SA 3.0"}]}, "sangabriel": {"title": "Набережная Сан-Габриэль", "kid": "Найди вдали остров и помаши ему рукой. Сколько лодок и кораблей ты насчитал?", "segs": [{"audio": "pres/sangabriel-01.mp3", "text": "Вы на набережной Пасео-де-Сан-Габриэль, у самой воды. Посмотрите на реку. Далеко впереди лежит низкий остров с деревьями, это остров Сан-Габриэль. До него около трёх километров. Остров длиной примерно в километр, он занимает двадцать четыре гектара. Теперь оглянитесь на берег: мы стоим рядом с мысом Пунта-де-Сан-Педро, где португальцы построили бастион.", "caption": "Набережная Сан-Габриэль, вдали остров в трёх километрах", "big": "3 километра", "img": "img/sangabriel-3.jpg", "credit": "CHUCAO, CC BY-SA 3.0"}, {"audio": "pres/sangabriel-02.mp3", "text": "Остров знали задолго до города. Здесь останавливался Фернан Магеллан в тысяча пятьсот двадцатом году, а в тысяча пятьсот двадцать седьмом году мореплаватель Себастьян Кабот дал острову имя святого Габриэля. История города началась именно здесь. В тысяча шестьсот восьмидесятом году лодочник из Буэнос-Айреса по имени Маркос Роман поплыл сюда за дровами и увидел у острова четыре незнакомых корабля. Чьи они, он не знал и поспешил сообщить властям. А в том же году Мануэл Лобу высадился на острове и от имени своего короля объявил и острова, и берег португальскими.", "caption": "1680: лодочник Маркос Роман увидел у острова четыре корабля", "big": "4 корабля", "img": "img/sangabriel-2.jpg", "credit": "Ypsilon from Finland, CC0"}, {"audio": "pres/sangabriel-03.mp3", "text": "Позже Лобу написал письмо португальскому принцу Педру. Он рассказал, что на материке, который они успели осмотреть, нет ни одного леса, а острова сплошь покрыты деревьями, и что на берегу много камня. Деревья с острова пошли на первые хижины, пока в крепости строили казармы. Вот почему остров был так нужен. Камень отсюда возили на городские укрепления, а в тысяча восемьсот девяносто третьем году даже на строительство порта Буэнос-Айреса.", "caption": "Письмо Лобу принцу: на острове деревья, на берегу камень", "big": "", "img": "img/sangabriel-1.jpg", "credit": "Photograph by Mike Peel (www.mikepeel.net), CC BY-SA 4.0"}, {"audio": "pres/sangabriel-04.mp3", "text": "Пока Колония оставалась португальской, остров служил убежищем. Здесь прятались десятки кораблей, и отсюда шла тайная торговля на всей Ла-Плате. В тысяча семьсот тридцать шестом году, во время войны с Испанией, португальцы укрепили на острове редут с шестью пушками. А бастион Сан-Педро один из шести, которые в тысяча семьсот двадцатых годах построили вдоль воды при губернаторе Васконселуше. Сегодня он охраняется государством как национальный памятник.", "caption": "Остров-убежище: десятки кораблей, редут с шестью пушками", "big": "6 пушек", "img": "img/sangabriel-3.jpg", "credit": "CHUCAO, CC BY-SA 3.0"}, {"audio": "pres/sangabriel-05.mp3", "text": "В старом квартале есть дом, который называют Домом вице-короля. Его воссоздали на старых руинах уже после тысяча девятьсот шестьдесят восьмого года. И вот загадка: ни один вице-король в Колонии не жил. Возможно, имя дали в честь генерала Педро де Севальоса, который взял город и в тысяча семьсот семьдесят седьмом году стал первым вице-королём Рио-де-ла-Платы. Но документов об этом нет.", "caption": "Дом вице-короля: загадка имени", "big": "загадка", "img": "img/sangabriel-1.jpg", "credit": "Photograph by Mike Peel (www.mikepeel.net), CC BY-SA 4.0"}, {"audio": "pres/sangabriel-06.mp3", "text": "И ещё одно совпадение. В тысяча девятьсот девяносто пятом году остров Сан-Габриэль объявили национальным парком. В тот же год старый квартал Колонии попал в список ЮНЕСКО.", "caption": "1995: остров стал национальным парком, квартал попал в список ЮНЕСКО", "big": "1995", "img": "img/sangabriel-2.jpg", "credit": "Ypsilon from Finland, CC0"}, {"audio": "pres/sangabriel-07.mp3", "text": "Задание для юного путешественника: найди вдали остров и помаши ему рукой. Потом сосчитай, сколько лодок и кораблей видно на реке. Взрослым вопрос: почему Лобу сначала занял остров, а не сразу берег?", "caption": "Задание: найди остров и сосчитай лодки на реке", "big": "Задание", "img": "img/sangabriel-3.jpg", "credit": "CHUCAO, CC BY-SA 3.0"}]}, "santarita": {"title": "Мыс Санта-Рита: закат", "kid": "Назови три цвета, которые видишь в воде и в небе. И загадайте одно желание на всю семью. Только никому не рассказывай!", "segs": [{"audio": "pres/santarita-01.mp3", "text": "Вы на мысу Санта-Рита. Встаньте лицом к реке. Вдоль воды стоят скамейки, а если обернуться, видна гавань, которую называют Старым портом. В ней помещается больше ста шестидесяти лодок и яхт. Здесь, как и на мысу Сан-Педро, в тысяча семьсот двадцатых годах португальцы поставили бастион Санта-Рита. Сейчас это одно из лучших мест, чтобы встретить закат. Солнце сядет прямо над рекой, в начале ноября это бывает около половины восьмого вечера.", "caption": "Мыс Санта-Рита: Старый порт и бастион, закат около 19:30", "big": "около 19:30", "img": "img/santarita-1.jpg", "credit": "Banfield, CC BY-SA 3.0"}, {"audio": "pres/santarita-02.mp3", "text": "Посмотрите на цвет воды. Она не голубая, а мутноватая, ближе к коричневому. Дело в иле и глине: каждый год в Ла-Плату попадает около ста шестидесяти миллионов тонн осадка. Зато вода почти не солёная, и мореплаватель Хуан Диас де Солис назвал реку Пресным морем. В её водах живёт маленький речной дельфин франсискана. А закатное солнце красит реку в золото и медь.", "caption": "Цвет воды: ил и глина, 160 миллионов тонн осадка в год", "big": "160 млн тонн", "img": "img/santarita-2.jpg", "credit": "Mx. Granger, CC0"}, {"audio": "pres/santarita-03.mp3", "text": "Название Ла-Плата значит «серебряная». По легенде, мореплаватели увидели серебро у местных жителей и решили, что в глубине земли лежит Серебряная гора. Искали, не нашли, а имя реке осталось. Запомните эту легенду, потому что вся история Колонии про серебро. Кстати, на этой реке штормы собираются быстро и бывают яростными, поэтому здесь затонуло немало кораблей. Особенно известен холодный юго-западный ветер памперо.", "caption": "Ла-Плата значит «серебряная»: легенда о Серебряной горе", "big": "легенда", "img": "img/santarita-1.jpg", "credit": "Banfield, CC BY-SA 3.0"}, {"audio": "pres/santarita-04.mp3", "text": "Настоящее серебро добывали далеко, в горах Верхнего Перу. Испанская корона хотела, чтобы оно уходило только в Испанию. Но португальские и английские купцы везли в Колонию сахар, табак, хлопок и европейские товары и получали за них серебро. Покупатели с испанского берега приплывали за этими товарами тайком. Так работала контрабанда.", "caption": "Сахар, табак, ткани в обмен на серебро: так работала контрабанда", "big": "контрабанда", "img": "img/santarita-2.jpg", "credit": "Mx. Granger, CC0"}, {"audio": "pres/santarita-05.mp3", "text": "Купцов в городе было больше ста человек. Многие из них просили губернатора стать крёстным отцом своих детей: дружить с властью было очень выгодно. Колония отправляла в Рио-де-Жанейро кожи, а ещё здесь выращивали пшеницу, лён, коноплю и виноград. Представьте вечер вроде этого: у причалов суда, на берегу торгуются купцы, а над рекой садится солнце.", "caption": "Больше ста купцов, крёстные отцы-губернаторы и кожи на экспорт", "big": "100+ купцов", "img": "img/santarita-1.jpg", "credit": "Banfield, CC BY-SA 3.0"}, {"audio": "pres/santarita-06.mp3", "text": "Эти воды видели и настоящий бой. Шестого января тысяча семьсот шестьдесят третьего года англо-португальская эскадра попыталась отбить город у испанцев. Корабли встали на якорь перед Колонией и около трёх часов обстреливали укрепления. Испанские пушки ответили, на английском корабле «Лорд Клайв» начался пожар, огонь дошёл до пороховой кладовой, и корабль взорвался. Остальные корабли ушли назад в Рио-де-Жанейро, и город остался испанским.", "caption": "6 января 1763: бой на реке, «Лорд Клайв» взорвался", "big": "1763", "img": "img/santarita-2.jpg", "credit": "Mx. Granger, CC0"}, {"audio": "pres/santarita-07.mp3", "text": "Задание для юного путешественника: когда солнце начнёт садиться, назови три цвета, которые видишь в воде и в небе. А потом загадайте одно желание на всю семью. Только никому не рассказывай! Взрослым вопрос: о чём мечтал купец, глядя на этот закат триста лет назад?", "caption": "Задание: три цвета заката и одно общее желание", "big": "Задание", "img": "img/santarita-1.jpg", "credit": "Banfield, CC BY-SA 3.0"}]}, "muelle": {"title": "Старый причал и порт яхт", "kid": "Найди лодку с самой высокой мачтой и сосчитай все мачты, которые видишь. Сколько их?", "segs": [{"audio": "pres/muelle-01.mp3", "text": "Вы стоите у старого деревянного причала. Слышите, как поскрипывают доски и позвякивают о мачты тросы? Это Пуэрто-Вьехо, старый порт Колонии, а сегодня порт для яхт. Он лежит у мыса Санта-Рита, и здесь, как пишут, могут встать больше ста шестидесяти лодок. Летом сюда приходят хозяева яхт из Аргентины, ведь до Буэнос-Айреса по воде всего около пятидесяти километров. Съезжаются сюда и участники парусных гонок по реке Ла-Плата. А на островке Сан-Габриэль напротив есть крошечный причал для лодок с небольшой осадкой.", "caption": "Пуэрто-Вьехо: старый порт Колонии, а сегодня порт яхт", "big": "160+", "img": "img/muelle-1.jpg", "credit": "Patricio.lorente, CC BY-SA 2.5"}, {"audio": "pres/muelle-02.mp3", "text": "А теперь перенесёмся почти на триста пятьдесят лет назад. Колонию основали португальцы в тысяча шестьсот восьмидесятом году. Напротив, на другом берегу, стоял Буэнос-Айрес, испанский город, где чужим купцам торговать не разрешали. Но португальцы мечтали продавать испанским колонистам бразильский сахар, табак, хлопок и европейские товары. А взамен получать серебро, которое шло сюда с гор Верхнего Перу.", "caption": "1680: португальцы основали Колонию прямо напротив Буэнос-Айреса", "big": "1680", "img": "img/muelle-2.jpg", "credit": "Liam Quinn from Canada, CC BY-SA 2.0"}, {"audio": "pres/muelle-03.mp3", "text": "Так порт Колонии стал контрабандным. Историки пишут, что город был оживлённым центром португальской и английской контрабанды. Представьте тёмную ночь и лодку без огней, которая тихо отходит от этого берега. Это только воображение, но такие рейсы, по сути, и кормили город. А в Рио-де-Жанейро отсюда уходили кожи: шкуры быков, которых добывали в степях вокруг. Колонисты ещё и сеяли пшеницу, коноплю и лён, выращивали виноград, а дерево и продукты им привозили.", "caption": "Контрабанда: бразильский сахар и табак в обмен на серебро", "big": "", "img": "img/muelle-1.jpg", "credit": "Patricio.lorente, CC BY-SA 2.5"}, {"audio": "pres/muelle-04.mp3", "text": "Эти воды видели и настоящие бои. В феврале тысяча восемьсот двадцать шестого года шла война за эти земли между Бразилией и Аргентиной, и к Колонии подошёл адмирал Гильермо Браун со своими кораблями. Бразильский командир Мануэл Жорже Родригиш, которому предложили сдаться, ответил, что судьбу городов решает только судьба оружия. Бой шёл у бастиона Сан-Педро, один бриг сел на мель у островка Сан-Габриэль, а ночью загорелся другой. Колония выстояла, и спустя две недели Браун ушёл в Буэнос-Айрес.", "caption": "1826: адмирал Браун атакует порт Колонии", "big": "1826", "img": "img/muelle-2.jpg", "credit": "Liam Quinn from Canada, CC BY-SA 2.0"}, {"audio": "pres/muelle-05.mp3", "text": "Потом на смену парусникам пришли пароходы, и через реку пошли регулярные рейсы. А первого апреля тысяча девятьсот первого года в город пришла железная дорога. Сегодня порт Колонии самый оживлённый на всей этой реке. В две тысячи двадцать третьем году через его терминал прошли два миллиона шестьсот семьдесят тысяч пассажиров, и это был новый рекорд. Многие из них приплыли на таких же паромах, как ваш.", "caption": "Рекорд порта Колонии: 2 670 000 пассажиров в год", "big": "2,67 млн", "img": "img/muelle-1.jpg", "credit": "Patricio.lorente, CC BY-SA 2.5"}, {"audio": "pres/muelle-06.mp3", "text": "А теперь для тебя, юный путешественник. Посмотри на лодки: у одних мачты высокие, у других совсем маленькие. Видишь, как лодки чуть покачиваются, будто кивают друг другу? Задание для юного путешественника: найди лодку с самой высокой мачтой и сосчитай все мачты, которые увидишь. Сколько их получилось? Какая лодка понравилась тебе больше всех? Придумай ей имя и скажи, куда бы ты на ней отправился.", "caption": "Задание: сосчитай мачты на яхтах", "big": "", "img": "img/muelle-2.jpg", "credit": "Liam Quinn from Canada, CC BY-SA 2.0"}]}, "carmen": {"title": "Бастион дель Кармен, труба и аквариум", "kid": "Посмотри на трубу и сравни её с маяком: выше она или ниже? Придумай трубе имя.", "segs": [{"audio": "pres/carmen-01.mp3", "text": "Перед вами высокая кирпичная труба, а рядом низкие старые здания. Представьте, что вы пришли сюда в девятнадцатом веке. Из трубы валит дым, во дворе работают люди, а в больших котлах варится мыло. Так, по рассказам путеводителей, и было: здесь стояла фабрика, где варили мыло, мыли шерсть и выделывали кожу. Называлась она Караччоло. Один путеводитель даёт даже год постройки, тысяча восемьсот восьмидесятый, но надёжных документов об этом мы не нашли.", "caption": "Кирпичная труба бывшей мыльной фабрики Караччоло", "big": "", "img": "img/carmen-1.jpg", "credit": "Flaviohmg, CC BY-SA 4.0"}, {"audio": "pres/carmen-02.mp3", "text": "Самое надёжное свидетельство это государственный указ тысяча девятьсот семьдесят шестого года. В нём Уругвай объявил национальными памятниками самые ценные места Колонии: городскую стену и ворота Портон-де-Кампо, откуда началась ваша прогулка, руины монастыря, базилику. В том же списке значатся здания бывшей мыльной фабрики Караччоло и её труба, на углу улиц Ривадавия и Вирей-Себальос. Так что труба, на которую вы смотрите, охраняется государством, как крепостная стена или маяк.", "caption": "1976: фабрика и труба объявлены национальным памятником", "big": "1976", "img": "img/carmen-2.jpg", "credit": "Liam Quinn from Canada, CC BY-SA 2.0"}, {"audio": "pres/carmen-03.mp3", "text": "Название «Бастион дель Кармен» уводит ещё глубже в прошлое. Начиная с тысяча семьсот двадцать второго года португальский губернатор Антониу Педру ди Васконселуш, тот самый, что построил ворота Портон-де-Кампо, превращал Колонию в самый укреплённый город региона. Вдоль воды выросли шесть бастионов: Сан-Педро, Сан-Мигел, Санту-Антониу, Сан-Жуан, Санта-Рита и Карму, по-испански Кармен. О последнем и напоминает название этого места.", "caption": "1722: шесть бастионов вдоль воды, среди них Кармо (Кармен)", "big": "6 бастионов", "img": "img/carmen-1.jpg", "credit": "Flaviohmg, CC BY-SA 4.0"}, {"audio": "pres/carmen-04.mp3", "text": "Мыло, которым вы моете руки, и в те времена варили из жира, смешивая его со щёлоком и долго кипятя. Запах, наверное, стоял над всем берегом. Теперь здесь пахнет рекой и травой. В бывших цехах работают культурный центр и театр, идут спектакли и концерты, а вокруг лужайка, с которой открывается вид на реку. Загляните на афишу: по городскому календарю в пятницу вечером здесь назначен спектакль. Хорошее место, чтобы присесть, пока дети бегают по траве.", "caption": "Теперь здесь театр, культурный центр и лужайка у реки", "big": "", "img": "img/carmen-2.jpg", "credit": "Liam Quinn from Canada, CC BY-SA 2.0"}, {"audio": "pres/carmen-05.mp3", "text": "А совсем рядом, на улице Вирей-Себальос, спрятан аквариум рыб, которые живут в местных реках. Он устроен как большой грот, в его стенах прорезаны окна, и ты смотришь на рыб, будто из подводной пещеры. Рядом стоят компьютеры и таблички, где рассказывают, как рыбы живут в воде. Электрические рыбы умеют создавать разряды тока, и здесь эти разряды можно услышать. Аквариум признан местом национального интереса для туризма и образования, а в две тысячи одиннадцатом году получил культурную премию Моросоли.", "caption": "Аквариум местных рыб: грот с окнами и звуки электрических рыб", "big": "", "img": "img/carmen-1.jpg", "credit": "Flaviohmg, CC BY-SA 4.0"}, {"audio": "pres/carmen-06.mp3", "text": "Задание для юного путешественника: посмотри на трубу и сравни её с маяком, который мы видели. Она выше или ниже? Потом придумай трубе имя, ведь она стоит здесь уже очень давно и всё помнит. А если пойдёте в аквариум, найди рыбу, которая понравится тебе больше всех, и расскажи, чем она особенная.", "caption": "Задание: сравни трубу с маяком", "big": "", "img": "img/carmen-2.jpg", "credit": "Liam Quinn from Canada, CC BY-SA 2.0"}]}, "basilica": {"title": "Базилика Святейшего Таинства", "kid": "Найди на стене церкви места, где камни разные: старые и новые. Сколько разных видов камня насчитал?", "segs": [{"audio": "pres/basilica-01.mp3", "text": "Вы стоите перед самой старой церковью Уругвая, Базиликой Святейшего Таинства. Приход основали второго февраля тысяча шестьсот восьмидесятого года, через считанные дни после основания города. Первая церковь была хижиной из соломы и глины. Каменную, на извести, начали строить в тысяча шестьсот девяносто девятом году по приказу губернатора Себастьяна де Вейга Кабрала. Потом её не раз разрушали при осадах и строили заново.", "caption": "Основана 2 февраля 1680 года: самая старая церковь Уругвая", "big": "1680", "img": "img/basilica-2.jpg", "credit": "Heretiq, CC BY-SA 3.0"}, {"audio": "pres/basilica-02.mp3", "text": "В тысяча семьсот семьдесят седьмом году церковь сильно пострадала при бомбардировке, и приход на время молился в других часовнях. Нынешнее здание возводили с тысяча восемьсот восьмого по тысяча восемьсот десятый год по проекту испанского архитектора Томаса Торибио. Казалось, теперь церковь простоит долго. Но тринадцать лет спустя случилась история, о которой в Колонии вспоминают до сих пор.", "caption": "1808–1810: новое здание по проекту архитектора Томаса Торибио", "big": "1810", "img": "img/basilica-1.jpg", "credit": "Carlos E. Gonzalez, CC BY-SA 3.0"}, {"audio": "pres/basilica-03.mp3", "text": "Утро воскресенья, четырнадцатое декабря тысяча восемьсот двадцать третьего года. Над городом гроза. Колонией тогда владела Бразилия, и под ризницей, комнатой, где хранят облачения священников, был пороховой склад. Жители возражали против такого соседства, но их не послушали. Молния ударила в церковь. Порох взорвался, главный алтарь и ризница разлетелись, и работа Торибио была разрушена.", "caption": "14 декабря 1823: молния попала в пороховой склад под ризницей", "big": "1823", "img": "img/basilica-3.jpg", "credit": "Helge Høifødt, CC BY-SA 3.0"}, {"audio": "pres/basilica-04.mp3", "text": "Спустя десять лет, семнадцатого ноября тысяча восемьсот тридцать третьего года, в Колонию приехал двадцатичетырёхлетний натуралист Чарльз Дарвин с корабля «Бигль». Он записал, что церковь служила пороховым складом, что две трети здания снесло до основания, а то, что осталось, это любопытный памятник объединённой силе молнии и пороха. Про сам город он написал теплее: неровные улицы и рощи старых апельсиновых и персиковых деревьев придают ему милый вид.", "caption": "17 ноября 1833: Чарльз Дарвин видит «любопытную руину»", "big": "1833", "img": "img/basilica-1.jpg", "credit": "Carlos E. Gonzalez, CC BY-SA 3.0"}, {"audio": "pres/basilica-05.mp3", "text": "В другом блокноте Дарвина есть пометка про одиннадцать погибших, но он услышал об этом через много лет от местных жителей, так что точное число жертв неизвестно. Церковь отстраивали с тысяча восемьсот тридцать шестого по тысяча восемьсот сорок первый год. А в двадцатом веке реставраторы вернули фасаду прежний вид и поставили на место колокольни с изразцовыми куполами.", "caption": "Число жертв неизвестно; восстановление 1836–1841", "big": "1836–1841", "img": "img/basilica-2.jpg", "credit": "Heretiq, CC BY-SA 3.0"}, {"audio": "pres/basilica-06.mp3", "text": "При ремонте тысяча девятьсот семьдесят шестого года часть старых стен нарочно оставили на виду. Присмотритесь к боковой стене: вы увидите два вида кладки. Один это португальский камень, другой испанский кирпич. Внутри хранятся вещи ещё старше взрыва: купель около тысяча семисотого года, распятие, которое вырезали индейцы из иезуитских миссий, и дарохранительница из жакаранды.", "caption": "Два вида кладки: португальский камень и испанский кирпич", "big": "", "img": "img/basilica-3.jpg", "credit": "Helge Høifødt, CC BY-SA 3.0"}, {"audio": "pres/basilica-07.mp3", "text": "Перед базиликой площадь Пласа-де-Армас, названная именем основателя города, Мануэла Лобу. А слева от церкви, в нескольких десятках шагов, видны каменные основания Дома губернаторов. Их нашли при раскопках. Вместе с церковью это было главное здание города, а найденные там вещи показывают в Португальском музее. На этом наша прогулка закончена. Спасибо, что гуляли с нами! Задание для юного путешественника: найди на стене церкви места, где камни разные, одни старые, другие новые. Сколько разных видов камня ты насчитал?", "caption": "Пласа-де-Армас и фундаменты Дома губернаторов рядом с церковью", "big": "", "img": "img/basilica-2.jpg", "credit": "Heretiq, CC BY-SA 3.0"}]}, "paleo": {"title": "Музей древних гигантов", "kid": "Найди панцирь глиптодонта и встань рядом. Поместился бы ты под ним, как под крышей? А мама с папой?", "segs": [{"audio": "pres/paleo-01.mp3", "text": "Добро пожаловать в маленький музей больших зверей. Он стоит в районе Реаль-де-Сан-Карлос и носит имя Армандо Калькатерры. Здесь хранят кости и панцири животных, которые жили в ледниковую эпоху, когда по здешним равнинам бродили настоящие гиганты. Таких животных называют мегафауной, то есть «большими зверями». Многие находки сделаны в самом департаменте Колония, совсем рядом с вами.", "caption": "Музей Армандо Калькатерры: кости и панцири «больших зверей»", "big": "", "img": "img/paleo-1.jpg", "credit": "Mike Dickison, CC BY 4.0"}, {"audio": "pres/paleo-02.mp3", "text": "Главные звёзды музея это глиптодонты. Представьте броненосца, которого надули до размеров автомобиля. Это не шутка: броненосцы им родственники. Панцирь глиптодонта состоял из сотен костяных пластинок, подогнанных друг к другу, как мозаика, и поднимался куполом. Крупный родственник по имени дедикур был длиной около трёх с половиной метров, а весил в среднем почти полторы тонны, как бегемот. Питались такие звери травой.", "caption": "Глиптодонты: родственники броненосцев размером с автомобиль", "big": "1,4 тонны", "img": "img/paleo-2.jpg", "credit": "Zissoudisctrucker, CC BY-SA 4.0"}, {"audio": "pres/paleo-03.mp3", "text": "А у дедикура на хвосте была настоящая булава. Хвост срастался в твёрдый костяной стержень, и булава длиной до метра весила, по оценкам учёных, от сорока до шестидесяти пяти килограммов. При размахе её конец мог двигаться со скоростью около сорока километров в час. С таким защитником лучше было не спорить.", "caption": "Хвост-булава дедикура: до метра длиной, удар около 40 км/ч", "big": "40 км/ч", "img": "img/paleo-1.jpg", "credit": "Mike Dickison, CC BY 4.0"}, {"audio": "pres/paleo-04.mp3", "text": "Были звери и покрупнее. Гигантский ленивец мегатерий вырастал до шести метров в длину и весил три-четыре тонны, почти как слон. Он объедал листья и ветки деревьев. Ближайшие живые родственники мегатерия, по данным генетиков, это ленивцы, которые медленно висят на ветках в тропических лесах. Первый скелет мегатерия нашли в тысяча семьсот восемьдесят седьмом году у реки Луян в Аргентине и отправили в Мадрид в семи ящиках.", "caption": "Мегатерий: шесть метров и три-четыре тонны, как слон", "big": "6 метров", "img": "img/paleo-3.jpg", "credit": "ABelov2014, CC BY-SA 3.0"}, {"audio": "pres/paleo-05.mp3", "text": "Теперь история про человека, которого вы уже встречали в базилике. Двадцать шестого ноября тысяча восемьсот тридцать третьего года Чарльз Дарвин купил у фермера в Уругвае, возле ручья Саранди, притока реки Рио-Негро, череп неизвестного зверя и заплатил восемнадцать пенсов. Местные мальчишки использовали череп как мишень и выбили в нём зубы камнями. Позже зверя назвали токсодоном. Он был длиной около двух с половиной метров и немного походил на смесь бегемота с носорогом. Дарвин назвал его одним из самых странных животных, когда-либо найденных.", "caption": "26 ноября 1833: Дарвин покупает череп токсодона за 18 пенсов", "big": "18 пенсов", "img": "img/paleo-2.jpg", "credit": "Zissoudisctrucker, CC BY-SA 4.0"}, {"audio": "pres/paleo-06.mp3", "text": "Уругвай вообще богат такими находками. Остатки глиптодонта у ручья Солис-Гранде описал в тысяча восемьсот четырнадцатом году учёный Дамасо Антонио Ларраньяга и принял за кости гигантского броненосца. А на обрывах у пляжа Кию нашли череп самого крупного из известных грызунов, размером с голову коровы. Он жил от двух до трёх миллионов лет назад, и его назвали в честь национального героя Артигаса.", "caption": "Находки Уругвая: глиптодонт 1814 года и гигантский грызун", "big": "", "img": "img/paleo-3.jpg", "credit": "ABelov2014, CC BY-SA 3.0"}, {"audio": "pres/paleo-07.mp3", "text": "Куда всё это исчезло? Большинство таких зверей вымерло около двенадцати тысяч лет назад. Люди к тому времени уже жили в Южной Америке, а климат менялся. Учёные до сих пор спорят, что сыграло главную роль, перемены климата или охота. Многие считают, что люди тоже внесли свой вклад. В Аргентине нашли место, где около двенадцати с половиной тысяч лет назад разделывали мегатерия.", "caption": "Около 12 000 лет назад: почему вымерла мегафауна", "big": "12 000", "img": "img/paleo-1.jpg", "credit": "Mike Dickison, CC BY 4.0"}, {"audio": "pres/paleo-08.mp3", "text": "Задание для юного путешественника: найди в музее панцирь глиптодонта и встань рядом. Как думаешь, ты бы поместился под ним, как под крышей? А мама с папой? Сколько человек поместилось бы под таким панцирем? И придумай этому зверю имя, какое-нибудь смешное.", "caption": "Задание: поместишься ли ты под панцирем?", "big": "", "img": "img/paleo-2.jpg", "credit": "Zissoudisctrucker, CC BY-SA 4.0"}]}, "toros": {"title": "Арена Пласа-де-Торос", "kid": "Пройди по кругу и сосчитай арки. Сколько получилось? Закрой глаза и представь восемь тысяч зрителей.", "segs": [{"audio": "pres/toros-01.mp3", "text": "Название района, Реаль-де-Сан-Карлос, придумали испанские солдаты. В начале шестидесятых годов восемнадцатого века они стояли здесь лагерем и осаждали португальскую крепость, а лагерь назвали в честь короля Карла Третьего. Лагерь давно исчез, и мало кто о нём помнит, зато спустя полтора века на этом месте вырос самый необычный курорт на берегах Ла-Платы.", "caption": "Реаль-де-Сан-Карлос: лагерь испанцев в честь короля Карла III", "big": "", "img": "img/toros-1.jpg", "credit": "Chzemog, CC BY-SA 3.0"}, {"audio": "pres/toros-02.mp3", "text": "Его задумал Николас Миханович, судовладелец родом из Хорватии. Пароходы его компании возили людей через реку, и он решил построить на этом берегу курорт для гостей из Буэнос-Айреса. Разрешение он получил третьего июня тысяча девятьсот восьмого года. В планах были гостиница с казино, площадка для баскской пелоты, своя электростанция и главное украшение, огромная арена для корриды.", "caption": "1908: судовладелец Николас Миханович получает разрешение на курорт", "big": "1908", "img": "img/toros-2.jpg", "credit": "Mariola0675, CC BY-SA 3.0"}, {"audio": "pres/toros-03.mp3", "text": "Арену построили примерно за восемь месяцев, и строительство одобрил парламент Уругвая. Проект сделал тоже хорват, архитектор Йосип Маркович, в стиле неомудехар: так называют мавританские мотивы, как на испанских аренах. В поперечнике здание около ста метров, а песчаный круг посередине около пятидесяти. Железный каркас привезли из-за границы и собрали прямо здесь, а кирпичи и черепицу делали на местном заводе. Трибуны вмещали около восьми тысяч человек.", "caption": "Арена в стиле неомудехар: около 100 метров в поперечнике", "big": "100 метров", "img": "img/toros-3.jpg", "credit": "Unknown photographer, Public domain"}, {"audio": "pres/toros-04.mp3", "text": "Открытие состоялось девятого января тысяча девятьсот десятого года. Пришло от семи до восьми тысяч зрителей, а гостей из Буэнос-Айреса везли пароходы «Тритон», «Ривадавия» и «Колония». Первыми на арену вышли братья-тореро Рикардо и Мануэль Торрес, которых прозвали Бомбита. Быки были из хозяйства Хуана Нандина.", "caption": "9 января 1910: открытие и братья Бомбита", "big": "1910", "img": "img/toros-2.jpg", "credit": "Mariola0675, CC BY-SA 3.0"}, {"audio": "pres/toros-05.mp3", "text": "Праздник оказался недолгим. Власти Уругвая потребовали, чтобы быков на арене не убивали, и публика осталась недовольна. А в тысяча девятьсот двенадцатом году, при президенте Хосе Батлье-и-Ордоньесе, корриды в стране запретили совсем. Здесь успели провести всего восемь официальных корриды. Говорят, что за всё время на этой арене не погиб ни один бык и ни один тореро.", "caption": "1912: корриды в Уругвае запрещены, прошло всего восемь", "big": "8 корриды", "img": "img/toros-1.jpg", "credit": "Chzemog, CC BY-SA 3.0"}, {"audio": "pres/toros-06.mp3", "text": "Одну попытку вернуть корриду всё же сделали. В тысяча девятьсот тридцать пятом году закон разрешил такие представления в департаменте Колония, и девятого июля прошла ещё одна, особая, без пикадоров и с шарами на рогах быков. Но в Испании началась гражданская война, и планы организаторов сорвались.", "caption": "1935: последняя попытка, без пикадоров и с шарами на рогах", "big": "1935", "img": "img/toros-3.jpg", "credit": "Unknown photographer, Public domain"}, {"audio": "pres/toros-07.mp3", "text": "Потом арена почти сто лет стояла без дела. С тысяча девятьсот сорок третьего года комплексом владел город, но здание ветшало, а в две тысячи двенадцатом году после сильного юго-восточного шторма обрушилась верхняя часть фасада. Реставрацию начали в две тысячи девятнадцатом, это стало самым крупным общественным проектом в истории департамента. Девятого декабря две тысячи двадцать первого года арена открылась заново, через сто одиннадцать лет.", "caption": "2021: арена открылась снова через 111 лет", "big": "111 лет", "img": "img/toros-1.jpg", "credit": "Chzemog, CC BY-SA 3.0"}, {"audio": "pres/toros-08.mp3", "text": "Сегодня внутри музей, рестораны и зал для концертов. Музей открыли в феврале этого года, его называют музеем четвёртого поколения. Там есть голограммы, наушники с рассказами, проекции на макете арены, которые показывают, как менялось здание, и коды, которые можно навести телефоном.", "caption": "Музей четвёртого поколения: голограммы, наушники, проекции", "big": "2026", "img": "img/toros-2.jpg", "credit": "Mariola0675, CC BY-SA 3.0"}, {"audio": "pres/toros-09.mp3", "text": "Задание для юного путешественника: пройди по кругу и сосчитай арки. Сколько у тебя получилось? А потом закрой глаза и представь, что вокруг тебя восемь тысяч зрителей и все они хлопают. Громко ли это? Попробуй хлопнуть в ладоши так же громко, как они.", "caption": "Задание: сосчитай арки и представь 8000 зрителей", "big": "", "img": "img/toros-3.jpg", "credit": "Unknown photographer, Public domain"}]}, "fronton": {"title": "Фронтон: самая быстрая игра", "kid": "Найди самую высокую стену. В неё бьют мячом? Покажи, как бросают мяч корзиной на руке.", "segs": [{"audio": "pres/fronton-01.mp3", "text": "Это Фронтон, площадка для баскской пелоты. Игра, которую здесь играют, называется хай-алаи, по-баскски «весёлый праздник». Придумали её баски, жители Страны Басков на севере Испании. Вместо ракетки у игрока длинная плетёная корзина, которая надевается на руку, она называется сеста. А мяч, пелоту, делают вручную: тугой клубок каучука, обшитый двумя слоями козьей кожи.", "caption": "Фронтон: площадка для хай-алаи, «весёлого праздника» басков", "big": "", "img": "img/fronton-1.jpg", "credit": "Coquimbo58, CC0"}, {"audio": "pres/fronton-02.mp3", "text": "Игрок ловит мяч в корзину и сразу, одним движением, швыряет его в стену. Площадка с тремя стенами, передней, задней и левой, а справа стены нет. Мяч летит так быстро, что хай-алаи называют самой быстрой игрой с мячом. Рекорд скорости мяча в этой игре триста два километра в час.", "caption": "Рекорд скорости мяча: 302 км/ч", "big": "302 км/ч", "img": "img/fronton-2.jpg", "credit": "Coquimbo58, CC0"}, {"audio": "pres/fronton-03.mp3", "text": "Фронтон появился на свет вместе с остальным курортом Михановича и открылся двадцать седьмого ноября тысяча девятьсот десятого года. Длина площадки шестьдесят четыре метра, ширина двадцать один, на трибунах помещалось три тысячи зрителей. Это самая большая такая площадка в Южной Америке. Её восстановили в тысяча девятьсот семьдесят четвёртом году, и здесь прошёл чемпионат мира, а ещё один в тысяча девятьсот восьмидесятом.", "caption": "27 ноября 1910: 64 на 21 метр и три тысячи зрителей", "big": "64 × 21 м", "img": "img/fronton-1.jpg", "credit": "Coquimbo58, CC0"}, {"audio": "pres/fronton-04.mp3", "text": "Потом Фронтон надолго замолчал. Было время, когда в нём держали конфискованные машины. Но жители о нём не забыли, и семнадцатого октября этого года Фронтон открылся заново. На церемонии по стенам показывали фильм, и здание будто само рассказывало о себе, начиная со слов «Я Фронтон». Игроки шли за школьниками Колонии, которые несли флаги, а первые матчи сыграли Испания со Страной Басков и Франция с Соединёнными Штатами.", "caption": "17 октября 2026: Фронтон открылся заново чемпионатом мира", "big": "2026", "img": "img/fronton-2.jpg", "credit": "Coquimbo58, CC0"}, {"audio": "pres/fronton-05.mp3", "text": "Рядом стояла гостиница с казино. Казино работало до тысяча девятьсот семнадцатого года. Среди причин упадка называют штраф: власти Аргентины наказывали каждый пароход, который заходил в порт, где играют на деньги. А в гостинице, как пишут, встретились три поэтессы Америки: аргентинка Альфонсина Сторни, чилийка Габриэла Мистраль и уругвайка Хуана де Ибарбуру. Точной даты встречи источники не называют.", "caption": "Гостиница с казино до 1917 года и встреча трёх поэтесс", "big": "1917", "img": "img/fronton-1.jpg", "credit": "Coquimbo58, CC0"}, {"audio": "pres/fronton-06.mp3", "text": "Гостей доставляли необычным способом. От берега в реку уходил пирс длиной триста метров, и на нём лежали рельсы. По ним катили вагонетки, пассажирские до арены и гостиницы и отдельные для багажа. А вдоль берега ходил настоящий паровой трамвай системы Декавиль, узкоколейка шириной шестьсот миллиметров и около пяти километров длиной. Он возил гостей от причала Колонии к арене с тысяча девятьсот десятого по тысяча девятьсот двенадцатый год, как минимум. От пирса сегодня не осталось ничего: последние доски унесла буря.", "caption": "Пирс 300 метров, вагонетки и паровой трамвай Декавиль", "big": "300 метров", "img": "img/fronton-2.jpg", "credit": "Coquimbo58, CC0"}, {"audio": "pres/fronton-07.mp3", "text": "Следующим в Реаль-де-Сан-Карлос будут восстанавливать старую электростанцию, которую построили, чтобы дать свет и курорту, и городу. Задание для юного путешественника: найди самую высокую стену Фронтона. Как думаешь, в неё бьют мячом или нет? А потом покажи, как бросают мяч плетёной корзиной на руке. Только не отпускай воображаемый мяч слишком далеко!", "caption": "Задание: найди самую высокую стену", "big": "", "img": "img/fronton-1.jpg", "credit": "Coquimbo58, CC0"}]}, "ferry_uruguay": {"title": "Уругвай за пять минут", "kid": "Когда сойдёте на берег, считай, у скольких людей увидишь термос и мате. Найди флаг Уругвая с жёлтым солнцем.", "segs": [{"audio": "pres/ferry_uruguay-01.mp3", "text": "Скоро вы окажетесь в Уругвае. Это маленькая страна: чуть меньше трёх с половиной миллионов жителей, и больше половины из них живут в столице Монтевидео и вокруг неё. А ещё в Уругвае, по официальным данным, около одиннадцати с половиной миллионов коров и быков, то есть больше трёх на каждого жителя. Присматривают за стадами гаучо, пастухи-всадники. А Монтевидео, к слову, самая южная столица на всём американском континенте.", "caption": "Маленькая страна: 3,5 миллиона людей и 11,5 миллиона коров", "big": "3,5 млн", "img": "img/ferry_uruguay-1.jpg", "credit": "Gerardo Irazábal Valledor, CC BY-SA 3.0"}, {"audio": "pres/ferry_uruguay-02.mp3", "text": "Раньше эту землю называли Банда-Ориенталь, Восточный берег, потому что она лежит на восточном берегу реки Уругвай. Здесь, в Монтевидео, в тысяча семьсот шестьдесят четвёртом году родился самый почитаемый герой страны, Хосе Хервасио Артигас. С юности он работал на семейных ранчо, научился у гаучо обращаться с лошадьми, а в тысяча восемьсот одиннадцатом году поднял восстание против испанской власти.", "caption": "Банда-Ориенталь: «Восточный берег» и герой Хосе Хервасио Артигас", "big": "1764", "img": "img/ferry_uruguay-2.jpg", "credit": "Juan Manuel Blanes, Public domain"}, {"audio": "pres/ferry_uruguay-03.mp3", "text": "Самая известная страница его жизни это исход. В начале тысяча восемьсот двенадцатого года около шестнадцати тысяч человек, целые семьи, ушли за Артигасом через реку Уругвай, увозя скот и пожитки на тысяче повозок. Представь такой обоз, малыш! А в тысяча восемьсот пятнадцатом году Артигас издал закон о земле, где сказано, что самые несчастные должны стать самыми привилегированными.", "caption": "Исход 1812 года: 16 000 человек и тысяча повозок", "big": "16 000", "img": "img/ferry_uruguay-3.jpg", "credit": "Unknown author, Public domain"}, {"audio": "pres/ferry_uruguay-04.mp3", "text": "Но в сентябре тысяча восемьсот двадцатого года Артигас ушёл в изгнание в Парагвай и на родину не вернулся. Он прожил там тридцать лет и умер в тысяча восемьсот пятидесятом году, в восемьдесят шесть лет. А в апреле тысяча восемьсот двадцать пятого года, когда его уже не было, из Аргентины ночью переправилась через реку Уругвай небольшая группа во главе с Хуаном Антонио Лавалехой. Официально считается, что их было тридцать три, поэтому их зовут Тридцатью тремя ориенталями.", "caption": "1820: изгнание в Парагвай; 1825: тридцать три ориентала", "big": "33", "img": "img/ferry_uruguay-2.jpg", "credit": "Juan Manuel Blanes, Public domain"}, {"audio": "pres/ferry_uruguay-05.mp3", "text": "Они высадились на пляже Ла-Аграсиада девятнадцатого апреля и подняли флаг с красной, синей и белой полосами и надписью «Свобода или смерть». Четыре месяца спустя, двадцать пятого августа, собрание в городе Ла-Флорида объявило независимость от Бразилии. Эту дату в Уругвае теперь празднуют как День независимости. Началась война с Бразилией, и она шла около трёх лет.", "caption": "25 августа 1825: независимость от Бразилии", "big": "1825", "img": "img/ferry_uruguay-4.jpg", "credit": "Felipe Restrepo Acosta, CC BY-SA 4.0"}, {"audio": "pres/ferry_uruguay-06.mp3", "text": "Война закончилась в тысяча восемьсот двадцать восьмом году договором, посредником в котором выступила Великобритания, а английский дипломат лорд Понсонби помогал сторонам договориться. Так появилось отдельное государство, Восточная Республика Уругвай. Колония, где вы скоро будете, окончательно стала уругвайской второго декабря того же года. А первую конституцию страны приняли восемнадцатого июля тысяча восемьсот тридцатого года.", "caption": "1828: мир при посредничестве Англии; 1830: первая конституция", "big": "1830", "img": "img/ferry_uruguay-6.jpg", "credit": "fabulousfabs, CC BY 2.0"}, {"audio": "pres/ferry_uruguay-07.mp3", "text": "Конституции исполнялось сто лет, и в тысяча девятьсот тридцатом году Уругвай устроил праздник: первый в истории чемпионат мира по футболу. Хозяев выбрали ещё и потому, что их сборная выиграла Олимпийские игры тысяча девятьсот двадцать восьмого года. К чемпионату построили стадион «Сентенарио», что значит «столетний». Команды из Европы плыли на пароходе около двух недель. Финал выиграл Уругвай, обыграв Аргентину со счётом четыре два.", "caption": "1930: Уругвай принимает и выигрывает первый чемпионат мира", "big": "1930", "img": "img/ferry_uruguay-3.jpg", "credit": "Unknown author, Public domain"}, {"audio": "pres/ferry_uruguay-08.mp3", "text": "Были и забавные детали. Две команды не смогли договориться, каким мячом играть, и решили так: в одном тайме играли мячом одной команды, в другом мячом другой. А тысячи аргентинцев переправлялись через ту самую реку, по которой вы сейчас плывёте, на любых лодках, какие удавалось найти, и многие опоздали к началу матча.", "caption": "Два мяча в одном матче и лодки через реку", "big": "4:2", "img": "img/ferry_uruguay-5.jpg", "credit": "Manzanita2203, CC BY-SA 4.0"}, {"audio": "pres/ferry_uruguay-09.mp3", "text": "Через двадцать лет, шестнадцатого июля тысяча девятьсот пятидесятого года, уругвайцы совершили второе чудо. В Бразилии, на стадионе Маракана, где собралось около ста семидесяти четырёх тысяч зрителей, бразильцам для победы хватало ничьей. Но Уругвай выиграл со счётом два один. Капитан Обдулио Варела потом сказал, что если бы они сыграли этот матч ещё девяносто девять раз, то проиграли бы все. Этот матч называют Мараканасо.", "caption": "16 июля 1950: Мараканасо, Уругвай 2:1 Бразилия", "big": "2:1", "img": "img/ferry_uruguay-6.jpg", "credit": "fabulousfabs, CC BY 2.0"}, {"audio": "pres/ferry_uruguay-10.mp3", "text": "Ещё одна страсть уругвайцев это мате, горячий настой травы, который пьют через металлическую трубочку из чашки. Уругвайцы ходят по улицам с термосом под мышкой и мате в руке. По оценкам одного уругвайского издания, на человека выходит около десяти килограммов травы в год, больше, чем в Аргентине. А ещё в Уругвае звучит барабанный ритм кандомбе, и в две тысячи девятом году ЮНЕСКО внесла его в список нематериального наследия человечества.", "caption": "Мате и кандомбе: термос под мышкой и барабаны", "big": "10 кг в год", "img": "img/ferry_uruguay-5.jpg", "credit": "Manzanita2203, CC BY-SA 4.0"}, {"audio": "pres/ferry_uruguay-11.mp3", "text": "Теперь вы знаете главное об Уругвае: коровы, гаучо, Артигас, футбол и мате. Задание для юного путешественника: когда мы сойдём на берег, считай, у скольких людей ты увидишь термос и мате. А ещё найди флаг Уругвая, на нём есть жёлтое солнце. Нашёл? Сосчитай, сколько на флаге полосок, и скажи, какого они цвета. Тогда ты будешь знать флаг Уругвая лучше многих взрослых.", "caption": "Задание: считай термосы и ищи флаг с солнцем", "big": "", "img": "img/ferry_uruguay-1.jpg", "credit": "Gerardo Irazábal Valledor, CC BY-SA 3.0"}]}, "ferry_river": {"title": "Река, похожая на море", "kid": "Посмотри на воду за бортом. Какого она цвета? На что похожа: на какао, чай или кофе с молоком? Придумай цвету название.", "segs": [{"audio": "pres/ferry_river-01.mp3", "text": "Посмотрите за борт. Берега уже не видно, вокруг только вода, и кажется, что вы плывёте по морю. Но это река. Её зовут Рио-де-ла-Плата, по-русски река Ла-Плата, и вы пересекаете её на отрезке в пятьдесят или шестьдесят километров. Давайте узнаем, почему эту реку называют самой широкой на свете и почему вода в ней такого необычного цвета.", "caption": "Река, в которой не видно берегов: Рио-де-ла-Плата", "big": "", "img": "img/ferry_river-1.jpg", "credit": "Earth Sciences and Image Analysis Laboratory, NASA Johnson Space Center, Public domain"}, {"audio": "pres/ferry_river-02.mp3", "text": "Ла-Плата похожа на огромный треугольник. В длину она около трёхсот километров, а там, где впадает в океан, расширяется примерно до двухсот двадцати километров. Если считать её рекой, это самая широкая река на Земле. Учёные чаще называют её эстуарием: так называют устье, где пресная вода встречается с морской. А площадь этой воды около тридцати пяти тысяч квадратных километров.", "caption": "Самая широкая река мира: около 220 километров у устья", "big": "220 км", "img": "img/ferry_river-2.jpg", "credit": "Earth Sciences and Image Analysis Laboratory, NASA Johnson Space Center, Public domain"}, {"audio": "pres/ferry_river-03.mp3", "text": "Одним из первых европейцев сюда вошёл испанский мореплаватель Хуан Диас де Солис. Восьмого октября тысяча пятьсот пятнадцатого года он отплыл из Испании на трёх кораблях, с командой около семидесяти человек. В тысяча пятьсот шестнадцатом году его корабли вошли в устье. Берегов не было видно, а вода оказалась пресной. Солис назвал это место Пресным морем, Маре-Дульсе. Исследуя реку, он погиб, и экспедиция вернулась в Испанию без своего командира.", "caption": "1516: Хуан Диас де Солис входит в «Пресное море»", "big": "1516", "img": "img/ferry_river-4.jpg", "credit": "Ulpiano Checa, Public domain"}, {"audio": "pres/ferry_river-04.mp3", "text": "Во время этого плавания умер один из моряков, Мартин Гарсия, и остров в реке назвали его именем. Остров Мартин-Гарсия лежит всего в трёх с половиной километрах от берега Уругвая. Его скалам около миллиарда восьмисот миллионов лет: в отличие от песчаных островов вокруг, это обломок древнего материка. Из гранита с острова мостили улицы Буэнос-Айреса. А позже на острове устроили тюрьму, где в разные годы держали и аргентинских президентов.", "caption": "Остров Мартин-Гарсия: обломок скалы возрастом 1,8 миллиарда лет", "big": "1,8 млрд лет", "img": "img/ferry_river-6.jpg", "credit": "Liam Quinn from Canada, CC BY-SA 2.0"}, {"audio": "pres/ferry_river-05.mp3", "text": "Откуда же название «серебряная»? Легенда рассказывает, что спасшиеся моряки из экспедиции Солиса услышали от местных жителей про гору из серебра, где правит Белый король. Слухи о сокровищах разошлись по Европе. В тысяча пятьсот двадцать шестом году сюда пришёл Себастьян Кабот и исследовал притоки, Парану и Уругвай, а вскоре река получила имя Рио-де-ла-Плата, река Серебра. Серебра в этих краях, как пишут, нашли немного. Зато по этому слову назвали целую страну: Аргентина происходит от латинского слова «аргентум», серебро.", "caption": "Легенда о горе серебра: откуда «Ла-Плата» и «Аргентина»", "big": "серебро", "img": "img/ferry_river-3.jpg", "credit": "MODIS Land Rapid Response Team, NASA GSFC, Public domain"}, {"audio": "pres/ferry_river-06.mp3", "text": "Теперь посмотрите на цвет воды. Она коричневая, как какао с молоком. Эту краску несут две огромные реки, Парана и Уругвай, которые впадают в Ла-Плату. Каждый год они приносят сюда около ста шестидесяти миллионов тонн ила, глины и песка. Если посчитать, выходит около пяти тонн каждую секунду. Пока вы слушаете, реки приносят ещё сотни тонн.", "caption": "160 миллионов тонн ила в год: почему вода бурая", "big": "5 тонн в секунду", "img": "img/ferry_river-2.jpg", "credit": "JPSS imagery: CSU/CIRA & NOAA/NESDIS, Public domain", "video": "img/video-1.webm"}, {"audio": "pres/ferry_river-07.mp3", "text": "Вода в реке пресная, а ближе к океану становится солоноватой, потому что смешивается с морской. Даже у самого устья соли в ней немного меньше, чем в океане: чуть больше тридцати двух граммов на килограмм воды против тридцати пяти в открытом океане. Поэтому и казалось Солису, что он вошёл в пресное море. А у Колонии, где вы скоро будете, вода почти совсем речная.", "caption": "Пресная у Колонии и солоноватая ближе к океану", "big": "32 г из 35", "img": "img/ferry_river-6.jpg", "credit": "Liam Quinn from Canada, CC BY-SA 2.0"}, {"audio": "pres/ferry_river-08.mp3", "text": "При такой ширине река удивительно мелкая. Средняя глубина всего около тринадцати метров, а в некоторых местах на северо-западе меньше одного метра. На дне лежат песчаные отмели, и у них есть собственные имена, например Английская банка. Течение постоянно намывает ил, поэтому для больших кораблей приходится всё время углублять каналы специальными землечерпалками.", "caption": "Средняя глубина всего 13 метров: отмели и землечерпалки", "big": "13 метров", "img": "img/ferry_river-5.jpg", "credit": "Royal Navy official photographer, Public domain"}, {"audio": "pres/ferry_river-09.mp3", "text": "А теперь история из совсем недавнего прошлого. В декабре тысяча девятьсот тридцать девятого года, когда только началась Вторая мировая война, у входа в эту реку сошлись в бою немецкий крейсер «Адмирал граф Шпее» и три крейсера союзников, британские «Эксетер» и «Аякс» и новозеландский «Ахиллес». Бой был тринадцатого декабря. «Граф Шпее» получил повреждения и ушёл в нейтральный порт Монтевидео, на уругвайском берегу, чтобы починиться.", "caption": "13 декабря 1939: бой у входа в Ла-Плату", "big": "1939", "img": "img/ferry_river-3.jpg", "credit": "MODIS Land Rapid Response Team, NASA GSFC, Public domain"}, {"audio": "pres/ferry_river-10.mp3", "text": "Командир, капитан Ганс Лангсдорф, попросил у уругвайцев две недели на ремонт, а получил всего несколько дней. Он решил, что у входа в реку его ждёт огромный британский флот, и семнадцатого декабря вывел корабль на воду реки и затопил его. Моряки перебрались на аргентинский берег, больше тысячи человек. Корабль осел в илистое дно, и над водой торчит только верхушка мачты.", "caption": "17 декабря 1939: «Граф Шпее» затоплен, видна лишь верхушка мачты", "big": "17 декабря", "img": "img/ferry_river-5.jpg", "credit": "Royal Navy official photographer, Public domain"}, {"audio": "pres/ferry_river-11.mp3", "text": "В этих водах живёт и совсем другой герой, дельфин Ла-Платы. Увидеть его трудно, но кто знает, вдруг повезёт. Задание для юного путешественника: посмотри на воду за бортом. Какого она цвета? На что она похожа: на какао, на чай, на кофе с молоком? Придумай этому цвету название. И попробуй найти на воде или в небе хотя бы одну птицу.", "caption": "Задание: какого цвета вода? Придумай ей название", "big": "", "img": "img/ferry_river-1.jpg", "credit": "Earth Sciences and Image Analysis Laboratory, NASA Johnson Space Center, Public domain"}]}, "ferry_boats": {"title": "Как плавали через реку", "kid": "Подплывая к Колонии, найди маяк первым. Он красно-белый, как леденец. Увидел, крикни: «Маяк!»", "segs": [{"audio": "pres/ferry_boats-01.mp3", "text": "Ваш паром идёт через реку чуть больше часа. А в начале двадцатого века такой путь на пароходе занимал, по разным источникам, от шести до восьми часов. Как же люди научились плавать здесь так быстро? Начнём с человека, который больше всех сделал для речных перевозок. Это история мальчишки с лодки.", "caption": "Сегодня около часа пути, а сто лет назад от шести до восьми часов", "big": "6–8 часов", "img": "img/ferry_boats-1.jpg", "credit": "Liam Quinn from Canada, CC BY-SA 2.0"}, {"audio": "pres/ferry_boats-02.mp3", "text": "Его звали Николас Миханович. Он родился в середине девятнадцатого века в хорватском селе Доли, возле Дубровника, в семье, у которой была маленькая парусная лодка «Фортуната». В двенадцать лет он уже ходил юнгой на парусном судне дяди. В тысяча восемьсот шестьдесят седьмом году он сошёл на берег в Монтевидео почти без денег и не зная исп
