 её на отрезке в пятьдесят или шестьдесят километров. Давайте узнаем, почему эту реку называют самой широкой на свете и почему вода в ней такого необычного цвета.", "caption": "Река, в которой не видно берегов: Рио-де-ла-Плата", "big": "", "imgs": [{"src": "img/c_ferry_river-1.jpg", "cap": "Яхты на Ла-Плате: до горизонта вода, как на море", "credit": "Blmurch, CC BY-SA 4.0"}, {"src": "img/c_ferry_river-2.jpg", "cap": "Паром на бурой воде Ла-Платы, другого берега не видно", "credit": "Roxyuru, CC BY-SA 3.0"}, {"src": "img/ferry_river-6.jpg", "cap": "Вид на реку и крыши Колонии с маяка: воды так много, что другого берега не видно", "credit": "Liam Quinn from Canada, CC BY-SA 2.0"}], "img": "img/c_ferry_river-1.jpg", "credit": "Blmurch, CC BY-SA 4.0"}, {"audio": "pres/ferry_river-02.mp3", "text": "Ла-Плата похожа на огромный треугольник. В длину она около трёхсот километров, а там, где впадает в океан, расширяется примерно до двухсот двадцати километров. Если считать её рекой, это самая широкая река на Земле. Учёные чаще называют её эстуарием: так называют устье, где пресная вода встречается с морской. А площадь этой воды около тридцати пяти тысяч квадратных километров.", "caption": "Самая широкая река мира: около 220 километров у устья", "big": "220 км", "imgs": [{"src": "img/ferry_river-1.jpg", "cap": "Из космоса: Ла-Плата — огромный коричневый залив шириной до 270 км, Колония — посередине между Буэнос-Айресом и Монтевидео", "credit": "Earth Sciences and Image Analysis Laboratory, NASA Johnson Space Center, Public domain"}, {"src": "img/c_ferry_river-3.jpg", "cap": "Снимок из космоса: Ла-Плата похожа на огромный треугольник", "credit": "Jacques Descloitres, MODISRapid Response Team, NASA/GSFC, Public domain"}, {"src": "img/c_ferry_river-4.jpg", "cap": "Снимок с МКС: Парана впадает в Ла-Плату, и река сразу расширяется", "credit": "NASA, Public domain"}], "img": "img/ferry_river-1.jpg", "credit": "Earth Sciences and Image Analysis Laboratory, NASA Johnson Space Center, Public domain"}, {"audio": "pres/ferry_river-03.mp3", "text": "Одним из первых европейцев сюда вошёл испанский мореплаватель Хуан Диас де Солис. Восьмого октября тысяча пятьсот пятнадцатого года он отплыл из Испании на трёх кораблях, с командой около семидесяти человек. В тысяча пятьсот шестнадцатом году его корабли вошли в устье. Берегов не было видно, а вода оказалась пресной. Солис назвал это место Пресным морем, Маре-Дульсе. Исследуя реку, он погиб, и экспедиция вернулась в Испанию без своего командира.", "caption": "1516: Хуан Диас де Солис входит в «Пресное море»", "big": "1516", "imgs": [{"src": "img/ferry_river-4.jpg", "cap": "Рисунок: испанцы Хуана Диаса де Солиса открывают Рио-де-ла-Плату в 1516 году", "credit": "Ulpiano Checa, Public domain"}, {"src": "img/c_ferry_river-5.jpg", "cap": "Картина: корабль Хуана Диаса де Солиса входит в Пресное море", "credit": "Roberto Castellanos, Public domain"}, {"src": "img/c_ferry_river-6.jpg", "cap": "Копия корабля XVI века «Нао Виктория»: на таких плавали первооткрыватели", "credit": "Gnsin, CC BY-SA 3.0"}], "img": "img/ferry_river-4.jpg", "credit": "Ulpiano Checa, Public domain"}, {"audio": "pres/ferry_river-04.mp3", "text": "Во время этого плавания умер один из моряков, Мартин Гарсия, и остров в реке назвали его именем. Остров Мартин-Гарсия лежит всего в трёх с половиной километрах от берега Уругвая. Его скалам около миллиарда восьмисот миллионов лет: в отличие от песчаных островов вокруг, это обломок древнего материка. Из гранита с острова мостили улицы Буэнос-Айреса. А позже на острове устроили тюрьму, где в разные годы держали и аргентинских президентов.", "caption": "Остров Мартин-Гарсия: обломок скалы возрастом 1,8 миллиарда лет", "big": "1,8 млрд лет", "imgs": [{"src": "img/c_ferry_river-7.jpg", "cap": "Остров Мартин-Гарсия с самолёта: зелёный островок посреди реки", "credit": "Rik Schuiling / TropCrop-TCS, CC BY-SA 4.0"}, {"src": "img/c_ferry_river-8.jpg", "cap": "Бывшая каменоломня на острове: гранит отсюда шёл на мостовые Буэнос-Айреса", "credit": "CHUCAO, CC BY-SA 3.0"}, {"src": "img/c_ferry_river-9.jpg", "cap": "Руины старой тюрьмы на острове Мартин-Гарсия", "credit": "Ministerio de Cultura de la Nación, CC BY-SA 2.0"}], "img": "img/c_ferry_river-7.jpg", "credit": "Rik Schuiling / TropCrop-TCS, CC BY-SA 4.0"}, {"audio": "pres/ferry_river-05.mp3", "text": "Откуда же название «серебряная»? Легенда рассказывает, что спасшиеся моряки из экспедиции Солиса услышали от местных жителей про гору из серебра, где правит Белый король. Слухи о сокровищах разошлись по Европе. В тысяча пятьсот двадцать шестом году сюда пришёл Себастьян Кабот и исследовал притоки, Парану и Уругвай, а вскоре река получила имя Рио-де-ла-Плата, река Серебра. Серебра в этих краях, как пишут, нашли немного. Зато по этому слову назвали целую страну: Аргентина происходит от латинского слова «аргентум», серебро.", "caption": "Легенда о горе серебра: откуда «Ла-Плата» и «Аргентина»", "big": "серебро", "imgs": [{"src": "img/c_ferry_river-10.jpg", "cap": "Серро-Рико в Потоси: настоящая серебряная гора Южной Америки", "credit": "Jbmurray, CC BY-SA 4.0"}, {"src": "img/c_ferry_river-11.jpg", "cap": "Себастьян Кабот: в 1526 году он исследовал Парану и Уругвай", "credit": "Samuel Rawle / After Hans Holbein the Younger, Public domain"}, {"src": "img/c_ferry_river-12.jpg", "cap": "Карта XVI века: устье реки Ла-Платы, «реки Серебра»", "credit": "Alonso de Santa Cruz (1505-1567), Public domain"}], "img": "img/c_ferry_river-10.jpg", "credit": "Jbmurray, CC BY-SA 4.0"}, {"audio": "pres/ferry_river-06.mp3", "text": "Теперь посмотрите на цвет воды. Она коричневая, как какао с молоком. Эту краску несут две огромные реки, Парана и Уругвай, которые впадают в Ла-Плату. Каждый год они приносят сюда около ста шестидесяти миллионов тонн ила, глины и песка. Если посчитать, выходит около пяти тонн каждую секунду. Пока вы слушаете, реки приносят ещё сотни тонн.", "caption": "160 миллионов тонн ила в год: почему вода бурая", "big": "5 тонн в секунду", "imgs": [{"src": "img/ferry_river-3.jpg", "cap": "Две огромные реки — Парана и Уругвай — несут в Ла-Плату песок и глину, поэтому вода бурая", "credit": "MODIS Land Rapid Response Team, NASA GSFC, Public domain"}, {"src": "img/c_ferry_river-13.jpg", "cap": "Схема NASA: бурая вода течёт из Параны и Уругвая в Ла-Плату", "credit": "NASA's Earth Observatory, CC BY 2.0"}, {"src": "img/c_ferry_river-14.jpg", "cap": "Дельта реки Парана с самолёта: бурая вода несёт ил и песок", "credit": "Martin Terber, CC BY 2.0"}], "img": "img/ferry_river-3.jpg", "credit": "JPSS imagery: CSU/CIRA & NOAA/NESDIS, Public domain", "video": "img/video-1.webm"}, {"audio": "pres/ferry_river-07.mp3", "text": "Вода в реке пресная, а ближе к океану становится солоноватой, потому что смешивается с морской. Даже у самого устья соли в ней немного меньше, чем в океане: чуть больше тридцати двух граммов на килограмм воды против тридцати пяти в открытом океане. Поэтому и казалось Солису, что он вошёл в пресное море. А у Колонии, где вы скоро будете, вода почти совсем речная.", "caption": "Пресная у Колонии и солоноватая ближе к океану", "big": "32 г из 35", "imgs": [{"src": "img/ferry_river-2.jpg", "cap": "Снимок с орбиты: коричневая вода реки втекает в синий океан", "credit": "Earth Sciences and Image Analysis Laboratory, NASA Johnson Space Center, Public domain"}, {"src": "img/c_ferry_river-15.jpg", "cap": "Схема: речная вода идёт сверху, солёная морская — под ней", "credit": "Unknown author, Public domain"}, {"src": "img/c_ferry_river-16.jpg", "cap": "Берег у Колонии: вода здесь почти речная, коричневая", "credit": "TiziPro22, CC BY-SA 4.0"}], "img": "img/ferry_river-2.jpg", "credit": "Earth Sciences and Image Analysis Laboratory, NASA Johnson Space Center, Public domain"}, {"audio": "pres/ferry_river-08.mp3", "text": "При такой ширине река удивительно мелкая. Средняя глубина всего около тринадцати метров, а в некоторых местах на северо-западе меньше одного метра. На дне лежат песчаные отмели, и у них есть собственные имена, например Английская банка. Течение постоянно намывает ил, поэтому для больших кораблей приходится всё время углублять каналы специальными землечерпалками.", "caption": "Средняя глубина всего 13 метров: отмели и землечерпалки", "big": "13 метров", "imgs": [{"src": "img/c_ferry_river-17.jpg", "cap": "Вид из самолёта: в устье рек песчаные отмели и острова", "credit": "Ypsilon from Finland, CC0"}, {"src": "img/c_ferry_river-18.jpg", "cap": "Карта устья: видна Английская банка, песчаная отмель посреди реки", "credit": "British Government, Public domain"}, {"src": "img/c_ferry_river-19.jpg", "cap": "Землечерпалка: такие корабли углубляют каналы на мелкой реке", "credit": "Marc Ryckaert, CC BY-SA 4.0"}], "img": "img/c_ferry_river-17.jpg", "credit": "Ypsilon from Finland, CC0"}, {"audio": "pres/ferry_river-09.mp3", "text": "А теперь история из совсем недавнего прошлого. В декабре тысяча девятьсот тридцать девятого года, когда только началась Вторая мировая война, у входа в эту реку сошлись в бою немецкий крейсер «Адмирал граф Шпее» и три крейсера союзников, британские «Эксетер» и «Аякс» и новозеландский «Ахиллес». Бой был тринадцатого декабря. «Граф Шпее» получил повреждения и ушёл в нейтральный порт Монтевидео, на уругвайском берегу, чтобы починиться.", "caption": "13 декабря 1939: бой у входа в Ла-Плату", "big": "1939", "imgs": [{"src": "img/c_ferry_river-20.jpg", "cap": "Схема боя 13 декабря 1939 года: «Граф Шпее» и три крейсера союзников", "credit": "British Government, Public domain"}, {"src": "img/c_ferry_river-21.jpg", "cap": "«Адмирал граф Шпее»: на борту видны следы попаданий", "credit": "U.S. Naval Historical Center Photograph., Public domain"}, {"src": "img/c_ferry_river-22.jpg", "cap": "Акварель: британский крейсер «Эксетер» в бою у Ла-Платы", "credit": "Cdr Eric Erskine Campbell Tufnell RN (Retired), Public domain"}], "img": "img/c_ferry_river-20.jpg", "credit": "British Government, Public domain"}, {"audio": "pres/ferry_river-10.mp3", "text": "Командир, капитан Ганс Лангсдорф, попросил у уругвайцев две недели на ремонт, а получил всего несколько дней. Он решил, что у входа в реку его ждёт огромный британский флот, и семнадцатого декабря вывел корабль на воду реки и затопил его. Моряки перебрались на аргентинский берег, больше тысячи человек. Корабль осел в илистое дно, и над водой торчит только верхушка мачты.", "caption": "17 декабря 1939: «Граф Шпее» затоплен, видна лишь верхушка мачты", "big": "17 декабря", "imgs": [{"src": "img/c_ferry_river-23.jpg", "cap": "Капитан Ганс Лангсдорф, командир «Графа Шпее»", "credit": "Unknown author, Public domain"}, {"src": "img/c_ferry_river-24.jpg", "cap": "Моряки «Графа Шпее» на буксире идут к аргентинскому берегу", "credit": "Unknown author, Public domain"}, {"src": "img/c_ferry_river-25.jpg", "cap": "Затонувший «Граф Шпее»: над водой торчат только мачты", "credit": "Unknown author, Public domain"}], "img": "img/c_ferry_river-23.jpg", "credit": "Unknown author, Public domain"}, {"audio": "pres/ferry_river-11.mp3", "text": "В этих водах живёт и совсем другой герой, дельфин Ла-Платы. Увидеть его трудно, но кто знает, вдруг повезёт. Задание для юного путешественника: посмотри на воду за бортом. Какого она цвета? На что она похожа: на какао, на чай, на кофе с молоком? Придумай этому цвету название. И попробуй найти на воде или в небе хотя бы одну птицу.", "caption": "Задание: какого цвета вода? Придумай ей название", "big": "", "imgs": [{"src": "img/c_ferry_river-26.jpg", "cap": "Дельфин Ла-Платы (франсискана) в воде", "credit": "Victoria Ulman, CC BY-SA 4.0"}, {"src": "img/ferry_boats-4.jpg", "cap": "След на воде за паромом: река такая бурая от песка и глины", "credit": "Falk2, CC BY-SA 3.0 DE"}, {"src": "img/c_ferry_river-27.jpg", "cap": "Чайка над водой: найди хотя бы одну птицу", "credit": "Charles J. Sharp, CC BY-SA 4.0"}], "img": "img/c_ferry_river-26.jpg", "credit": "Victoria Ulman, CC BY-SA 4.0"}]}, "ferry_delta": {"title": "Дельта Параны, Тигре и берега Ла-Платы", "kid": "Считай на реке большие корабли и баржи. Представь рядом капибару и придумай ей имя.", "segs": [{"audio": "pres/ferry_delta-01.mp3", "text": "Река, по которой вы плывёте, родилась от встречи двух великанов, Параны и Уругвая. Парана вторая по длине река Южной Америки после Амазонки, а её имя пришло из языка гуарани и, по одной из версий, значит что-то вроде «река-море». Уругвай течёт навстречу, и вместе они образуют Ла-Плату. Но прямо перед встречей Парана успевает построить лабиринт из островов. Он называется дельта.", "caption": "Две реки, Парана и Уругвай, встречаются и образуют Ла-Плату", "big": "", "imgs": [{"src": "img/d4_1.jpg", "cap": "Карта бассейна Ла-Платы: Парана и Уругвай сходятся у моря", "credit": "Kmusser, CC BY-SA 3.0"}, {"src": "img/d4_2.jpg", "cap": "Парана у Росарио: река такая широкая, что похожа на море", "credit": "César Pérez, CC BY-SA 4.0"}, {"src": "img/d4_3.jpg", "cap": "Снимок NASA: Парана и Уругвай, зелёная дельта и бурая вода", "credit": "MODIS Land Rapid Response Team, NASA GSFC, Public domain"}], "img": "img/d4_1.jpg", "credit": "Kmusser, CC BY-SA 3.0"}, {"audio": "pres/ferry_delta-02.mp3", "text": "Дельта это место, где река разбегается на множество рукавов. Дельта Параны тянется примерно на триста двадцать километров, а площадь у неё больше четырнадцати тысяч квадратных километров. Необычна она тем, что впадает не в океан, а в другую реку. И дельта растёт: по оценке газеты «Ла Насьон», в среднем на шестьдесят метров в год. По одной из оценок, через несколько веков она дойдёт до самого Буэнос-Айреса.", "caption": "Дельта Параны: лабиринт островов, растёт примерно на 60 метров в год", "big": "320 км", "imgs": [{"src": "img/d4_4.jpg", "cap": "Снимок NASA: дельта Параны, лабиринт островов и проток", "credit": "NASA, Public domain"}, {"src": "img/c_ferry_river-14.jpg", "cap": "Дельта реки Парана с самолёта: бурая вода несёт ил и песок", "credit": "Martin Terber, CC BY 2.0"}, {"src": "img/d4_5.jpg", "cap": "Старая карта дельты Параны: река разбегается на рукава", "credit": "Stanfords (London), Public domain"}], "img": "img/d4_4.jpg", "credit": "NASA, Public domain"}, {"audio": "pres/ferry_delta-03.mp3", "text": "Ворота в дельту это городок Тигре, примерно в тридцати километрах от Буэнос-Айреса. Почему «тигр», если тигров в Америке нет? По преданию, у ручья когда-то хозяйничал ягуар, и ручей назвали Тигре. В Пуэрто-де-Фрутос с островов привозили на лодках фрукты и лозу для плетения, а теперь там ремесленная ярмарка. А ещё Тигре зовут колыбелью аргентинской гребли: здесь много гребных клубов.", "caption": "Тигре: ягуар-«тигр», рынок Пуэрто-де-Фрутос и гребцы", "big": "", "imgs": [{"src": "img/d4_6.jpg", "cap": "Ягуар: в этих краях его называли тигром", "credit": "Garst, Warren, 1922-2016, photographer, CC BY-SA 4.0"}, {"src": "img/d4_7.jpg", "cap": "Фруктовый рынок Тигре, 1902 год: горы корзин и фруктов", "credit": "Harry Grant Olds, Public domain"}, {"src": "img/d4_8.jpg", "cap": "Гребцы на реке Лухан в Тигре", "credit": "Murgatroyd49, CC BY-SA 4.0"}], "img": "img/d4_6.jpg", "credit": "Garst, Warren, 1922-2016, photographer, CC BY-SA 4.0"}, {"audio": "pres/ferry_delta-04.mp3", "text": "В Тигре стоит нарядный дворец, и это музей. Его построили как клуб в начале прошлого века, а в две тысячи шестом году открыли Музей искусств Тигре. А в дельте, на реке Сармьенто, есть музей-малыш: деревянный домик в стеклянном футляре. Он принадлежал Доминго Сармьенто, будущему президенту, и тот назвал его «Прочида», по острову возле Неаполя. Сармьенто так любил школы, что день его памяти, одиннадцатое сентября, отмечают как День учителя.", "caption": "Музей искусств Тигре и домик Сармьенто в стеклянном футляре", "big": "2006", "imgs": [{"src": "img/d4_9.jpg", "cap": "Музей искусств Тигре со стороны реки", "credit": "panr (Flickr), CC BY 2.0"}, {"src": "img/d4_10.jpg", "cap": "Музей искусств Тигре: бывший клуб с белыми арками", "credit": "Roberto Fiadone, CC BY-SA 4.0"}, {"src": "img/d4_11.jpg", "cap": "Домик Сармьенто в стеклянном футляре на реке Сармьенто", "credit": "Facu Gelves, CC BY-SA 2.0"}], "img": "img/d4_9.jpg", "credit": "panr (Flickr), CC BY 2.0"}, {"audio": "pres/ferry_delta-05.mp3", "text": "На островах живёт около десяти тысяч человек, по оценке газеты. Дома стоят на сваях, высоко над водой, чтобы разлив не добрался до комнат. Улиц нет, вместо них протоки, а вместо автобуса лодка, ланча колектива. На такой лодке многие дети плывут утром в школу. Продукты привозит ланча альмасенера, настоящий плавучий супермаркет. А ещё тут есть мусорная лодка и даже плавучая больница.", "caption": "Жизнь в дельте: дом на сваях, лодка-автобус, плавучий магазин", "big": "", "imgs": [{"src": "img/d4_12.jpg", "cap": "Дом на сваях в дельте возле Тигре", "credit": "davidw (Flickr), CC BY 2.0"}, {"src": "img/d4_13.jpg", "cap": "Ланча колектива: лодка-автобус дельты", "credit": "Rcidte, Public domain"}, {"src": "img/d4_14.jpg", "cap": "Ланча альмасенера: плавучий магазин с продуктами", "credit": "Rcidte, CC BY-SA 3.0"}], "img": "img/d4_12.jpg", "credit": "davidw (Flickr), CC BY 2.0"}, {"audio": "pres/ferry_delta-06.mp3", "text": "Теперь посмотрим, кто живёт на берегах. Это капибара, по-аргентински карпинчо, самый большой грызун на свете. Взрослая весит от тридцати пяти до шестидесяти шести килограммов и может не дышать под водой до пяти минут. Рядом живёт нутрия, или койпо, с ярко-оранжевыми зубами: так в них проявляется железо. А рыбу ловят белые и серые цапли.", "caption": "Капибара, нутрия с оранжевыми зубами и цапля", "big": "до 66 кг", "imgs": [{"src": "img/d4_15.jpg", "cap": "Семья капибар в воде", "credit": "Bob Johnson, CC BY-SA 4.0"}, {"src": "img/d4_16.jpg", "cap": "Нутрия: видны большие оранжевые зубы", "credit": "Peleg, Public domain"}, {"src": "img/d4_17.jpg", "cap": "Серая цапля гарза мора у воды", "credit": "Irene, CC0"}], "img": "img/d4_15.jpg", "credit": "Bob Johnson, CC BY-SA 4.0"}, {"audio": "pres/ferry_delta-07.mp3", "text": "В августе две тысячи двадцать первого года капибары прославились на весь мир. В закрытом посёлке Нордельта, построенном на болоте возле Тигре, они стали гулять по улицам и объедать газоны. Весь интернет смеялся, а эколог Энрике Виале сказал: это Нордельта вторглась в мир карпинчо. Выходит, дом у капибар был здесь раньше, чем посёлок.", "caption": "Август 2021: капибары гуляют по посёлку Нордельта", "big": "2021", "imgs": [{"src": "img/d4_18.jpg", "cap": "Закрытый посёлок Нордельта: дома, озёра и газоны", "credit": "Grupo Monarca, CC BY-SA 4.0"}, {"src": "img/d4_19.jpg", "cap": "Озёра Нордельты, построенной на бывшем болоте", "credit": "AnuPrieto, CC BY-SA 4.0"}, {"src": "img/d4_20.jpg", "cap": "Капибара щиплет траву", "credit": "Tomás Carranza Perales, CC0"}], "img": "img/d4_18.jpg", "credit": "Grupo Monarca, CC BY-SA 4.0"}, {"audio": "pres/ferry_delta-08.mp3", "text": "Вернёмся к острову Мартин-Гарсия, о котором мы уже говорили. Он лежит в уругвайских водах, у самого берега Уругвая, а принадлежит Аргентине. Так решили в договоре о Рио-де-ла-Плата, подписанном девятнадцатого ноября тысяча девятьсот семьдесят третьего года. Получился эксклав: кусочек одной страны посреди чужих вод. Там должен быть заповедник, а жили на нём, по данным две тысячи восьмого года, около ста пятидесяти человек.", "caption": "Мартин-Гарсия: остров Аргентины в водах Уругвая", "big": "1973", "imgs": [{"src": "img/c_ferry_river-7.jpg", "cap": "Остров Мартин-Гарсия с самолёта: зелёный островок посреди реки", "credit": "Rik Schuiling / TropCrop-TCS, CC BY-SA 4.0"}, {"src": "img/d4_21.jpg", "cap": "Остров Мартин-Гарсия: старая пристань среди заповедных зарослей", "credit": "Roberto Fiadone, CC BY-SA 4.0"}, {"src": "img/d4_22.jpg", "cap": "Посёлок на острове Мартин-Гарсия: церковь и дома", "credit": "Roberto Fiadone, CC BY-SA 4.0"}], "img": "img/c_ferry_river-7.jpg", "credit": "Rik Schuiling / TropCrop-TCS, CC BY-SA 4.0"}, {"audio": "pres/ferry_delta-09.mp3", "text": "Две столицы смотрят друг на друга через реку: Буэнос-Айрес и Монтевидео, примерно в двухстах километрах. Их объединяет не только вода, но и музыка. Танго родилось в бедных кварталах обоих городов, где встретились переселенцы из Европы, потомки африканцев и местные жители. В две тысячи девятом году ЮНЕСКО внесла его в список нематериального наследия человечества, одно на двоих, на Аргентину и Уругвай.", "caption": "Буэнос-Айрес и Монтевидео смотрят друг на друга, а танго у них одно", "big": "2009", "imgs": [{"src": "img/d4_23.jpg", "cap": "Центр Буэнос-Айреса с берега Ла-Платы", "credit": "Dan DeLuca, CC BY 2.0"}, {"src": "img/d4_24.jpg", "cap": "Монтевидео за бухтой, вид с холма Серро", "credit": "Marcelo Campi, CC BY-SA 3.0"}, {"src": "img/d4_25.jpg", "cap": "Танцуют танго в Палермо, Буэнос-Айрес, около 1890 года", "credit": "Unknown author, Public domain"}], "img": "img/d4_23.jpg", "credit": "Dan DeLuca, CC BY 2.0"}, {"audio": "pres/ferry_delta-10.mp3", "text": "Там, где речка Риачуэло впадает в Ла-Плату, лежит Ла-Бока, что значит «устье». В конце девятнадцатого века сюда приплыли переселенцы из итальянской Генуи. Дома они строили из металлических листов и красили, по рассказам, остатками корабельной краски. С тысяча девятьсот пятьдесят девятого года улочка Каминито стала музеем под открытым небом. Есть и знаменитое танго «Каминито», его написал в тысяча девятьсот двадцать шестом году Хуан де Диос Филиберто.", "caption": "Ла-Бока: порт на Риачуэло, разноцветные дома, улочка Каминито", "big": "1959", "imgs": [{"src": "img/d4_26.jpg", "cap": "Художник Кинкела Мартин у порта Ла-Боки на Риачуэло, 1953", "credit": "Unknown author, Public domain"}, {"src": "img/d4_27.jpg", "cap": "Разноцветные дома улочки Каминито", "credit": "Lars Curfs (Grashoofd), CC BY-SA 3.0 (NL)"}, {"src": "img/d4_28.jpg", "cap": "Уличное танго на Каминито", "credit": "padrei, CC BY 3.0"}], "img": "img/d4_26.jpg", "credit": "Unknown author, Public domain"}, {"audio": "pres/ferry_delta-11.mp3", "text": "А ещё эта река работяга. Порт Пуэрто-Мадеро достроили в тысяча восемьсот девяносто седьмом году, и в начале прошлого века он мог отправлять в день до тридцати тысяч тонн зерна. По Паране и соседней реке Парагвай идёт водный путь «Идровия» длиной около трёх с половиной тысяч километров. По нему тянутся баржи с соей. А порты возле Росарио в две тысячи двадцать пятом году, по данным местной биржи, стали первыми в мире по вывозу сельскохозяйственных товаров.", "caption": "Порт Пуэрто-Мадеро и водный путь Парана-Парагвай: баржи с соей", "big": "3 500 км", "imgs": [{"src": "img/d4_29.jpg", "cap": "Порт Пуэрто-Мадеро около 1900 года: склады для зерна", "credit": "Unknown, Public domain"}, {"src": "img/d4_30.jpg", "cap": "Группа барж на реке Парана", "credit": "Claudio Elias, CC BY-SA 3.0"}, {"src": "img/d4_31.jpg", "cap": "Танкерные баржи на водном пути Парана-Парагвай", "credit": "Claudio Elias, Public domain"}], "img": "img/d4_29.jpg", "credit": "Unknown, Public domain"}, {"audio": "pres/ferry_delta-12.mp3", "text": "Задание для юного путешественника: пока мы плывём, смотри на реку и считай, сколько больших кораблей и барж ты увидишь. А потом представь рядом капибару: в длину она от метра до метра тридцати пяти, почти с тебя ростом. Придумай ей имя. А если спросят, чей остров Мартин-Гарсия, ты уже знаешь ответ. Счастливого плавания!", "caption": "Задание: считай корабли и баржи на реке, придумай имя капибаре", "big": "", "imgs": [{"src": "img/c_ferry_river-1.jpg", "cap": "Яхты на Ла-Плате: до горизонта вода, как на море", "credit": "Blmurch, CC BY-SA 4.0"}, {"src": "img/d4_32.jpg", "cap": "Баржа на реке Парана у города Корриентес", "credit": "Carla Antonini, CC BY-SA 2.5 (AR)"}, {"src": "img/d4_33.jpg", "cap": "Две капибары отдыхают", "credit": "Maria Pilar Etxebarria, Public domain"}], "img": "img/c_ferry_river-1.jpg", "credit": "Blmurch, CC BY-SA 4.0"}]}, "ferry_boats": {"title": "Как плавали через реку", "kid": "Подплывая к Колонии, найди маяк первым. Он красно-белый, как леденец. Увидел, крикни: «Маяк!»", "segs": [{"audio": "pres/ferry_boats-01.mp3", "text": "Ваш паром идёт через реку чуть больше часа. А в начале двадцатого века такой путь на пароходе занимал, по разным источникам, от шести до восьми часов. Как же люди научились плавать здесь так быстро? Начнём с человека, который больше всех сделал для речных перевозок. Это история мальчишки с лодки.", "caption": "Сегодня около часа пути, а сто лет назад от шести до восьми часов", "big": "6–8 часов", "imgs": [{"src": "img/ferry_boats-1.jpg", "cap": "Скоростные паромы Buquebus у причала в Колонии", "credit": "Liam Quinn from Canada, CC BY-SA 2.0"}, {"src": "img/c_ferry_boats-1.jpg", "cap": "Порт Буэнос-Айреса около 1910 года: старые пароходы у причалов", "credit": "Unknown author, Public domain"}, {"src": "img/ferry_boats-6.jpg", "cap": "Историческое фото: пассажиры идут по длинному деревянному причалу, а на воде стоит пароход", "credit": "Unknown photographer, Public domain"}], "img": "img/ferry_boats-1.jpg", "credit": "Liam Quinn from Canada, CC BY-SA 2.0"}, {"audio": "pres/ferry_boats-02.mp3", "text": "Его звали Николас Миханович. Он родился в середине девятнадцатого века в хорватском селе Доли, возле Дубровника, в семье, у которой была маленькая парусная лодка «Фортуната». В двенадцать лет он уже ходил юнгой на парусном судне дяди. В тысяча восемьсот шестьдесят седьмом году он сошёл на берег в Монтевидео почти без денег и не зная испанского, и стал лодочником. Потом, в Буэнос-Айресе, он нанялся к капитану, который буксирами перевозил грузы и людей с кораблей на берег.", "caption": "Николас Миханович: мальчишка с парусной лодки «Фортуната»", "big": "", "imgs": [{"src": "img/c_ferry_boats-2.jpg", "cap": "Николас Миханович, будущий «король рек»", "credit": "Unknown author, Public domain"}, {"src": "img/c_ferry_boats-3.jpg", "cap": "Дубровник: рядом в селе Доли родился Миханович", "credit": "VynedJ, CC BY 4.0"}, {"src": "img/c_ferry_boats-4.jpg", "cap": "Пассажирский причал Буэнос-Айреса в 1860-х, где работали лодочники", "credit": "Unknown author, Public domain"}], "img": "img/c_ferry_boats-2.jpg", "credit": "Unknown author, Public domain"}, {"audio": "pres/ferry_boats-03.mp3", "text": "Когда капитан погиб, Миханович взял его дело в свои руки, а позже женился на его вдове. Он покупал буксиры, потом пароходы. В тысяча восемьсот восемьдесят седьмом году его пароход «Рапидо», что значит «быстрый», начал регулярные рейсы между Буэнос-Айресом, Колонией и Кармело. Позже у него было, по некоторым данным, больше трёхсот судов с чёрными трубами и большой белой буквой «эм». Испанский писатель Висенте Бласко Ибаньес называл его королём рек.", "caption": "1887: пароход «Рапидо» открывает регулярную линию, «король рек»", "big": "1887", "imgs": [{"src": "img/c_ferry_boats-5.jpg", "cap": "Старый порт Буэнос-Айреса: пароход и толпа пассажиров", "credit": "Unknown author, Public domain"}, {"src": "img/c_ferry_boats-6.jpg", "cap": "Здание компании Михановича в Буэнос-Айресе", "credit": "Elsapucai, Public domain"}, {"src": "img/c_ferry_boats-7.jpg", "cap": "Писатель Бласко Ибаньес назвал Михановича королём рек", "credit": "LAURA MORET ESCRIG, CC BY-SA 4.0"}], "img": "img/c_ferry_boats-5.jpg", "credit": "Unknown author, Public domain"}, {"audio": "pres/ferry_boats-04.mp3", "text": "В двадцатом веке на смену пароходам пришли скоростные суда. Компанию Букебус основал в тысяча девятьсот семьдесят девятом году аргентинский предприниматель Хуан Карлос Лопес Мена, чтобы быстро и надёжно соединить Буэнос-Айрес и Монтевидео. На линии до Колонии в тысяча девятьсот восемьдесят шестом году вышли суда «Эладия Исабель» и «Флеча де Буэнос-Айрес». Через десять лет, в тысяча девятьсот девяносто шестом году, появилось скоростное судно «Силвия Ана Эле», которое может идти почти со скоростью восьмидесяти километров в час.", "caption": "1979: основан Букебус; 1996: «Силвия Ана Эле» почти 80 км/ч", "big": "1979", "imgs": [{"src": "img/c_ferry_boats-8.jpg", "cap": "Скоростной катамаран Букебус у терминала в Буэнос-Айресе", "credit": "User:Banfield, CC BY-SA 2.5"}, {"src": "img/ferry_boats-2.jpg", "cap": "Паром Buquebus у пирса в Колонии: через несколько часов он отправится в Буэнос-Айрес", "credit": "Jaan-Cornelius K. from Buenos Aires, Argentina, CC BY-SA 2.0"}, {"src": "img/c_ferry_boats-9.jpg", "cap": "Нос судна Букебус: белый корпус с жёлто-синей волной", "credit": "Liam Quinn from Canada, CC BY-SA 2.0"}], "img": "img/c_ferry_boats-8.jpg", "credit": "User:Banfield, CC BY-SA 2.5"}, {"audio": "pres/ferry_boats-05.mp3", "text": "Компания Колония Экспресс, чьим паромом вы плывёте, моложе. Она начала работать двадцать восьмого февраля две тысячи седьмого года. Её основали дети бывших владельцев другой паромной компании, Феррилинеас. Первый катамаран назывался так же, как компания, и вмещал триста шестьдесят пассажиров. В августе к нему присоединился «Буэнос-Айрес Экспресс», а в две тысячи пятнадцатом году появился флагман «Атлантик Экспресс» на пятьсот семьдесят семь пассажиров и восемьдесят восемь машин.", "caption": "28 февраля 2007: начинает работу Колония Экспресс", "big": "2007", "imgs": [{"src": "img/c_ferry_boats-10.jpg", "cap": "Катамаран «Колония Экспресс» у причала", "credit": "Mándbu, CC BY 4.0"}, {"src": "img/c_ferry_boats-11.jpg", "cap": "Терминал компании «Колония Экспресс»", "credit": "Gobonobo, CC BY-SA 3.0"}, {"src": "img/c_ferry_boats-12.jpg", "cap": "Паромный порт Колонии: отсюда ходят катамараны в Буэнос-Айрес", "credit": "Photograph by Mike Peel (www.mikepeel.net)., CC BY-SA 4.0"}], "img": "img/c_ferry_boats-10.jpg", "credit": "Mándbu, CC BY 4.0"}, {"audio": "pres/ferry_boats-06.mp3", "text": "Самый быстрый корабль этих вод называется «Франсиско», в честь папы Франциска. Его построили на верфи Инкат на острове Тасмания и в две тысячи тринадцатом году пустили по линии Буэнос-Айрес Монтевидео. Он может идти со скоростью до пятидесяти восьми узлов, это около ста семи километров в час, и когда его построили, это был самый быстрый паром в мире. Работает он на сжиженном природном газе, а завод по его производству Букебус построил сам.", "caption": "«Франсиско»: 58 узлов и сжиженный природный газ", "big": "58 узлов", "imgs": [{"src": "img/c_ferry_boats-13.jpg", "cap": "Скоростной паром «Франсиско» на ходу, до 58 узлов", "credit": "Fcobqb, CC BY-SA 4.0"}, {"src": "img/c_ferry_boats-14.jpg", "cap": "Верфь Инкат в Хобарте на острове Тасмания", "credit": "Gary Houston, CC0"}, {"src": "img/ferry_boats-3.jpg", "cap": "Скоростной катамаран «Франсиско» (Buquebus) в порту Буэнос-Айреса", "credit": "ProfesorFavalli, CC BY-SA 4.0"}], "img": "img/c_ferry_boats-13.jpg", "credit": "Fcobqb, CC BY-SA 4.0"}, {"audio": "pres/ferry_boats-07.mp3", "text": "А новейший корабль на линии называется «Чина Соррилья». По данным Википедии, это крупнейшее в мире полностью электрическое судно. Его тоже построила верфь Инкат, в Хобарте, в Австралии, и спустила на воду второго мая две тысячи двадцать пятого года. Длина сто тридцать метров, он вмещает две тысячи сто пассажиров и двести двадцать пять машин, батареи на нём на сорок мегаватт-часов, а скорость двадцать пять узлов, около сорока шести километров в час. Он не выбрасывает дыма.", "caption": "«Чина Соррилья»: крупнейший в мире электрический корабль", "big": "40 МВт·ч", "imgs": [{"src": "img/ferry_boats-5.jpg", "cap": "Новый электрический паром «Чина Соррилья» для Buquebus, построенный на верфи в Тасмании", "credit": "Chuq, CC BY-SA 4.0"}, {"src": "img/c_ferry_boats-15.jpg", "cap": "Электрический «Чина Соррилья» у верфи в Хобарте, 2025 год", "credit": "Chuq, CC BY-SA 4.0"}, {"src": "img/c_ferry_boats-16.jpg", "cap": "Хобарт на Тасмании: здесь построили самый большой электрический корабль", "credit": "Diego Delso, CC BY-SA 3.0"}], "img": "img/ferry_boats-5.jpg", "credit": "Chuq, CC BY-SA 4.0"}, {"audio": "pres/ferry_boats-08.mp3", "text": "Через океан его привёз тяжёлый корабль-перевозчик «Блэк Марлин», и десятого сентября этого года судно прибыло в Уругвай. А двадцать второго октября «Чина Соррилья» начал возить пассажиров между Буэнос-Айресом и Колонией, пока один рейс в день. Если повезёт, вы его увидите, а может быть, и встретите на обратном пути.", "caption": "Путь корабля: Тасмания, Уругвай, 22 октября 2026 первый рейс", "big": "22 октября", "imgs": [{"src": "img/c_ferry_boats-17.jpg", "cap": "Тяжёлый корабль «Блэк Марлин» везёт груз через океан", "credit": "Ronnie Robertson, CC BY-SA 2.0"}, {"src": "img/c_ferry_boats-18.jpg", "cap": "«Блэк Марлин» в порту: на палубе умещаются целые суда", "credit": "kees torn, CC BY-SA 2.0"}, {"src": "img/c_ferry_boats-19.jpg", "cap": "Порт Колонии сверху: здесь причаливают паромы", "credit": "Helge Høifødt, CC BY-SA 3.0"}], "img": "img/c_ferry_boats-17.jpg", "credit": "Ronnie Robertson, CC BY-SA 2.0"}, {"audio": "pres/ferry_boats-09.mp3", "text": "Кто такая Чина Соррилья? Это знаменитая уругвайская актриса, которую считают представительницей культуры обоих берегов Ла-Платы. Она родилась в Монтевидео четырнадцатого марта тысяча девятьсот двадцать второго года и прожила девяносто два года. Прозвище «Чина» получилось из детской переделки имени Консепсьон: сначала «кочона», по-французски «кочон», то есть поросёнок, потом «кочина» и наконец просто «Чина». Она сыграла более чем в пятидесяти фильмах и много лет работала в театре и кино Аргентины.", "caption": "Чина Соррилья: актриса, которую любили на обоих берегах", "big": "1922", "imgs": [{"src": "img/c_ferry_boats-20.jpg", "cap": "Чина Соррилья, знаменитая уругвайская актриса", "credit": "Unknown author, Public domain"}, {"src": "img/c_ferry_boats-21.jpg", "cap": "Поросёнок: французское «кочон» превратилось в «Чину»", "credit": "Basile Morin, CC BY-SA 4.0"}, {"src": "img/c_ferry_boats-22.jpg", "cap": "Чина Соррилья на сцене: она много лет играла в театре", "credit": "Unknown author, Public domain"}], "img": "img/c_ferry_boats-20.jpg", "credit": "Unknown author, Public domain"}, {"audio": "pres/ferry_boats-10.mp3", "text": "А как корабль находит дорогу в такой мелкой реке? Главные помощники это каналы, то есть углублённые и отмеченные пути. Их чистят землечерпалками и обозначают буями и знаками. Например, за канал Мартин-Гарсия отвечает общая комиссия Аргентины и Уругвая. Капитан ведёт судно по морской карте и спутниковой навигации. Но и людям на палубе полезно смотреть вперёд.", "caption": "Каналы, буи и землечерпалки: дорога по мелкой реке", "big": "", "imgs": [{"src": "img/c_ferry_boats-23.jpg", "cap": "Схема каналов в Ла-Плате: корабли идут по отмеченным путям", "credit": "Claudio Elias, Public domain"}, {"src": "img/c_ferry_boats-24.jpg", "cap": "Красный буй на Ла-Плате отмечает фарватер", "credit": "WiZaRd SaiLoR, Public domain"}, {"src": "img/c_ferry_boats-25.jpg", "cap": "Штурман прокладывает курс по морской карте (фото ВМС США)", "credit": "U.S. Navy photo by Photographer’s Mate 1st Class Novia E Harrington., Public domain"}], "img": "img/c_ferry_boats-23.jpg", "credit": "Claudio Elias, Public domain"}, {"audio": "pres/ferry_boats-11.mp3", "text": "Что же искать с палубы? Сначала берега не видно совсем. Потом появится тонкая полоска суши и низкий город. Ищите башню маяка. Огонь маяка Колонии расположен на высоте тридцати четырёх метров над уровнем моря, и в ясную погоду, как пишут, виден примерно за двенадцать километров. Башня белая, а на самом верху стеклянный фонарь. Задание для юного путешественника: когда будешь подплывать к Колонии, найди маяк первым. Он красно-белый, как леденец. Увидел, крикни: «Маяк!»", "caption": "Ищите красно-белый маяк Колонии на горизонте", "big": "12 км", "imgs": [{"src": "img/c_ferry_boats-26.jpg", "cap": "Вид с маяка: низкий берег Колонии и река до горизонта", "credit": "TiziPro22, CC BY-SA 4.0"}, {"src": "img/c_ferry_boats-27.jpg", "cap": "Башня маяка Колонии над деревьями старого города", "credit": "Skellig2008 from New York City, USA, CC BY 2.0"}, {"src": "img/c_ferry_boats-28.jpg", "cap": "Маяк Колонии среди руин монастыря", "credit": "P. Hughes, CC BY 4.0"}], "img": "img/c_ferry_boats-26.jpg", "credit": "TiziPro22, CC BY-SA 4.0"}]}, "w2_intro": {"title": "Дома и люди старой Колонии", "kid": "Сегодня у тебя три помощника: глаза, ладони и уши. На каждой остановке будет задание.", "segs": [{"audio": "pres/w2_intro-01.mp3", "text": "Здравствуйте! Это вторая прогулка по старой Колонии, и она не про ворота, маяки и осады, а про дома и людей. Мы будем читать дома, как книгу: по крыше, по стене, по двери, по балкону, по табличке на углу. И у каждого дома найдём хозяев и жильцов: командиров и солдат, купцов, адмирала, бедные семьи, которые жили в одном доме вместе, и тех, о ком в документах почти ничего не сказано.", "caption": "Дома и люди старой Колонии: читаем дома, как книгу", "big": "Дома и люди", "imgs": [], "img": null, "credit": ""}, {"audio": "pres/w2_intro-02.mp3", "text": "Вот главное, что полезно знать про здешние дома. Португальцы строили низкие каменные дома с толстыми стенами и двускатной крышей из красной черепицы. Испанцы любили более ровные крыши, их называют азотеи, а ещё балконы и двери с аркой. В Колонии эти два стиля стоят рядом, иногда стена к стене. Поэтому так интересно гулять с открытыми глазами и угадывать, чья рука строила.", "caption": "Две крыши: португальская скатная и испанская плоская", "big": "", "imgs": [], "img": null, "credit": ""}, {"audio": "pres/w2_intro-03.mp3", "text": "Маршрут короткий, около километра с небольшим, восемь остановок. Начинаем почти у вашей двери и сюда же вернёмся. Многие остановки стоят совсем близко друг к другу, так что для малыша это скорее игра с короткими перебежками. Музеи по пути необязательны: нам нужны фасады, стены и улицы, а их можно рассматривать просто так.", "caption": "Около километра, восемь остановок, старт у вашей двери", "big": "8 остановок", "imgs": [], "img": null, "credit": ""}, {"audio": "pres/w2_intro-04.mp3", "text": "И одно правило: в этих домах живут люди. Фотографируйте фасады и трогайте стены, но в двери не стучите и в окна не заглядывайте. А для самого юного путешественника у нас три помощника: глаза, ладони и уши. На каждой остановке тебя ждёт задание, а у взрослых будет свой вопрос. Готов? Тогда идём к первому дому, которого уже нет.", "caption": "В домах живут люди: смотрим и трогаем, но не стучим", "big": "", "imgs": [], "img": null, "credit": ""}]}, "w2_gob": {"title": "Дом губернаторов: что лежит под ногами", "kid": "Положи ладонь на камень мостовой: под ним старая дорога с колеями. И сосчитай свои шаги вдоль длинной стены.", "segs": [{"audio": "pres/w2_gob-01.mp3", "text": "Мы у дома, которого уже нет, зато его стены под нами. Перед вами низкие каменные стены на площади Пласа-де-Армас, слева от Базилики. Это Дом губернаторов, самый важный дом португальского города. Внутрь заходить не нужно, это памятник, смотрите с края. А рассказывать нам будут археологи: они копали здесь с января тысяча девятьсот девяносто первого года по октябрь тысяча девятьсот девяносто второго, почти два года.", "caption": "Руины Дома губернаторов на площади Пласа-де-Армас", "big": "", "imgs": [], "img": null, "credit": ""}, {"audio": "pres/w2_gob-02.mp3", "text": "Дом оказался вытянутым прямоугольником, примерно двадцать два метра в ширину и сорок семь в длину. Стены толщиной сорок пять сантиметров сложены из камня, кирпича и обломков черепицы. Входов три: на север, к церкви, на юг, к площади, и главный, на восток. На карте тысяча семьсот тридцать первого года у дома почти нет окон наружу, зато над ним поднимается что-то вроде смотровой башенки. Это был дом правителя и немного крепость.", "caption": "Дом правителя и немного крепость: 22 на 47 метров", "big": "22 на 47 метров", "imgs": [], "img": null, "credit": ""}, {"audio": "pres/w2_gob-03.mp3", "text": "Теперь о том, что здесь ели. В середине дома лежал слой золы и угля, а в нём множество остатков обедов. Судя по костям, чаще всего на стол попадала рыба и другие обитатели воды, ведь река совсем рядом. Были кости птиц и полевого оленя, а ещё овец, коров и свиней, то есть привычных европейских животных. Эти находки показывали в витрине на первой в Уругвае выставке исторических находок.", "caption": "Остатки обедов: рыба, птицы, олень, овцы, коровы, свиньи", "big": "", "imgs": [], "img": null, "credit": ""}, {"audio": "pres/w2_gob-04.mp3", "text": "С водой тоже было продумано. На западной стороне дома нашли круглые каменные кладки, которые считают оголовками колодцев: воду там хранили и доставали. А позже, в конце девятнадцатого века, в Колонии строили сводчатые цистерны для дождевой воды, их называют альхибе. Одну такую археологи нашли в новой части Колонии, и сегодня её показывают всем желающим.", "caption": "Колодцы дома и цистерна для дождевой воды альхибе", "big": "", "imgs": [], "img": null, "credit": ""}, {"audio": "pres/w2_gob-05.mp3", "text": "А что пили и во что играли? В мусорных ямах нашли бутылки: круглые винные и квадратные из-под джина, в основном английские и испанские. Нашли два вида глиняных трубок, европейские и гуаранийские: рядом жили люди из двух миров. И фишки для какой-то игры, сделанные из осколков европейской посуды. Выходит, даже битая тарелка превращалась в развлечение.", "caption": "Бутылки, две глиняные трубки и фишки из осколков посуды", "big": "", "imgs": [], "img": null, "credit": ""}, {"audio": "pres/w2_gob-06.mp3", "text": "Последнее чудо можно потрогать. Под песком, на котором лежит нынешняя брусчатка, и над фундаментом дома археологи нашли следы грунтовой дороги девятнадцатого века, с колеями от телег и отпечатками копыт. Задание для юного путешественника: присядь и положи ладонь на камень мостовой, где-то под такими камнями лежит та самая дорога. А потом сосчитай свои шаги вдоль длинной стены: папа считает свои, ты свои, у кого получилось больше?", "caption": "Под брусчаткой лежит дорога с колеями телег", "big": "", "imgs": [], "img": null, "credit": ""}]}, "w2_archivo": {"title": "Архив: город, посчитанный по головам", "kid": "Найди на стене у входа чёрно-белый квадратик-код. Попроси папу навести на него телефон.", "segs": [{"audio": "pres/w2_archivo-01.mp3", "text": "Вы у дома на улице Мисьонес-де-лос-Тапес, номер сто пятнадцать. Здесь Исторический архив региона. Его создали в тысяча девятьсот семьдесят втором году, чтобы собрать документы о Колонии, которые разбросаны по архивам разных стран. Один туристический сайт называет дом португальским, примерно тысяча семьсот пятидесятого года, с сохранившимися стенами, крышей и каменными перемычками над окнами и дверями.", "caption": "Исторический архив региона, Мисьонес-де-лос-Тапес 115", "big": "115", "imgs": [], "img": null, "credit": ""}, {"audio": "pres/w2_archivo-02.mp3", "text": "Документы умеют считать людей. В тысяча семьсот двадцать втором году губернатор Васконселуш составил «Общую карту всего, что есть в Новой Колонии». В конце он записал число очагов, то есть семей: двести тридцать пять. И разделил жителей на группы: мужчины, женщины, девочки, мальчики, индейцы, индианки, рабы и рабыни. Без солдат и чиновников жителей было тысяча триста восемьдесят восемь, а вместе с ними около тысячи восьмисот.", "caption": "Карта 1722 года: 235 очагов и 1388 жителей без солдат", "big": "1722", "imgs": [], "img": null, "credit": ""}, {"audio": "pres/w2_archivo-03.mp3", "text": "Рабов в тот год записали двести девяносто четыре. В тысяча семьсот тридцатом году их стало шестьсот восемьдесят семь при трёхстах двадцати девяти очагах, то есть в среднем больше чем по два на семью. А в тысяча семьсот шестидесятом году историки насчитали тысячу пятьсот семьдесят пять человек, больше половины жителей города. Они работали по дому, в мастерских, в порту, были матросами. Многих привозили на продажу испанским соседям за рекой.", "caption": "Рабов становилось больше: 294, 687, 1575 человек", "big": "1575", "imgs": [], "img": null, "credit": ""}, {"audio": "pres/w2_archivo-04.mp3", "text": "Откуда они? По записям о крещении, больше половины матерей приехали из Центрально-Западной Африки, почти треть из Анголы. Взрослые, которых крестили уже здесь, в основном пришли с Берега Мина в Западной Африке. А в тысяча семьсот сорок восьмом и сорок девятом годах четыре корабля привезли в Колонию прямо из Африки тысячу пятьсот восемьдесят два человека.", "caption": "Откуда привезли: Ангола и Берег Мина", "big": "", "imgs": [], "img": null, "credit": ""}, {"audio": "pres/w2_archivo-05.mp3", "text": "А индейцы? В той же карте они записаны отдельной строкой. Вспомните гуаранийские трубки из Дома губернаторов. И название улицы под вашими ногами: «Миссии тапес» это иезуитские поселения гуарани на юге нынешней Бразилии. Область называли Тапе, и это слово, как пишут, значит на гуарани «путь к морю». Почему улицу назвали именно так, мы не нашли.", "caption": "Тапес: иезуитские миссии гуарани, «путь к морю»", "big": "", "imgs": [], "img": null, "credit": ""}, {"audio": "pres/w2_archivo-06.mp3", "text": "Задание для юного путешественника: найди на стене у входа чёрно-белый квадратик, который читает телефон. Это кьюар-код маршрута «Заглушённые голоса», он собран из рассказов жителей квартала. Попроси маму или папу навести телефон и посмотрите, что откроется. Взрослым вопрос: чьи голоса вы бы записали о вашей семье, чтобы их услышали через триста лет?", "caption": "Кьюар-код «Заглушённые голоса» на стене архива", "big": "", "imgs": [], "img": null, "credit": ""}]}, "w2_azotea": {"title": "Дом с плоской крышей", "kid": "Сравни две крыши: ровную у этого дома и из двух скатов у соседнего. Куда стечёт дождь с каждой? Какие камни под ногами?", "segs": [{"audio": "pres/w2_azotea-01.mp3", "text": "Посмотрите на крышу этого дома. Она почти ровная, как терраса. По-испански такая крыша называется азотея, и государственный указ тысяча девятьсот семьдесят шестого года так и называет дом: «дом с азотеей». В указе сказано, что в нём Муниципальный музей. Он открылся в тысяча девятьсот пятьдесят первом году, сегодня это Эспасио-Ребуффо, дом семьдесят семь на улице Дель-Комерсио. Мы сверили названия и адреса, и, по-видимому, речь именно об этом доме.", "caption": "Дом с азотеей: почти ровная крыша-терраса", "big": "азотея", "imgs": [], "img": null, "credit": ""}, {"audio": "pres/w2_azotea-02.mp3", "text": "В Колонии по крыше легко угадать, кто строил. Португальцы любили скатные черепичные крыши, а испанцы более ровные, с балконами и дверями с аркой наверху. Даже булыжник отличается: у португальцев камни-клинья, у испанцев мостовая ровнее. Опустите взгляд и посмотрите. Но это не строгое правило. Дома много раз перестраивали, и одно здание могло сменить стиль вместе с хозяевами.", "caption": "Португальская крыша со скатами и испанская ровная", "big": "", "imgs": [], "img": null, "credit": ""}, {"audio": "pres/w2_azotea-03.mp3", "text": "В указе записана биография дома. С тысяча семьсот двадцать третьего года он принадлежал Франсиско Альбину, командующему округами Лас-Виборас и Эспинильо. Кроме того, в нём жили испанские войска. О жизни испанских солдат сохранились письма. В тысяча семьсот шестьдесят первом году генерал Педро де Севальос писал ко двору, что жалованье солдатам задерживают, им приходится брать продукты в долг по завышенным ценам, а мундиры приходят с большим опозданием.", "caption": "С 1723 года дом принадлежал командующему Франсиско Альбину", "big": "1723", "imgs": [], "img": null, "credit": ""}, {"audio": "pres/w2_azotea-04.mp3", "text": "У португальцев было то же самое. В тысяча семьсот двадцатом году девять месяцев без жалованья вызвали мятеж пехоты Колонии. А один солдат в тысяча семьсот двадцать пятом году признался, что задолжал купцу огромную по тем временам сумму за еду и одежду, которые тот отпускал, когда жалованья не было. Вот как торговля держала город: купцы кормили армию в долг, пока она ждала денег.", "caption": "Солдаты ждали жалованья и брали еду в долг у купцов", "big": "", "imgs": [], "img": null, "credit": ""}, {"audio": "pres/w2_azotea-05.mp3", "text": "А с тысяча восемьсот двадцать восьмого года, по тому же указу, в этом доме жил адмирал Гильермо Браун. Тот самый, который в тысяча восемьсот двадцать шестом году подходил к Колонии с эскадрой. Два года назад он воевал у стен этого города, а теперь поселился в одном из его домов. История иногда устроена именно так.", "caption": "С 1828 года здесь жил адмирал Гильермо Браун", "big": "1828", "imgs": [], "img": null, "credit": ""}, {"audio": "pres/w2_azotea-06.mp3", "text": "Задание для юного путешественника: сравни две крыши. Найди дом с ровной крышей, это этот, и соседний, у которого крыша из двух скатов, как книжка, раскрытая домиком. Покажи пальцем, куда, по-твоему, стечёт дождь с каждой из них. А потом посмотри под ноги: камни одинаковые или разные? Взрослым вопрос: в каком из двух домов вы выбрали бы жить?", "caption": "Найди две крыши: ровную и из двух скатов", "big": "", "imgs": [], "img": null, "credit": ""}]}, "w2_nacarello": {"title": "Дом на много семей", "kid": "Положи ладонь на стену у входа и сосчитай, сколько твоих ладошек в её толщину. Потом хлопай ритм по коленям.", "segs": [{"audio": "pres/w2_nacarello-01.mp3", "text": "Следующий дом совсем рядом, это Каса-де-Накарелло. Крыша у него из двух скатов, покрыта красной черепицей. Такую изогнутую черепицу здесь зовут «муслера», от слова «мусло», бедро. Говорят, глину для неё формовали на бедре. Это скорее предание, надёжного подтверждения мы не нашли. А вот стены настоящие: в путеводителях пишут, что у старых португальских домов они толщиной почти в восемьдесят сантиметров, а двери и окна, как пишут про улицу Вздохов, маленькие и деревянные.", "caption": "Черепичная крыша «муслера» и толстые каменные стены", "big": "", "imgs": [], "img": null, "credit": ""}, {"audio": "pres/w2_nacarello-02.mp3", "text": "Дом называют музеем, но его настоящая история про людей. До реставрации шестидесятых годов нынешний Исторический квартал был обычным жилым районом, где жило много небогатых семей, и назывался Барио-Сур, то есть Южный квартал. Многие здешние дома были конвентильо: в одном доме жили сразу несколько семей. Известны конвентильо семей Усука, Накарелло и Бертон. Сегодня на их месте ресторан, музей и рынок ремёсел.", "caption": "Барио-Сур: в одном доме жили сразу несколько семей", "big": "конвентильо", "imgs": [], "img": null, "credit": ""}, {"audio": "pres/w2_nacarello-03.mp3", "text": "Вот неожиданная мысль. Старые дома сохранились ещё и потому, что в них жили небогатые люди. Соседи рассказывают: у бедных не было денег всё переделывать, поэтому стены, двери и окна остались старыми, а позже их назвали историческими. После тысяча девятьсот шестьдесят восьмого года началась реставрация. Одни хозяева получили деньги или новое жильё, а арендаторов и тех, у кого не было бумаг на дом, выселили. Возразить тогда было почти невозможно.", "caption": "Бедность сохранила старые стены, а потом пришла реставрация", "big": "", "imgs": [], "img": null, "credit": ""}, {"audio": "pres/w2_nacarello-04.mp3", "text": "Но жизнь тут кипела. С конвентильо Усука связывают карнавальную группу кандомбе «Караси Кемадо»: кандомбе это уличные барабаны, музыка уругвайцев африканского происхождения. Дети играли прямо на улицах в футбол и в шарики. А жительница по имени Поча прожила в квартале всю жизнь, переезжая лишь из дома в дом, и в две тысячи восьмом году её признали живой памятью. Голоса таких людей сегодня можно услышать, но об этом чуть позже.", "caption": "Кандомбе, футбол «Покас Пильчас» и шарики на улице", "big": "", "imgs": [], "img": null, "credit": ""}, {"audio": "pres/w2_nacarello-05.mp3", "text": "Задание для юного путешественника: положи ладонь на стену у входа и сосчитай, сколько твоих ладошек поместится в её толщину. Потом придумайте вместе свой ритм: хлопайте по коленям, два быстрых хлопка и один медленный, а мама или папа повторяют. Взрослым вопрос: какой самый старый предмет есть у вас дома, и кто им пользовался до вас?", "caption": "Сосчитай свои ладошки в толщину стены", "big": "", "imgs": [], "img": null, "credit": ""}]}, "w2_azulejo": {"title": "Дом, который почти построили заново", "kid": "Найди на доме камень, красную черепицу и дерево. Сколько сине-белых табличек видно отсюда?", "segs": [{"audio": "pres/w2_azulejo-01.mp3", "text": "Спустимся к реке. Перед вами маленький дом с красной двускатной крышей на набережной, Пасео-де-Сан-Габриэль, номер сто четыре. Это Эспасио-дель-Асулехо, музей плитки азулежу. Сейчас он, возможно, закрыт, и ничего страшного: нам интересен сам дом, снаружи. Встаньте так, чтобы видеть и стену, и крышу, и дверь. Что здесь старое, а что нет?", "caption": "Эспасио-дель-Асулехо, Пасео-де-Сан-Габриэль, 104", "big": "104", "imgs": [], "img": null, "credit": ""}, {"audio": "pres/w2_azulejo-02.mp3", "text": "Сами музейщики отвечают честно. Они пишут, что дом почти полностью восстановлен, а от старой португальской постройки остались двускатная черепичная крыша, каменные стены, центральная балка и часть пола. Так устроен весь квартал. С тысяча девятьсот шестьдесят девятого года до начала восьмидесятых годов восстанавливали стены, ворота, церкви и укрепления и открывали музеи. Старое здесь перемешано с новым.", "caption": "Дом почти полностью восстановлен: что здесь старое?", "big": "", "imgs": [], "img": null, "credit": ""}, {"audio": "pres/w2_azulejo-03.mp3", "text": "Из чего вообще строили? В тысяча семьсот двадцать втором году один испанский автор писал, что городок мал, но построен опрятно, а дома здесь строят по-современному, из бразильского дерева и местного камня. Дерево везли из Бразилии, а камень брали на месте. Так что даже обычная балка под крышей могла приплыть из другой страны.", "caption": "Бразильское дерево и местный камень: из чего строили", "big": "", "imgs": [], "img": null, "credit": ""}, {"audio": "pres/w2_azulejo-04.mp3", "text": "Теперь про плитку. Азулежу, расписная глазурованная плитка, считается португальской. Но музей уточняет: в архитектуру региона Ла-Платы плитка пришла в девятнадцатом веке, в основном французская, а в португальские времена её было мало или не было совсем. Коллекция внутри, по сведениям туристического сайта, из французской, испанской и португальской плитки семнадцатого и восемнадцатого веков, музей открыли в тысяча девятьсот восемьдесят восьмом году.", "caption": "Плитка пришла в Ла-Плату в девятнадцатом веке", "big": "19 век", "imgs": [], "img": null, "credit": ""}, {"audio": "pres/w2_azulejo-05.mp3", "text": "Значит, сине-белые таблички на углах, которые вы видели, португальские по стилю. Когда именно их повесили, мы надёжно не выяснили, возможно, при реставрации. В конце восьмидесятых годов советом по восстановлению руководил архитектор Мигель Одриосола, и, судя по всему, его именем названа улица на восточном краю квартала. Старые стены, новые таблички, и всё вместе похоже на настоящий португальский город, который восстановили с любовью.", "caption": "Сине-белые таблички португальские по стилю", "big": "", "imgs": [], "img": null, "credit": ""}, {"audio": "pres/w2_azulejo-06.mp3", "text": "Задание для юного путешественника: найди на этом доме три разных материала, камень, красную черепицу и дерево, и покажи на каждый пальцем. Потом найди на соседних домах сине-белые таблички с названием улицы и сосчитай, сколько их видно отсюда. Взрослым вопрос: что для вас значит настоящий дом, старые стены или старая жизнь?", "caption": "Камень, черепица и дерево: покажи пальцем", "big": "", "imgs": [], "img": null, "credit": ""}]}, "w2_playa": {"title": "Кто живёт здесь сегодня", "kid": "Найди три двери и догадайся, за какой настоящий дом: ищи занавески, цветы, велосипед. Не стучи. Сосчитай ступени.", "segs": [{"audio": "pres/w2_playa-01.mp3", "text": "Вы на улице Де-ла-Плайя, то есть «Пляжной». Она заканчивается ступенями вниз к реке. Почему её так назвали, мы документов не нашли, но догадаться нетрудно. По указу, на углу с Мисьонес-де-лос-Тапес стоит Каса-де-Паласиос, дом, охраняемый государством. Кто такой Паласиос, мы не выяснили. А вот кто живёт здесь сейчас, давайте подумаем вместе: посмотрите на окна и двери вокруг.", "caption": "Де-ла-Плайя: улица, спускающаяся к реке по ступеням", "big": "", "imgs": [], "img": null, "credit": ""}, {"audio": "pres/w2_playa-02.mp3", "text": "Цифры бывают говорливее домов. В тысяча девятьсот восемьдесят пятом году в этом квартале жили семьсот шестьдесят три человека. В тысяча девятьсот девяносто шестом году четыреста шестьдесят шесть, в две тысячи четвёртом триста тридцать два. А по неофициальному подсчёту две тысячи девятого года двести тридцать пять человек в восьмидесяти четырёх семьях. Зато в две тысячи девятнадцатом году в Колонию приехали двести восемьдесят пять тысяч девятьсот восемьдесят восемь туристов, а в обычные выходные по полуострову гуляют около пяти с половиной тысяч человек. Всё меньше жителей, всё больше гостей.", "caption": "Жителей: 763, 466, 332, 235 человек", "big": "763 → 235", "imgs": [], "img": null, "credit": ""}, {"audio": "pres/w2_playa-03.mp3", "text": "Дома стали гостиницами, магазинами, ресторанами и музеями. Квартал даже перестал называться Барио-Сур, остался только Исторический. Кто-то из жителей сказал грустно: я чувствую, что он перестал нам принадлежать. Другие вспоминают, как играли здесь детьми, и хотят, чтобы это знали. А раньше площадь, река, футбольное поле «Покас Пильчас», улицы и причал были местами встреч соседей, а не достопримечательностями. Поэтому и родилась затея с записанными голосами.", "caption": "Дома стали гостиницами, магазинами и музеями", "big": "", "imgs": [], "img": null, "credit": ""}, {"audio": "pres/w2_playa-04.mp3", "text": "В две тысячи первом году бывшие жильцы собрались на «Ночь встречи». Потом выходило издание «Воспоминания Юга». В две тысячи девятнадцатом году сняли фильм «Заглушённые голоса» с двенадцатью жителями и бывшими жителями. А по кварталу в пятнадцати местах висят кьюар-коды: наведёшь телефон, и человек, который здесь вырос, расскажет, как здесь жили на протяжении более восьмидесяти лет.", "caption": "Кьюар-коды «Заглушённые голоса»: рассказы тех, кто вырос здесь", "big": "15 мест", "imgs": [], "img": null, "credit": ""}, {"audio": "pres/w2_playa-05.mp3", "text": "Задание для юного путешественника: найди три двери и догадайся, за какой из них настоящий дом. Ищи занавески, цветы, велосипед, детскую игрушку у порога. Стучать нельзя, там живут люди. А потом спустись или поднимись по ступеням и сосчитай их. Взрослым вопрос: чем вы бы поделились о вашем доме с теми, кто придёт сюда через сто лет?", "caption": "Где настоящий дом? Занавески, цветы, велосипед", "big": "", "imgs": [], "img": null, "credit": ""}]}, "w2_real": {"title": "Улица, которая говорит", "kid": "Найди табличку из плитки и назови её цвета. Сколько фонарей на стенах ты видишь? Найди машину с цветами.", "segs": [{"audio": "pres/w2_real-01.mp3", "text": "Вы на Калье-Реаль, «Королевской улице», на перекрёстке с улочкой Де-Португаль. Королевской по-испански называют главную улицу, так что это название можно понять и как «главная». В путеводителях о ней пишут так же, как о Калье-де-лос-Суспирос: на углах сине-белая табличка в португальском стиле, а на стенах фонари, прикреплённые прямо к камню. Подними голову, они над тобой.", "caption": "Калье-Реаль: сине-белая табличка и фонарь на стене", "big": "", "imgs": [], "img": null, "credit": ""}, {"audio": "pres/w2_real-02.mp3", "text": "Как светили здесь в старину, надёжных записей мы не нашли, поэтому ничего не придумываем. Но есть живая традиция: по субботам в половине седьмого вечера местные гиды проводят прогулку «При свете фонаря». Шесть кварталов старого Южного квартала, дети до десяти лет идут бесплатно. Если захотите, узнайте на месте, проходит ли она в эту субботу.", "caption": "«При свете фонаря»: субботняя прогулка местных гидов", "big": "", "imgs": [], "img": null, "credit": ""}, {"audio": "pres/w2_real-03.mp3", "text": "Теперь представьте город глазами гостя. В тысяча семьсот сорок восьмом году здесь побывал иезуит Флориан Паукке. Он писал: дома низкие и стоят в хорошем порядке, площадь квадратная и маленькая, а живут в основном португальские торговцы. Ночью на площади, у главной стражи, держали коров губернатора. Кстати, в тысяча семьсот тридцать пятом году в городе было триста двадцать семь домов, восемнадцать улиц, шестнадцать переулков и четыре площади.", "caption": "1735 год: 327 домов, 18 улиц, 16 переулков, 4 площади", "big": "327 домов", "imgs": [], "img": null, "credit": ""}, {"audio": "pres/w2_real-04.mp3", "text": "Названия улиц тоже история. В конце шестидесятых годов восстановители решили вернуть улицам старые имена: список предложили в тысяча девятьсот семидесятом году, а утвердили в тысяча девятьсот семьдесят втором. Много имён святых: Сан-Хосе, Сан-Педро, Сан-Франсиско. И заметьте сами: Сан-Мигель, Сан-Педро и Сан-Антонио повторяют имена бастионов тысяча семьсот двадцать второго года. Возможно, это не случайность, но прямых записей об этом мы не нашли.", "caption": "Улицам вернули старые имена в 1972 году", "big": "1972", "imgs": [], "img": null, "credit": ""}, {"audio": "pres/w2_real-05.mp3", "text": "А ещё в старом городе любят старые машины. В Википедии есть фотография, на которой на этой улице стоит классический автомобиль. А шагов на пятьдесят восточнее, по улочке Де-Португаль, на карте отмечена «Коче Флорида», то есть «цветущая машина». Если она на месте, это старый автомобиль, превращённый в клумбу. Загляните, если хватит сил, а если нет, не страшно.", "caption": "Старые машины в старом городе: «Коче Флорида»", "big": "", "imgs": [], "img": null, "credit": ""}, {"audio": "pres/w2_real-06.mp3", "text": "Задание для юного путешественника: найди на углу табличку из плитки и скажи, какие на ней цвета. Потом найди фонарь на стене и сосчитай, сколько фонарей ты видишь на этой улице. А если найдёшь машину с цветами, помаши ей рукой. Взрослым вопрос: какое имя вы бы дали улице, на которой стоит ваш дом?", "caption": "Считаем фонари, слова на табличке и машины с цветами", "big": "", "imgs": [], "img": null, "credit": ""}]}, "w2_aguila": {"title": "Испанский дом с балконом", "kid": "Найди балкон с железной решёткой и сосчитай завитки. Найди дверь с аркой. По дороге домой сосчитай ровные и скатные крыши.", "segs": [{"audio": "pres/w2_aguila-01.mp3", "text": "Мы на углу улиц Сан-Хосе и Эспанья. Тут сразу три здания, которые государство взяло под охрану: дом Хуана де Агилы, дом, принадлежавший Самуэлю Пертону и Гильермо Вибмеру, и бывшая казарма с таможней у воды. Имена Пертон и Вибмер звучат не по-испански, но кто они были, мы не нашли. Зато видно, как рядом уживались дом, казарма и таможня: жизнь, солдаты и торговля.", "caption": "Три охраняемых здания на углу Сан-Хосе и Эспанья", "big": "3", "imgs": [], "img": null, "credit": ""}, {"audio": "pres/w2_aguila-02.mp3", "text": "Поднимите глаза на дом сто пятьдесят шесть по улице Сан-Хосе. Сегодня здесь Эспасио-Эспаньоль, Испанский музей, а у дома, как пишут, кованые железные балконы. В Колонии это почерк испанских домов: балконы, двери с аркой наверху, более ровные крыши и даже более ровный булыжник. Португальские дома проще и ниже. Но начиналось всё с португальской стройки: музей занимает два португальских дома восемнадцатого века, соединённые в один комплекс.", "caption": "Кованые балконы Эспасио-Эспаньоль, дом 156", "big": "156", "imgs": [], "img": null, "credit": ""}, {"audio": "pres/w2_aguila-03.mp3", "text": "Дом, как пишут путеводители, построили в первой половине восемнадцатого века. По их словам, он принадлежал испанскому торговцу, и в нём жили и португальские, и испанские семьи, хотя документа нам не попалось. Для нас здесь важна мысль: дома старше своих хозяев. Менялись власть, флаги и языки, а стены стояли и принимали каждого нового жильца, и каждый оставил на них свой след.", "caption": "Дом старше хозяев: португальский по строению, испанский по жизни", "big": "", "imgs": [], "img": null, "credit": ""}, {"audio": "pres/w2_aguila-04.mp3", "text": "Музей рассказывает о жизни испанской Колонии: о первых испанских поселенцах, откуда они родом и чем занимались, о том, как город пережил английское вторжение и революцию и как он рос. На сайте музея сказано, что здесь жило население преимущественно испанского происхождения, мирное, оставившее позади военную колонию. После тысяча семьсот семьдесят седьмого года город перестал быть крепостью.", "caption": "Испанская Колония в девятнадцатом веке: мирный городок", "big": "", "imgs": [], "img": null, "credit": ""}, {"audio": "pres/w2_aguila-05.mp3", "text": "А кто делал вещи для этих домов? Любопытная деталь про ремесленников. В переписи тысяча восемьсот пятьдесят седьмого года Мартин Альдекоа не нашёл в Колонии ни гончаров, ни мастерских, ни печей для обжига. А в Доме губернаторов, по словам археологов, среди посуды преобладал английский фаянс. Значит, многое привозили, а привозили и продавали торговцы, и, судя по путеводителям, один из них жил в этом доме.", "caption": "1857 год: ни гончаров, ни печей, посуду привозили", "big": "1857", "imgs": [], "img": null, "credit": ""}, {"audio": "pres/w2_aguila-06.mp3", "text": "Вот мы и замкнули петлю, до вашей двери минут пять неспешным шагом. Спасибо, что читали вместе с нами дома и людей. Задание для юного путешественника: найди балкон с железной решёткой и посчитай завитки на ней. Найди дверь с аркой наверху и покажи её маме. А по дороге домой посчитай, сколько ровных крыш и сколько крыш со скатами ты увидишь. Каких больше?", "caption": "Считаем завитки на решётке, арки и крыши", "big": "", "imgs": [], "img": null, "credit": ""}]}}, "film": ["intro", "ferry_uruguay", "ferry_people", "ferry_state", "ferry_famous", "ferry_river", "ferry_delta", "ferry_boats"], "videos": [{"file": "video-1.webm", "caption_ru": "Спутниковая анимация: бурая вода реки смешивается с морской на выходе из Ла-Платы", "author": "JPSS imagery: CSU/CIRA & NOAA/NESDIS", "license": "Public domain", "source": "https://commons.wikimedia.org/wiki/File:Brown_Sediment_Mixes_With_Seawater_in_Rio_de_la_Plata_(CIRA_2024-01-24_-_nolabels).webm"}], "days": [{"id": "thu", "tab": "Чт 5", "title": "Четверг, 5 ноября — приезд и Реаль-де-Сан-Карлос", "steps": [{"time": "08:30", "kind": "move", "title": "Выезд из дома", "lat": -34.5581749, "lon": -58.4569808, "text": "Cuba 2391. Такси, Uber или Cabify до терминала Colonia Express, около 14 км, 30–40 минут. Таксисту: «Terminal Colonia Express, Dársena Sur».", "nonav": true}, {"time": "09:00", "kind": "ferry", "title": "Терминал в Буэнос-Айресе: регистрация и граница", "lat": -34.6254581, "lon": -58.3602624, "text": "Av. Elvira Rawson de Dellepiane 155. Регистрация начинается за 1,5 часа до отхода. Нужны пластиковые DNI всех четверых, свидетельства о рождении детей и распечатанные ваучеры. Аргентинскую и уругвайскую границу проходите сразу, здесь же."}, {"time": "10:30", "kind": "ferry", "title": "Паром 10:30 → 11:45: фильм на паром", "text": "Фильм с фото и голосом: Колония, Уругвай, река Ла-Плата и история паромов, около 24 минут. Наденьте наушники или смотрите всей семьёй.", "audio": "intro", "path": [[-34.6254581, -58.3602624], [-34.47404, -57.84416]]}, {"time": "11:45", "kind": "ferry", "title": "Паромный терминал Колонии", "lat": -34.47404, "lon": -57.84416, "text": "Прибытие. До старого города 15–20 минут пешком или такси. По билету Colonia Express 24 часа бесплатно ходит городской автобус, в том числе до Plaza de Toros. Включите сыну «Игру на все выходные»: охота на старые машины.", "audio": "igra", "alabel": "▶ Игра для сына"}, {"time": "12:15", "kind": "hotel", "title": "Posada de la Flor: оставить вещи", "lat": -34.469118, "lon": -57.849385, "text": "Ituzaingó 268. Здесь выдают ключи от нашего дома и проводят заселение (с 15:00). Попросите оставить вещи до заселения; телефон +598 4523 0794. Оплата на месте в песо, $133,20."}, {"time": "12:25", "kind": "money", "title": "Обмен денег", "lat": -34.47075, "lon": -57.85038, "text": "Поменять около $100–150: в обменнике дают примерно 39 песо за доллар. Это ближайший обменник, в 80 м от дома. Запасной — Cambio Aspen, Av. General Flores 350 (пн–пт 10:00–18:30, сб 10:00–17:30). Остальное платите картой, в песо."}, {"time": "12:40", "kind": "food", "title": "Casa Viera", "lat": -34.470517, "lon": -57.852638, "text": "Обед. Google 4,7, ежедневно с 12:30."}, {"time": "13:45", "kind": "move", "title": "Такси в Реаль-де-Сан-Карлос", "text": "Около 10 минут, стоянки такси на Av. General Flores. Музей с глиптодонтами открыт только в среду и четверг до 16:30, поэтому едем сегодня.", "gmaps": "https://www.google.com/maps/dir/?api=1&destination=-34.439047,-57.859002", "path": [[-34.4715, -57.8505], [-34.439047, -57.859002]]}, {"time": "14:00", "kind": "audio", "title": "Музей древних гигантов", "rec": 10, "lat": -34.439047, "lon": -57.859002, "audio": "paleo", "text": "Открыт только в среду и четверг, 11:30–16:30 (сайт музеев, 04.11). Билет 150 песо, дети до 12 лет бесплатно.", "kid": "Найди панцирь глиптодонта и встань рядом. Поместился бы ты под ним, как под крышей? А мама с папой?"}, {"time": "14:45", "kind": "audio", "title": "Арена Пласа-де-Торос", "rec": 11, "lat": -34.436551, "lon": -57.865214, "audio": "toros", "text": "Экскурсии по арене каждый час. Вс–пт 10:00–18:30, сб 10:00–19:00. Вход 250 песо, экскурсия 350 (каждый час с 11:00), дети до 5 лет бесплатно. В субботу 7.11 вечером здесь концерт.", "kid": "Пройди по кругу и сосчитай арки. Сколько получилось? Закрой глаза и представь восемь тысяч зрителей."}, {"time": "15:45", "kind": "audio", "title": "Фронтон: самая быстрая игра", "rec": 12, "lat": -34.437885, "lon": -57.867778, "audio": "fronton", "text": "Фронтон заново открыли в октябре 2026 года; часы посещения после реставрации не опубликованы, смотрите на месте.", "kid": "Найди самую высокую стену. В неё бьют мячом? Покажи, как бросают мяч корзиной на руке."}, {"time": "16:00", "kind": "walk", "title": "Набережная Реаль-де-Сан-Карлос", "lat": -34.441718, "lon": -57.867807, "text": "Набережная, парк и бывший причал Михановича. Обратно в город на такси."}, {"time": "16:30", "kind": "hotel", "title": "Posada de la Flor: ключи", "lat": -34.469118, "lon": -57.849385, "text": "Забрать ключи и вещи, заселение с 15:00. Покажите DNI и карту."}, {"time": "16:45", "kind": "hotel", "title": "Отель", "hotel": true, "text": "Casa Los Nísperos, 18 de Julio 211: дом с двумя спальнями. Отдых. Завтрак не входит — кафе Albertine в 30 метрах."}, {"time": "17:15", "kind": "walk", "title": "Прогулка «Дома и люди старой Колонии»", "tab": "walk", "text": "Вступление и 8 остановок, петля 1,2 км от дома и обратно, около часа: как жили в португальское и испанское время, кто жил в этих домах, плитки, фонари, крыши, колодцы. Маршрут и рассказы — во вкладке «🏠 Дома и люди»."}, {"time": "19:00", "kind": "audio", "title": "Мыс Санта-Рита: закат", "rec": 6, "lat": -34.470452, "lon": -57.853765, "audio": "santarita", "text": "Закат около 19:25. Закат 6–8 ноября около 19:25. Рядом ресторан Amor Amor (Calle Santa Rita 40).", "kid": "Назови три цвета, которые видишь в воде и в небе. И загадайте одно желание на всю семью. Только никому не рассказывай!"}, {"time": "20:00", "kind": "food", "title": "La Bodeguita", "lat": -34.471222, "lon": -57.8527, "text": "Ужин: пицца и закуски на террасе над рекой. +598 4522 5329."}]}, {"id": "fri", "tab": "Пт 6 ♥", "title": "Пятница, 6 ноября — годовщина и старый город", "steps": [{"time": "10:00", "kind": "food", "title": "Albertine Pan y Café", "lat": -34.471435, "lon": -57.849783, "text": "Завтрак, кофе и торты (чт–сб с 10:00)."}, {"time": "10:45", "kind": "audio", "title": "Ворота Портон-де-Кампо", "rec": 1, "lat": -34.472695, "lon": -57.850452, "audio": "porton", "text": "Рядом детская площадка и туалет. Рядом туристический центр (Manuel Lobo 224), туалет и детская площадка. Отсюда ежедневно в 11:00 и 15:00 уходит городская прогулка с гидом «Camina Colonia» на испанском: 250 песо (≈$6) с человека, дети до 10 лет бесплатно.", "kid": "Представь, что ты стражник. Найди ров и мост. Как думаешь, зачем мост делали подъёмным? И найди самый большой камень в стене."}, {"time": "11:00", "kind": "audio", "title": "Улица Вздохов", "rec": 2, "lat": -34.472833, "lon": -57.851115, "audio": "suspiros", "text": "Брусчатка крупная и неровная, тротуаров нет: малыша удобнее нести в слинге, а не катить в коляске.", "kid": "Встань в желобок посередине улицы. Куда побежит вода, если пойдёт дождь: вверх или вниз, к реке? Потом передай маме «телеграмму»: коротко «ти», долго «таа»."}, {"time": "11:15", "kind": "audio", "title": "Маяк и руины монастыря", "rec": 4, "lat": -34.472818, "lon": -57.852269, "audio": "faro", "text": "Маяк сегодня открыт 10:00–12:00 и 15:00–17:00. Поднимайтесь по очереди: детей младше 8 лет не пускают. Подъём: 118 ступеней, чт–вс 10:00–12:00 и 15:00–17:00, 50 песо. Детей младше 8 лет наверх не пускают; в дождь и сильный ветер закрыто. Поднимайтесь по очереди.", "kid": "Где маяк квадратный, а где круглый? Найди наверху стеклянный фонарь и придумай историю про монаха из монастыря."}, {"time": "11:45", "kind": "audio", "title": "Пласа-Майор и музеи", "rec": 3, "lat": -34.472318, "lon": -57.851447, "audio": "plaza", "text": "Музеи работают 11:30–16:30. Сегодня открыты Ребуффо (касса) и Испанский музей. Касса музеев: Espacio Rebuffo, Del Comercio 77. Билет 150 песо (≈$4), дети до 12 лет бесплатно, 11:30–16:30. Часть музеев закрыта в отдельные дни, список ниже, в разделе «Музеи».", "kid": "Сосчитай деревья на площади. А в музее найди старинную карту и покажи на ней реку."}, {"time": "12:15", "kind": "audio", "title": "Набережная Сан-Габриэль", "rec": 5, "lat": -34.472665, "lon": -57.853683, "audio": "sangabriel", "text": "Неподалёку руины «Дома вице-короля» (Casa del Virrey). Музей азулежу на этой набережной сейчас закрыт.", "kid": "Найди вдали остров и помаши ему рукой. Сколько лодок и кораблей ты насчитал?"}, {"time": "12:45", "kind": "food", "title": "Mesón de la Plaza", "lat": -34.47118, "lon": -57.85105, "text": "Обед: классическая уругвайская кухня (≈ Vasconcellos 153)."}, {"time": "13:45", "kind": "hotel", "title": "Отель", "hotel": true, "text": "Тихий час дома, Casa Los Nísperos."}, {"time": "15:45", "kind": "kids", "title": "Музей телеграфа", "lat": -34.470838, "lon": -57.852493, "text": "Музей телеграфа (пт открыт до 16:30): азбука Морзе, видео."}, {"time": "16:30", "kind": "audio", "title": "Бастион дель Кармен, труба и аквариум", "rec": 8, "lat": -34.469291, "lon": -57.85028, "audio": "carmen", "text": "Рядом аквариум (до 18:00) — следующий пункт. В пятницу 6.11 в 21:00 здесь спектакль (билет 250 песо). Рядом туалет. Рядом — аквариум местных рыб (чт–вс 14:00–18:00, дети до 10 лет бесплатно).", "kid": "Посмотри на трубу и сравни её с маяком: выше она или ниже? Придумай трубе имя."}, {"time": "16:45", "kind": "kids", "title": "Аквариум местных рыб", "lat": -34.46984, "lon": -57.850706, "text": "Аквариум местных рыб: чт–вс 14:00–18:00, 100 песо, дети до 10 лет бесплатно."}, {"time": "17:30", "kind": "shop", "title": "Super USA: сладости и вино", "lat": -34.4706652, "lon": -57.8477671, "text": "Съедобные сувениры по обычным ценам: дульсе-де-лече (500 г около 140 песо), альфахоры (40–50 песо), вино Таннат (450–950 песо). Открыт до 22:30."}, {"time": "19:00", "kind": "love", "title": "♥ Charco Bistró", "lat": -34.473163, "lon": -57.851909, "text": "Ужин в честь годовщины на террасе над рекой, закат в 19:25. Бронь: +598 98 502 130."}]}, {"id": "sat", "tab": "Сб 7", "title": "Суббота, 7 ноября — отъезд", "steps": [{"time": "10:00", "kind": "food", "title": "Albertine Pan y Café", "lat": -34.471435, "lon": -57.849783, "text": "Завтрак, в 30 метрах от дома (сб с 10:00)."}, {"time": "10:45", "kind": "hotel", "title": "Выезд: ключи и вещи", "lat": -34.469118, "lon": -57.849385, "text": "Выезд до 11:00: сдать ключи в Posada de la Flor (Ituzaingó 268) и попросить оставить вещи до обеда."}, {"time": "11:00", "kind": "shop", "title": "Рынок ремесленников", "lat": -34.4731466, "lon": -57.84887, "text": "Сувениры: калебасы для мате и бомбильи, кожа, шерсть, украшения, керамика. Многие продавцы берут только наличные песо. Чт–пн с 10:00."}, {"time": "11:40", "kind": "shop", "title": "Almacén La Carlota", "lat": -34.4717029, "lon": -57.851828, "text": "Сувениры и ремёсла на Calle Real 150, ежедневно 11:00–19:00 (по отзывам). Рядом лавка Cosa Nuestra."}, {"time": "12:15", "kind": "audio", "title": "Старый причал и порт яхт", "rec": 7, "lat": -34.468659, "lon": -57.851909, "audio": "muelle", "text": "Прогулка на катере «Tour Náutico» от яхт-порта: 1 час, 11:00, 13:30 и 17:00; взрослые 850 песо (≈$21), дети 5–12 лет 750, до 5 лет бесплатно.", "kid": "Найди лодку с самой высокой мачтой и сосчитай все мачты, которые видишь. Сколько их?"}, {"time": "12:35", "kind": "audio", "title": "Базилика Святейшего Таинства", "rec": 9, "lat": -34.471099, "lon": -57.85073, "audio": "basilica", "text": "Рядом Португальский дом (сб открыт до 16:30), касса — Del Comercio 77. Рядом — Пласа-де-Армас и фундаменты Дома губернаторов. Отсюда до ворот, где маршрут начинался, пара минут пешком.", "kid": "Найди на стене церкви места, где камни разные: старые и новые. Сколько разных видов камня насчитал?"}, {"time": "13:15", "kind": "food", "title": "Mesón de la Plaza", "lat": -34.47118, "lon": -57.85105, "text": "Обед: классическая уругвайская кухня (≈ Vasconcellos 153)."}, {"time": "14:15", "kind": "food", "title": "Helados Papito", "lat": -34.47075, "lon": -57.85165, "text": "Мороженое."}, {"time": "14:30", "kind": "hotel", "title": "Posada de la Flor: забрать вещи", "lat": -34.469118, "lon": -57.849385, "text": "Забрать вещи и пешком или на такси в порт (около 1 км)."}, {"time": "14:45", "kind": "ferry", "title": "Паромный терминал Колонии", "lat": -34.47404, "lon": -57.84416, "text": "Регистрация начинается в 14:45. Паром 16:15 → 17:30 в Буэнос-Айрес, дома около 18:15–18:30."}]}], "audio": {"intro": [null, "Добро пожаловать в Колонию"], "igra": ["00-igra.mp3", "Игра на все выходные"], "porton": [null, "Ворота Портон-де-Кампо"], "suspiros": [null, "Улица Вздохов"], "plaza": [null, "Пласа-Майор и музеи"], "faro": [null, "Маяк и руины монастыря"], "sangabriel": [null, "Набережная Сан-Габриэль"], "santarita": [null, "Мыс Санта-Рита: закат"], "muelle": [null, "Старый причал и порт яхт"], "carmen": [null, "Бастион дель Кармен, труба и аквариум"], "basilica": [null, "Базилика Святейшего Таинства"], "paleo": [null, "Музей древних гигантов"], "toros": [null, "Арена Пласа-де-Торос"], "fronton": [null, "Фронтон: самая быстрая игра"], "ferry_uruguay": [null, "Уругвай за пять минут"], "ferry_people": [null, "Кто живёт в Уругвае: индейцы, переселенцы, мы сегодня"], "ferry_state": [null, "Как Уругвай стал государством"], "ferry_famous": [null, "Чем знаменит Уругвай и чем уругвайцы отличаются"], "ferry_river": [null, "Река, похожая на море"], "ferry_delta": [null, "Дельта Параны, Тигре и берега Ла-Платы"], "ferry_boats": [null, "Как плавали через реку"], "w2_intro": [null, "Дома и люди старой Колонии"], "w2_gob": [null, "Дом губернаторов: что лежит под ногами"], "w2_archivo": [null, "Архив: город, посчитанный по головам"], "w2_azotea": [null, "Дом с плоской крышей"], "w2_nacarello": [null, "Дом на много семей"], "w2_azulejo": [null, "Дом, который почти построили заново"], "w2_playa": [null, "Кто живёт здесь сегодня"], "w2_real": [null, "Улица, которая говорит"], "w2_aguila": [null, "Испанский дом с балконом"]}, "stops": {"porton": {"n": 1, "title": "Ворота Портон-де-Кампо", "sub": "Portón de Campo · начало маршрута", "lat": -34.472695, "lon": -57.850452, "kid": "Представь, что ты стражник. Найди ров и мост. Как думаешь, зачем мост делали подъёмным?", "info": "Рядом туристический центр (Manuel Lobo 224), туалет и детская площадка. Отсюда ежедневно в 11:00 и 15:00 уходит городская прогулка с гидом «Camina Colonia» на испанском: 250 песо (≈$6) с человека, дети до 10 лет бесплатно.", "text": ["Перед вами ворота Портон-де-Кампо. Через эти ворота из крепости выходили в поле. Их построил португальский губернатор Антониу Педру ди Васконселуш, примерно в тысяча семьсот сорок пятом году. При нём Колония стала самым богатым
