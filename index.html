 и самым укреплённым городом в округе.", "Посмотрите вниз. Перед воротами ров, а через него деревянный подъёмный мост. Когда мост поднимали, враг оставался по ту сторону рва.", "И маленький секрет. Стена, которую вы видите, почти вся восстановлена. Испанцы снесли укрепления в тысяча семьсот семьдесят седьмом году, и к середине двадцатого века от стены почти ничего не осталось. Ворота собрали заново после тысяча девятьсот шестьдесят восьмого года, частью из старых камней, частью из новых.", "Рядом с воротами есть туристический центр, туалет и детская площадка. Отсюда каждый день в одиннадцать и в три часа дня уходит недорогая прогулка с городским гидом на испанском языке. Детям до десяти лет бесплатно."]}, "suspiros": {"n": 2, "title": "Улица Вздохов", "sub": "Calle de los Suspiros", "lat": -34.472833, "lon": -57.851115, "kid": "Встань в желобок посередине улицы. Куда побежит вода, если пойдёт дождь: вверх или вниз, к реке?", "info": "Брусчатка крупная и неровная, тротуаров нет: малыша удобнее нести в слинге, а не катить в коляске.", "text": ["Это самая знаменитая улица города, Калье-де-лос-Суспирос, улица Вздохов. Она спускается от главной площади прямо к реке.", "Посмотрите под ноги. Тротуаров нет, а мостовая с обеих сторон наклонена к середине. Посередине получается желоб, по которому дождевая вода стекает к реке. Так строили португальцы.", "Дома здесь первой половины восемнадцатого века: каменные стены, черепичные крыши, маленькие деревянные двери и окна. Это одна из немногих улиц, которые выглядят почти как триста лет назад.", "Почему улица Вздохов? Этого точно никто не знает. Ещё в середине прошлого века она называлась иначе. Есть три легенды. По первой, здесь были таверны, и моряки вздыхали по местным красавицам. По второй, по этой улице к реке вели приговорённых, и они вздыхали в последний раз. А по третьей, здесь девушка ждала возлюбленного, да так и не дождалась. Выбирайте ту, что вам больше нравится.", "Внизу, на углу с улицей Сан-Педро, стоит дом, где когда-то работала телеграфная компания. Отсюда по дну реки на другой берег протянули первый в Южной Америке телеграфный кабель."]}, "plaza": {"n": 3, "title": "Пласа-Майор и музеи", "sub": "Plaza Mayor 25 de Mayo", "lat": -34.472318, "lon": -57.851447, "kid": "В музее лежат осколки старой посуды, которые нашли прямо в земле. Как думаешь, кто из неё ел триста лет назад?", "info": "Касса музеев: Espacio Rebuffo, Del Comercio 77. Билет 150 песо (≈$4), дети до 12 лет бесплатно, 11:30–16:30. Часть музеев закрыта в отдельные дни, список ниже, в разделе «Музеи».", "text": ["Вы на Пласа-Майор, главной площади старого города. Вокруг стоят старые португальские дома, а в углу площади руины монастыря, из которых вырастает маяк.", "Если хотите в музеи, касса находится в доме на улице Дель-Комерсио, семьдесят семь, напротив площади. Это Эспасио Ребуффо, самый первый музей города, его открыли в тысяча девятьсот пятьдесят первом году. Наверху там есть зал природы. Билет стоит сто пятьдесят песо, дети до двенадцати лет проходят бесплатно.", "На площади стоит и Португальский музей: старинная мебель, карты, оружие и вещи, найденные при раскопках дома губернаторов. Фундамент этого дома можно увидеть рядом с базиликой, это последняя остановка нашего маршрута."]}, "faro": {"n": 4, "title": "Маяк и руины монастыря", "sub": "Faro y Convento de San Francisco", "lat": -34.472818, "lon": -57.852269, "kid": "Посмотри на маяк: снизу он квадратный или круглый? А сверху? Найди наверху стеклянный фонарь.", "info": "Подъём: 118 ступеней, чт–вс 10:00–12:00 и 15:00–17:00, 50 песо. Детей младше 8 лет наверх не пускают; в дождь и сильный ветер закрыто. Поднимайтесь по очереди.", "text": ["Перед вами маяк и руины монастыря Сан-Франсиско семнадцатого века. Присмотритесь: снизу у маяка квадратное каменное основание. Это остаток одной из башен монастыря. А сверху круглая белая башня.", "Маяк начали строить в тысяча восемьсот сорок пятом году, потом война остановила работы, и открыли его только в январе тысяча восемьсот пятьдесят седьмого года. Достроить его помог налог с кораблей, которые заходили в порты Колонии и Монтевидео.", "Наверх ведут сто восемнадцать ступеней. Маяк открыт с четверга по воскресенье, с десяти до двенадцати и с трёх до пяти. Детей младше восьми лет наверх не пускают, а в дождь и сильный ветер маяк закрыт. Поэтому поднимайтесь по очереди: один взрослый идёт наверх, второй с детьми ждёт внизу. Говорят, сверху открывается лучший вид на город и реку."]}, "sangabriel": {"n": 5, "title": "Набережная Сан-Габриэль", "sub": "Paseo de San Gabriel · Punta de San Pedro", "lat": -34.472665, "lon": -57.853683, "kid": "Посмотри на реку. Какого она цвета? Видишь вдали остров?", "info": "Неподалёку руины «Дома вице-короля» (Casa del Virrey). Музей азулежу на этой набережной сейчас закрыт.", "text": ["Вы на набережной Пасео-де-Сан-Габриэль. Посмотрите на реку. Где-то впереди лежит остров Сан-Габриэль, в ясную погоду его видно. Именно к этому острову в январе тысяча шестьсот восьмидесятого года подошли корабли Мануэла Лобу, а через несколько дней на берегу начали строить крепость.", "Мыс рядом называется Пунта-де-Сан-Педро. Здесь стоял бастион Сан-Педро, один из шести бастионов, которые португальцы построили вдоль воды в тысяча семьсот двадцатых годах.", "А руины неподалёку называют Домом вице-короля. Забавно, но ни один вице-король здесь не жил. Возможно, имя появилось в честь испанского генерала Педро де Севальоса, который взял Колонию и стал первым вице-королём Ла-Платы. Но документов об этом нет, так что это загадка."]}, "santarita": {"n": 6, "title": "Мыс Санта-Рита: закат", "sub": "Calle Santa Rita · Bastión de Santa Rita", "lat": -34.470452, "lon": -57.853765, "kid": "Когда солнце будет садиться, загадайте одно желание на всю семью. Только никому не рассказывай!", "info": "Закат 6–8 ноября около 19:25. Рядом ресторан Amor Amor (Calle Santa Rita 40).", "text": ["Это мыс Санта-Рита. Здесь тоже стоял португальский бастион, а сейчас это одно из лучших мест, чтобы встретить закат. Солнце садится прямо над рекой. В начале ноября закат около половины восьмого вечера.", "Здесь вдоль воды стоят скамейки. Можно просто сесть, никуда не спешить и посмотреть, как река становится золотой."]}, "muelle": {"n": 7, "title": "Старый причал и порт яхт", "sub": "Muelle de madera · Puerto de Yates", "lat": -34.468659, "lon": -57.851909, "kid": "Найди лодку с самой высокой мачтой. Сколько всего мачт ты насчитал?", "info": "Прогулка на катере «Tour Náutico» от яхт-порта: 1 час, 11:00, 13:30 и 17:00; взрослые 850 песо (≈$21), дети 5–12 лет 750, до 5 лет бесплатно.", "text": ["Это старый деревянный причал, а рядом пристань для яхт. Когда-то сюда приходили парусники и пароходы из Буэнос-Айреса.", "Если хочется посмотреть на город с воды, от яхт-порта уходит часовая прогулка на катере: в одиннадцать, в половине второго и в пять. Детям до пяти лет бесплатно."]}, "carmen": {"n": 8, "title": "Бастион дель Кармен, труба и аквариум", "sub": "Centro Cultural Bastión del Carmen", "lat": -34.469291, "lon": -57.85028, "kid": "Задери голову и посмотри на трубу. Как думаешь, она выше маяка или ниже? А сколько в ней кирпичей?", "info": "В пятницу 6.11 в 21:00 здесь спектакль (билет 250 песо). Рядом туалет. Рядом — аквариум местных рыб (чт–вс 14:00–18:00, дети до 10 лет бесплатно).", "text": ["Высокая кирпичная труба осталась от старой мыльной фабрики. Сейчас в её зданиях культурный центр и театр, а вокруг лужайка у самой воды. Название досталось от португальского бастиона, который стоял на этом берегу.", "Здания фабрики и труба охраняются государством как национальный памятник. Днём здесь хорошо посидеть на траве у реки, пока дети бегают.", "А совсем рядом есть небольшой аквариум с рыбами, которые живут в местных реках. Дети до десяти лет проходят бесплатно."]}, "basilica": {"n": 9, "title": "Базилика Святейшего Таинства", "sub": "Basílica del Santísimo Sacramento · Plaza de Armas", "lat": -34.471099, "lon": -57.85073, "kid": "Посмотри на стены церкви. Найди места, где камни разные: где-то старые, а где-то новые. Сколько разных видов камня ты увидишь?", "info": "Рядом — Пласа-де-Армас и фундаменты Дома губернаторов. Отсюда до ворот, где маршрут начинался, пара минут пешком.", "text": ["Это Базилика Святейшего Таинства, самая старая церковь Уругвая. Приход основали в феврале тысяча шестьсот восьмидесятого года, сразу после прихода португальцев. Первая церковь была хижиной из соломы и глины. Потом её много раз перестраивали.", "Самая драматичная история случилась воскресным утром, в декабре тысяча восемьсот двадцать третьего года. Под ризницей хранили порох. Во время грозы в церковь ударила молния, и порох взорвался. Большая часть здания была разрушена. Через десять лет здесь побывал Чарльз Дарвин и записал, что от церкви остались любопытные руины, памятник силе молнии и пороха.", "Церковь восстановили в тысяча восемьсот тридцатых годах, а в двадцатом веке реставраторы оставили на виду старые части стен рядом с новыми. Внутри есть купель, которой около трёхсот лет, и распятие, вырезанное индейцами из иезуитских миссий.", "Перед базиликой площадь Пласа-де-Армас, а в паре десятков шагов видны каменные фундаменты Дома губернаторов. Вместе с церковью это было главное здание города. На этом маршрут по старому городу закончен. Спасибо, что гуляли с нами!"]}, "paleo": {"n": 10, "title": "Музей древних гигантов", "sub": "Espacio Paleontológico Armando Calcaterra", "lat": -34.439047, "lon": -57.859002, "kid": "Найди панцирь глиптодонта. Как думаешь, ты бы поместился под ним, как под крышей?", "info": "Открыт только в среду и четверг, 11:30–16:30 (сайт музеев, 04.11). Билет 150 песо, дети до 12 лет бесплатно.", "text": ["Мы в районе Реаль-де-Сан-Карлос. В этом небольшом музее хранятся кости и панцири животных, которые жили здесь больше десяти тысяч лет назад.", "Главные звёзды музея — глиптодонты, древние родственники броненосцев. Их панцирь был размером с маленький автомобиль, а сами они весили как бегемот. Представьте такого зверя на берегу реки!"]}, "toros": {"n": 11, "title": "Арена Пласа-де-Торос", "sub": "Plaza de Toros Real de San Carlos", "lat": -34.436551, "lon": -57.865214, "kid": "Пройди по кругу и сосчитай арки. Сколько у тебя получилось?", "info": "Вс–пт 10:00–18:30, сб 10:00–19:00. Вход 250 песо, экскурсия 350 (каждый час с 11:00), дети до 5 лет бесплатно. В субботу 7.11 вечером здесь концерт.", "text": ["Название Реаль-де-Сан-Карлос дали испанцы. Отсюда они осаждали португальскую крепость и назвали лагерь в честь короля Карла Третьего.", "В начале двадцатого века сюда пришёл Николас Миханович, судовладелец родом из Хорватии. Его пароходы возили людей между Буэнос-Айресом и Колонией, и он задумал здесь курорт для гостей с того берега: отель, казино, площадку для баскской пелоты и арену для корриды.", "Арену построили всего за восемь месяцев и открыли в январе тысяча девятьсот десятого года. На первую корриду пришли тысячи зрителей. Но уже в тысяча девятьсот двенадцатом году корриду в Уругвае запретили, и здесь успели провести всего восемь боёв.", "Потом арена почти сто лет стояла заброшенной и разрушалась. В две тысячи двенадцатом году обрушилась часть фасада. Её отреставрировали и в декабре две тысячи двадцать первого года открыли снова, через сто одиннадцать лет после открытия. Сейчас внутри музей, рестораны и концертная площадка."]}, "fronton": {"n": 12, "title": "Фронтон: самая быстрая игра", "sub": "Frontón Real de San Carlos", "lat": -34.437885, "lon": -57.867778, "kid": "Найди самую высокую стену. Как думаешь, в неё бьют мячом или нет?", "info": "Фронтон заново открыли в октябре 2026 года; часы посещения после реставрации не опубликованы, смотрите на месте.", "text": ["Это Фронтон, площадка для баскской пелоты. В этой игре мяч с огромной силой бросают в высокую стену плетёной корзиной, надетой на руку.", "Фронтон открыли в тысяча девятьсот десятом году. Он длиной шестьдесят четыре метра, а на трибунах помещались три тысячи зрителей. Это самая большая площадка такого рода в Южной Америке. В октябре этого года, после реставрации, здесь прошёл чемпионат мира по этой игре.", "Рядом стоял отель с казино. Казино работало до тысяча девятьсот семнадцатого года, а в отеле любили собираться известные поэтессы Латинской Америки."]}}, "hotels": [{"id": "nisperos", "name": "Casa Los Nísperos (18 de Julio 211)", "lat": -34.4714362, "lon": -57.850053}, {"id": "bajoelfaro", "name": "Bajo el Faro", "lat": -34.473152, "lon": -57.852776}, {"id": "leoncia", "name": "Hotel Leoncia", "lat": -34.470092, "lon": -57.843951}, {"id": "glicinas", "name": "Las Glicinas", "lat": -34.469478, "lon": -57.847154}, {"id": "manuellobo", "name": "Posada Manuel de Lobo", "lat": -34.471359, "lon": -57.849506}, {"id": "casarao", "name": "Casarão Sacramento", "lat": -34.47258, "lon": -57.847469}], "walk2": [{"id": "w2_intro", "title": "Дома и люди старой Колонии", "lat": null, "lon": null, "address": "Старт и финиш: 18 de Julio 211", "time_min": 2, "kid": "Сегодня у тебя три помощника: глаза, ладони и уши. На каждой остановке будет задание."}, {"id": "w2_gob", "title": "Дом губернаторов: что лежит под ногами", "lat": -34.471547, "lon": -57.850866, "address": "Plaza de Armas Manuel Lobo, руины Дома губернаторов слева от Базилики", "time_min": 8, "kid": "Положи ладонь на камень мостовой: под ним старая дорога с колеями. И сосчитай свои шаги вдоль длинной стены."}, {"id": "w2_archivo", "title": "Архив: город, посчитанный по головам", "lat": -34.4719, "lon": -57.852282, "address": "De las Misiones de los Tapes 115", "time_min": 8, "kid": "Найди на стене у входа чёрно-белый квадратик-код. Попроси папу навести на него телефон."}, {"id": "w2_azotea", "title": "Дом с плоской крышей", "lat": -34.47228, "lon": -57.852471, "address": "Del Comercio 77 (Espacio Rebuffo)", "time_min": 7, "kid": "Сравни две крыши: ровную у этого дома и из двух скатов у соседнего. Куда стечёт дождь с каждой? Какие камни под ногами?"}, {"id": "w2_nacarello", "title": "Дом на много семей", "lat": -34.472431   const pts=[]; const add=(arr,k,lab)=>{ list.insertAdjacentHTML('beforeend',`<div class="daytitle">${lab}</div>`); arr.forEach(x=>{ const pos=(x.lat!=null)?[x.lat,x.lon]:null; if(pos){ L.marker(pos,{icon:pin(ICON[k],k)}).addTo(layer).bindTooltip(x.name); pts.push(pos) }
    const dd=hotel&&pos?` · ${fmtD(dist([hotel.lat,hotel.lon],pos))} от дома`:'';
    list.insertAdjacentHTML('beforeend',`<div class="step"${pos?` data-ll="${pos[0]},${pos[1]}"`:''}><div class="badge k-${k}">${ICON[k]}</div><div class="body"><div class="ttl">${x.name}</div><div class="time">${x.address||''}${dd}</div><div class="txt">${[x.hours,x.what,x.prices].filter(Boolean).join('. ')}</div>${pos?`<div class="acts"><a target="_blank" rel="noopener" href="https://www.google.com/maps/dir/?api=1&destination=${pos[0]},${pos[1]}&travelmode=walking">Пешком ↗</a></div>`:''}</div></div>`) }) };
  add(DATA.money.exchange,'money','Обменники'); add(DATA.money.atms,'atm','Банкоматы'); add(DATA.money.shops,'shop','Сувениры и продукты');
  list.insertAdjacentHTML('beforeend',`<div class="small">Часы работы взяты из справочников и не везде проверены, перед походом лучше позвонить.</div>`);
  drawHotel(); drawMe(); if(fit&&pts.length) map.fitBounds(pts,{padding:[30,30]});
}
function select(i,scroll){ selIdx=i; render(false); const s=DATA.days.find(d=>d.id===day).steps[i]; const p=stepPos(s); follow=false;
  if(s.path){ const pl=L.polyline(s.path,{color:'#c9772b',weight:4,dashArray:'8 8'}).addTo(layer); s.path.forEach(q=>L.circleMarker(q,{radius:6,color:'#c9772b',fillOpacity:1}).addTo(layer)); map.fitBounds(pl.getBounds(),{padding:[40,40]}) }
  else if(p){ map.setView(p,dist(COL,p)>20000?14:Math.max(map.getZoom(),16)) }
  else if(s.hotel&&!hotel){ chooseHotel() } if(scroll){const e=document.getElementById('st'+i); e&&e.scrollIntoView({behavior:'smooth',block:'center'})} }
document.getElementById('list').addEventListener('click',e=>{
  const card=e.target.closest('.step[data-ll]'); if(card&&!e.target.closest('button,a,summary')){ const [la,lo]=card.dataset.ll.split(',').map(Number); follow=false; map.setView([la,lo],17); return }
  const th=e.target.closest('.thumbs'); if(th){ openShow([th.dataset.w]); return }
  const b=e.target.closest('button'); if(!b) return;
  if(b.dataset.tab){ day=b.dataset.tab; selIdx=-1; render(true); document.getElementById('list').scrollTop=0; return }
  if(b.dataset.a) play(b.dataset.a);
  if(b.dataset.w) openShow([b.dataset.w]);
  if(b.dataset.film) openShow(DATA.film.filter(x=>DATA.pres[x]));
  if(b.dataset.filmfrom) openShow(DATA.film.filter(x=>DATA.pres[x]).slice(+b.dataset.filmfrom));
  if(b.dataset.plist) playList(DATA.film.filter(x=>DATA.pres[x]));
  if(b.dataset.show) select(+b.dataset.show,false);
  if(b.dataset.done){ done[b.dataset.done]=!done[b.dataset.done]; LS.set('done',done); render(false) }
  if(b.dataset.hotel) chooseHotel();
});
// ---- плеер
const A=new Audio(); A.preload='none'; let cur=null;
const P=document.getElementById('player'), PP=document.getElementById('pp'), PT=document.getElementById('ptitle'), PB=document.querySelector('#pbar div');
let queue=[], qi=0, qTitle='';
function chunks(t){ const out=[]; (t||'').split(/(?<=[.!?…])\s+/).forEach(sn=>{ if(sn.length<=120){out.push(sn);return} let cur=''; sn.split(/(?<=,)\s+/).forEach(w=>{ if((cur+' '+w).trim().length>110&&cur){out.push(cur.trim()); cur=w} else cur=(cur+' '+w).trim() }); if(cur) out.push(cur) }); return out.filter(Boolean) }
function subAt(t,frac){ const c=chunks(t); if(!c.length) return ''; const tot=c.reduce((a,x)=>a+x.length+8,0); let acc=0; for(const x of c){ acc+=x.length+8; if(acc/tot>=frac) return x } return c[c.length-1] }
function segsOf(id){ const p=DATA.pres[id]; if(p) return p.segs.filter(x=>x.audio).map(x=>({u:x.audio,t:x.text})); const a=DATA.audio[id]; return a&&a[0]?[{u:'audio/'+a[0],t:''}]:[] }
function titleOf(id){ return (DATA.pres[id]&&DATA.pres[id].title)||(DATA.audio[id]&&DATA.audio[id][1])||'' }
function textOf(id){ if(DATA.pres[id]) return DATA.pres[id].segs.map(x=>x.text); const s=DATA.stops[id]; return s?s.text:null }
function estDur(id){ const p=DATA.pres[id]; return p?p.segs.reduce((a,x)=>a+x.text.split(/\s+/).length/2.4,0):60 }
function thumbs(id){ const p=DATA.pres[id]; if(!p) return ''; const im=[...new Set(p.segs.map(x=>x.img).filter(Boolean))].slice(0,6); return im.length?`<div class="thumbs" data-w="${id}">${im.map(u=>`<img loading="lazy" src="${u}" alt="">`).join('')}</div>`:'' }
function play(id){ closeShow(); if(cur===id&&queue.length){A.play();return} queue=segsOf(id).map(x=>({u:x.u,t:x.t,id})); qi=0; cur=id; startQ() }
function playList(ids){ closeShow(); queue=[]; ids.forEach(id=>segsOf(id).forEach(x=>queue.push({u:x.u,t:x.t,id}))); qi=0; cur=ids[0]; startQ() }
function startQ(){ if(!queue.length) return; A.src=queue[qi].u; A.play(); P.style.display='block'; PT.textContent=titleOf(queue[qi].id); hideNear() }
PP.onclick=()=>{ A.paused?A.play():A.pause() };
document.getElementById('px').onclick=()=>{A.pause(); P.style.display='none'};
A.onplay=()=>PP.textContent='❚❚'; A.onpause=()=>PP.textContent='▶';
A.ontimeupdate=()=>{ if(A.duration) PB.style.width=(100*A.currentTime/A.duration)+'%' };
A.onended=()=>{ if(qi+1<queue.length){ if(queue[qi+1].id!==queue[qi].id){heard[queue[qi].id]=1; LS.set('heard',heard)} qi++; A.src=queue[qi].u; PT.textContent=titleOf(queue[qi].id); A.play(); return }
  if(queue.length){heard[queue[qi].id]=1; LS.set('heard',heard)} PP.textContent='▶'; render(false) };
A.ontimeupdate=()=>{ if(A.duration&&queue.length){ PB.style.width=(100*(qi+A.currentTime/A.duration)/queue.length)+'%'; document.getElementById('psub').textContent=subAt(queue[qi].t,A.currentTime/A.duration) } };
// ---- геолокация
const BME=document.getElementById('bme');
document.getElementById('bme2').onclick=()=>BME.onclick();
BME.onclick=()=>{
  if(!navigator.geolocation){alert('Телефон не отдаёт геопозицию');return}
  if(watch===null){ follow=true; BME.classList.add('on'); BME.textContent='◎ Слежу'; document.getElementById('bme2').classList.add('on'); if(me) map.setView(me,17);
    watch=navigator.geolocation.watchPosition(onPos,err=>{ stopWatch(); alert(err.code===1?'Геопозиция запрещена. Если страница открыта внутри Telegram, нажмите ⋮ → «Открыть в Chrome». В Chrome: значок слева от адреса → «Разрешения» → «Местоположение» → разрешить.':'Не удалось определить место: включите геолокацию (GPS) в телефоне и попробуйте ещё раз.') },{enableHighAccuracy:true,maximumAge:5000,timeout:30000});
  } else if(!follow){ follow=true; me&&map.setView(me,17) } else stopWatch();
};
function stopWatch(){ if(watch!==null) navigator.geolocation.clearWatch(watch); watch=null; follow=false; BME.classList.remove('on'); BME.textContent='◎ Где я'; document.getElementById('bme2').classList.remove('on') }
map.on('dragstart',()=>{ if(watch!==null){follow=false; BME.textContent='◎ К себе'} });
let lastRender=0;
function onPos(p){ me=[p.coords.latitude,p.coords.longitude]; drawMe(p.coords.accuracy); if(follow) map.setView(me,Math.max(map.getZoom(),16)); checkNear(); if(Date.now()-lastRender>15000){lastRender=Date.now(); render(false)} }
function drawMe(acc){ if(!me) return; if(!meMk){ meMk=L.marker(me,{icon:L.divIcon({className:'',html:'<div class="me"></div>',iconSize:[18,18],iconAnchor:[9,9]}),zIndexOffset:2000}).addTo(map); meAcc=L.circle(me,{radius:acc||30,color:'#1a73e8',weight:1,fillOpacity:.1}).addTo(map) } else { meMk.setLatLng(me); meAcc.setLatLng(me); if(acc) meAcc.setRadius(acc) } }
// ---- рядом с остановкой
const NEAR=document.getElementById('near');
function checkNear(){
  if(!me) return; let best=null;
  const cand=[...Object.entries(DATA.stops),...DATA.walk2.filter(o=>o.lat!=null).map((o,i)=>[o.id,{n:'🏠'+(i+1),title:titleOf(o.id)||o.title,lat:o.lat,lon:o.lon}])];
  for(const [id,s] of cand){ const d=dist(me,[s.lat,s.lon]); if(d<40&&(!best||d<best.d)) best={id,s,d} }
  if(!best||heard[best.id]||cur===best.id&&!A.paused||(snooze[best.id]&&Date.now()<snooze[best.id])) { if(!best) hideNear(); return }
  NEAR.innerHTML=`<b>Вы рядом: ${best.s.n}. ${best.s.title}</b><div class="small" style="margin:2px 0">${fmtD(best.d)} · запись «${titleOf(best.id)}»</div><div class="acts"><button class="play" onclick="play('${best.id}')">▶ Слушать</button><button onclick="snooze['${best.id}']=Date.now()+600000;hideNear()">Позже</button></div>`;
  NEAR.style.display='block';
}
function hideNear(){ NEAR.style.display='none' }
// ---- отель
function drawHotel(){ if(hotelMk){map.removeLayer(hotelMk);hotelMk=null} if(hotel) hotelMk=L.marker([hotel.lat,hotel.lon],{icon:pin('⌂','hotel')}).addTo(map).bindTooltip(hotel.name) }
function chooseHotel(){
  const opts=DATA.hotels.map((h,i)=>`${i+1} — ${h.name}`).join('\n');
  const a=prompt(`Где вы живёте? Введите номер:\n${opts}\n${DATA.hotels.length+1} — поставить в центр карты\n0 — убрать отметку`, '');
  if(a===null) return; const n=parseInt(a,10);
  if(n===0){hotel=null} else if(n>=1&&n<=DATA.hotels.length){hotel=DATA.hotels[n-1]} else if(n===DATA.hotels.length+1){const c=map.getCenter(); hotel={name:'Мой отель',lat:c.lat,lon:c.lng}} else return;
  LS.set('hotel2',hotel); render(false);
}
document.getElementById('bhotel').onclick=()=>{ if(hotel&&!confirm(`Отель: ${hotel.name}. Поменять?`)){map.setView([hotel.lat,hotel.lon],17);return} chooseHotel() };
// ---- офлайн
document.getElementById('boff').onclick=async()=>{
  if(!('caches' in window)){alert('Браузер не умеет офлайн');return}
  const b=document.getElementById('boff'); const c=await caches.open('colonia-v13');
  const list=['./','index.html','https://unpkg.com/leaflet@1.9.4/dist/leaflet.css','https://unpkg.com/leaflet@1.9.4/dist/leaflet.js',...Object.values(DATA.audio).filter(a=>a[0]).map(a=>'audio/'+a[0]),...Object.values(DATA.pres).flatMap(p=>p.segs.flatMap(x=>[x.audio,x.video,...(x.imgs||[]).map(i=>i.src)]).filter(Boolean))];
  let n=0; for(const u of list){ try{await c.add(u); n++; b.textContent=`⇩ ${n}/${list.length}`}catch(e){} }
  b.textContent=n===list.length?'✓ Офлайн':'⇩ '+n+'/'+list.length;
  alert(n===list.length?'Готово: страница и все записи сохранены в телефоне. Карту полистайте по Wi-Fi — просмотренные места тоже запомнятся.':'Сохранилось не всё, повторите при хорошем интернете.');
};
// ---- показ: фото + голос + подписи
const SH=document.getElementById('show'), BG=[document.getElementById('bg1'),document.getElementById('bg2')], BIG=document.getElementById('big'), CAP=document.getElementById('cap'), SUB=document.getElementById('sub'), CRED=document.getElementById('cred'), BARS=document.getElementById('bars'), CHAP=document.getElementById('chap'), SPLAY=document.getElementById('splay');
const SA=new Audio(); let sl=[], si=0, bgi=0, chapTimer=null;
function openShow(ids){ A.pause(); P.style.display='none'; sl=[]; ids.forEach(id=>DATA.pres[id].segs.forEach((x,k)=>sl.push({...x,id,first:k===0,last:k===DATA.pres[id].segs.length-1}))); if(!sl.length) return;
  BARS.innerHTML=sl.map(()=>'<i><b></b></i>').join(''); SH.style.display='block'; si=0; document.getElementById('stitle').textContent=ids.length>1?'Фильм на паром':titleOf(ids[0]); showSlide(); if(document.documentElement.requestFullscreen) document.documentElement.requestFullscreen().catch(()=>{}) }
function closeShow(){ if(SH.style.display!=='block') return; SA.pause(); document.getElementById('vbg').pause(); SH.style.display='none'; if(document.fullscreenElement) document.exitFullscreen().catch(()=>{}) }
function showSlide(){ const x=sl[si]; if(!x) return closeShow();
  [...BARS.children].forEach((e,i)=>e.firstChild.style.width=i<si?'100%':'0');
  const VB=document.getElementById('vbg'); VB.classList.remove('on'); VB.onplaying=null;
  if(x.video){ VB.src=x.video; VB.onplaying=()=>VB.classList.add('on'); VB.play().catch(()=>{}) } else { VB.pause() }
  picK=-1; showPic(0);
  CAP.textContent=x.caption||''; SUBS.innerHTML='';
  BIG.classList.remove('on'); BIG.textContent=x.big||''; if(x.big) setTimeout(()=>BIG.classList.add('on'),600);
  clearTimeout(chapTimer); CHAP.classList.remove('on');
  if(x.first){ CHAP.innerHTML=`${titleOf(x.id)}<small>${DATA.pres[x.id].kid?'Задание в конце рассказа':''}</small>`; CHAP.classList.add('on'); chapTimer=setTimeout(()=>CHAP.classList.remove('on'),3500) }
  if(x.audio){ SA.src=x.audio; SA.play().catch(()=>{SPLAY.textContent='▶'}) } else { setTimeout(()=>{ if(sl[si]===x) next() },6000) }
  heard[x.id]=heard[x.id]||(x.last?1:0); if(x.last) LS.set('heard',heard);
  const n=sl[si+1]; if(n&&n.imgs&&n.imgs[0]){ const im=new Image(); im.src=n.imgs[0].src }
}
let picK=-1;
function showPic(k){ const x=sl[si]; const arr=(x.imgs&&x.imgs.length)?x.imgs:[{src:null,cap:'',credit:''}]; k=Math.min(k,arr.length-1); if(k===picK) return; picK=k; const im=arr[k];
  const nb=BG[bgi^1], ob=BG[bgi]; nb.classList.remove('on'); void nb.offsetWidth;
  const per=Math.max(8,x.text.split(/\s+/).length/2.3/arr.length);
  if(im.src){ nb.querySelector('.blur').style.backgroundImage=`url("${im.src}")`; const ig=nb.querySelector('img'); ig.style.display=''; ig.src=im.src } else { nb.querySelector('.blur').style.backgroundImage='linear-gradient(135deg,#1d3f61,#c9772b)'; nb.querySelector('img').style.display='none' }
  nb.style.setProperty('--d',(per+2)+'s'); nb.classList.add('on'); ob.classList.remove('on'); bgi^=1;
  SUB.textContent=im.cap?('На фото: '+im.cap):''; CRED.textContent=im.credit?('Фото: '+im.credit):'';
  const nx=arr[k+1]; if(nx&&nx.src){ const p=new Image(); p.src=nx.src } }
function next(){ if(si+1<sl.length){si++; showSlide()} else closeShow() }
function prev(){ si=Math.max(0,si-1); showSlide() }
SA.onended=next; SA.onplay=()=>SPLAY.textContent='❚❚'; SA.onpause=()=>SPLAY.textContent='▶';
const SUBS=document.getElementById('subs');
SA.ontimeupdate=()=>{ const b=BARS.children[si]; if(b&&SA.duration){ const fr=SA.currentTime/SA.duration; b.firstChild.style.width=(100*fr)+'%'; const x=sl[si]; const n=(x.imgs&&x.imgs.length)||1; showPic(Math.floor(fr*n)); const st=subAt(x.text,fr); SUBS.innerHTML=st?`<span>${st}</span>`:'' } };
document.getElementById('snext').onclick=next; document.getElementById('sprev').onclick=prev; document.getElementById('tapr').onclick=next; document.getElementById('tapl').onclick=prev;
SPLAY.onclick=()=>{ SA.paused?SA.play():SA.pause() }; document.getElementById('sclose').onclick=closeShow;
document.addEventListener('keydown',e=>{ if(SH.style.display!=='block') return; if(e.key==='ArrowRight') next(); if(e.key==='ArrowLeft') prev(); if(e.key==='Escape') closeShow(); if(e.key===' ') SPLAY.click() });
// ---- калькулятор валют (база: доллар)
const RATES0={UYU:40.23,RUB:81.42,ARS:1549.7,date:'04.11.2026',live:false};
let RT=LS.get('rates',null)||RATES0;
const CF={uyu:'UYU',usd:'USD',rub:'RUB',ars:'ARS'};
function rate(c){ return c==='USD'?1:RT[c] }
function fmt(v){ return v>=100?Math.round(v).toLocaleString('ru-RU'):(Math.round(v*100)/100).toLocaleString('ru-RU') }
function calcFrom(src){ const raw=document.getElementById('c_'+src).value.replace(/\s/g,'').replace(',','.'); const v=parseFloat(raw); if(isNaN(v)) return;
  const usd=v/rate(CF[src]); for(const k in CF){ if(k!==src) document.getElementById('c_'+k).value=fmt(usd*rate(CF[k])) }
  document.getElementById('cnote').textContent=`1 $ = ${fmt(RT.UYU)} UYU = ${fmt(RT.RUB)} ₽ = ${fmt(RT.ARS)} ARS (официальный курс). Курс от ${RT.date}${RT.live?', обновлён онлайн':''}. В обменнике за доллар дадут чуть меньше.` }
for(const k in CF) document.getElementById('c_'+k).addEventListener('input',()=>calcFrom(k));
document.getElementById('bcalc').onclick=()=>{ document.getElementById('calc').classList.toggle('on'); calcFrom('uyu') };
fetch('https://open.er-api.com/v6/latest/USD').then(r=>r.json()).then(d=>{ if(d&&d.rates&&d.rates.UYU){ RT={UYU:d.rates.UYU,RUB:d.rates.RUB,ARS:d.rates.ARS,date:new Date(d.time_last_update_unix*1000).toLocaleDateString('ru-RU'),live:true}; LS.set('rates',RT); calcFrom('uyu') } }).catch(()=>{});
if('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js');
render(true);
</script></body></html>
