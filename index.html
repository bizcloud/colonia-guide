анского, и стал лодочником. Потом, в Буэнос-Айресе, он нанялся к капитану, который буксирами перевозил грузы и людей с кораблей на берег.", "caption": "Николас Миханович: мальчишка с парусной лодки «Фортуната»", "big": "", "img": "img/ferry_boats-2.jpg", "credit": "Jaan-Cornelius K. from Buenos Aires, Argentina, CC BY-SA 2.0"}, {"audio": "pres/ferry_boats-03.mp3", "text": "Когда капитан погиб, Миханович взял его дело в свои руки, а позже женился на его вдове. Он покупал буксиры, потом пароходы. В тысяча восемьсот восемьдесят седьмом году его пароход «Рапидо», что значит «быстрый», начал регулярные рейсы между Буэнос-Айресом, Колонией и Кармело. Позже у него было, по некоторым данным, больше трёхсот судов с чёрными трубами и большой белой буквой «эм». Испанский писатель Висенте Бласко Ибаньес называл его королём рек.", "caption": "1887: пароход «Рапидо» открывает регулярную линию, «король рек»", "big": "1887", "img": "img/ferry_boats-6.jpg", "credit": "Unknown photographer, Public domain"}, {"audio": "pres/ferry_boats-04.mp3", "text": "В двадцатом веке на смену пароходам пришли скоростные суда. Компанию Букебус основал в тысяча девятьсот семьдесят девятом году аргентинский предприниматель Хуан Карлос Лопес Мена, чтобы быстро и надёжно соединить Буэнос-Айрес и Монтевидео. На линии до Колонии в тысяча девятьсот восемьдесят шестом году вышли суда «Эладия Исабель» и «Флеча де Буэнос-Айрес». Через десять лет, в тысяча девятьсот девяносто шестом году, появилось скоростное судно «Силвия Ана Эле», которое может идти почти со скоростью восьмидесяти километров в час.", "caption": "1979: основан Букебус; 1996: «Силвия Ана Эле» почти 80 км/ч", "big": "1979", "img": "img/ferry_boats-3.jpg", "credit": "ProfesorFavalli, CC BY-SA 4.0"}, {"audio": "pres/ferry_boats-05.mp3", "text": "Компания Колония Экспресс, чьим паромом вы плывёте, моложе. Она начала работать двадцать восьмого февраля две тысячи седьмого года. Её основали дети бывших владельцев другой паромной компании, Феррилинеас. Первый катамаран назывался так же, как компания, и вмещал триста шестьдесят пассажиров. В августе к нему присоединился «Буэнос-Айрес Экспресс», а в две тысячи пятнадцатом году появился флагман «Атлантик Экспресс» на пятьсот семьдесят семь пассажиров и восемьдесят восемь машин.", "caption": "28 февраля 2007: начинает работу Колония Экспресс", "big": "2007", "img": "img/ferry_boats-1.jpg", "credit": "Liam Quinn from Canada, CC BY-SA 2.0"}, {"audio": "pres/ferry_boats-06.mp3", "text": "Самый быстрый корабль этих вод называется «Франсиско», в честь папы Франциска. Его построили на верфи Инкат на острове Тасмания и в две тысячи тринадцатом году пустили по линии Буэнос-Айрес Монтевидео. Он может идти со скоростью до пятидесяти восьми узлов, это около ста семи километров в час, и когда его построили, это был самый быстрый паром в мире. Работает он на сжиженном природном газе, а завод по его производству Букебус построил сам.", "caption": "«Франсиско»: 58 узлов и сжиженный природный газ", "big": "58 узлов", "img": "img/ferry_boats-4.jpg", "credit": "Falk2, CC BY-SA 3.0 DE"}, {"audio": "pres/ferry_boats-07.mp3", "text": "А новейший корабль на линии называется «Чина Соррилья». По данным Википедии, это крупнейшее в мире полностью электрическое судно. Его тоже построила верфь Инкат, в Хобарте, в Австралии, и спустила на воду второго мая две тысячи двадцать пятого года. Длина сто тридцать метров, он вмещает две тысячи сто пассажиров и двести двадцать пять машин, батареи на нём на сорок мегаватт-часов, а скорость двадцать пять узлов, около сорока шести километров в час. Он не выбрасывает дыма.", "caption": "«Чина Соррилья»: крупнейший в мире электрический корабль", "big": "40 МВт·ч", "img": "img/ferry_boats-5.jpg", "credit": "Chuq, CC BY-SA 4.0"}, {"audio": "pres/ferry_boats-08.mp3", "text": "Через океан его привёз тяжёлый корабль-перевозчик «Блэк Марлин», и десятого сентября этого года судно прибыло в Уругвай. А двадцать второго октября «Чина Соррилья» начал возить пассажиров между Буэнос-Айресом и Колонией, пока один рейс в день. Если повезёт, вы его увидите, а может быть, и встретите на обратном пути.", "caption": "Путь корабля: Тасмания, Уругвай, 22 октября 2026 первый рейс", "big": "22 октября", "img": "img/ferry_boats-3.jpg", "credit": "ProfesorFavalli, CC BY-SA 4.0"}, {"audio": "pres/ferry_boats-09.mp3", "text": "Кто такая Чина Соррилья? Это знаменитая уругвайская актриса, которую считают представительницей культуры обоих берегов Ла-Платы. Она родилась в Монтевидео четырнадцатого марта тысяча девятьсот двадцать второго года и прожила девяносто два года. Прозвище «Чина» получилось из детской переделки имени Консепсьон: сначала «кочона», по-французски «кочон», то есть поросёнок, потом «кочина» и наконец просто «Чина». Она сыграла более чем в пятидесяти фильмах и много лет работала в театре и кино Аргентины.", "caption": "Чина Соррилья: актриса, которую любили на обоих берегах", "big": "1922", "img": "img/ferry_boats-5.jpg", "credit": "Chuq, CC BY-SA 4.0"}, {"audio": "pres/ferry_boats-10.mp3", "text": "А как корабль находит дорогу в такой мелкой реке? Главные помощники это каналы, то есть углублённые и отмеченные пути. Их чистят землечерпалками и обозначают буями и знаками. Например, за канал Мартин-Гарсия отвечает общая комиссия Аргентины и Уругвая. Капитан ведёт судно по морской карте и спутниковой навигации. Но и людям на палубе полезно смотреть вперёд.", "caption": "Каналы, буи и землечерпалки: дорога по мелкой реке", "big": "", "img": "img/ferry_boats-4.jpg", "credit": "Falk2, CC BY-SA 3.0 DE"}, {"audio": "pres/ferry_boats-11.mp3", "text": "Что же искать с палубы? Сначала берега не видно совсем. Потом появится тонкая полоска суши и низкий город. Ищите башню маяка. Огонь маяка Колонии расположен на высоте тридцати четырёх метров над уровнем моря, и в ясную погоду, как пишут, виден примерно за двенадцать километров. Башня красно-белая, с полосами. Задание для юного путешественника: когда будешь подплывать к Колонии, найди маяк первым. Он красно-белый, как леденец. Увидел, крикни: «Маяк!»", "caption": "Ищите красно-белый маяк Колонии на горизонте", "big": "12 км", "img": "img/ferry_boats-2.jpg", "credit": "Jaan-Cornelius K. from Buenos Aires, Argentina, CC BY-SA 2.0"}]}}, "film": ["intro", "ferry_uruguay", "ferry_river", "ferry_boats"], "videos": [{"file": "video-1.webm", "caption_ru": "Спутниковая анимация: бурая вода реки смешивается с морской на выходе из Ла-Платы", "author": "JPSS imagery: CSU/CIRA & NOAA/NESDIS", "license": "Public domain", "source": "https://commons.wikimedia.org/wiki/File:Brown_Sediment_Mixes_With_Seawater_in_Rio_de_la_Plata_(CIRA_2024-01-24_-_nolabels).webm"}], "days": [{"id": "thu", "tab": "Чт 5", "title": "Четверг, 5 ноября — приезд и Реаль-де-Сан-Карлос", "steps": [{"time": "08:30", "kind": "move", "title": "Выезд из дома", "home": true, "text": "Такси, Uber или Cabify до терминала Colonia Express, около 14 км, 30–40 минут. Таксисту: «Terminal Colonia Express, Dársena Sur»."}, {"time": "09:00", "kind": "ferry", "title": "Терминал в Буэнос-Айресе: регистрация и граница", "lat": -34.6254581, "lon": -58.3602624, "text": "Av. Elvira Rawson de Dellepiane 155. Регистрация начинается за 1,5 часа до отхода. Нужны пластиковые DNI всех четверых, свидетельства о рождении детей и распечатанные ваучеры. Аргентинскую и уругвайскую границу проходите сразу, здесь же."}, {"time": "10:30", "kind": "ferry", "title": "Паром 10:30 → 11:45: фильм на паром", "text": "Фильм с фото и голосом: Колония, Уругвай, река Ла-Плата и история паромов, около 17 минут. Наденьте наушники или смотрите всей семьёй.", "audio": "intro"}, {"time": "11:45", "kind": "ferry", "title": "Паромный терминал Колонии", "lat": -34.47404, "lon": -57.84416, "text": "Прибытие. До старого города 15–20 минут пешком или такси. По билету Colonia Express 24 часа бесплатно ходит городской автобус, в том числе до Plaza de Toros."}, {"time": "12:15", "kind": "hotel", "title": "Отель", "hotel": true, "text": "Оставить вещи, заселение обычно с 14:00. Отель отметьте кнопкой «Мой отель» над картой."}, {"time": "12:30", "kind": "food", "title": "Casa Viera", "lat": -34.470517, "lon": -57.852638, "text": "Обед. Google 4,7, ежедневно с 12:30."}, {"time": "13:45", "kind": "move", "title": "Такси в Реаль-де-Сан-Карлос", "text": "Около 10 минут, стоянки такси на Av. General Flores. Музей с глиптодонтами открыт только в среду и четверг до 16:30, поэтому едем сегодня.", "gmaps": "https://www.google.com/maps/dir/?api=1&destination=-34.439047,-57.859002"}, {"time": "14:00", "kind": "audio", "title": "Музей древних гигантов", "rec": 10, "lat": -34.439047, "lon": -57.859002, "audio": "paleo", "text": "Открыт только в среду и четверг, 11:30–16:30 (сайт музеев, 04.11). Билет 150 песо, дети до 12 лет бесплатно.", "kid": "Найди панцирь глиптодонта и встань рядом. Поместился бы ты под ним, как под крышей? А мама с папой?"}, {"time": "14:45", "kind": "audio", "title": "Арена Пласа-де-Торос", "rec": 11, "lat": -34.436551, "lon": -57.865214, "audio": "toros", "text": "Экскурсии по арене каждый час. Вс–пт 10:00–18:30, сб 10:00–19:00. Вход 250 песо, экскурсия 350 (каждый час с 11:00), дети до 5 лет бесплатно. В субботу 7.11 вечером здесь концерт.", "kid": "Пройди по кругу и сосчитай арки. Сколько получилось? Закрой глаза и представь восемь тысяч зрителей."}, {"time": "15:45", "kind": "audio", "title": "Фронтон: самая быстрая игра", "rec": 12, "lat": -34.437885, "lon": -57.867778, "audio": "fronton", "text": "Фронтон заново открыли в октябре 2026 года; часы посещения после реставрации не опубликованы, смотрите на месте.", "kid": "Найди самую высокую стену. В неё бьют мячом? Покажи, как бросают мяч корзиной на руке."}, {"time": "16:00", "kind": "walk", "title": "Набережная Реаль-де-Сан-Карлос", "lat": -34.441718, "lon": -57.867807, "text": "Набережная, парк и бывший причал Михановича. Обратно в город на такси."}, {"time": "16:45", "kind": "hotel", "title": "Отель", "hotel": true, "text": "Заселение и отдых."}, {"time": "19:00", "kind": "audio", "title": "Мыс Санта-Рита: закат", "rec": 6, "lat": -34.470452, "lon": -57.853765, "audio": "santarita", "text": "Закат около 19:25. Закат 6–8 ноября около 19:25. Рядом ресторан Amor Amor (Calle Santa Rita 40).", "kid": "Назови три цвета, которые видишь в воде и в небе. И загадайте одно желание на всю семью. Только никому не рассказывай!"}, {"time": "20:00", "kind": "food", "title": "La Bodeguita", "lat": -34.471222, "lon": -57.8527, "text": "Ужин: пицца и закуски на террасе над рекой. +598 4522 5329."}]}, {"id": "fri", "tab": "Пт 6 ♥", "title": "Пятница, 6 ноября — годовщина и старый город", "steps": [{"time": "10:00", "kind": "food", "title": "Albertine Pan y Café", "lat": -34.471435, "lon": -57.849783, "text": "Завтрак, кофе и торты (чт–сб с 10:00)."}, {"time": "10:45", "kind": "audio", "title": "Ворота Портон-де-Кампо", "rec": 1, "lat": -34.472695, "lon": -57.850452, "audio": "porton", "text": "Рядом детская площадка и туалет. Рядом туристический центр (Manuel Lobo 224), туалет и детская площадка. Отсюда ежедневно в 11:00 и 15:00 уходит городская прогулка с гидом «Camina Colonia» на испанском: 250 песо (≈$6) с человека, дети до 10 лет бесплатно.", "kid": "Представь, что ты стражник. Найди ров и мост. Как думаешь, зачем мост делали подъёмным? И найди самый большой камень в стене."}, {"time": "11:00", "kind": "audio", "title": "Улица Вздохов", "rec": 2, "lat": -34.472833, "lon": -57.851115, "audio": "suspiros", "text": "Брусчатка крупная и неровная, тротуаров нет: малыша удобнее нести в слинге, а не катить в коляске.", "kid": "Встань в желобок посередине улицы. Куда побежит вода, если пойдёт дождь: вверх или вниз, к реке? Потом передай маме «телеграмму»: коротко «ти», долго «таа»."}, {"time": "11:15", "kind": "audio", "title": "Маяк и руины монастыря", "rec": 4, "lat": -34.472818, "lon": -57.852269, "audio": "faro", "text": "Маяк сегодня открыт 10:00–12:00 и 15:00–17:00. Поднимайтесь по очереди: детей младше 8 лет не пускают. Подъём: 118 ступеней, чт–вс 10:00–12:00 и 15:00–17:00, 50 песо. Детей младше 8 лет наверх не пускают; в дождь и сильный ветер закрыто. Поднимайтесь по очереди.", "kid": "Где маяк квадратный, а где круглый? Сосчитай красные полосы и придумай историю про монаха из монастыря."}, {"time": "11:45", "kind": "audio", "title": "Пласа-Майор и музеи", "rec": 3, "lat": -34.472318, "lon": -57.851447, "audio": "plaza", "text": "Музеи работают 11:30–16:30. Сегодня открыты Ребуффо (касса) и Испанский музей. Касса музеев: Espacio Rebuffo, Del Comercio 77. Билет 150 песо (≈$4), дети до 12 лет бесплатно, 11:30–16:30. Часть музеев закрыта в отдельные дни, список ниже, в разделе «Музеи».", "kid": "Сосчитай деревья на площади. А в музее найди старинную карту и покажи на ней реку."}, {"time": "12:15", "kind": "audio", "title": "Набережная Сан-Габриэль", "rec": 5, "lat": -34.472665, "lon": -57.853683, "audio": "sangabriel", "text": "Неподалёку руины «Дома вице-короля» (Casa del Virrey). Музей азулежу на этой набережной сейчас закрыт.", "kid": "Найди вдали остров и помаши ему рукой. Сколько лодок и кораблей ты насчитал?"}, {"time": "12:45", "kind": "food", "title": "Mesón de la Plaza", "lat": -34.47118, "lon": -57.85105, "text": "Обед: классическая уругвайская кухня (≈ Vasconcellos 153)."}, {"time": "13:45", "kind": "hotel", "title": "Отель", "hotel": true, "text": "Тихий час."}, {"time": "15:45", "kind": "kids", "title": "Музей телеграфа", "lat": -34.470838, "lon": -57.852493, "text": "Музей телеграфа (пт открыт до 16:30): азбука Морзе, видео."}, {"time": "16:30", "kind": "audio", "title": "Бастион дель Кармен, труба и аквариум", "rec": 8, "lat": -34.469291, "lon": -57.85028, "audio": "carmen", "text": "Рядом аквариум (до 18:00) — следующий пункт. В пятницу 6.11 в 21:00 здесь спектакль (билет 250 песо). Рядом туалет. Рядом — аквариум местных рыб (чт–вс 14:00–18:00, дети до 10 лет бесплатно).", "kid": "Посмотри на трубу и сравни её с маяком: выше она или ниже? Придумай трубе имя."}, {"time": "16:45", "kind": "kids", "title": "Аквариум местных рыб", "lat": -34.46984, "lon": -57.850706, "text": "Аквариум местных рыб: чт–вс 14:00–18:00, 100 песо, дети до 10 лет бесплатно."}, {"time": "19:00", "kind": "love", "title": "♥ Charco Bistró", "lat": -34.473163, "lon": -57.851909, "text": "Ужин в честь годовщины на террасе над рекой, закат в 19:25. Бронь: +598 98 502 130."}]}, {"id": "sat", "tab": "Сб 7", "title": "Суббота, 7 ноября — отъезд", "steps": [{"time": "09:30", "kind": "hotel", "title": "Отель", "hotel": true, "text": "Завтрак, выезд из номера, вещи оставить на ресепшене."}, {"time": "11:00", "kind": "walk", "title": "Яхт-порт: катер Tour Náutico", "lat": -34.468251, "lon": -57.852302, "text": "По желанию: часовая прогулка на катере. Взрослые 850 песо, дети 5–12 лет 750, до 5 лет бесплатно."}, {"time": "12:00", "kind": "audio", "title": "Старый причал и порт яхт", "rec": 7, "lat": -34.468659, "lon": -57.851909, "audio": "muelle", "text": "Прогулка на катере «Tour Náutico» от яхт-порта: 1 час, 11:00, 13:30 и 17:00; взрослые 850 песо (≈$21), дети 5–12 лет 750, до 5 лет бесплатно.", "kid": "Найди лодку с самой высокой мачтой и сосчитай все мачты, которые видишь. Сколько их?"}, {"time": "12:20", "kind": "audio", "title": "Базилика Святейшего Таинства", "rec": 9, "lat": -34.471099, "lon": -57.85073, "audio": "basilica", "text": "Рядом Португальский дом (сб открыт до 16:30), касса — Del Comercio 77. Рядом — Пласа-де-Армас и фундаменты Дома губернаторов. Отсюда до ворот, где маршрут начинался, пара минут пешком.", "kid": "Найди на стене церкви места, где камни разные: старые и новые. Сколько разных видов камня насчитал?"}, {"time": "13:00", "kind": "food", "title": "Mesón de la Plaza", "lat": -34.47118, "lon": -57.85105, "text": "Обед: классическая уругвайская кухня (≈ Vasconcellos 153)."}, {"time": "14:15", "kind": "food", "title": "Helados Papito", "lat": -34.47075, "lon": -57.85165, "text": "Мороженое."}, {"time": "14:30", "kind": "hotel", "title": "Отель", "hotel": true, "text": "Забрать вещи."}, {"time": "14:45", "kind": "ferry", "title": "Паромный терминал Колонии", "lat": -34.47404, "lon": -57.84416, "text": "Регистрация начинается в 14:45. Паром 16:15 → 17:30 в Буэнос-Айрес, дома около 18:15–18:30."}]}], "audio": {"intro": [null, "Добро пожаловать в Колонию"], "igra": ["00-igra.mp3", "Игра на все выходные"], "porton": [null, "Ворота Портон-де-Кампо"], "suspiros": [null, "Улица Вздохов"], "plaza": [null, "Пласа-Майор и музеи"], "faro": [null, "Маяк и руины монастыря"], "sangabriel": [null, "Набережная Сан-Габриэль"], "santarita": [null, "Мыс Санта-Рита: закат"], "muelle": [null, "Старый причал и порт яхт"], "carmen": [null, "Бастион дель Кармен, труба и аквариум"], "basilica": [null, "Базилика Святейшего Таинства"], "paleo": [null, "Музей древних гигантов"], "toros": [null, "Арена Пласа-де-Торос"], "fronton": [null, "Фронтон: самая быстрая игра"], "ferry_uruguay": [null, "Уругвай за пять минут"], "ferry_river": [null, "Река, похожая на море"], "ferry_boats": [null, "Как плавали через реку"]}, "stops": {"porton": {"n": 1, "title": "Ворота Портон-де-Кампо", "sub": "Portón de Campo · начало маршрута", "lat": -34.472695, "lon": -57.850452, "kid": "Представь, что ты стражник. Найди ров и мост. Как думаешь, зачем мост делали подъёмным?", "info": "Рядом туристический центр (Manuel Lobo 224), туалет и детская площадка. Отсюда ежедневно в 11:00 и 15:00 уходит городская прогулка с гидом «Camina Colonia» на испанском: 250 песо (≈$6) с человека, дети до 10 лет бесплатно.", "text": ["Перед вами ворота Портон-де-Кампо. Через эти ворота из крепости выходили в поле. Их построил португальский губернатор Антониу Педру ди Васконселуш, примерно в тысяча семьсот сорок пятом году. При нём Колония стала самым богатым и самым укреплённым городом в округе.", "Посмотрите вниз. Перед воротами ров, а через него деревянный подъёмный мост. Когда мост поднимали, враг оставался по ту сторону рва.", "И маленький секрет. Стена, которую вы видите, почти вся восстановлена. Испанцы снесли укрепления в тысяча семьсот семьдесят седьмом году, и к середине двадцатого века от стены почти ничего не осталось. Ворота собрали заново после тысяча девятьсот шестьдесят восьмого года, частью из старых камней, частью из новых.", "Рядом с воротами есть туристический центр, туалет и детская площадка. Отсюда каждый день в одиннадцать и в три часа дня уходит недорогая прогулка с городским гидом на испанском языке. Детям до десяти лет бесплатно."]}, "suspiros": {"n": 2, "title": "Улица Вздохов", "sub": "Calle de los Suspiros", "lat": -34.472833, "lon": -57.851115, "kid": "Встань в желобок посередине улицы. Куда побежит вода, если пойдёт дождь: вверх или вниз, к реке?", "info": "Брусчатка крупная и неровная, тротуаров нет: малыша удобнее нести в слинге, а не катить в коляске.", "text": ["Это самая знаменитая улица города, Калье-де-лос-Суспирос, улица Вздохов. Она спускается от главной площади прямо к реке.", "Посмотрите под ноги. Тротуаров нет, а мостовая с обеих сторон наклонена к середине. Посередине получается желоб, по которому дождевая вода стекает к реке. Так строили португальцы.", "Дома здесь первой половины восемнадцатого века: каменные стены, черепичные крыши, маленькие деревянные двери и окна. Это одна из немногих улиц, которые выглядят почти как триста лет назад.", "Почему улица Вздохов? Этого точно никто не знает. Ещё в середине прошлого века она называлась иначе. Есть три легенды. По первой, здесь были таверны, и моряки вздыхали по местным красавицам. По второй, по этой улице к реке вели приговорённых, и они вздыхали в последний раз. А по третьей, здесь девушка ждала возлюбленного, да так и не дождалась. Выбирайте ту, что вам больше нравится.", "Внизу, на углу с улицей Сан-Педро, стоит дом, где когда-то работала телеграфная компания. Отсюда по дну реки на другой берег протянули первый в Южной Америке телеграфный кабель."]}, "plaza": {"n": 3, "title": "Пласа-Майор и музеи", "sub": "Plaza Mayor 25 de Mayo", "lat": -34.472318, "lon": -57.851447, "kid": "В музее лежат осколки старой посуды, которые нашли прямо в земле. Как думаешь, кто из неё ел триста лет назад?", "info": "Касса музеев: Espacio Rebuffo, Del Comercio 77. Билет 150 песо (≈$4), дети до 12 лет бесплатно, 11:30–16:30. Часть музеев закрыта в отдельные дни, список ниже, в разделе «Музеи».", "text": ["Вы на Пласа-Майор, главной площади старого города. Вокруг стоят старые португальские дома, а в углу площади руины монастыря, из которых вырастает маяк.", "Если хотите в музеи, касса находится в доме на улице Дель-Комерсио, семьдесят семь, напротив площади. Это Эспасио Ребуффо, самый первый музей города, его открыли в тысяча девятьсот пятьдесят первом году. Наверху там есть зал природы. Билет стоит сто пятьдесят песо, дети до двенадцати лет проходят бесплатно.", "На площади стоит и Португальский музей: старинная мебель, карты, оружие и вещи, найденные при раскопках дома губернаторов. Фундамент этого дома можно увидеть рядом с базиликой, это последняя остановка нашего маршрута."]}, "faro": {"n": 4, "title": "Маяк и руины монастыря", "sub": "Faro y Convento de San Francisco", "lat": -34.472818, "lon": -57.852269, "kid": "Посмотри на маяк: снизу он квадратный или круглый? А сверху? Сосчитай красные полосы.", "info": "Подъём: 118 ступеней, чт–вс 10:00–12:00 и 15:00–17:00, 50 песо. Детей младше 8 лет наверх не пускают; в дождь и сильный ветер закрыто. Поднимайтесь по очереди.", "text": ["Перед вами маяк и руины монастыря Сан-Франсиско семнадцатого века. Присмотритесь: снизу у маяка квадратное каменное основание. Это остаток одной из башен монастыря. А сверху круглая башня с красно-белыми полосами.", "Маяк начали строить в тысяча восемьсот сорок пятом году, потом война остановила работы, и открыли его только в январе тысяча восемьсот пятьдесят седьмого года. Достроить его помог налог с кораблей, которые заходили в порты Колонии и Монтевидео.", "Наверх ведут сто восемнадцать ступеней. Маяк открыт с четверга по воскресенье, с десяти до двенадцати и с трёх до пяти. Детей младше восьми лет наверх не пускают, а в дождь и сильный ветер маяк закрыт. Поэтому поднимайтесь по очереди: один взрослый идёт наверх, второй с детьми считает полосы внизу. Говорят, сверху открывается лучший вид на город и реку."]}, "sangabriel": {"n": 5, "title": "Набережная Сан-Габриэль", "sub": "Paseo de San Gabriel · Punta de San Pedro", "lat": -34.472665, "lon": -57.853683, "kid": "Посмотри на реку. Какого она цвета? Видишь вдали остров?", "info": "Неподалёку руины «Дома вице-короля» (Casa del Virrey). Музей азулежу на этой набережной сейчас закрыт.", "text": ["Вы на набережной Пасео-де-Сан-Габриэль. Посмотрите на реку. Где-то впереди лежит остров Сан-Габриэль, в ясную погоду его видно. Именно к этому острову в январе тысяча шестьсот восьмидесятого года подошли корабли Мануэла Лобу, а через несколько дней на берегу начали строить крепость.", "Мыс рядом называется Пунта-де-Сан-Педро. Здесь стоял бастион Сан-Педро, один из шести бастионов, которые португальцы построили вдоль воды в тысяча семьсот двадцатых годах.", "А руины неподалёку называют Домом вице-короля. Забавно, но ни один вице-король здесь не жил. Возможно, имя появилось в честь испанского генерала Педро де Севальоса, который взял Колонию и стал первым вице-королём Ла-Платы. Но документов об этом нет, так что это загадка."]}, "santarita": {"n": 6, "title": "Мыс Санта-Рита: закат", "sub": "Calle Santa Rita · Bastión de Santa Rita", "lat": -34.470452, "lon": -57.853765, "kid": "Когда солнце будет садиться, загадайте одно желание на всю семью. Только никому не рассказывай!", "info": "Закат 6–8 ноября около 19:25. Рядом ресторан Amor Amor (Calle Santa Rita 40).", "text": ["Это мыс Санта-Рита. Здесь тоже стоял португальский бастион, а сейчас это одно из лучших мест, чтобы встретить закат. Солнце садится прямо над рекой. В начале ноября закат около половины восьмого вечера.", "Здесь вдоль воды стоят скамейки. Можно просто сесть, никуда не спешить и посмотреть, как река становится золотой."]}, "muelle": {"n": 7, "title": "Старый причал и порт яхт", "sub": "Muelle de madera · Puerto de Yates", "lat": -34.468659, "lon": -57.851909, "kid": "Найди лодку с самой высокой мачтой. Сколько всего мачт ты насчитал?", "info": "Прогулка на катере «Tour Náutico» от яхт-порта: 1 час, 11:00, 13:30 и 17:00; взрослые 850 песо (≈$21), дети 5–12 лет 750, до 5 лет бесплатно.", "text": ["Это старый деревянный причал, а рядом пристань для яхт. Когда-то сюда приходили парусники и пароходы из Буэнос-Айреса.", "Если хочется посмотреть на город с воды, от яхт-порта уходит часовая прогулка на катере: в одиннадцать, в половине второго и в пять. Детям до пяти лет бесплатно."]}, "carmen": {"n": 8, "title": "Бастион дель Кармен, труба и аквариум", "sub": "Centro Cultural Bastión del Carmen", "lat": -34.469291, "lon": -57.85028, "kid": "Задери голову и посмотри на трубу. Как думаешь, она выше маяка или ниже? А сколько в ней кирпичей?", "info": "В пятницу 6.11 в 21:00 здесь спектакль (билет 250 песо). Рядом туалет. Рядом — аквариум местных рыб (чт–вс 14:00–18:00, дети до 10 лет бесплатно).", "text": ["Высокая кирпичная труба осталась от старой мыльной фабрики. Сейчас в её зданиях культурный центр и театр, а вокруг лужайка у самой воды. Название досталось от португальского бастиона, который стоял на этом берегу.", "Здания фабрики и труба охраняются государством как национальный памятник. Днём здесь хорошо посидеть на траве у реки, пока дети бегают.", "А совсем рядом есть небольшой аквариум с рыбами, которые живут в местных реках. Дети до десяти лет проходят бесплатно."]}, "basilica": {"n": 9, "title": "Базилика Святейшего Таинства", "sub": "Basílica del Santísimo Sacramento · Plaza de Armas", "lat": -34.471099, "lon": -57.85073, "kid": "Посмотри на стены церкви. Найди места, где камни разные: где-то старые, а где-то новые. Сколько разных видов камня ты увидишь?", "info": "Рядом — Пласа-де-Армас и фундаменты Дома губернаторов. Отсюда до ворот, где маршрут начинался, пара минут пешком.", "text": ["Это Базилика Святейшего Таинства, самая старая церковь Уругвая. Приход основали в феврале тысяча шестьсот восьмидесятого года, сразу после прихода португальцев. Первая церковь была хижиной из соломы и глины. Потом её много раз перестраивали.", "Самая драматичная история случилась воскресным утром, в декабре тысяча восемьсот двадцать третьего года. Под ризницей хранили порох. Во время грозы в церковь ударила молния, и порох взорвался. Большая часть здания была разрушена. Через десять лет здесь побывал Чарльз Дарвин и записал, что от церкви остались любопытные руины, памятник силе молнии и пороха.", "Церковь восстановили в тысяча восемьсот тридцатых годах, а в двадцатом веке реставраторы оставили на виду старые части стен рядом с новыми. Внутри есть купель, которой около трёхсот лет, и распятие, вырезанное индейцами из иезуитских миссий.", "Перед базиликой площадь Пласа-де-Армас, а в паре десятков шагов видны каменные фундаменты Дома губернаторов. Вместе с церковью это было главное здание города. На этом маршрут по старому городу закончен. Спасибо, что гуляли с нами!"]}, "paleo": {"n": 10, "title": "Музей древних гигантов", "sub": "Espacio Paleontológico Armando Calcaterra", "lat": -34.439047, "lon": -57.859002, "kid": "Найди панцирь глиптодонта. Как думаешь, ты бы поместился под ним, как под крышей?", "info": "Открыт только в среду и четверг, 11:30–16:30 (сайт музеев, 04.11). Билет 150 песо, дети до 12 лет бесплатно.", "text": ["Мы в районе Реаль-де-Сан-Карлос. В этом небольшом музее хранятся кости и панцири животных, которые жили здесь больше десяти тысяч лет назад.", "Главные звёзды музея — глиптодонты, древние родственники броненосцев. Их панцирь был размером с маленький автомобиль, а сами они весили как бегемот. Представьте такого зверя на берегу реки!"]}, "toros": {"n": 11, "title": "Арена Пласа-де-Торос", "sub": "Plaza de Toros Real de San Carlos", "lat": -34.436551, "lon": -57.865214, "kid": "Пройди по кругу и сосчитай арки. Сколько у тебя получилось?", "info": "Вс–пт 10:00–18:30, сб 10:00–19:00. Вход 250 песо, экскурсия 350 (каждый час с 11:00), дети до 5 лет бесплатно. В субботу 7.11 вечером здесь концерт.", "text": ["Название Реаль-де-Сан-Карлос дали испанцы. Отсюда они осаждали португальскую крепость и назвали лагерь в честь короля Карла Третьего.", "В начале двадцатого века сюда пришёл Николас Миханович, судовладелец родом из Хорватии. Его пароходы возили людей между Буэнос-Айресом и Колонией, и он задумал здесь курорт для гостей с того берега: отель, казино, площадку для баскской пелоты и арену для корриды.", "Арену построили всего за восемь месяцев и открыли в январе тысяча девятьсот десятого года. На первую корриду пришли тысячи зрителей. Но уже в тысяча девятьсот двенадцатом году корриду в Уругвае запретили, и здесь успели провести всего восемь боёв.", "Потом арена почти сто лет стояла заброшенной и разрушалась. В две тысячи двенадцатом году обрушилась часть фасада. Её отреставрировали и в декабре две тысячи двадцать первого года открыли снова, через сто одиннадцать лет после открытия. Сейчас внутри музей, рестораны и концертная площадка."]}, "fronton": {"n": 12, "title": "Фронтон: самая быстрая игра", "sub": "Frontón Real de San Carlos", "lat": -34.437885, "lon": -57.867778, "kid": "Найди самую высокую стену. Как думаешь, в неё бьют мячом или нет?", "info": "Фронтон заново открыли в октябре 2026 года; часы посещения после реставрации не опубликованы, смотрите на месте.", "text": ["Это Фронтон, площадка для баскской пелоты. В этой игре мяч с огромной силой бросают в высокую стену плетёной корзиной, надетой на руку.", "Фронтон открыли в тысяча девятьсот десятом году. Он длиной шестьдесят четыре метра, а на трибунах помещались три тысячи зрителей. Это самая большая площадка такого рода в Южной Америке. В октябре этого года, после реставрации, здесь прошёл чемпионат мира по этой игре.", "Рядом стоял отель с казино. Казино работало до тысяча девятьсот семнадцатого года, а в отеле любили собират     const b=document.createElement('button'); b.textContent=lab; b.className=id===day?'on':''; b.onclick=()=>{day=id;LS.set('day',id);selIdx=-1;render(true)}; t.appendChild(b)});
}
function render(fit){
  renderTabs(); layer.clearLayers(); markers=[];
  const list=document.getElementById('list'); list.innerHTML='';
  if(day==='all'){ renderAll(list,fit); return }
  const D=DATA.days.find(d=>d.id===day);
  list.insertAdjacentHTML('beforeend',`<div class="daytitle">${D.title}</div>`);
  const pts=[]; let mapN=0;
  (DATA.routes[day]||[]).forEach(leg=>L.polyline(leg,{color:'#2a5c8a',weight:4,opacity:.55}).addTo(layer));
  D.steps.forEach((s,i)=>{
    const pos=stepPos(s), k=s.kind, num=pos?++mapN:null;
    if(pos){ const m=L.marker(pos,{icon:pin(num,k,i===selIdx),zIndexOffset:i===selIdx?1000:0}).addTo(layer).on('click',()=>select(i,true)); m.bindTooltip(s.time+' '+s.title,{permanent:i===selIdx,direction:'top',offset:[0,-14]}); markers[i]=m; if(dist(COL,pos)<20000) pts.push(pos) }
    const key=day+':'+i, isDone=done[key];
    const dd=(me&&pos)?` · ${fmtD(dist(me,pos))} от вас`:'';
    const el=document.createElement('div'); el.className='step'+(isDone?' done':'')+(i===selIdx?' cur':''); el.id='st'+i;
    el.onclick=ev=>{ if(ev.target.closest('button,a,summary')) return; select(i,false) };
    let acts='';
    if(s.audio==='intro'&&DATA.film.some(x=>DATA.pres[x])) acts+=`<button class="watch" data-film="1">🎬 Фильм на паром</button>`;
    else if(s.audio&&DATA.pres[s.audio]) acts+=`<button class="watch" data-w="${s.audio}">🎬 Смотреть</button>`;
    if(s.audio){acts+=`<button class="play" data-a="${s.audio}">▶ ${heard[s.audio]?'Ещё раз':'Слушать'}</button>`}
    if(pos){const far=dist(COL,pos)>20000; acts+=`<button data-show="${i}">На карте</button>`; if(!s.home) acts+=`<a target="_blank" rel="noopener" href="https://www.google.com/maps/dir/?api=1&destination=${pos[0]},${pos[1]}&travelmode=${far?'driving':'walking'}">${far?'Маршрут ↗':'Пешком ↗'}</a>`}
    else if(s.gmaps){acts+=`<a target="_blank" rel="noopener" href="${s.gmaps}">Маршрут ↗</a>`}
    if(s.hotel&&!hotel){acts+=`<button data-hotel="1">Отметить отель</button>`}
    if(s.home&&!home){acts+=`<span class="small">Точка дома — в ссылке из семейного чата</span>`}
    acts+=`<button data-done="${key}">${isDone?'↺ Вернуть':'✓ Готово'}</button>`;
    el.innerHTML=`<div class="badge k-${k}">${pos?num:(ICON[k]||'•')}</div><div class="body"><div class="time">${s.time}${s.rec?` · 🎧 запись ${s.rec}`:''}${dd}</div><div class="ttl">${ICON[k]||''} ${s.title}</div><div class="txt">${s.text||''}</div>${s.audio?thumbs(s.audio):''}${s.kid?`<div class="kid"><b>Для ребёнка:</b> ${s.kid}</div>`:''}<div class="acts">${acts}</div></div>`;
    list.appendChild(el);
  });
  list.insertAdjacentHTML('beforeend',`<div class="small">Время ориентировочное. Цены и часы проверены 01–04.11.2026. Карта © OpenStreetMap.</div>`);
  drawHotel(); drawMe();
  if(fit&&pts.length) map.fitBounds(pts,{padding:[30,30],maxZoom:17});
}
function renderAll(list,fit){
  list.insertAdjacentHTML('beforeend',`<div class="daytitle">Рассказы: слушать или смотреть с фото</div>`);
  const filmIds=DATA.film.filter(x=>DATA.pres[x]);
  if(filmIds.length) list.insertAdjacentHTML('beforeend',`<div class="step film"><div class="badge" style="background:#c9772b">🎬</div><div class="body"><div class="ttl">Фильм на паром</div><div class="txt">${filmIds.map(x=>DATA.pres[x].title).join(' · ')}</div><div class="time">≈ ${Math.round(filmIds.reduce((a,x)=>a+estDur(x),0)/60)} минут, фото и голос</div><div class="acts"><button class="watch" data-film="1">🎬 Смотреть фильм</button><button class="play" data-plist="1">▶ Только слушать</button></div></div></div>`);
  const pts=[];
  const ids=[...new Set([...Object.keys(DATA.pres),...Object.keys(DATA.audio)])];
  ids.forEach(id=>{ const t=(DATA.pres[id]&&DATA.pres[id].title)||DATA.audio[id][1];
    const s=DATA.stops[id]; const pos=s?[s.lat,s.lon]:null;
    if(pos){ L.marker(pos,{icon:pin(s.n,'audio')}).addTo(layer).bindTooltip(t).on('click',()=>play(id)); pts.push(pos) }
    const dd=(me&&pos)?` · ${fmtD(dist(me,pos))} от вас`:'';
    list.insertAdjacentHTML('beforeend',`<div class="step"${pos?` data-ll="${pos[0]},${pos[1]}"`:''}><div class="badge k-audio">${s?s.n:'🎧'}</div><div class="body"><div class="ttl">${t}</div><div class="time">${s?s.sub:'можно слушать где угодно'}${dd}</div>${s&&s.kid?`<div class="kid"><b>Для ребёнка:</b> ${s.kid}</div>`:''}${thumbs(id)}<div class="acts">${DATA.pres[id]?`<button class="watch" data-w="${id}">🎬 Смотреть</button>`:''}<button class="play" data-a="${id}">▶ ${heard[id]?'Ещё раз':'Слушать'}</button>${pos?`<a target="_blank" rel="noopener" href="https://www.google.com/maps/dir/?api=1&destination=${pos[0]},${pos[1]}&travelmode=walking">Пешком ↗</a>`:''}</div>${textOf(id)?`<details><summary class="small">Текст рассказа</summary>${textOf(id).map(p=>`<p class="txt">${p}</p>`).join('')}</details>`:''}</div></div>`);
  });
  drawHotel(); drawMe();
  if(fit&&pts.length) map.fitBounds(pts,{padding:[30,30]});
}
function select(i,scroll){ selIdx=i; render(false); const s=DATA.days.find(d=>d.id===day).steps[i]; const p=stepPos(s); if(p){ follow=false; map.setView(p,dist(COL,p)>20000?14:Math.max(map.getZoom(),16)) } if(scroll){const e=document.getElementById('st'+i); e&&e.scrollIntoView({behavior:'smooth',block:'center'})} }
document.getElementById('list').addEventListener('click',e=>{
  const card=e.target.closest('.step[data-ll]'); if(card&&!e.target.closest('button,a,summary')){ const [la,lo]=card.dataset.ll.split(',').map(Number); follow=false; map.setView([la,lo],17); return }
  const th=e.target.closest('.thumbs'); if(th){ openShow([th.dataset.w]); return }
  const b=e.target.closest('button'); if(!b) return;
  if(b.dataset.a) play(b.dataset.a);
  if(b.dataset.w) openShow([b.dataset.w]);
  if(b.dataset.film) openShow(DATA.film.filter(x=>DATA.pres[x]));
  if(b.dataset.plist) playList(DATA.film.filter(x=>DATA.pres[x]));
  if(b.dataset.show) select(+b.dataset.show,false);
  if(b.dataset.done){ done[b.dataset.done]=!done[b.dataset.done]; LS.set('done',done); render(false) }
  if(b.dataset.hotel) chooseHotel();
});
// ---- плеер
const A=new Audio(); A.preload='none'; let cur=null;
const P=document.getElementById('player'), PP=document.getElementById('pp'), PT=document.getElementById('ptitle'), PB=document.querySelector('#pbar div');
let queue=[], qi=0, qTitle='';
function segsOf(id){ const p=DATA.pres[id]; if(p) return p.segs.filter(x=>x.audio).map(x=>x.audio); const a=DATA.audio[id]; return a&&a[0]?['audio/'+a[0]]:[] }
function titleOf(id){ return (DATA.pres[id]&&DATA.pres[id].title)||(DATA.audio[id]&&DATA.audio[id][1])||'' }
function textOf(id){ if(DATA.pres[id]) return DATA.pres[id].segs.map(x=>x.text); const s=DATA.stops[id]; return s?s.text:null }
function estDur(id){ const p=DATA.pres[id]; return p?p.segs.reduce((a,x)=>a+x.text.split(/\s+/).length/2.4,0):60 }
function thumbs(id){ const p=DATA.pres[id]; if(!p) return ''; const im=[...new Set(p.segs.map(x=>x.img).filter(Boolean))].slice(0,6); return im.length?`<div class="thumbs" data-w="${id}">${im.map(u=>`<img loading="lazy" src="${u}" alt="">`).join('')}</div>`:'' }
function play(id){ closeShow(); if(cur===id&&queue.length){A.play();return} queue=segsOf(id).map(u=>({u,id})); qi=0; cur=id; startQ() }
function playList(ids){ closeShow(); queue=[]; ids.forEach(id=>segsOf(id).forEach(u=>queue.push({u,id}))); qi=0; cur=ids[0]; startQ() }
function startQ(){ if(!queue.length) return; A.src=queue[qi].u; A.play(); P.style.display='block'; PT.textContent=titleOf(queue[qi].id); hideNear() }
PP.onclick=()=>{ A.paused?A.play():A.pause() };
document.getElementById('px').onclick=()=>{A.pause(); P.style.display='none'};
A.onplay=()=>PP.textContent='❚❚'; A.onpause=()=>PP.textContent='▶';
A.ontimeupdate=()=>{ if(A.duration) PB.style.width=(100*A.currentTime/A.duration)+'%' };
A.onended=()=>{ if(qi+1<queue.length){ if(queue[qi+1].id!==queue[qi].id){heard[queue[qi].id]=1; LS.set('heard',heard)} qi++; A.src=queue[qi].u; PT.textContent=titleOf(queue[qi].id); A.play(); return }
  if(queue.length){heard[queue[qi].id]=1; LS.set('heard',heard)} PP.textContent='▶'; render(false) };
A.ontimeupdate=()=>{ if(A.duration&&queue.length){ PB.style.width=(100*(qi+A.currentTime/A.duration)/queue.length)+'%' } };
// ---- геолокация
const BME=document.getElementById('bme');
BME.onclick=()=>{
  if(!navigator.geolocation){alert('Телефон не отдаёт геопозицию');return}
  if(watch===null){ follow=true; BME.classList.add('on'); BME.textContent='◎ Слежу';
    watch=navigator.geolocation.watchPosition(onPos,err=>{alert('Нет доступа к геопозиции: разрешите её для этой страницы в настройках браузера'); stopWatch()},{enableHighAccuracy:true,maximumAge:5000,timeout:20000});
  } else if(!follow){ follow=true; me&&map.setView(me,17) } else stopWatch();
};
function stopWatch(){ if(watch!==null) navigator.geolocation.clearWatch(watch); watch=null; follow=false; BME.classList.remove('on'); BME.textContent='◎ Где я' }
map.on('dragstart',()=>{ if(watch!==null){follow=false; BME.textContent='◎ К себе'} });
let lastRender=0;
function onPos(p){ me=[p.coords.latitude,p.coords.longitude]; drawMe(p.coords.accuracy); if(follow) map.setView(me,Math.max(map.getZoom(),16)); checkNear(); if(Date.now()-lastRender>15000){lastRender=Date.now(); render(false)} }
function drawMe(acc){ if(!me) return; if(!meMk){ meMk=L.marker(me,{icon:L.divIcon({className:'',html:'<div class="me"></div>',iconSize:[18,18],iconAnchor:[9,9]}),zIndexOffset:2000}).addTo(map); meAcc=L.circle(me,{radius:acc||30,color:'#1a73e8',weight:1,fillOpacity:.1}).addTo(map) } else { meMk.setLatLng(me); meAcc.setLatLng(me); if(acc) meAcc.setRadius(acc) } }
// ---- рядом с остановкой
const NEAR=document.getElementById('near');
function checkNear(){
  if(!me) return; let best=null;
  for(const [id,s] of Object.entries(DATA.stops)){ const d=dist(me,[s.lat,s.lon]); if(d<60&&(!best||d<best.d)) best={id,s,d} }
  if(!best||heard[best.id]||cur===best.id&&!A.paused||(snooze[best.id]&&Date.now()<snooze[best.id])) { if(!best) hideNear(); return }
  NEAR.innerHTML=`<b>Вы рядом: ${best.s.n}. ${best.s.title}</b><div class="small" style="margin:2px 0">${fmtD(best.d)} · запись ${DATA.audio[best.id][1]}</div><div class="acts"><button class="play" onclick="play('${best.id}')">▶ Слушать</button><button onclick="snooze['${best.id}']=Date.now()+600000;hideNear()">Позже</button></div>`;
  NEAR.style.display='block';
}
function hideNear(){ NEAR.style.display='none' }
// ---- отель
function drawHotel(){ if(hotelMk){map.removeLayer(hotelMk);hotelMk=null} if(hotel) hotelMk=L.marker([hotel.lat,hotel.lon],{icon:pin('⌂','hotel')}).addTo(map).bindTooltip(hotel.name) }
function chooseHotel(){
  const opts=DATA.hotels.map((h,i)=>`${i+1} — ${h.name}`).join('\n');
  const a=prompt(`Где вы живёте? Введите номер:\n${opts}\n${DATA.hotels.length+1} — поставить в центр карты\n0 — убрать отметку`, '');
  if(a===null) return; const n=parseInt(a,10);
  if(n===0){hotel=null} else if(n>=1&&n<=DATA.hotels.length){hotel=DATA.hotels[n-1]} else if(n===DATA.hotels.length+1){const c=map.getCenter(); hotel={name:'Мой отель',lat:c.lat,lon:c.lng}} else return;
  LS.set('hotel',hotel); render(false);
}
document.getElementById('bhotel').onclick=()=>{ if(hotel&&!confirm(`Отель: ${hotel.name}. Поменять?`)){map.setView([hotel.lat,hotel.lon],17);return} chooseHotel() };
// ---- офлайн
document.getElementById('boff').onclick=async()=>{
  if(!('caches' in window)){alert('Браузер не умеет офлайн');return}
  const b=document.getElementById('boff'); const c=await caches.open('colonia-v5');
  const list=['./','index.html','https://unpkg.com/leaflet@1.9.4/dist/leaflet.css','https://unpkg.com/leaflet@1.9.4/dist/leaflet.js',...Object.values(DATA.audio).filter(a=>a[0]).map(a=>'audio/'+a[0]),...Object.values(DATA.pres).flatMap(p=>p.segs.flatMap(x=>[x.audio,x.img,x.video]).filter(Boolean))];
  let n=0; for(const u of list){ try{await c.add(u); n++; b.textContent=`⇩ ${n}/${list.length}`}catch(e){} }
  b.textContent=n===list.length?'✓ Офлайн':'⇩ '+n+'/'+list.length;
  alert(n===list.length?'Готово: страница и все записи сохранены в телефоне. Карту полистайте по Wi-Fi — просмотренные места тоже запомнятся.':'Сохранилось не всё, повторите при хорошем интернете.');
};
// ---- показ: фото + голос + подписи
const SH=document.getElementById('show'), BG=[document.getElementById('bg1'),document.getElementById('bg2')], BIG=document.getElementById('big'), CAP=document.getElementById('cap'), SUB=document.getElementById('sub'), CRED=document.getElementById('cred'), BARS=document.getElementById('bars'), CHAP=document.getElementById('chap'), SPLAY=document.getElementById('splay');
const SA=new Audio(); let sl=[], si=0, bgi=0, chapTimer=null;
function openShow(ids){ A.pause(); P.style.display='none'; sl=[]; ids.forEach(id=>DATA.pres[id].segs.forEach((x,k)=>sl.push({...x,id,first:k===0,last:k===DATA.pres[id].segs.length-1}))); if(!sl.length) return;
  BARS.innerHTML=sl.map(()=>'<i><b></b></i>').join(''); SH.style.display='block'; si=0; document.getElementById('stitle').textContent=ids.length>1?'Фильм на паром':titleOf(ids[0]); showSlide(); if(document.documentElement.requestFullscreen) document.documentElement.requestFullscreen().catch(()=>{}) }
function closeShow(){ if(SH.style.display!=='block') return; SA.pause(); document.getElementById('vbg').pause(); SH.style.display='none'; if(document.fullscreenElement) document.exitFullscreen().catch(()=>{}) }
function showSlide(){ const x=sl[si]; if(!x) return closeShow();
  [...BARS.children].forEach((e,i)=>e.firstChild.style.width=i<si?'100%':'0');
  const nb=BG[bgi^1], ob=BG[bgi]; nb.classList.remove('on'); void nb.offsetWidth;
  const VB=document.getElementById('vbg');
  if(x.video){ VB.src=x.video; VB.classList.add('on'); VB.play().catch(()=>{}) } else { VB.classList.remove('on'); VB.pause() }
  if(x.img){ nb.style.backgroundImage=`url("${x.img}")` } else { nb.style.backgroundImage='linear-gradient(135deg,#1d3f61,#c9772b)' }
  nb.style.setProperty('--d',Math.max(20,x.text.split(/\s+/).length/2.3)+'s'); nb.classList.add('on'); ob.classList.remove('on'); bgi^=1;
  CAP.textContent=x.caption||''; SUB.textContent=''; CRED.textContent=x.credit?('Фото: '+x.credit):'';
  BIG.classList.remove('on'); BIG.textContent=x.big||''; if(x.big) setTimeout(()=>BIG.classList.add('on'),600);
  clearTimeout(chapTimer); CHAP.classList.remove('on');
  if(x.first){ CHAP.innerHTML=`${titleOf(x.id)}<small>${DATA.pres[x.id].kid?'Задание в конце рассказа':''}</small>`; CHAP.classList.add('on'); chapTimer=setTimeout(()=>CHAP.classList.remove('on'),3500) }
  if(x.audio){ SA.src=x.audio; SA.play().catch(()=>{SPLAY.textContent='▶'}) } else { setTimeout(()=>{ if(sl[si]===x) next() },6000) }
  heard[x.id]=heard[x.id]||(x.last?1:0); if(x.last) LS.set('heard',heard);
  const n=sl[si+1]; if(n&&n.img){ const im=new Image(); im.src=n.img }
}
function next(){ if(si+1<sl.length){si++; showSlide()} else closeShow() }
function prev(){ si=Math.max(0,si-1); showSlide() }
SA.onended=next; SA.onplay=()=>SPLAY.textContent='❚❚'; SA.onpause=()=>SPLAY.textContent='▶';
SA.ontimeupdate=()=>{ const b=BARS.children[si]; if(b&&SA.duration) b.firstChild.style.width=(100*SA.currentTime/SA.duration)+'%' };
document.getElementById('snext').onclick=next; document.getElementById('sprev').onclick=prev; document.getElementById('tapr').onclick=next; document.getElementById('tapl').onclick=prev;
SPLAY.onclick=()=>{ SA.paused?SA.play():SA.pause() }; document.getElementById('sclose').onclick=closeShow;
document.addEventListener('keydown',e=>{ if(SH.style.display!=='block') return; if(e.key==='ArrowRight') next(); if(e.key==='ArrowLeft') prev(); if(e.key==='Escape') closeShow(); if(e.key===' ') SPLAY.click() });
if('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js');
render(true);
</script></body></html>
