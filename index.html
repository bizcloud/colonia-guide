<!doctype html>
<html lang="ru"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#1d3f61">
<title>Колония — карта поездки</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
:root{--ink:#2b2622;--muted:#6f655c;--ochre:#c9772b;--blue:#2a5c8a;--paper:#fbf6ee;--line:#eadfce;--love:#c2185b}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{font:16px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;color:var(--ink);background:var(--paper);display:flex;flex-direction:column}
header{background:#1d3f61;color:#fff;padding:10px 12px 0}
header h1{font-size:17px;margin:0 0 8px;font-weight:600}
.calcbtn{border:0;border-radius:10px;background:#2a5c8a;color:#fff;padding:6px 10px;font-size:14px;margin-bottom:8px}
#calc{display:none;background:#fff;color:var(--ink);border-radius:12px;padding:8px 10px;margin:0 0 8px}
#calc.on{display:block}
.crow{display:flex;align-items:center;gap:8px;margin:4px 0}
.crow label{flex:1;font-size:14px}
.crow input{width:46%;font-size:18px;padding:6px 8px;border:1px solid var(--line);border-radius:8px;text-align:right}
.cnote{font-size:12px;color:var(--muted);margin-top:4px}
.tabs{display:flex;gap:6px;overflow-x:auto}
.tabs button{flex:0 0 auto;border:0;border-radius:10px 10px 0 0;padding:8px 14px;font-size:15px;background:#2a5c8a;color:#dfe9f3}
.tabs button.on{background:var(--paper);color:var(--ink);font-weight:600}
#map{height:42vh;min-height:250px;flex:0 0 auto}
.mapbtns{position:absolute;right:10px;top:10px;z-index:900;display:flex;flex-direction:column;gap:6px}
.mapbtns button{border:0;border-radius:10px;padding:8px 10px;font-size:14px;background:#fff;box-shadow:0 1px 5px rgba(0,0,0,.3)}
.mapbtns button.on{background:var(--blue);color:#fff}
.locbtn{position:absolute;right:12px;bottom:14px;z-index:900;width:56px;height:56px;border-radius:50%;border:0;background:#fff;color:#1a73e8;font-size:30px;line-height:56px;box-shadow:0 2px 8px rgba(0,0,0,.35)}
.locbtn.on{background:#1a73e8;color:#fff}
#mapwrap{position:relative}
#list{flex:1 1 auto;overflow-y:auto;padding:8px 10px 120px}
.daytitle{font-weight:600;margin:6px 2px 8px;color:var(--ochre)}
.step{display:flex;gap:10px;background:#fff;border:1px solid var(--line);border-radius:12px;padding:10px;margin-bottom:8px}
.step{cursor:pointer}
.step.cur{border-color:var(--blue);box-shadow:0 0 0 2px rgba(42,92,138,.25);background:#f2f7fc}
.step.done{opacity:.55}
.badge{flex:0 0 34px;height:34px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:700;font-size:15px}
.k-money{background:#2e7d32} .k-shop{background:#ad5f00} .k-atm{background:#455a64}
.k-audio{background:var(--ochre)} .k-food{background:#7a4b9c} .k-ferry{background:#555} .k-move{background:#888} .k-hotel{background:#2a8a5c} .k-kids{background:#1f8a9e} .k-walk{background:#5d7b2f} .k-love{background:var(--love)}
.body{flex:1;min-width:0}
.time{font-size:13px;color:var(--muted)}
.ttl{font-weight:600;margin:1px 0 3px}
.txt{font-size:14.5px}
.kid{font-size:14px;background:#fff4e0;border-radius:8px;padding:5px 8px;margin-top:6px}
.acts{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.acts button,.acts a{border:1px solid var(--line);background:#f6f1e9;border-radius:8px;padding:6px 10px;font-size:14px;color:var(--ink);text-decoration:none}
.acts .play{background:var(--ochre);border-color:var(--ochre);color:#fff;font-weight:600}
.pin{border-radius:50%;width:28px;height:28px;display:flex;align-items:center;justify-content:center;color:#fff;font:bold 13px sans-serif;border:2px solid #fff;box-shadow:0 1px 4px rgba(0,0,0,.45)}
.pin.sel{transform:scale(1.25)}
.me{width:18px;height:18px;border-radius:50%;background:#1a73e8;border:3px solid #fff;box-shadow:0 0 0 2px rgba(26,115,232,.4)}
#player{position:fixed;left:0;right:0;bottom:0;z-index:1000;background:#1d3f61;color:#fff;padding:8px 12px calc(8px + env(safe-area-inset-bottom));display:none}
#player .row{display:flex;align-items:center;gap:10px}
#player button{border:0;background:#fff;color:#1d3f61;border-radius:50%;width:42px;height:42px;font-size:18px;flex:0 0 42px}
#ptitle{flex:1;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#pbar{height:4px;background:rgba(255,255,255,.25);border-radius:2px;margin-top:6px}
#pbar div{height:4px;background:var(--ochre);border-radius:2px;width:0}
#near{position:fixed;left:10px;right:10px;bottom:76px;z-index:1001;background:#fff;border:2px solid var(--ochre);border-radius:14px;padding:10px 12px;box-shadow:0 4px 14px rgba(0,0,0,.25);display:none}
#near .acts{margin-top:6px}
.allaudio .step{align-items:center}
.small{font-size:13px;color:var(--muted);margin:10px 2px}
#show{position:fixed;inset:0;z-index:3000;background:#000;color:#fff;display:none;overflow:hidden}
#show .bg{position:absolute;inset:0;opacity:0;transition:opacity 1s}
#show .bg.on{opacity:1}
#show .bg .blur{position:absolute;inset:-40px;background-size:cover;background-position:center;filter:blur(26px) brightness(.5)}
#show .bg img{position:absolute;left:0;top:0;width:100%;height:100%;object-fit:contain}
#show .bg.on img{animation:kb var(--d,15s) ease-in-out forwards}
@keyframes kb{from{transform:scale(1)}to{transform:scale(1.08)}}
#show video#vbg{position:absolute;left:0;top:0;width:100%;height:100%;object-fit:contain;opacity:0;transition:opacity .8s;background:transparent}
#show video#vbg.on{opacity:1}
#show .shade{position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,.55) 0,rgba(0,0,0,0) 22%,rgba(0,0,0,0) 50%,rgba(0,0,0,.8) 100%)}
#show .bars{position:absolute;top:calc(8px + env(safe-area-inset-top));left:8px;right:8px;display:flex;gap:3px}
#show .bars i{flex:1;height:3px;background:rgba(255,255,255,.3);border-radius:2px;overflow:hidden}
#show .bars i b{display:block;height:100%;width:0;background:#fff}
#show .top{position:absolute;top:calc(18px + env(safe-area-inset-top));left:12px;right:12px;display:flex;align-items:center;gap:8px;font-size:14px;z-index:6}
#show .top .t{flex:1;opacity:.9;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#show .top button{border:0;background:rgba(0,0,0,.45);color:#fff;border-radius:50%;width:44px;height:44px;font-size:20px}
#show .big{position:absolute;left:0;right:0;top:30%;text-align:center;font-weight:800;font-size:min(16vw,84px);text-shadow:0 3px 18px rgba(0,0,0,.7);opacity:0;transform:translateY(12px);transition:all .8s}
#show .big.on{opacity:1;transform:none}
#show .cap{position:absolute;left:14px;right:14px;bottom:calc(150px + env(safe-area-inset-bottom));font-size:21px;font-weight:700;line-height:1.25;text-shadow:0 2px 10px rgba(0,0,0,.8)}
#show .sub{position:absolute;left:12px;max-width:62%;top:calc(62px + env(safe-area-inset-top));font-size:12px;opacity:.85;max-height:32px;overflow:hidden;text-shadow:0 1px 6px rgba(0,0,0,.9);z-index:3}
#show .subs{position:absolute;left:10px;right:10px;bottom:calc(60px + env(safe-area-inset-bottom));z-index:4;text-align:center;pointer-events:none}
#show .subs span{display:inline-block;background:rgba(0,0,0,.62);color:#fff;font-size:15px;line-height:1.35;padding:5px 10px;border-radius:8px;max-width:100%}
#psub{font-size:13px;opacity:.9;margin-top:5px;min-height:18px;line-height:1.3}
#show .cred{position:absolute;right:10px;top:calc(62px + env(safe-area-inset-top));font-size:10px;opacity:.55;max-width:34%;text-align:right;z-index:3}
#show .ctl{position:absolute;left:0;right:0;bottom:calc(6px + env(safe-area-inset-bottom));display:flex;justify-content:center;gap:22px;z-index:6}
#show .ctl button{border:0;background:rgba(255,255,255,.18);color:#fff;border-radius:50%;width:44px;height:44px;font-size:18px}
#show .tapl,#show .tapr{position:absolute;top:calc(120px + env(safe-area-inset-top));bottom:calc(200px + env(safe-area-inset-bottom));width:30%;z-index:2}
#show .tapl{left:0} #show .tapr{right:0}
#show .chapter{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;background:rgba(0,0,0,.45);font-size:30px;font-weight:800;padding:20px;opacity:0;transition:opacity .8s;pointer-events:none}
#show .chapter.on{opacity:1}
#show .chapter small{font-size:15px;font-weight:500;opacity:.8;margin-top:10px}
.thumbs{display:flex;gap:6px;overflow-x:auto;margin-top:8px}
.thumbs img{height:70px;border-radius:8px;flex:0 0 auto}
.film{background:linear-gradient(135deg,#1d3f61,#2a5c8a);color:#fff;border:0}
.film .txt,.film .time{color:#e6eef6}
.acts .watch{background:#1d3f61;border-color:#1d3f61;color:#fff;font-weight:600}
</style></head><body>
<header><div style="display:flex;align-items:center;gap:8px"><h1 style="flex:1">Колония-дель-Сакраменто · 5–7 ноября</h1><button id="bcalc" class="calcbtn">💱 Курс</button></div>
<div id="calc"><div class="crow"><label>🇺🇾 Песо Уругвая</label><input id="c_uyu" inputmode="decimal" value="1000"></div>
<div class="crow"><label>🇺🇸 Доллары</label><input id="c_usd" inputmode="decimal"></div>
<div class="crow"><label>🇷🇺 Рубли</label><input id="c_rub" inputmode="decimal"></div>
<div class="crow"><label>🇦🇷 Песо Аргентины</label><input id="c_ars" inputmode="decimal"></div>
<div class="cnote" id="cnote"></div></div>
<div class="tabs" id="tabs"></div></header>
<div id="mapwrap"><div id="map"></div>
<button id="bme2" class="locbtn" title="Где я">◎</button>
<div class="mapbtns"><button id="bme">◎ Где я</button><button id="bhotel">⌂ Мой отель</button><button id="boff">⇩ Офлайн</button></div></div>
<div id="list"></div>
<div id="near"></div>
<div id="show"><div class="bg" id="bg1"><div class="blur"></div><img alt=""></div><div class="bg" id="bg2"><div class="blur"></div><img alt=""></div><video id="vbg" muted loop playsinline preload="none"></video><div class="shade"></div><div class="chapter" id="chap"></div><div class="big" id="big"></div>
<div class="bars" id="bars"></div><div class="top"><div class="t" id="stitle"></div><button id="sclose">✕</button></div>
<div class="cap" id="cap"></div><div class="sub" id="sub"></div><div class="subs" id="subs"></div><div class="cred" id="cred"></div>
<div class="tapl" id="tapl"></div><div class="tapr" id="tapr"></div>
<div class="ctl"><button id="sprev">⏮</button><button id="splay">❚❚</button><button id="snext">⏭</button></div></div>
<div id="player"><div class="row"><button id="pp">▶</button><div id="ptitle"></div><button id="px" style="width:32px;height:32px;flex-basis:32px;font-size:14px">✕</button></div><div id="psub"></div><div id="pbar"><div></div></div></div>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
const DATA={"pres": {"intro": {"title": "Добро пожаловать в Колонию", "kid": "Слушай внимательно: на каждой остановке тебя ждёт задание.", "segs": [{"audio": "pres/intro-01.mp3", "text": "Добро пожаловать в Колонию-дель-Сакраменто, самый старый город Уругвая. Сегодня здесь живёт около тридцати двух тысяч человек. Если вы приплыли на пароме из Буэнос-Айреса, а он идёт сюда примерно полтора часа, то только что пересекли реку Ла-Плата. Её называют самой широкой рекой мира: в самом широком месте от берега до берега больше двухсот километров. Поэтому с набережной кажется, что перед вами море. А теперь послушайте, как здесь появился город.", "caption": "Колония-дель-Сакраменто: самый старый город Уругвая", "big": "самый старый", "imgs": [{"src": "img/ferry_boats-2.jpg", "cap": "Паром Buquebus у пирса в Колонии: через несколько часов он отправится в Буэнос-Айрес", "credit": "Jaan-Cornelius K. from Buenos Aires, Argentina, CC BY-SA 2.0"}, {"src": "img/ferry_river-1.jpg", "cap": "Из космоса: Ла-Плата — огромный коричневый залив шириной до 270 км, Колония — посередине между Буэнос-Айресом и Монтевидео", "credit": "Earth Sciences and Image Analysis Laboratory, NASA Johnson Space Center, Public domain"}, {"src": "img/intro-2.jpg", "cap": "Колония с высоты: старый город — на узком мысе, который вдаётся в реку", "credit": "Germanramos, CC BY-SA 4.0"}], "img": "img/ferry_boats-2.jpg", "credit": "Jaan-Cornelius K. from Buenos Aires, Argentina, CC BY-SA 2.0"}, {"audio": "pres/intro-02.mp3", "text": "В январе тысяча шестьсот восьмидесятого года к острову Сан-Габриэль подошли корабли португальского командира Мануэла Лобу. С ним было около четырёхсот солдат и восемнадцать пушек. Они назвали своё поселение Новой колонией Святейшего Таинства, отсюда и имя города. Крепость построили на берегу, прямо напротив Буэнос-Айреса, а Буэнос-Айрес принадлежал Испании. Это было смелое и очень хитрое решение. Испания не разрешала чужакам торговать в своих колониях, а отсюда, через реку, можно было возить товары в обход запретов. Купцы из Рио-де-Жанейро помогли собрать эту экспедицию, потому что ждали хорошей прибыли. Колония быстро стала городом контрабандистов.", "caption": "Январь 1680: Мануэл Лобу основал крепость напротив Буэнос-Айреса", "big": "1680", "imgs": [{"src": "img/a_intro-1.jpg", "cap": "Плитка-азулежу: португальцы основывают Колонию, 1680 год", "credit": "Fulviusbsas, CC BY-SA 3.0"}, {"src": "img/a_intro-2.jpg", "cap": "Португальский галеон XVII века: чертёж из книги 1616 года", "credit": "Manuel Fernandes, CC0"}, {"src": "img/a_intro-3.jpg", "cap": "Бухта Рио-де-Жанейро: отсюда купцы снаряжали поход Лобу (рисунок XIX в.)", "credit": "Jean Baptiste Debret, Public domain"}], "img": "img/a_intro-1.jpg", "credit": "Fulviusbsas, CC BY-SA 3.0"}, {"audio": "pres/intro-03.mp3", "text": "Испанцам это очень не понравилось. Седьмого августа того же года войско из Буэнос-Айреса, испанцы и около трёх тысяч индейцев-гуарани, взяло крепость. Её переименовали в Форт-дель-Росарио. Лобу попал в плен и умер в Буэнос-Айресе. Но по договору город всё равно вернули португальцам, и всё началось сначала.", "caption": "7 августа 1680: испанцы взяли крепость, Лобу попал в плен", "big": "7 августа", "imgs": [{"src": "img/a_intro-4.jpg", "cap": "Старый форт Буэнос-Айреса — испанская крепость на том берегу реки", "credit": "Unknown author, Public domain"}, {"src": "img/a_intro-5.jpg", "cap": "Испанские солдаты XVII века: мушкетёры, пикинёр и знаменосец", "credit": "Serafín María de Sotto, Conde de Clonard, Public domain"}, {"src": "img/a_intro-6.jpg", "cap": "Индейцы-гуарани, служившие артиллеристами (литография Ж.-Б. Дебре)", "credit": "Arquivo Nacional do Brasil, Public domain"}], "img": "img/a_intro-4.jpg", "credit": "Unknown author, Public domain"}, {"audio": "pres/intro-04.mp3", "text": "Дальше почти сто лет шло перетягивание каната. Испанцы осаждали Колонию, португальцы возвращались. Одна осада тянулась почти два года. По договору тысяча семьсот пятидесятого года город собирались отдать Испании, но договор так и не выполнили. В тысяча семьсот шестьдесят втором году испанцы снова взяли Колонию, а по мирному договору её опять вернули Португалии. Окончательно город стал испанским в тысяча семьсот семьдесят седьмом году. В тысяча восемьсот седьмом году сюда на время вошли англичане, потом пришли португальско-бразильские войска. А в тысяча восемьсот двадцать восьмом году Колония вошла в состав нового государства Уругвай.", "caption": "Почти сто лет город переходил из рук в руки: до 1828 года", "big": "1680 → 1828", "imgs": [{"src": "img/a_intro-7.jpg", "cap": "Мадридский договор 1750 года: титул печатного издания", "credit": "Oficina de José da Costa Coimbra (printer), Public domain"}, {"src": "img/a_intro-8.jpg", "cap": "Англичане атакуют Буэнос-Айрес, 1806–1807 год (старая картина)", "credit": "Madrid Martínez, Public domain"}, {"src": "img/a_intro-9.jpg", "cap": "Присяга первой конституции Уругвая, 1830 год (эскиз Бланеса)", "credit": "Juan Manuel Blanes, Public domain"}], "img": "img/a_intro-7.jpg", "credit": "Oficina de José da Costa Coimbra (printer), Public domain"}, {"audio": "pres/intro-05.mp3", "text": "Старый квартал совсем небольшой, меньше двадцати гектаров. Зато из-за такой судьбы он получился необычным. Португальцы подгоняли улицы под рельеф, и они вышли узкими и неровными. Чарльз Дарвин, побывав здесь в начале тридцатых годов девятнадцатого века, записал, что неправильность улиц и рощи старых апельсиновых и персиковых деревьев придают городу милый вид. Об этом мы ещё поговорим у ворот.", "caption": "Кривые португальские улочки: Дарвин назвал их милыми", "big": "", "imgs": [{"src": "img/a_intro-10.jpg", "cap": "Чарльз Дарвин в молодости (портрет Дж. Ричмонда)", "credit": "George Richmond, Public domain"}, {"src": "img/a_intro-11.jpg", "cap": "Корабль «Бигль», на котором плавал Дарвин (акварель Конрада Мартенса)", "credit": "Conrad Martens, Public domain"}, {"src": "img/intro-4.jpg", "cap": "Улочка старого города, включённого в список ЮНЕСКО: булыжник, кафе и пальмы", "credit": "Embajada de los Estados Unidos en Uruguay from Montevideo, Uruguay, Public domain"}], "img": "img/a_intro-10.jpg", "credit": "George Richmond, Public domain"}, {"audio": "pres/intro-06.mp3", "text": "К середине двадцатого века от крепостной стены почти ничего не осталось. В тысяча девятьсот шестьдесят восьмом году президент Уругвая подписал указ, с которого началось восстановление старого квартала. Заново поднялись стена и ворота, открылись музеи. А в тысяча девятьсот девяносто пятом году квартал внесли в список Всемирного наследия ЮНЕСКО. Там отметили, что план города подстроен под местность и не повторяет правил, по которым Испания строила свои колониальные города.", "caption": "1968: восстановление квартала. 1995: список ЮНЕСКО", "big": "1995", "imgs": [{"src": "img/a_intro-12.jpg", "cap": "Старая фотография Колонии с берега — город до восстановления", "credit": "Dornaleche y Reyes (printer), Public domain"}, {"src": "img/a_intro-13.jpg", "cap": "Старая фотография: маяк и руины монастыря среди пустыря", "credit": "Unknown author (Uruguay, copy of an old photograph), Public domain"}, {"src": "img/a_intro-14.jpg", "cap": "Табличка ЮНЕСКО на стене: старый квартал — Всемирное наследие", "credit": "Ezarate, CC BY-SA 3.0"}], "img": "img/a_intro-12.jpg", "credit": "Dornaleche y Reyes (printer), Public domain"}, {"audio": "pres/intro-07.mp3", "text": "Наша прогулка начнётся у старых городских ворот. Мы пройдём по улице Вздохов, постоим на главной площади, посмотрим на маяк, на реку и на остров, встретим закат на мысу, а закончим у самой старой церкви Уругвая. И вот что важно для самого юного путешественника: на каждой остановке тебя ждёт задание. Слушай внимательно!", "caption": "Маршрут: ворота, улица Вздохов, площадь, маяк, набережная, закат, церковь", "big": "", "imgs": [{"src": "img/a_intro-15.jpg", "cap": "Плитка-азулежу с картой Колонии 1762 года: стены, улицы, река", "credit": "Heretiq, CC BY-SA 3.0"}, {"src": "img/porton-1.jpg", "cap": "Главные ворота старого города — Портон-де-Кампо: арка, мост через ров и крепостная стена", "credit": "Liam Quinn from Canada, CC BY-SA 2.0"}, {"src": "img/basilica-1.jpg", "cap": "Базилика Святейшего Причастия: две белые колокольни — посмотрите, какие на них часы", "credit": "Carlos E. Gonzalez, CC BY-SA 3.0"}], "img": "img/a_intro-15.jpg", "credit": "Heretiq, CC BY-SA 3.0"}]}, "porton": {"title": "Ворота Портон-де-Кампо", "kid": "Представь, что ты стражник. Найди ров и мост. Как думаешь, зачем мост делали подъёмным? И найди самый большой камень в стене.", "segs": [{"audio": "pres/porton-01.mp3", "text": "Перед вами ворота Портон-де-Кампо, главный вход в старый город. Посмотрите вперёд, на толстую каменную стену. Потом вниз: перед воротами тянется ров, а над ним переброшен деревянный подъёмный мост. Эти ворота называют ещё Пуэрта-де-ла-Сьюдаделья, воротами цитадели. Через них из крепости выходили в поле, а враги, наоборот, мечтали пройти внутрь. От ворот стена уходит к реке, вдоль улицы Пасео-де-Сан-Мигель, а на травянистом берегу у её подножия удобно отдохнуть.", "caption": "Портон-де-Кампо: ворота, ров и деревянный подъёмный мост", "big": "", "imgs": [{"src": "img/a_porton-1.jpg", "cap": "Ворота Портон-де-Кампо: деревянный подъёмный мост над рвом", "credit": "Profemate, CC BY-SA 3.0"}, {"src": "img/porton-2.jpg", "cap": "Ворота и деревянный подъёмный мост снаружи: стена из дикого камня и ров, заросший травой", "credit": "Photograph by Mike Peel (www.mikepeel.net), CC BY-SA 4.0"}, {"src": "img/porton-1.jpg", "cap": "Главные ворота старого города — Портон-де-Кампо: арка, мост через ров и крепостная стена", "credit": "Liam Quinn from Canada, CC BY-SA 2.0"}], "img": "img/a_porton-1.jpg", "credit": "Profemate, CC BY-SA 3.0"}, {"audio": "pres/porton-02.mp3", "text": "Построили их примерно в тысяча семьсот сорок пятом году, при португальском губернаторе Антониу Педру ди Васконселуше. Он управлял Колонией с тысяча семьсот двадцать второго года и сделал её самым богатым и самым укреплённым городом на берегах Ла-Платы. И укрепления ему пригодились.", "caption": "Примерно 1745 год: ворота при губернаторе Васконселуше", "big": "1745", "imgs": [{"src": "img/a_porton-2.jpg", "cap": "Король Португалии Жуан V, при котором укрепляли Колонию (портрет)", "credit": "Attributed to Pompeo Batoni, Public domain"}, {"src": "img/a_porton-3.jpg", "cap": "Португальские пехотинцы 1730-х годов: синие мундиры, алебарда", "credit": "Unknown author, CC0"}, {"src": "img/a_porton-4.jpg", "cap": "Португальская карта Колонии 1731 года: кварталы, бастионы, поля", "credit": "Diogo Soares, Public domain"}], "img": "img/a_porton-2.jpg", "credit": "Attributed to Pompeo Batoni, Public domain"}, {"audio": "pres/porton-03.mp3", "text": "В тысяча семьсот тридцать пятом году к городу подошла испанская армия из Буэнос-Айреса. Её вёл губернатор Мигель де Сальседо. Четыре тысячи триста человек, из них три тысячи индейцев-гуарани, против восьмисот сорока защитников крепости. Девятого декабря испанцы обрушили на стены две тысячи четыреста сорок ядер и шестьдесят шесть бомб и пробили брешь. Но все атаки через неё отбили. Осада тянулась почти два года и кончилась только тогда, когда из Европы приплыл корабль с вестью о перемирии.", "caption": "1735–1737: осада почти в два года, 840 защитников против 4300", "big": "почти 2 года", "imgs": [{"src": "img/a_porton-5.jpg", "cap": "План Колонии 1737 года: звёздообразная крепость с бастионами", "credit": "Unknown author, Public domain"}, {"src": "img/a_porton-6.jpg", "cap": "Иезуитская миссия и индейские всадники (рисунок XVIII века)", "credit": "Florian Paucke, Public domain"}, {"src": "img/a_porton-7.jpg", "cap": "Пирамида каменных ядер: тысячи таких ядер летели в стену", "credit": "George Chernilevsky, CC BY 4.0"}], "img": "img/a_porton-5.jpg", "credit": "Unknown author, Public domain"}, {"audio": "pres/porton-04.mp3", "text": "Прошло двадцать семь лет, и осенью тысяча семьсот шестьдесят второго года под стенами встал генерал Педро де Севальос. С ним было около двух тысяч семисот солдат и обоз из ста тринадцати повозок с тяжёлыми пушками, пришедший по суше из Монтевидео. Осада длилась пять недель. К двадцатому октября в стене было уже два пролома. Раненый португальский командир Висенте да Силва да Фонсека не стал ждать штурма и начал переговоры. Гарнизон вышел из города с воинскими почестями, а вместе с ним вышли тысяча шестьсот жителей.", "caption": "1762: пять недель осады, два пролома, сдача города", "big": "5 недель", "imgs": [{"src": "img/intro-3.jpg", "cap": "Педро де Севальос — испанский генерал, который брал Колонию штурмом", "credit": "Unknown author, Public domain"}, {"src": "img/a_porton-8.jpg", "cap": "Возчик с огромной повозкой-каретой, Рио-де-ла-Плата (рисунок Ругендаса)", "credit": "Johann Moritz Rugendas, Public domain"}, {"src": "img/a_porton-9.jpg", "cap": "Португальская пехота и испанская лёгкая кавалерия, 1762 год", "credit": "Paul Fischer, Public domain"}], "img": "img/intro-3.jpg", "credit": "Unknown author, Public domain"}, {"audio": "pres/porton-05.mp3", "text": "В тысяча семьсот семьдесят седьмом году испанцы разобрали большую часть стен. Так что стена, которую вы видите, почти целиком восстановлена. Работы шли после тысяча девятьсот шестьдесят восьмого года, и ворота тоже собрали заново, частью из старых камней, частью из новых. С тысяча девятьсот семьдесят шестого года стена, ров и ворота охраняются государством как национальный памятник.", "caption": "Стену разобрали в 1777-м, восстановили после 1968 года", "big": "1968", "imgs": [{"src": "img/a_porton-10.jpg", "cap": "План Колонии после захвата испанцами, 1777 год", "credit": "Unknown author, Public domain"}, {"src": "img/porton-3.jpg", "cap": "Крепостная стена над рекой: на бастионе стоит старинная пушка, за ней — Ла-Плата", "credit": "Liam Quinn from Canada, CC BY-SA 2.0"}, {"src": "img/a_porton-11.jpg", "cap": "Каменная арка в крепостной стене, рядом памятные таблички", "credit": "Pau Vairoletti, CC BY-SA 3.0"}], "img": "img/a_porton-10.jpg", "credit": "Unknown author, Public domain"}, {"audio": "pres/porton-06.mp3", "text": "И ещё одна любопытная деталь. Постойте у ворот и сравните два города. Внутри стен улочки узкие и кривые: португальцы подгоняли их под рельеф. А за линией бывшей стены кварталы расчерчены ровно, как клетки в тетради: так строили испанцы. Два разных города стоят вплотную друг к другу.", "caption": "Два города рядом: кривые улочки и ровные испанские кварталы", "big": "2 города", "imgs": [{"src": "img/intro-2.jpg", "cap": "Колония с высоты: старый город — на узком мысе, который вдаётся в реку", "credit": "Germanramos, CC BY-SA 4.0"}, {"src": "img/a_porton-12.jpg", "cap": "План Буэнос-Айреса 1801 года: ровная сетка кварталов, как в тетради", "credit": "Martín Boneo y Villalonga, Public domain"}, {"src": "img/a_porton-13.jpg", "cap": "План Монтевидео: испанский город «по клеточкам» внутри стен", "credit": "Unknown author (Bibliothèque nationale de France), Public domain"}], "img": "img/intro-2.jpg", "credit": "Germanramos, CC BY-SA 4.0"}, {"audio": "pres/porton-07.mp3", "text": "Задание для юного путешественника: представь, что ты стражник на воротах. Найди ров и мост. Как думаешь, зачем мост сделали подъёмным? А потом найди в стене самый большой камень. Взрослым вопрос: почему в крепости кривые улочки могли быть удобнее прямых? Рядом с воротами есть детская площадка, так что после задания можно побегать.", "caption": "Задание: стражник на воротах. Найди ров и мост. Зачем мост подъёмный?", "big": "Задание", "imgs": [{"src": "img/a_porton-14.jpg", "cap": "Подъёмный мост над рвом (замок Хивер, Англия): как в сказке про рыцарей", "credit": "Martinvl, CC BY 4.0"}, {"src": "img/a_porton-15.jpg", "cap": "Старая пушка выглядывает из бойницы в стене бастиона", "credit": "Emilianodesing, CC BY-SA 3.0"}], "img": "img/a_porton-14.jpg", "credit": "Martinvl, CC BY 4.0"}]}, "suspiros": {"title": "Улица Вздохов", "kid": "Встань в желобок посередине улицы. Куда побежит вода, если пойдёт дождь: вверх или вниз, к реке? Потом передай маме «телеграмму»: коротко «ти», долго «таа».", "segs": [{"audio": "pres/suspiros-01.mp3", "text": "Вы на Калье-де-лос-Суспирос, на улице Вздохов. Она начинается от главной площади и спускается к реке. Вместе с воротами Портон-де-Кампо её считают одним из самых характерных мест квартала. Остановитесь и посмотрите под ноги. Улица узкая, по ней ходят пешком. Мостовая выложена камнями-клиньями, тротуаров нет, а с обеих сторон она слегка наклонена к середине. Там получается желобок, по которому после дождя стекает вода. Теперь поднимите глаза. На стене табличка с названием улицы из португальской глазурованной плитки, она называется азулежу, а рядом висят фонари.", "caption": "Калье-де-лос-Суспирос: мостовая с желобом посередине", "big": "", "imgs": [{"src": "img/a_suspiros-1.jpg", "cap": "Табличка «Улица Вздохов» из португальской плитки азулежу", "credit": "Kved, CC BY-SA 3.0"}, {"src": "img/a_suspiros-2.jpg", "cap": "Уличные фонари на стене старого дома", "credit": "CHITANAOPANO, CC BY-SA 4.0"}, {"src": "img/a_suspiros-3.jpg", "cap": "Мостовая из камней-клиньев, по бокам пологий уклон к середине", "credit": "Carlos daniel castro, CC BY-SA 3.0"}], "img": "img/a_suspiros-1.jpg", "credit": "Kved, CC BY-SA 3.0"}, {"audio": "pres/suspiros-02.mp3", "text": "Дома вдоль улицы построили в первой половине восемнадцатого века. Стены каменные, крыши черепичные, а двери и окна маленькие и деревянные. Внутри, по описаниям, полы керамические. Присмотритесь к крышам: у всех они двускатные. Раньше встречались и трёхскатные, и четырёхскатные, но сохранились только двускатные. Эта улица одна из немногих, которые остались почти такими, какими были.", "caption": "Дома первой половины XVIII века, у всех крыши двускатные", "big": "XVIII век", "imgs": [{"src": "img/suspiros-1.jpg", "cap": "Улица Вздохов: булыжная мостовая и старые домики с облупившейся розовой штукатуркой", "credit": "Fredlyfish4, CC BY-SA 4.0"}, {"src": "img/a_suspiros-4.jpg", "cap": "Улица Вздохов: каменные дома с красной штукатуркой", "credit": "Fabio Mincarelli Monfrin, CC BY 2.0"}, {"src": "img/a_suspiros-5.jpg", "cap": "Угол Суспирос и Сан-Педро: черепичная крыша, фонарь, таблички", "credit": "Ypsilon from Finland, CC0"}], "img": "img/suspiros-1.jpg", "credit": "Fredlyfish4, CC BY-SA 4.0"}, {"audio": "pres/suspiros-03.mp3", "text": "Почему же она улица Вздохов? Точно не знает никто. До тысяча девятьсот сороковых годов она называлась Ансина. Зато есть три легенды. Говорят, здесь стояли таверны, куда после долгих плаваний приходили и португальские, и испанские моряки, и они вздыхали по местным красавицам. По другой легенде, по этой улице к реке вели приговорённых, и они вздыхали в последний раз. А по третьей, самой романтичной, в лунную ночь здесь ждала возлюбленного девушка, но эта история кончилась печально. Выбирайте ту, что вам больше нравится.", "caption": "Откуда имя? Три легенды о вздохах", "big": "3 легенды", "imgs": [{"src": "img/a_suspiros-6.jpg", "cap": "Лунная ночь над гаванью (картина): так ждали на берегу возлюбленных", "credit": "Julius Paulsen, Public domain"}, {"src": "img/a_suspiros-7.jpg", "cap": "Старая улочка Колонии вечером: свет фонарей и булыжник", "credit": "Flc1980, CC BY-SA 3.0"}, {"src": "img/suspiros-3.jpg", "cap": "Нижний конец улицы Вздохов: цветущая бугенвиллея, и в конце улицы — река", "credit": "Diego Delso, CC BY-SA 3.0"}], "img": "img/a_suspiros-6.jpg", "credit": "Julius Paulsen, Public domain"}, {"audio": "pres/suspiros-04.mp3", "text": "А теперь история настоящая. На углу с улицей Сан-Педро стоит дом в португальском стиле, номер сто сорок два. Здесь работала телеграфная компания «Ривер-Плейт Телеграф». В октябре тысяча восемьсот шестьдесят шестого года британская фирма проложила по дну Ла-Платы кабель от Колонии до Пунта-Лара на аргентинском берегу, больше сорока километров. Это был первый телеграфный кабель Южной Америки. Телеграф похож на письмо, только оно бежит по проводу и очень быстро. По кабелю бежали короткие и длинные сигналы, а с ними деловые вести с того берега. Второй конец кабеля прятался в хлипком домике на берегу Пунта-Лара. В тысяча восемьсот семьдесят четвёртом году компанию купила другая, «Вестерн Телеграф». Часть этого кабеля работала до тысяча девятьсот семидесятого года. А историю телеграфа рассказывает небольшой музей на улице Дель-Колехио, детям там обычно интересно.", "caption": "1866: первый телеграфный кабель Южной Америки, Колония – Пунта-Лара", "big": "1866", "imgs": [{"src": "img/a_suspiros-8.jpg", "cap": "Атлантический кабель: пароход «Грейт Истерн» и телеграфисты (1865)", "credit": "Edward Forbes (artist), Public domain"}, {"src": "img/a_suspiros-9.jpg", "cap": "Кабель проложен: «Грейт Истерн» и люди, которые его строили (1866)", "credit": "Edward Forbes (artist), Public domain"}, {"src": "img/a_suspiros-10.jpg", "cap": "Карта подводного телеграфа: по дну океана от берега к берегу", "credit": "Unknown author, Public domain"}], "img": "img/a_suspiros-8.jpg", "credit": "Edward Forbes (artist), Public domain"}, {"audio": "pres/suspiros-05.mp3", "text": "Задание для юного путешественника: встань в желобок посередине улицы. Если пойдёт дождь, куда побежит вода: вверх или вниз, к реке? А потом сыграем в телеграф. Скажи один раз коротко «ти», а потом долго «таа», и пусть мама или папа повторят. Это и есть сигналы, которые бежали по кабелю. Взрослым вопрос: какая из трёх легенд нравится вам больше всех?", "caption": "Задание: встань в желобок. Куда побежит дождевая вода?", "big": "Задание", "imgs": [{"src": "img/suspiros-2.jpg", "cap": "Улица Вздохов в сторону главной площади: булыжная мостовая и старые стены розового и серого цвета", "credit": "Ypsilon from Finland, CC0"}, {"src": "img/a_suspiros-3.jpg", "cap": "Мостовая из камней-клиньев, по бокам пологий уклон к середине", "credit": "Carlos daniel castro, CC BY-SA 3.0"}, {"src": "img/a_suspiros-11.jpg", "cap": "Азбука Морзе: короткие точки и длинные тире", "credit": "Rhey T. Snodgrass and Victor F. Camp, Public domain"}], "img": "img/suspiros-2.jpg", "credit": "Ypsilon from Finland, CC0"}]}, "plaza": {"title": "Пласа-Майор и музеи", "kid": "Сосчитай деревья на площади. А в музее найди старинную карту и покажи на ней реку.", "segs": [{"audio": "pres/plaza-01.mp3", "text": "Вы на Пласа-Майор, главной площади старого города. Оглядитесь. Площадь обсажена деревьями, вокруг стоят старые португальские дома, а в дальнем углу из руин монастыря вырастает маяк, к нему мы пойдём дальше. Здесь же, в нескольких шагах, три небольших музея: Эспасио Ребуффо и Вивьенда-Португеса на улице Дель-Комерсио и Эспасио Португес напротив площади. Заходить необязательно, но заглянуть в дверь стоит. Билеты в музеи продают только в Эспасио Ребуффо, а дни работы у музеев разные, расписание смотрите в приложении.", "caption": "Пласа-Майор: деревья, старые дома и маяк в углу", "big": "", "imgs": [{"src": "img/plaza-1.jpg", "cap": "Главная площадь 25 Мая: тенистый сад, а за деревьями — белый маяк", "credit": "Fulviusbsas, CC BY-SA 3.0"}, {"src": "img/plaza-2.jpg", "cap": "Старый каменный дом с зелёной дверью — Португальский музей", "credit": "Nicolas Barriola, CC BY-SA 3.0"}, {"src": "img/plaza-3.jpg", "cap": "Дом Накарелло: красные стены и черепичная крыша — совсем небольшой дом XVIII века", "credit": "Fulviusbsas, CC BY-SA 3.0"}], "img": "img/plaza-1.jpg", "credit": "Fulviusbsas, CC BY-SA 3.0"}, {"audio": "pres/plaza-02.mp3", "text": "Давайте представим эту площадь пустой. Такой она могла стать в тысяча семьсот пятом году, когда долгая осада кончилась. Жителей увезли на португальских кораблях, а испанский командир Алонсо де Вальдес-и-Инклан приказал снести укрепления. Город опустел. Лишь после Утрехтского договора, который вернул Колонию Португалии, сюда снова приплыли больше тысячи колонистов и начали всё заново.", "caption": "1705: город опустел. После Утрехтского договора вернулись колонисты", "big": "1705", "imgs": [{"src": "img/a_plaza-1.jpg", "cap": "Утрехтский договор 1713 года: испанский и английский тексты", "credit": "Unknown author (printed treaty, 1713), Public domain"}, {"src": "img/a_plaza-2.jpg", "cap": "Португальский парусный корабль — нао («Сан-Габриэл»)", "credit": "Anonymous (Álbum do Século), Public domain"}, {"src": "img/intro-1.jpg", "cap": "Старинный план крепости Колония-дель-Сакраменто: найдите стены, бастионы и улицы", "credit": "Franco. Rodrigz. y Cardoso (digitized by Bibliothèque nationale de France, Gallica), Public domain"}], "img": "img/a_plaza-1.jpg", "credit": "Unknown author (printed treaty, 1713), Public domain"}, {"audio": "pres/plaza-03.mp3", "text": "Правили городом португальские губернаторы. Их дом, Каса-де-лос-Гобернадорес, стоял у церкви, на другой площади, Пласа-де-Армас. Вместе с церковью это было главное здание города. От дома остались только фундаменты, их раскопали археологи в конце двадцатого века. Их можно увидеть рядом с базиликой. А находки из этого дома показывают в Португальском музее, рядом с мебелью, старинными картами, оружием и военной одеждой. Сам дом считается образцовым примером португальского жилья, так что можно заглянуть и в комнаты. Городские власти пишут, что музей очень интересен детям и всей семье.", "caption": "Каса-де-лос-Гобернадорес: от дома остались фундаменты", "big": "фундаменты", "imgs": [{"src": "img/a_plaza-3.jpg", "cap": "Фундаменты дома губернаторов: по ним видно, где стояли комнаты", "credit": "Heretiq, CC BY-SA 3.0"}, {"src": "img/a_plaza-4.jpg", "cap": "Зал Португальского музея: старинные кресла и плитка с портретом", "credit": "Fulviusbsas, CC BY-SA 3.0"}, {"src": "img/sangabriel-1.jpg", "cap": "Руины дома губернатора: низкие каменные стены прямо на траве — по ним видно, где были комнаты", "credit": "Photograph by Mike Peel (www.mikepeel.net), CC BY-SA 4.0"}], "img": "img/a_plaza-3.jpg", "credit": "Heretiq, CC BY-SA 3.0"}, {"audio": "pres/plaza-04.mp3", "text": "Эспасио Ребуффо назван в честь доктора Баутисты Ребуффо. Он основал музей Колонии и был его почётным директором. Этот зал открылся первым, в тысяча девятьсот пятьдесят первом году. Здесь рассказывают историю края от древних времён до наших дней, а вещи в залах принадлежали предкам нынешних жителей. А сам дом намного старше. Его построили в первой половине восемнадцатого века для португальских секретарей, как государственную контору. В разные времена в нём жили богатые горожане, работала больница, ютились многие семьи в одном доме и торговал магазин. Когда пришли испанцы, дом получил плоскую крышу и фасад в классическом стиле. Вот сколько жизней прожил один дом.", "caption": "Эспасио Ребуффо: первый музей города, 1951 год", "big": "1951", "imgs": [{"src": "img/a_plaza-5.jpg", "cap": "Здание Эспасио Ребуффо: белый фасад, у дверей старинные пушки", "credit": "Fernando Martello, CC BY-SA 3.0"}, {"src": "img/a_plaza-6.jpg", "cap": "Муниципальный музей Колонии на площади: белый дом под деревьями", "credit": "Fulviusbsas, CC BY-SA 3.0"}, {"src": "img/a_plaza-7.jpg", "cap": "Улочка у музея: белый дом с зелёными дверями за старым деревом", "credit": "Fulviusbsas, CC BY-SA 3.0"}], "img": "img/a_plaza-5.jpg", "credit": "Fernando Martello, CC BY-SA 3.0"}, {"audio": "pres/plaza-05.mp3", "text": "Рядом дом, который называют Вивьенда-Португеса или Каса-де-Накарелло. Он есть на планах города с тысяча семьсот тридцать второго года. Сохранились каменные стены и часть пола, а внутри показана повседневная жизнь по обычаям разных областей Португалии: Траз-уж-Монтиш, Миньу и Алентежу. Откуда имя Накарелло, мы надёжно не выяснили. Путеводители говорят, что так звали одного из хозяев.", "caption": "Вивьенда-Португеса: дом с плана 1732 года", "big": "1732", "imgs": [{"src": "img/a_plaza-8.jpg", "cap": "Внутри дома Накарелло: лавка, кувшин и простая мебель XVIII века", "credit": "Mx. Granger, CC0"}, {"src": "img/a_plaza-9.jpg", "cap": "Жители Алентежу, Португалия: старинная акварель, 1820-е", "credit": "Unknown author (c. 1820s, Picturesque Review of the Costume of the Portuguese), Public domain"}, {"src": "img/a_plaza-10.jpg", "cap": "Праздничный наряд северной Португалии (Миньо): платок и золотая серьга", "credit": "Feliciano Guimarães from Guimarães, Portugal, CC BY 2.0"}], "img": "img/a_plaza-8.jpg", "credit": "Mx. Granger, CC0"}, {"audio": "pres/plaza-06.mp3", "text": "Задание для юного путешественника: пока мы на площади, сосчитай деревья. А если зайдёте в Португальский музей, найди там старинную карту и покажи на ней реку. Взрослым вопрос: какую вещь из вашего дома вы хотели бы увидеть в музее через триста лет?", "caption": "Задание: посчитай деревья и найди в музее старинную карту", "big": "Задание", "imgs": [{"src": "img/a_plaza-11.jpg", "cap": "Площадь Мануэла Лобу: раскидистое дерево, за ним низкие руины", "credit": "TiziPro22, CC BY-SA 4.0"}, {"src": "img/a_plaza-12.jpg", "cap": "Португальский музей: на стенах старинные карты, найдите на них реку", "credit": "Profemate, CC BY-SA 3.0"}, {"src": "img/plaza-1.jpg", "cap": "Главная площадь 25 Мая: тенистый сад, а за деревьями — белый маяк", "credit": "Fulviusbsas, CC BY-SA 3.0"}], "img": "img/a_plaza-11.jpg", "credit": "TiziPro22, CC BY-SA 4.0"}]}, "faro": {"title": "Маяк и руины монастыря", "kid": "Где маяк квадратный, а где круглый? Найди наверху стеклянный фонарь и придумай историю про монаха из монастыря.", "segs": [{"audio": "pres/faro-01.mp3", "text": "Перед вами маяк и руины монастыря Сан-Франсиско, в юго-западном углу площади Пласа-Майор. Присмотритесь к самому маяку. Снизу у него каменное основание с четырьмя углами, то есть квадратное. А выше круглая белая башня, и на самом верху стеклянный фонарь, где горит огонь. Вокруг стоят остатки монастырских стен, и вместе со всем старым кварталом они находятся под охраной ЮНЕСКО. С тысяча девятьсот семьдесят шестого года и маяк, и руины охраняются государством как национальный памятник.", "caption": "Маяк на руинах монастыря: снизу квадрат, сверху круг", "big": "", "imgs": [{"src": "img/faro-1.jpg", "cap": "Белый маяк Колонии на фоне синего неба, рядом — руины монастыря", "credit": "Diego Delso, CC BY-SA 3.0"}, {"src": "img/a_faro-1.jpg", "cap": "Маяк с красно-белыми полосами и стены монастыря у подножия", "credit": "Embajada de los Estados Unidos en Uruguay, Public domain"}, {"src": "img/a_faro-2.jpg", "cap": "Маяк: внизу квадратное каменное основание, выше — круглая башня", "credit": "Heretiq, CC BY-SA 3.0"}], "img": "img/faro-1.jpg", "credit": "Diego Delso, CC BY-SA 3.0"}, {"audio": "pres/faro-02.mp3", "text": "Монастырь Сан-Франсиско-Хавьер, посвящённый святому Франциску Ксаверию, построили францисканцы в конце семнадцатого века. Когда-то здесь жили монахи. Потом случился большой пожар, и монастырь превратился в руины. Когда именно, источники спорят: называют тысяча семьсот четвёртый год и конец восемнадцатого века. Стены остались, а в середине девятнадцатого века на одной из старых монастырских башен вырос маяк. Поэтому у него и квадратное основание.", "caption": "Монастырь францисканцев XVII века: пожар и руины", "big": "XVII век", "imgs": [{"src": "img/a_faro-3.jpg", "cap": "Святой Франциск Ксаверий, в честь которого назван монастырь (картина)", "credit": "Unknown artist, Public domain"}, {"src": "img/a_faro-4.jpg", "cap": "Монах-францисканец сидит у креста (акварель XIX века)", "credit": "Alfred Diston, CC0"}, {"src": "img/a_faro-5.jpg", "cap": "Стены монастыря Сан-Франсиско и башня маяка над ними", "credit": "Huguitoportal, CC BY-SA 3.0"}], "img": "img/a_faro-3.jpg", "credit": "Unknown artist, Public domain"}, {"audio": "pres/faro-03.mp3", "text": "Строить его начали в тысяча восемьсот сорок пятом году солдаты армии Хуана Мануэля де Росаса, правителя Буэнос-Айреса, то есть соседа через реку. Потом началась долгая Великая война, как её называют в Уругвае, и работы встали. Их возобновили в тысяча восемьсот пятьдесят пятом году, а двадцать четвёртого января тысяча восемьсот пятьдесят седьмого года, при правлении Габриэля Перейры, маяк открыли. Всего на стройку ушло двенадцать лет.", "caption": "1845: начали строить. 24 января 1857: маяк открыт", "big": "1857", "imgs": [{"src": "img/a_faro-6.jpg", "cap": "Хуан Мануэль де Росас, правитель Буэнос-Айреса (портрет 1842 года)", "credit": "Raymond Monvoisin, Public domain"}, {"src": "img/a_faro-7.jpg", "cap": "Солдаты времён Великой войны у Монтевидео, 1844 год (рисунок)", "credit": "Museo Histórico Nacional (Argentina), after Doumic, CC BY-SA 4.0"}, {"src": "img/a_faro-8.jpg", "cap": "Габриэль Перейра, президент Уругвая в год открытия маяка (портрет)", "credit": "Eduardo D. Carbajal, Public domain"}], "img": "img/a_faro-6.jpg", "credit": "Raymond Monvoisin, Public domain"}, {"audio": "pres/faro-04.mp3", "text": "Деньги на достройку собрали необычным способом. Всем кораблям, которые заходили в порты Колонии и Монтевидео, ввели налог. Получается, что свет для моряков оплатили сами корабли. Сначала в лампе горел керосин. Потом его заменили ацетиленовым газом, а затем электричеством. А с тысяча девятьсот девяносто седьмого года маяк питают солнечные батареи, и он светит до сих пор. Его свет виден примерно за четырнадцать километров. Сегодня маяк принадлежит военно-морскому флоту Уругвая.", "caption": "Налог на корабли, керосин, электричество, солнечные батареи с 1997", "big": "1997", "imgs": [{"src": "img/a_faro-9.jpg", "cap": "Парусное торговое судно XVIII века идёт под всеми парусами (картина)", "credit": "Francis Holman, Public domain"}, {"src": "img/a_faro-10.jpg", "cap": "Ацетиленовая линза маяка в музее: работала с 1938 по 1997 год", "credit": "Mike Peel, CC BY-SA 4.0"}, {"src": "img/a_faro-11.jpg", "cap": "Старая фотография: маяк и низкие дома вокруг, без деревьев", "credit": "Unknown author (Uruguay, copy of an old photograph), Public domain"}], "img": "img/a_faro-9.jpg", "credit": "Francis Holman, Public domain"}, {"audio": "pres/faro-05.mp3", "text": "Городские власти пишут, что в этом каменном часовом спрятано много легенд. Ни одну из них мы не нашли в надёжных записях, поэтому пересказывать не будем. Зато у вас есть шанс придумать свою: кто жил в этом монастыре и что он видел с башни?", "caption": "Легенды маяка: придумайте свою", "big": "легенда", "imgs": [{"src": "img/a_faro-12.jpg", "cap": "Руины монастыря сверху, с маяка: видны стены комнат без крыши", "credit": "Heretiq, CC BY-SA 3.0"}, {"src": "img/faro-2.jpg", "cap": "Руины монастыря Сан-Франсиско: каменные стены с арками, а крыши давно нет", "credit": "Huguitoportal, CC BY-SA 3.0"}, {"src": "img/a_faro-4.jpg", "cap": "Монах-францисканец сидит у креста (акварель XIX века)", "credit": "Alfred Diston, CC0"}], "img": "img/a_faro-12.jpg", "credit": "Heretiq, CC BY-SA 3.0"}, {"audio": "pres/faro-06.mp3", "text": "Наверх ведут сто восемнадцать ступеней. Детей младше восьми лет туда не пускают, поэтому идите по очереди: один взрослый поднимается, а второй остаётся с детьми внизу. Говорят, сверху открывается невероятный вид на город и реку. А если вам интересны корабли, рядом есть военно-морской музей. Он рассказывает, почему этот маленький полуостров был таким важным.", "caption": "118 ступеней. Детей младше 8 лет наверх не пускают", "big": "118 ступеней", "imgs": [{"src": "img/a_faro-13.jpg", "cap": "Винтовая лестница маяка: по ней поднимаются сто восемнадцать ступеней", "credit": "Mike Peel, CC BY-SA 4.0"}, {"src": "img/a_faro-14.jpg", "cap": "Военно-морской музей Колонии: вход с жёлтым флагом", "credit": "Mx. Granger, CC0"}, {"src": "img/faro-3.jpg", "cap": "Маяк среди деревьев: на него можно подняться и посмотреть на город сверху", "credit": "Diego Delso, CC BY-SA 3.0"}], "img": "img/a_faro-13.jpg", "credit": "Mike Peel, CC BY-SA 4.0"}, {"audio": "pres/faro-07.mp3", "text": "Задание для юного путешественника: найди, где маяк квадратный, а где круглый. Найди наверху стеклянный фонарь, где по ночам горит огонь. А потом придумай историю про монаха, который жил в этом монастыре, и скажи, что выше: маяк или ближайший дом. Взрослым вопрос: почему маяк построили именно на старой башне?", "caption": "Задание: квадрат или круг? Найди стеклянный фонарь наверху", "big": "Задание", "imgs": [{"src": "img/a_faro-15.jpg", "cap": "Маяк на закате: башня с огнём на фоне оранжевого неба", "credit": "Huguitoportal, CC BY-SA 3.0"}, {"src": "img/faro-1.jpg", "cap": "Белый маяк Колонии на фоне синего неба, рядом — руины монастыря", "credit": "Diego Delso, CC BY-SA 3.0"}], "img": "img/a_faro-15.jpg", "credit": "Huguitoportal, CC BY-SA 3.0"}]}, "sangabriel": {"title": "Набережная Сан-Габриэль", "kid": "Найди вдали остров и помаши ему рукой. Сколько лодок и кораблей ты насчитал?", "segs": [{"audio": "pres/sangabriel-01.mp3", "text": "Вы на набережной Пасео-де-Сан-Габриэль, у самой воды. Посмотрите на реку. Далеко впереди лежит низкий остров с деревьями, это остров Сан-Габриэль. До него около трёх километров. Остров длиной примерно в километр, он занимает двадцать четыре гектара. Теперь оглянитесь на берег: мы стоим рядом с мысом Пунта-де-Сан-Педро, где португальцы построили бастион.", "caption": "Набережная Сан-Габриэль, вдали остров в трёх километрах", "big": "3 километра", "imgs": [{"src": "img/a_sangabriel-1.jpg", "cap": "Остров Сан-Габриэль — низкая зелёная полоска на горизонте", "credit": "Mx. Granger, CC0"}, {"src": "img/a_sangabriel-2.jpg", "cap": "Морская карта 1762 года: берег у Колонии и острова напротив города", "credit": "Unknown author (Bibliothèque nationale de France), Public domain"}, {"src": "img/sangabriel-3.jpg", "cap": "Остров Сан-Габриэль — зелёный остров на горизонте, прямо напротив города", "credit": "CHUCAO, CC BY-SA 3.0"}], "img": "img/a_sangabriel-1.jpg", "credit": "Mx. Granger, CC0"}, {"audio": "pres/sangabriel-02.mp3", "text": "Остров знали задолго до города. Здесь останавливался Фернан Магеллан в тысяча пятьсот двадцатом году, а в тысяча пятьсот двадцать седьмом году мореплаватель Себастьян Кабот дал острову имя святого Габриэля. История города началась именно здесь. В тысяча шестьсот восьмидесятом году лодочник из Буэнос-Айреса по имени Маркос Роман поплыл сюда за дровами и увидел у острова четыре незнакомых корабля. Чьи они, он не знал и поспешил сообщить властям. А в том же году Мануэл Лобу высадился на острове и от имени своего короля объявил и острова, и берег португальскими.", "caption": "1680: лодочник Маркос Роман увидел у острова четыре корабля", "big": "4 корабля", "imgs": [{"src": "img/a_sangabriel-3.jpg", "cap": "Фернан Магеллан, он останавливался у острова в 1520 году (портрет)", "credit": "Unknown artist, Public domain"}, {"src": "img/a_sangabriel-4.jpg", "cap": "Себастьян Кабот, мореплаватель, назвавший остров (гравюра с портрета)", "credit": "Samuel Rawle, after Hans Holbein the Younger, Public domain"}, {"src": "img/a_intro-1.jpg", "cap": "Плитка-азулежу: португальцы основывают Колонию, 1680 год", "credit": "Fulviusbsas, CC BY-SA 3.0"}], "img": "img/a_sangabriel-3.jpg", "credit": "Unknown artist, Public domain"}, {"audio": "pres/sangabriel-03.mp3", "text": "Позже Лобу написал письмо португальскому принцу Педру. Он рассказал, что на материке, который они успели осмотреть, нет ни одного леса, а острова сплошь покрыты деревьями, и что на берегу много камня. Деревья с острова пошли на первые хижины, пока в крепости строили казармы. Вот почему остров был так нужен. Камень отсюда возили на городские укрепления, а в тысяча восемьсот девяносто третьем году даже на строительство порта Буэнос-Айреса.", "caption": "Письмо Лобу принцу: на острове деревья, на берегу камень", "big": "", "imgs": [{"src": "img/a_sangabriel-5.jpg", "cap": "Принц Педру, будущий король Педру II: ему писал письма Лобу (портрет)", "credit": "Unknown author, Public domain"}, {"src": "img/a_sangabriel-6.jpg", "cap": "Стройка порта Буэнос-Айреса, 1890-е: каменные стены и краны", "credit": "Unknown author (Archivo General de la Nación, Argentina), Public domain"}, {"src": "img/a_sangabriel-7.jpg", "cap": "Порт Буэнос-Айреса на старой фотографии, около 1895 года", "credit": "Sociedad Fotográfica de Aficionados, Public domain"}], "img": "img/a_sangabriel-5.jpg", "credit": "Unknown author, Public domain"}, {"audio": "pres/sangabriel-04.mp3", "text": "Пока Колония оставалась португальской, остров служил убежищем. Здесь прятались десятки кораблей, и отсюда шла тайная торговля на всей Ла-Плате. В тысяча семьсот тридцать шестом году, во время войны с Испанией, португальцы укрепили на острове редут с шестью пушками. А бастион Сан-Педро один из шести, которые в тысяча семьсот двадцатых годах построили вдоль воды при губернаторе Васконселуше. Сегодня он охраняется государством как национальный памятник.", "caption": "Остров-убежище: десятки кораблей, редут с шестью пушками", "big": "6 пушек", "imgs": [{"src": "img/a_sangabriel-8.jpg", "cap": "Купеческий парусник XVII века в гавани (картина Лоренцо А Кастро)", "credit": "Lorenzo A Castro, Public domain"}, {"src": "img/a_sangabriel-9.jpg", "cap": "Пушка на бастионе: такие пушки стояли и на острове, и на городских стенах", "credit": "Fulviusbsas, CC BY-SA 3.0"}, {"src": "img/sangabriel-2.jpg", "cap": "Набережная Сан-Габриэль: белая балюстрада вдоль реки", "credit": "Ypsilon from Finland, CC0"}], "img": "img/a_sangabriel-8.jpg", "credit": "Lorenzo A Castro, Public domain"}, {"audio": "pres/sangabriel-05.mp3", "text": "В старом квартале есть дом, который называют Домом вице-короля. Его воссоздали на старых руинах уже после тысяча девятьсот шестьдесят восьмого года. И вот загадка: ни один вице-король в Колонии не жил. Возможно, имя дали в честь генерала Педро де Севальоса, который взял город и в тысяча семьсот семьдесят седьмом году стал первым вице-королём Рио-де-ла-Платы. Но документов об этом нет.", "caption": "Дом вице-короля: загадка имени", "big": "загадка", "imgs": [{"src": "img/a_sangabriel-10.jpg", "cap": "Дом вице-короля: низкие каменные стены, воссозданные на руинах", "credit": "Mx. Granger, CC0"}, {"src": "img/intro-3.jpg", "cap": "Педро де Севальос — испанский генерал, который брал Колонию штурмом", "credit": "Unknown author, Public domain"}, {"src": "img/a_sangabriel-11.jpg", "cap": "Карта вице-королевства Рио-де-ла-Плата, 1783 год", "credit": "Floppa Historico, CC BY 4.0"}], "img": "img/a_sangabriel-10.jpg", "credit": "Mx. Granger, CC0"}, {"audio": "pres/sangabriel-06.mp3", "text": "И ещё одно совпадение. В тысяча девятьсот девяносто пятом году остров Сан-Габриэль объявили национальным парком. В тот же год старый квартал Колонии попал в список ЮНЕСКО.", "caption": "1995: остров стал национальным парком, квартал попал в список ЮНЕСКО", "big": "1995", "imgs": [{"src": "img/a_sangabriel-12.jpg", "cap": "Остров Сан-Габриэль: деревья, песчаный берег и широкая вода", "credit": "Liam Quinn from Canada, CC BY-SA 2.0"}, {"src": "img/a_sangabriel-13.jpg", "cap": "Табличка в честь трёхсотлетия города, 1980 год", "credit": "Smmvinicius, CC BY-SA 4.0"}], "img": "img/a_sangabriel-12.jpg", "credit": "Liam Quinn from Canada, CC BY-SA 2.0"}, {"audio": "pres/sangabriel-07.mp3", "text": "Задание для юного путешественника: найди вдали остров и помаши ему рукой. Потом сосчитай, сколько лодок и кораблей видно на реке. Взрослым вопрос: почему Лобу сначала занял остров, а не сразу берег?", "caption": "Задание: найди остров и сосчитай лодки на реке", "big": "Задание", "imgs": [{"src": "img/a_sangabriel-1.jpg", "cap": "Остров Сан-Габриэль — низкая зелёная полоска на горизонте", "credit": "Mx. Granger, CC0"}, {"src": "img/ferry_boats-1.jpg", "cap": "Скоростные паромы Buquebus у причала в Колонии", "credit": "Liam Quinn from Canada, CC BY-SA 2.0"}, {"src": "img/muelle-2.jpg", "cap": "Яхтенная гавань и деревянный причал, вдалеке — высокая кирпичная труба", "credit": "Liam Quinn from Canada, CC BY-SA 2.0"}], "img": "img/a_sangabriel-1.jpg", "credit": "Mx. Granger, CC0"}]}, "santarita": {"title": "Мыс Санта-Рита: закат", "kid": "Назови три цвета, которые видишь в воде и в небе. И загадайте одно желание на всю семью. Только никому не рассказывай!", "segs": [{"audio": "pres/santarita-01.mp3", "text": "Вы на мысу Санта-Рита. Встаньте лицом к реке. Вдоль воды стоят скамейки, а если обернуться, видна гавань, которую называют Старым портом. В ней помещается больше ста шестидесяти лодок и яхт. Здесь, как и на мысу Сан-Педро, в тысяча семьсот двадцатых годах португальцы поставили бастион Санта-Рита. Сейчас это одно из лучших мест, чтобы встретить закат. Солнце сядет прямо над рекой, в начале ноября это бывает около половины восьмого вечера.", "caption": "Мыс Санта-Рита: Старый порт и бастион, закат около 19:30", "big": "около 19:30", "imgs": [{"src": "img/santarita-1.jpg", "cap": "Закат над Рио-де-ла-Платой: солнце садится прямо в воду и оставляет золотую дорожку", "credit": "Banfield, CC BY-SA 3.0"}, {"src": "img/a_santarita-1.jpg", "cap": "Старая фотография причала в Колонии: паровозик возит камень", "credit": "Arthur Koppel AG, Public domain"}, {"src": "img/muelle-1.jpg", "cap": "Старый деревянный причал: по нему можно пройтись до самого конца, по сторонам — яхты", "credit": "Patricio.lorente, CC BY-SA 2.5"}], "img": "img/santarita-1.jpg", "credit": "Banfield, CC BY-SA 3.0"}, {"audio": "pres/santarita-02.mp3", "text": "Посмотрите на цвет воды. Она не голубая, а мутноватая, ближе к коричневому. Дело в иле и глине: каждый год в Ла-Плату попадает около ста шестидесяти миллионов тонн осадка. Зато вода почти не солёная, и мореплаватель Хуан Диас де Солис назвал реку Пресным морем. В её водах живёт маленький речной дельфин франсискана. А закатное солнце красит реку в золото и медь.", "caption": "Цвет воды: ил и глина, 160 миллионов тонн осадка в год", "big": "160 млн тонн", "imgs": [{"src": "img/ferry_river-4.jpg", "cap": "Рисунок: испанцы Хуана Диаса де Солиса открывают Рио-де-ла-Плату в 1516 году", "credit": "Ulpiano Checa, Public domain"}, {"src": "img/a_santarita-2.jpg", "cap": "Речной дельфин франсискана с длинным клювом (рисунок 1847 года)", "credit": "Alcide d'Orbigny, Public domain"}, {"src": "img/ferry_river-3.jpg", "cap": "Две огромные реки — Парана и Уругвай — несут в Ла-Плату песок и глину, поэтому вода бурая", "credit": "MODIS Land Rapid Response Team, NASA GSFC, Public domain"}], "img": "img/ferry_river-4.jpg", "credit": "Ulpiano Checa, Public domain"}, {"audio": "pres/santarita-03.mp3", "text": "Название Ла-Плата значит «серебряная». По легенде, мореплаватели увидели серебро у местных жителей и решили, что в глубине земли лежит Серебряная гора. Искали, не нашли, а имя реке осталось. Запомните эту легенду, потому что вся история Колонии про серебро. Кстати, на этой реке штормы собираются быстро и бывают яростными, поэтому здесь затонуло немало кораблей. Особенно известен холодный юго-западный ветер памперо.", "caption": "Ла-Плата значит «серебряная»: легенда о Серебряной горе", "big": "легенда", "imgs": [{"src": "img/a_santarita-3.jpg", "cap": "Серебряная гора Потоси: гравюра 1553 года", "credit": "Pedro Cieza de León, CC BY-SA 4.0"}, {"src": "img/a_santarita-4.jpg", "cap": "Старая карта Ла-Платы: «Серебряная река» среди земель Парагвая", "credit": "Unknown author (17th-century map), CC BY-SA 4.0"}, {"src": "img/a_santarita-5.jpg", "cap": "Парусник в шторм: такие бури бывали и на Ла-Плате", "credit": "Lorenzo A Castro, Public domain"}], "img": "img/a_santarita-3.jpg", "credit": "Pedro Cieza de León, CC BY-SA 4.0"}, {"audio": "pres/santarita-04.mp3", "text": "Настоящее серебро добывали далеко, в горах Верхнего Перу. Испанская корона хотела, чтобы оно уходило только в Испанию. Но португальские и английские купцы везли в Колонию сахар, табак, хлопок и европейские товары и получали за них серебро. Покупатели с испанского берега приплывали за этими товарами тайком. Так работала контрабанда.", "caption": "Сахар, табак, ткани в обмен на серебро: так работала контрабанда", "big": "контрабанда", "imgs": [{"src": "img/a_santarita-6.jpg", "cap": "Город Потоси у серебряной горы, картина 1758 года", "credit": "Giadrico7, CC0"}, {"src": "img/a_santarita-7.jpg", "cap": "Серебряная монета восемь реалов, 1759 год: за такие везли товары", "credit": "Sgh, CC BY-SA 4.0"}, {"src": "img/a_santarita-8.jpg", "cap": "Сахарный завод в Бразилии (картина Франса Поста): оттуда везли сахар", "credit": "Frans Post, Public domain"}], "img": "img/a_santarita-6.jpg", "credit": "Giadrico7, CC0"}, {"audio": "pres/santarita-05.mp3", "text": "Купцов в городе было больше ста человек. Многие из них просили губернатора стать крёстным отцом своих детей: дружить с властью было очень выгодно. Колония отправляла в Рио-де-Жанейро кожи, а ещё здесь выращивали пшеницу, лён, коноплю и виноград. Представьте вечер вроде этого: у причалов суда, на берегу торгуются купцы, а над рекой садится солнце.", "caption": "Больше ста купцов, крёстные отцы-губернаторы и кожи на экспорт", "big": "100+ купцов", "imgs": [{"src": "img/a_santarita-9.jpg", "cap": "Гаучо отдыхают у крытой повозки в пампе (картина Ругендаса)", "credit": "Johann Moritz Rugendas, Public domain"}, {"src": "img/a_santarita-10.jpg", "cap": "Голубое цветущее поле льна", "credit": "EllenCherryCharles, CC BY-SA 4.0"}, {"src": "img/a_santarita-11.jpg", "cap": "Гроздь винограда на лозе", "credit": "Ian Schneider (Unsplash), CC0"}], "img": "img/a_santarita-9.jpg", "credit": "Johann Moritz Rugendas, Public domain"}, {"audio": "pres/santarita-06.mp3", "text": "Эти воды видели и настоящий бой. Шестого января тысяча семьсот шестьдесят третьего года англо-португальская эскадра попыталась отбить город у испанцев. Корабли встали на якорь перед Колонией и около трёх часов обстреливали укрепления. Испанские пушки ответили, на английском корабле «Лорд Клайв» начался пожар, огонь дошёл до пороховой кладовой, и корабль взорвался. Остальные корабли ушли назад в Рио-де-Жанейро, и город остался испанским.", "caption": "6 января 1763: бой на реке, «Лорд Клайв» взорвался", "big": "1763", "imgs": [{"src": "img/intro-5.jpg", "cap": "Картина: корабли обстреливают Колонию в 1763 году", "credit": "William Elliott, Public domain"}, {"src": "img/a_santarita-12.jpg", "cap": "Гравюра: корабли горят и тонут при обстреле Колонии, 1763 год", "credit": "Unknown author, Public domain"}, {"src": "img/a_santarita-13.jpg", "cap": "Английский торговый корабль XVIII века (Ост-Индская компания)", "credit": "Francis Holman, Public domain"}], "img": "img/intro-5.jpg", "credit": "William Elliott, Public domain"}, {"audio": "pres/santarita-07.mp3", "text": "Задание для юного путешественника: когда солнце начнёт садиться, назови три цвета, которые видишь в воде и в небе. А потом загадайте одно желание на всю семью. Только никому не рассказывай! Взрослым вопрос: о чём мечтал купец, глядя на этот закат триста лет назад?", "caption": "Задание: три цвета заката и одно общее желание", "big": "Задание", "imgs": [{"src": "img/santarita-2.jpg", "cap": "Закат с городского пляжа: небо розовое, а вода спокойная", "credit": "Mx. Granger, CC0"}, {"src": "img/a_santarita-14.jpg", "cap": "Закат над рекой: серебряная вода и тучи с лучами", "credit": "Ceciliaourens, CC BY-SA 4.0"}, {"src": "img/a_santarita-15.jpg", "cap": "Сумерки над рекой: оранжевая полоса у горизонта и тёмная вода", "credit": "Mx. Granger, CC0"}], "img": "img/santarita-2.jpg", "credit": "Mx. Granger, CC0"}]}, "muelle": {"title": "Старый причал и порт яхт", "kid": "Найди лодку с самой высокой мачтой и сосчитай все мачты, которые видишь. Сколько их?", "segs": [{"audio": "pres/muelle-01.mp3", "text": "Вы стоите у старого деревянного причала. Слышите, как поскрипывают доски и позвякивают о мачты тросы? Это Пуэрто-Вьехо, старый порт Колонии, а сегодня порт для яхт. Он лежит у мыса Санта-Рита, и здесь, как пишут, могут встать больше ста шестидесяти лодок. Летом сюда приходят хозяева яхт из Аргентины, ведь до Буэнос-Айреса по воде всего около пятидесяти километров. Съезжаются сюда и участники парусных гонок по реке Ла-Плата. А на островке Сан-Габриэль напротив есть крошечный причал для лодок с небольшой осадкой.", "caption": "Пуэрто-Вьехо: старый порт Колонии, а сегодня порт яхт", "big": "160+", "imgs": [{"src": "img/muelle-1.jpg", "cap": "Старый деревянный причал: по нему можно пройтись до самого конца, по сторонам — яхты", "credit": "Patricio.lorente, CC BY-SA 2.5"}, {"src": "img/b_muelle-1.jpg", "cap": "Порт яхт Колонии с высоты: яхты стоят у причалов бухты", "credit": "Marcelo Campi, CC BY-SA 3.0"}, {"src": "img/sangabriel-3.jpg", "cap": "Остров Сан-Габриэль — зелёный остров на горизонте, прямо напротив города", "credit": "CHUCAO, CC BY-SA 3.0"}], "img": "img/muelle-1.jpg", "credit": "Patricio.lorente, CC BY-SA 2.5"}, {"audio": "pres/muelle-02.mp3", "text": "А теперь перенесёмся почти на триста пятьдесят лет назад. Колонию основали португальцы в тысяча шестьсот восьмидесятом году. Напротив, на другом берегу, стоял Буэнос-Айрес, испанский город, где чужим купцам торговать не разрешали. Но португальцы мечтали продавать испанским колонистам бразильский сахар, табак, хлопок и европейские товары. А взамен получать серебро, которое шло сюда с гор Верхнего Перу.", "caption": "1680: португальцы основали Колонию прямо напротив Буэнос-Айреса", "big": "1680", "imgs": [{"src": "img/b_muelle-2.jpg", "cap": "Азулежу: основание Колонии в 1680 году — португальцы с флагом и священник", "credit": "Fulviusbsas, CC BY-SA 3.0"}, {"src": "img/b_muelle-3.jpg", "cap": "Буэнос-Айрес с реки, рисунок 1794 года: город на другом берегу Ла-Платы", "credit": "Fernando Brambila, Public domain"}, {"src": "img/b_muelle-4.jpg", "cap": "Сахарная плантация и завод в Бразилии, XVII век: оттуда возили сахар", "credit": "Frans Post, Public domain"}], "img": "img/b_muelle-2.jpg", "credit": "Fulviusbsas, CC BY-SA 3.0"}, {"audio": "pres/muelle-03.mp3", "text": "Так порт Колонии стал контрабандным. Историки пишут, что город был оживлённым центром португальской и английской контрабанды. Представьте тёмную ночь и лодку без огней, которая тихо отходит от этого берега. Это только воображение, но такие рейсы, по сути, и кормили город. А в Рио-де-Жанейро отсюда уходили кожи: шкуры быков, которых добывали в степях вокруг. Колонисты ещё и сеяли пшеницу, коноплю и лён, выращивали виноград, а дерево и продукты им привозили.", "caption": "Контрабанда: бразильский сахар и табак в обмен на серебро", "big": "", "imgs": [{"src": "img/b_muelle-5.jpg", "cap": "Контрабандисты с лодкой и повозкой, картина около 1793 года (Англия)", "credit": "anonymous, Public domain"}, {"src": "img/b_muelle-6.jpg", "cap": "Погрузка шкур в порту Буэнос-Айреса: акварель Видаля, около 1818 года", "credit": "Emeric Essex Vidal, Public domain"}, {"src": "img/b_muelle-7.jpg", "cap": "Эстансия в Уругвае около 1818 года: бычьи шкуры растянуты сушиться", "credit": "Emeric Essex Vidal (1791-1861), Public domain"}], "img": "img/b_muelle-5.jpg", "credit": "anonymous, Public domain"}, {"audio": "pres/muelle-04.mp3", "text": "Эти воды видели и настоящие бои. В феврале тысяча восемьсот двадцать шестого года шла война за эти земли между Бразилией и Аргентиной, и к Колонии подошёл адмирал Гильермо Браун со своими кораблями. Бразильский командир Мануэл Жорже Родригиш, которому предложили сдаться, ответил, что судьбу городов решает только судьба оружия. Бой шёл у бастиона Сан-Педро, один бриг сел на мель у островка Сан-Габриэль, а ночью загорелся другой. Колония выстояла, и спустя две недели Браун ушёл в Буэнос-Айрес.", "caption": "1826: адмирал Браун атакует порт Колонии", "big": "1826", "imgs": [{"src": "img/b_muelle-8.jpg", "cap": "Адмирал Гильермо Браун: портрет 1827 года", "credit": "Jean-Philippe Goulu, Public domain"}, {"src": "img/b_muelle-9.jpg", "cap": "Парусный бой времён Брауна: сражение при Хункале, 1827 (картина 1865 года)", "credit": "José Murature, Public domain"}, {"src": "img/b_muelle-10.jpg", "cap": "Бразильская эскадра у Буэнос-Айреса в 1828 году: гравюра той же войны", "credit": "Gaston Roullet, Public domain"}], "img": "img/b_muelle-8.jpg", "credit": "Jean-Philippe Goulu, Public domain"}, {"audio": "pres/muelle-05.mp3", "text": "Потом на смену парусникам пришли пароходы, и через реку пошли регулярные рейсы. А первого апреля тысяча девятьсот первого года в город пришла железная дорога. Сегодня порт Колонии самый оживлённый на всей этой реке. В две тысячи двадцать третьем году через его терминал прошли два миллиона шестьсот семьдесят тысяч пассажиров, и это был новый рекорд. Многие из них приплыли на таких же паромах, как ваш.", "caption": "Рекорд порта Колонии: 2 670 000 пассажиров в год", "big": "2,67 млн", "imgs": [{"src": "img/b_muelle-11.jpg", "cap": "Пароход «Ciudad de Montevideo», 1918 год: такие плавали по Ла-Плате", "credit": "Unknown author, Public domain"}, {"src": "img/b_muelle-12.jpg", "cap": "Вокзал Колонии: железная дорога пришла в город в 1901 году", "credit": "Photograph by Mike Peel (www.mikepeel.net)., CC BY-SA 4.0"}, {"src": "img/ferry_boats-1.jpg", "cap": "Скоростные паромы Buquebus у причала в Колонии", "credit": "Liam Quinn from Canada, CC BY-SA 2.0"}], "img": "img/b_muelle-11.jpg", "credit": "Unknown author, Public domain"}, {"audio": "pres/muelle-06.mp3", "text": "А теперь для тебя, юный путешественник. Посмотри на лодки: у одних мачты высокие, у других совсем маленькие. Видишь, как лодки чуть покачиваются, будто кивают друг другу? Задание для юного путешественника: найди лодку с самой высокой мачтой и сосчитай все мачты, которые увидишь. Сколько их получилось? Какая лодка понравилась тебе больше всех? Придумай ей имя и скажи, куда бы ты на ней отправился.", "caption": "Задание: сосчитай мачты на яхтах", "big": "", "imgs": [{"src": "img/muelle-2.jpg", "cap": "Яхтенная гавань и деревянный причал, вдалеке — высокая кирпичная труба", "credit": "Liam Quinn from Canada, CC BY-SA 2.0"}, {"src": "img/b_muelle-13.jpg", "cap": "Мачты яхт на фоне солнца в порту Колонии: попробуй сосчитать", "credit": "Banfield, CC BY-SA 3.0"}, {"src": "img/muelle-1.jpg", "cap": "Старый деревянный причал: по нему можно пройтись до самого конца, по сторонам — яхты", "credit": "Patricio.lorente, CC BY-SA 2.5"}], "img": "img/muelle-2.jpg", "credit": "Liam Quinn from Canada, CC BY-SA 2.0"}]}, "carmen": {"title": "Бастион дель Кармен, труба и аквариум", "kid": "Посмотри на трубу и сравни её с маяком: выше она или ниже? Придумай трубе имя.", "segs": [{"audio": "pres/carmen-01.mp3", "text": "Перед вами высокая кирпичная труба, а рядом низкие старые здания. Представьте, что вы пришли сюда в девятнадцатом веке. Из трубы валит дым, во дворе работают люди, а в больших котлах варится мыло. Так, по рассказам путеводителей, и было: здесь стояла фабрика, где варили мыло, мыли шерсть и выделывали кожу. Называлась она Караччоло. Один путеводитель даёт даже год постройки, тысяча восемьсот восьмидесятый, но надёжных документов об этом мы не нашли.", "caption": "Кирпичная труба бывшей мыльной фабрики Караччоло", "big": "", "imgs": [{"src": "img/b_carmen-1.jpg", "cap": "Бастион дель Кармен сверху: труба, старые цеха и лужайка у воды", "credit": "Marcelo Campi, CC BY-SA 3.0"}, {"src": "img/b_carmen-2.jpg", "cap": "Варка мыла в больших котлах: рисунок XIX века", "credit": "Unknown author, Public domain"}, {"src": "img/b_carmen-3.jpg", "cap": "Мойка шерсти на реке в XIX веке (фото из Австралии)", "credit": "Charles Nettleton, Public domain"}], "img": "img/b_carmen-1.jpg", "credit": "Marcelo Campi, CC BY-SA 3.0"}, {"audio": "pres/carmen-02.mp3", "text": "Самое надёжное свидетельство это государственный указ тысяча девятьсот семьдесят шестого года. В нём Уругвай объявил национальными памятниками самые ценные места Колонии: городскую стену и ворота Портон-де-Кампо, откуда началась ваша прогулка, руины монастыря, базилику. В том же списке значатся здания бывшей мыльной фабрики Караччоло и её труба, на углу улиц Ривадавия и Вирей-Себальос. Так что труба, на которую вы смотрите, охраняется государством, как крепостная стена или маяк.", "caption": "1976: фабрика и труба объявлены национальным памятником", "big": "1976", "imgs": [{"src": "img/porton-1.jpg", "cap": "Главные ворота старого города — Портон-де-Кампо: арка, мост через ров и крепостная стена", "credit": "Liam Quinn from Canada, CC BY-SA 2.0"}, {"src": "img/faro-2.jpg", "cap": "Руины монастыря Сан-Франсиско: каменные стены с арками, а крыши давно нет", "credit": "Huguitoportal, CC BY-SA 3.0"}, {"src": "img/b_carmen-4.jpg", "cap": "Кирпичная труба бывшей мыльной фабрики — национальный памятник", "credit": "P. Hughes, CC BY 4.0"}], "img": "img/porton-1.jpg", "credit": "Liam Quinn from Canada, CC BY-SA 2.0"}, {"audio": "pres/carmen-03.mp3", "text": "Название «Бастион дель Кармен» уводит ещё глубже в прошлое. Начиная с тысяча семьсот двадцать второго года португальский губернатор Антониу Педру ди Васконселуш, тот самый, что построил ворота Портон-де-Кампо, превращал Колонию в самый укреплённый город региона. Вдоль воды выросли шесть бастионов: Сан-Педро, Сан-Мигел, Санту-Антониу, Сан-Жуан, Санта-Рита и Карму, по-испански Кармен. О последнем и напоминает название этого места.", "caption": "1722: шесть бастионов вдоль воды, среди них Кармо (Кармен)", "big": "6 бастионов", "imgs": [{"src": "img/b_carmen-5.jpg", "cap": "План Колонии 1731 года: крепость с бастионами вдоль берега", "credit": "Diogo Soares (17??–17??), Public domain"}, {"src": "img/b_carmen-6.jpg", "cap": "Португальский план Колонии, 1737 год: бастионы вдоль воды", "credit": "Unknown author, Public domain"}, {"src": "img/b_carmen-7.jpg", "cap": "Остатки Бастиона дель Кармен: кирпичная стена с аркой", "credit": "Profemate, CC BY-SA 3.0"}], "img": "img/b_carmen-5.jpg", "credit": "Diogo Soares (17??–17??), Public domain"}, {"audio": "pres/carmen-04.mp3", "text": "Мыло, которым вы моете руки, и в те времена варили из жира, смешивая его со щёлоком и долго кипятя. Запах, наверное, стоял над всем берегом. Теперь здесь пахнет рекой и травой. В бывших цехах работают культурный центр и театр, идут спектакли и концерты, а вокруг лужайка, с которой открывается вид на реку. Загляните на афишу: по городскому календарю в пятницу вечером здесь назначен спектакль. Хорошее место, чтобы присесть, пока дети бегают по траве.", "caption": "Теперь здесь театр, культурный центр и лужайка у реки", "big": "", "imgs": [{"src": "img/b_carmen-8.jpg", "cap": "Мыловар за работой: гравюра 1847 года", "credit": "Wentzel, Jean Frédéric (1807-1869). Fonction indéterminée, Public domain"}, {"src": "img/carmen-2.jpg", "cap": "Старая каменная стена бастиона у воды и труба за ней; сегодня здесь театр", "credit": "Liam Quinn from Canada, CC BY-SA 2.0"}, {"src": "img/b_carmen-1.jpg", "cap": "Бастион дель Кармен сверху: труба, старые цеха и лужайка у воды", "credit": "Marcelo Campi, CC BY-SA 3.0"}], "img": "img/b_carmen-8.jpg", "credit": "Wentzel, Jean Frédéric (1807-1869). Fonction indéterminée, Public domain"}, {"audio": "pres/carmen-05.mp3", "text": "А совсем рядом, на улице Вирей-Себальос, спрятан аквариум рыб, которые живут в местных реках. Он устроен как большой грот, в его стенах прорезаны окна, и ты смотришь на рыб, будто из подводной пещеры. Рядом стоят компьютеры и таблички, где рассказывают, как рыбы живут в воде. Электрические рыбы умеют создавать разряды тока, и здесь эти разряды можно услышать. Аквариум признан местом национального интереса для туризма и образования, а в две тысячи одиннадцатом году получил культурную премию Моросоли.", "caption": "Аквариум местных рыб: грот с окнами и звуки электрических рыб", "big": "", "imgs": [{"src": "img/b_carmen-9.jpg", "cap": "Тарарира в аквариуме Колонии: хищная рыба местных рек", "credit": "Enrique Manuel González González, CC BY-SA 4.0"}, {"src": "img/b_carmen-10.jpg", "cap": "Сурубí — полосатый речной сом бассейна Ла-Платы", "credit": "CHUCAO, CC BY-SA 3.0"}, {"src": "img/b_carmen-11.jpg", "cap": "Электрический угорь: умеет давать разряды тока", "credit": "Steven G. Johnson, CC BY-SA 3.0"}], "img": "img/b_carmen-9.jpg", "credit": "Enrique Manuel González González, CC BY-SA 4.0"}, {"audio": "pres/carmen-06.mp3", "text": "Задание для юного путешественника: посмотри на трубу и сравни её с маяком, который мы видели. Она выше или ниже? Потом придумай трубе имя, ведь она стоит здесь уже очень давно и всё помнит. А если пойдёте в аквариум, найди рыбу, которая понравится тебе больше всех, и расскажи, чем она особенная.", "caption": "Задание: сравни трубу с маяком", "big": "", "imgs": [{"src": "img/carmen-1.jpg", "cap": "Бастион дель Кармен: высокая кирпичная труба — найдите её над деревьями", "credit": "Flaviohmg, CC BY-SA 4.0"}, {"src": "img/faro-1.jpg", "cap": "Белый маяк Колонии на фоне синего неба, рядом — руины монастыря", "credit": "Diego Delso, CC BY-SA 3.0"}, {"src": "img/faro-3.jpg", "cap": "Маяк среди деревьев: на него можно подняться и посмотреть на город сверху", "credit": "Diego Delso, CC BY-SA 3.0"}], "img": "img/carmen-1.jpg", "credit": "Flaviohmg, CC BY-SA 4.0"}]}, "basilica": {"title": "Базилика Святейшего Таинства", "kid": "Найди на стене церкви места, где камни разные: старые и новые. Сколько разных видов камня насчитал?", "segs": [{"audio": "pres/basilica-01.mp3", "text": "Вы стоите перед самой старой церковью Уругвая, Базиликой Святейшего Таинства. Приход основали второго февраля тысяча шестьсот восьмидесятого года, через считанные дни после основания города. Первая церковь была хижиной из соломы и глины. Каменную, на извести, начали строить в тысяча шестьсот девяносто девятом году по приказу губернатора Себастьяна де Вейга Кабрала. Потом её не раз разрушали при осадах и строили заново.", "caption": "Основана 2 февраля 1680 года: самая старая церковь Уругвая", "big": "1680", "imgs": [{"src": "img/basilica-1.jpg", "cap": "Базилика Святейшего Причастия: две белые колокольни — посмотрите, какие на них часы", "credit": "Carlos E. Gonzalez, CC BY-SA 3.0"}, {"src": "img/b_muelle-2.jpg", "cap": "Азулежу: основание Колонии в 1680 году — португальцы с флагом и священник", "credit": "Fulviusbsas, CC BY-SA 3.0"}, {"src": "img/b_basilica-1.jpg", "cap": "Базилика Святейшего Таинства: самая старая церковь Уругвая", "credit": "Heretiq, CC BY-SA 3.0"}], "img": "img/basilica-1.jpg", "credit": "Carlos E. Gonzalez, CC BY-SA 3.0"}, {"audio": "pres/basilica-02.mp3", "text": "В тысяча семьсот семьдесят седьмом году церковь сильно пострадала при бомбардировке, и приход на время молился в других часовнях. Нынешнее здание возводили с тысяча восемьсот восьмого по тысяча восемьсот десятый год по проекту испанского архитектора Томаса Торибио. Казалось, теперь церковь простоит долго. Но тринадцать лет спустя случилась история, о которой в Колонии вспоминают до сих пор.", "caption": "1808–1810: новое здание по проекту архитектора Томаса Торибио", "big": "1810", "imgs": [{"src": "img/b_basilica-2.jpg", "cap": "План Колонии 1777 года, когда город сильно пострадал при осаде", "credit": "Tomás López de Vargas Machuca, Public domain"}, {"src": "img/intro-5.jpg", "cap": "Картина: корабли обстреливают Колонию в 1763 году", "credit": "William Elliott, Public domain"}, {"src": "img/basilica-2.jpg", "cap": "Боковая стена базилики — одной из старейших церквей Уругвая: толстые каменные стены и две колокольни", "credit": "Heretiq, CC BY-SA 3.0"}], "img": "img/b_basilica-2.jpg", "credit": "Tomás López de Vargas Machuca, Public domain"}, {"audio": "pres/basilica-03.mp3", "text": "Утро воскресенья, четырнадцатое декабря тысяча восемьсот двадцать третьего года. Над городом гроза. Колонией тогда владела Бразилия, и под ризницей, комнатой, где хранят облачения священников, был пороховой склад. Жители возражали против такого соседства, но их не послушали. Молния ударила в церковь. Порох взорвался, главный алтарь и ризница разлетелись, и работа Торибио была разрушена.", "caption": "14 декабря 1823: молния попала в пороховой склад под ризницей", "big": "1823", "imgs": [{"src": "img/b_basilica-3.jpg", "cap": "Молния в грозу: такая в 1823 году ударила в церковь", "credit": "Jan Bambach, CC BY-SA 3.0"}, {"src": "img/b_basilica-4.jpg", "cap": "Бочонки с порохом в старом форте: похожий склад был под ризницей", "credit": "jjmusgrove, CC BY 2.0"}], "img": "img/b_basilica-3.jpg", "credit": "Jan Bambach, CC BY-SA 3.0"}, {"audio": "pres/basilica-
