04.mp3", "text": "Спустя десять лет, семнадцатого ноября тысяча восемьсот тридцать третьего года, в Колонию приехал двадцатичетырёхлетний натуралист Чарльз Дарвин с корабля «Бигль». Он записал, что церковь служила пороховым складом, что две трети здания снесло до основания, а то, что осталось, это любопытный памятник объединённой силе молнии и пороха. Про сам город он написал теплее: неровные улицы и рощи старых апельсиновых и персиковых деревьев придают ему милый вид.", "caption": "17 ноября 1833: Чарльз Дарвин видит «любопытную руину»", "big": "1833", "imgs": [{"src": "img/b_basilica-5.jpg", "cap": "Чарльз Дарвин: портрет работы Джорджа Ричмонда, 1840 год", "credit": "George Richmond, Public domain"}, {"src": "img/b_basilica-6.jpg", "cap": "Корабль «Бигль», на котором плыл Дарвин (старый рисунок)", "credit": "illustrations by R. T. Pritchett 1828-1907, Public domain"}], "img": "img/b_basilica-5.jpg", "credit": "George Richmond, Public domain"}, {"audio": "pres/basilica-05.mp3", "text": "В другом блокноте Дарвина есть пометка про одиннадцать погибших, но он услышал об этом через много лет от местных жителей, так что точное число жертв неизвестно. Церковь отстраивали с тысяча восемьсот тридцать шестого по тысяча восемьсот сорок первый год. А в двадцатом веке реставраторы вернули фасаду прежний вид и поставили на место колокольни с изразцовыми куполами.", "caption": "Число жертв неизвестно; восстановление 1836–1841", "big": "1836–1841", "imgs": [{"src": "img/b_basilica-7.jpg", "cap": "Старая панорама Колонии, 1907 год: город на берегу и церковь", "credit": "Dornaleche y Reyes Impresores., Public domain"}, {"src": "img/b_basilica-8.jpg", "cap": "Две колокольни базилики: их вернули на место в XX веке", "credit": "P. Hughes, CC BY 4.0"}, {"src": "img/basilica-3.jpg", "cap": "Площадь Оружия (Пласа-де-Армас): тенистые деревья, а за ними — базилика", "credit": "Helge Høifødt, CC BY-SA 3.0"}], "img": "img/b_basilica-7.jpg", "credit": "Dornaleche y Reyes Impresores., Public domain"}, {"audio": "pres/basilica-06.mp3", "text": "При ремонте тысяча девятьсот семьдесят шестого года часть старых стен нарочно оставили на виду. Присмотритесь к боковой стене: вы увидите два вида кладки. Один это португальский камень, другой испанский кирпич. Внутри хранятся вещи ещё старше взрыва: купель около тысяча семисотого года, распятие, которое вырезали индейцы из иезуитских миссий, и дарохранительница из жакаранды.", "caption": "Два вида кладки: португальский камень и испанский кирпич", "big": "", "imgs": [{"src": "img/b_basilica-9.jpg", "cap": "Южная стена базилики: толстая кладка из камня и кирпича", "credit": "Heretiq, CC BY-SA 3.0"}, {"src": "img/b_basilica-10.jpg", "cap": "Внутри базилики: каменные стены и алтарь", "credit": "Profemate, CC BY-SA 3.0"}, {"src": "img/b_basilica-11.jpg", "cap": "Руины иезуитской миссии гуарани (Сан-Игнасио-Мини, Аргентина)", "credit": "Miguel Vieira derivative work: MrPanyGoff, CC BY 2.0"}], "img": "img/b_basilica-9.jpg", "credit": "Heretiq, CC BY-SA 3.0"}, {"audio": "pres/basilica-07.mp3", "text": "Перед базиликой площадь Пласа-де-Армас, названная именем основателя города, Мануэла Лобу. А слева от церкви, в нескольких десятках шагов, видны каменные основания Дома губернаторов. Их нашли при раскопках. Вместе с церковью это было главное здание города, а найденные там вещи показывают в Португальском музее. На этом наша прогулка закончена. Спасибо, что гуляли с нами! Задание для юного путешественника: найди на стене церкви места, где камни разные, одни старые, другие новые. Сколько разных видов камня ты насчитал?", "caption": "Пласа-де-Армас и фундаменты Дома губернаторов рядом с церковью", "big": "", "imgs": [{"src": "img/b_basilica-12.jpg", "cap": "Пласа-де-Армас: тенистая площадь перед базиликой", "credit": "Helge Høifødt, CC BY-SA 3.0"}, {"src": "img/sangabriel-1.jpg", "cap": "Руины дома губернатора: низкие каменные стены прямо на траве — по ним видно, где были комнаты", "credit": "Photograph by Mike Peel (www.mikepeel.net), CC BY-SA 4.0"}, {"src": "img/plaza-2.jpg", "cap": "Старый каменный дом с зелёной дверью — Португальский музей", "credit": "Nicolas Barriola, CC BY-SA 3.0"}], "img": "img/b_basilica-12.jpg", "credit": "Helge Høifødt, CC BY-SA 3.0"}]}, "paleo": {"title": "Музей древних гигантов", "kid": "Найди панцирь глиптодонта и встань рядом. Поместился бы ты под ним, как под крышей? А мама с папой?", "segs": [{"audio": "pres/paleo-01.mp3", "text": "Добро пожаловать в маленький музей больших зверей. Он стоит в районе Реаль-де-Сан-Карлос и носит имя Армандо Калькатерры. Здесь хранят кости и панцири животных, которые жили в ледниковую эпоху, когда по здешним равнинам бродили настоящие гиганты. Таких животных называют мегафауной, то есть «большими зверями». Многие находки сделаны в самом департаменте Колония, совсем рядом с вами.", "caption": "Музей Армандо Калькатерры: кости и панцири «больших зверей»", "big": "", "imgs": [{"src": "img/b_paleo-1.jpg", "cap": "Палеонтологический музей имени Армандо Калькатерры", "credit": "Oscar muller, CC BY-SA 3.0"}, {"src": "img/b_paleo-2.jpg", "cap": "В музее: огромный костяной панцирь и кость древнего зверя", "credit": "Oscar muller, CC BY-SA 3.0"}, {"src": "img/paleo-3.jpg", "cap": "Так учёные представляют себе глиптодонтов, которые жили здесь 20 тысяч лет назад", "credit": "ABelov2014, CC BY-SA 3.0"}], "img": "img/b_paleo-1.jpg", "credit": "Oscar muller, CC BY-SA 3.0"}, {"audio": "pres/paleo-02.mp3", "text": "Главные звёзды музея это глиптодонты. Представьте броненосца, которого надули до размеров автомобиля. Это не шутка: броненосцы им родственники. Панцирь глиптодонта состоял из сотен костяных пластинок, подогнанных друг к другу, как мозаика, и поднимался куполом. Крупный родственник по имени дедикур был длиной около трёх с половиной метров, а весил в среднем почти полторы тонны, как бегемот. Питались такие звери травой.", "caption": "Глиптодонты: родственники броненосцев размером с автомобиль", "big": "1,4 тонны", "imgs": [{"src": "img/b_paleo-3.jpg", "cap": "Современный броненосец — родственник глиптодонтов", "credit": "Charles J. Sharp, CC BY-SA 4.0"}, {"src": "img/b_paleo-4.jpg", "cap": "Модель глиптодонта в натуральную величину", "credit": "Shaitan (Bruno Rios Evangelista), CC0"}, {"src": "img/paleo-2.jpg", "cap": "Скелет и панцирь глиптодонта в музее Филда (Чикаго): прикиньте, какого он размера рядом с вами", "credit": "Zissoudisctrucker, CC BY-SA 4.0"}], "img": "img/b_paleo-3.jpg", "credit": "Charles J. Sharp, CC BY-SA 4.0"}, {"audio": "pres/paleo-03.mp3", "text": "А у дедикура на хвосте была настоящая булава. Хвост срастался в твёрдый костяной стержень, и булава длиной до метра весила, по оценкам учёных, от сорока до шестидесяти пяти килограммов. При размахе её конец мог двигаться со скоростью около сорока километров в час. С таким защитником лучше было не спорить.", "caption": "Хвост-булава дедикура: до метра длиной, удар около 40 км/ч", "big": "40 км/ч", "imgs": [{"src": "img/b_paleo-5.jpg", "cap": "Дедикур с булавой на хвосте и глиптодон: рисунок 1913 года", "credit": "R. Bruce Horsfall, Public domain"}, {"src": "img/b_paleo-6.jpg", "cap": "Глиптодонты на лугу: у одного хвост-булава", "credit": "ABelov2014, CC BY-SA 3.0"}], "img": "img/b_paleo-5.jpg", "credit": "R. Bruce Horsfall, Public domain"}, {"audio": "pres/paleo-04.mp3", "text": "Были звери и покрупнее. Гигантский ленивец мегатерий вырастал до шести метров в длину и весил три-четыре тонны, почти как слон. Он объедал листья и ветки деревьев. Ближайшие живые родственники мегатерия, по данным генетиков, это ленивцы, которые медленно висят на ветках в тропических лесах. Первый скелет мегатерия нашли в тысяча семьсот восемьдесят седьмом году у реки Луян в Аргентине и отправили в Мадрид в семи ящиках.", "caption": "Мегатерий: шесть метров и три-четыре тонны, как слон", "big": "6 метров", "imgs": [{"src": "img/b_paleo-7.jpg", "cap": "Мегатерий на задних лапах рядом с глиптодонтами (рисунок)", "credit": "DiBgd at English Wikipedia, CC BY-SA 3.0"}, {"src": "img/b_paleo-8.jpg", "cap": "Скелет мегатерия, отправленный в Мадрид: гравюра 1796 года", "credit": "Manuel Navarro, Public domain"}, {"src": "img/b_paleo-9.jpg", "cap": "Современный ленивец — ближайший живой родственник мегатерия", "credit": "Charles J. Sharp, CC BY-SA 3.0"}], "img": "img/b_paleo-7.jpg", "credit": "DiBgd at English Wikipedia, CC BY-SA 3.0"}, {"audio": "pres/paleo-05.mp3", "text": "Теперь история про человека, которого вы уже встречали в базилике. Двадцать шестого ноября тысяча восемьсот тридцать третьего года Чарльз Дарвин купил у фермера в Уругвае, возле ручья Саранди, притока реки Рио-Негро, череп неизвестного зверя и заплатил восемнадцать пенсов. Местные мальчишки использовали череп как мишень и выбили в нём зубы камнями. Позже зверя назвали токсодоном. Он был длиной около двух с половиной метров и немного походил на смесь бегемота с носорогом. Дарвин назвал его одним из самых странных животных, когда-либо найденных.", "caption": "26 ноября 1833: Дарвин покупает череп токсодона за 18 пенсов", "big": "18 пенсов", "imgs": [{"src": "img/b_basilica-5.jpg", "cap": "Чарльз Дарвин: портрет работы Джорджа Ричмонда, 1840 год", "credit": "George Richmond, Public domain"}, {"src": "img/b_paleo-10.jpg", "cap": "Череп токсодона на выставке к 200-летию Дарвина (Бразилия)", "credit": "Foto: Wilson Dias/Abr, CC BY 3.0 br"}, {"src": "img/b_paleo-11.jpg", "cap": "Токсодон — зверь, похожий на бегемота с носорогом: рисунок 1913 года", "credit": "R. Bruce Horsfall, Public domain"}], "img": "img/b_basilica-5.jpg", "credit": "George Richmond, Public domain"}, {"audio": "pres/paleo-06.mp3", "text": "Уругвай вообще богат такими находками. Остатки глиптодонта у ручья Солис-Гранде описал в тысяча восемьсот четырнадцатом году учёный Дамасо Антонио Ларраньяга и принял за кости гигантского броненосца. А на обрывах у пляжа Кию нашли череп самого крупного из известных грызунов, размером с голову коровы. Он жил от двух до трёх миллионов лет назад, и его назвали в честь национального героя Артигаса.", "caption": "Находки Уругвая: глиптодонт 1814 года и гигантский грызун", "big": "", "imgs": [{"src": "img/b_paleo-12.jpg", "cap": "Дамасо Антонио Ларраньяга — учёный, описавший кости глиптодонта", "credit": "Unknown author, Public domain"}, {"src": "img/b_paleo-13.jpg", "cap": "Гигантский грызун Josephoartigasia monesi: голова размером с коровью", "credit": "Andrés Rinderknecht & Ernesto Blanco; Illustration: Gustavo Lecuona, CC BY-SA 2.5"}, {"src": "img/b_paleo-14.jpg", "cap": "Хосе Артигас, национальный герой Уругвая: картина Бланеса", "credit": "Juan Manuel Blanes, Public domain"}], "img": "img/b_paleo-12.jpg", "credit": "Unknown author, Public domain"}, {"audio": "pres/paleo-07.mp3", "text": "Куда всё это исчезло? Большинство таких зверей вымерло около двенадцати тысяч лет назад. Люди к тому времени уже жили в Южной Америке, а климат менялся. Учёные до сих пор спорят, что сыграло главную роль, перемены климата или охота. Многие считают, что люди тоже внесли свой вклад. В Аргентине нашли место, где около двенадцати с половиной тысяч лет назад разделывали мегатерия.", "caption": "Около 12 000 лет назад: почему вымерла мегафауна", "big": "12 000", "imgs": [{"src": "img/b_paleo-15.jpg", "cap": "Охотники и глиптодон: рисунок Генриха Хардера", "credit": "Heinrich Harder (1858-1935), Public domain"}, {"src": "img/b_paleo-16.jpg", "cap": "Наконечники копий «рыбий хвост» древних охотников Южной Америки", "credit": "KehDon, CC BY-SA 4.0"}, {"src": "img/b_paleo-17.jpg", "cap": "Отпечатки рук древних людей: пещера Куэва-де-лас-Манос (Аргентина)", "credit": "Suzko, CC BY-SA 3.0"}], "img": "img/b_paleo-15.jpg", "credit": "Heinrich Harder (1858-1935), Public domain"}, {"audio": "pres/paleo-08.mp3", "text": "Задание для юного путешественника: найди в музее панцирь глиптодонта и встань рядом. Как думаешь, ты бы поместился под ним, как под крышей? А мама с папой? Сколько человек поместилось бы под таким панцирем? И придумай этому зверю имя, какое-нибудь смешное.", "caption": "Задание: поместишься ли ты под панцирем?", "big": "", "imgs": [{"src": "img/paleo-1.jpg", "cap": "Глиптодонт в Национальном музее естественной истории Уругвая (Монтевидео): панцирь как купол, а хвост — с шипастой булавой", "credit": "Mike Dickison, CC BY 4.0"}, {"src": "img/b_paleo-18.jpg", "cap": "Глиптодонт: панцирь куполом, как крыша (рисунок Хардера)", "credit": "Heinrich Harder for Wilhelm Bölsche, Public domain"}, {"src": "img/b_paleo-2.jpg", "cap": "В музее: огромный костяной панцирь и кость древнего зверя", "credit": "Oscar muller, CC BY-SA 3.0"}], "img": "img/paleo-1.jpg", "credit": "Mike Dickison, CC BY 4.0"}]}, "toros": {"title": "Арена Пласа-де-Торос", "kid": "Пройди по кругу и сосчитай арки. Сколько получилось? Закрой глаза и представь восемь тысяч зрителей.", "segs": [{"audio": "pres/toros-01.mp3", "text": "Название района, Реаль-де-Сан-Карлос, придумали испанские солдаты. В начале шестидесятых годов восемнадцатого века они стояли здесь лагерем и осаждали португальскую крепость, а лагерь назвали в честь короля Карла Третьего. Лагерь давно исчез, и мало кто о нём помнит, зато спустя полтора века на этом месте вырос самый необычный курорт на берегах Ла-Платы.", "caption": "Реаль-де-Сан-Карлос: лагерь испанцев в честь короля Карла III", "big": "", "imgs": [{"src": "img/b_toros-1.jpg", "cap": "Король Испании Карл III: портрет работы Менгса", "credit": "Anton Raphael Mengs, Public domain"}, {"src": "img/intro-3.jpg", "cap": "Педро де Севальос — испанский генерал, который брал Колонию штурмом", "credit": "Unknown author, Public domain"}, {"src": "img/b_toros-2.jpg", "cap": "Плитка с картой Колонии 1762 года — года осады", "credit": "Heretiq, CC BY-SA 3.0"}], "img": "img/b_toros-1.jpg", "credit": "Anton Raphael Mengs, Public domain"}, {"audio": "pres/toros-02.mp3", "text": "Его задумал Николас Миханович, судовладелец родом из Хорватии. Пароходы его компании возили людей через реку, и он решил построить на этом берегу курорт для гостей из Буэнос-Айреса. Разрешение он получил третьего июня тысяча девятьсот восьмого года. В планах были гостиница с казино, площадка для баскской пелоты, своя электростанция и главное украшение, огромная арена для корриды.", "caption": "1908: судовладелец Николас Миханович получает разрешение на курорт", "big": "1908", "imgs": [{"src": "img/b_toros-3.jpg", "cap": "Николас Миханович, судовладелец родом из Хорватии", "credit": "Unknown author, Public domain"}, {"src": "img/b_toros-4.jpg", "cap": "Пирс курорта Реаль-де-Сан-Карлос: рельсы, люди и пароход вдали", "credit": "Unknown photographer, Public domain"}, {"src": "img/b_toros-5.jpg", "cap": "Гостиница с казино в Реаль-де-Сан-Карлос: старая фотография", "credit": "Unknown photographer, Public domain"}], "img": "img/b_toros-3.jpg", "credit": "Unknown author, Public domain"}, {"audio": "pres/toros-03.mp3", "text": "Арену построили примерно за восемь месяцев, и строительство одобрил парламент Уругвая. Проект сделал тоже хорват, архитектор Йосип Маркович, в стиле неомудехар: так называют мавританские мотивы, как на испанских аренах. В поперечнике здание около ста метров, а песчаный круг посередине около пятидесяти. Железный каркас привезли из-за границы и собрали прямо здесь, а кирпичи и черепицу делали на местном заводе. Трибуны вмещали около восьми тысяч человек.", "caption": "Арена в стиле неомудехар: около 100 метров в поперечнике", "big": "100 метров", "imgs": [{"src": "img/toros-1.jpg", "cap": "Арена для боя быков в Реал-де-Сан-Карлос: стены с арками в форме замочной скважины", "credit": "Chzemog, CC BY-SA 3.0"}, {"src": "img/b_toros-6.jpg", "cap": "Стальной каркас и арки-«замочные скважины» арены", "credit": "Melodygar, CC BY-SA 3.0"}, {"src": "img/toros-2.jpg", "cap": "Внутри арены: круглое поле и каменные трибуны, которые заросли травой", "credit": "Mariola0675, CC BY-SA 3.0"}], "img": "img/toros-1.jpg", "credit": "Chzemog, CC BY-SA 3.0"}, {"audio": "pres/toros-04.mp3", "text": "Открытие состоялось девятого января тысяча девятьсот десятого года. Пришло от семи до восьми тысяч зрителей, а гостей из Буэнос-Айреса везли пароходы «Тритон», «Ривадавия» и «Колония». Первыми на арену вышли братья-тореро Рикардо и Мануэль Торрес, которых прозвали Бомбита. Быки были из хозяйства Хуана Нандина.", "caption": "9 января 1910: открытие и братья Бомбита", "big": "1910", "imgs": [{"src": "img/b_toros-7.jpg", "cap": "Арена в начале XX века: старая фотография", "credit": "Unknown photographer, Public domain"}, {"src": "img/b_toros-8.jpg", "cap": "Гости едут на вагонетках по пирсу к арене: старая фотография", "credit": "Unknown photographer, Public domain"}, {"src": "img/b_toros-9.jpg", "cap": "Рикардо Торрес «Бомбита», тореро", "credit": "Compañy, CC0"}], "img": "img/b_toros-7.jpg", "credit": "Unknown photographer, Public domain"}, {"audio": "pres/toros-05.mp3", "text": "Праздник оказался недолгим. Власти Уругвая потребовали, чтобы быков на арене не убивали, и публика осталась недовольна. А в тысяча девятьсот двенадцатом году, при президенте Хосе Батлье-и-Ордоньесе, корриды в стране запретили совсем. Здесь успели провести всего восемь официальных корриды. Говорят, что за всё время на этой арене не погиб ни один бык и ни один тореро.", "caption": "1912: корриды в Уругвае запрещены, прошло всего восемь", "big": "8 корриды", "imgs": [{"src": "img/b_toros-10.jpg", "cap": "Хосе Батлье-и-Ордоньес, президент Уругвая, фото 1910 года", "credit": "Bain News Service, publisher, Public domain"}, {"src": "img/b_toros-11.jpg", "cap": "Гравюра Гойи из серии «Тавромахия»: игра с плащом", "credit": "Francisco Goya, Public domain"}, {"src": "img/toros-3.jpg", "cap": "Старая фотография арены — когда-то сюда ходили целыми семьями", "credit": "Unknown photographer, Public domain"}], "img": "img/b_toros-10.jpg", "credit": "Bain News Service, publisher, Public domain"}, {"audio": "pres/toros-06.mp3", "text": "Одну попытку вернуть корриду всё же сделали. В тысяча девятьсот тридцать пятом году закон разрешил такие представления в департаменте Колония, и девятого июля прошла ещё одна, особая, без пикадоров и с шарами на рогах быков. Но в Испании началась гражданская война, и планы организаторов сорвались.", "caption": "1935: последняя попытка, без пикадоров и с шарами на рогах", "big": "1935", "imgs": [{"src": "img/b_toros-12.jpg", "cap": "Арена и аллея к ней: фотография 1919 года", "credit": "Unknown author, Public domain"}, {"src": "img/b_toros-14.jpg", "cap": "Арена до реставрации: от верхней части фасада остался каркас", "credit": "Mx. Granger, CC0"}], "img": "img/b_toros-12.jpg", "credit": "Unknown author, Public domain"}, {"audio": "pres/toros-07.mp3", "text": "Потом арена почти сто лет стояла без дела. С тысяча девятьсот сорок третьего года комплексом владел город, но здание ветшало, а в две тысячи двенадцатом году после сильного юго-восточного шторма обрушилась верхняя часть фасада. Реставрацию начали в две тысячи девятнадцатом, это стало самым крупным общественным проектом в истории департамента. Девятого декабря две тысячи двадцать первого года арена открылась заново, через сто одиннадцать лет.", "caption": "2021: арена открылась снова через 111 лет", "big": "111 лет", "imgs": [{"src": "img/b_toros-14.jpg", "cap": "Арена до реставрации: от верхней части фасада остался каркас", "credit": "Mx. Granger, CC0"}, {"src": "img/b_toros-15.jpg", "cap": "Разрушенные стены арены до реставрации", "credit": "Niels Elgaard Larsen, CC BY-SA 3.0"}, {"src": "img/b_toros-16.jpg", "cap": "Арена после реставрации, 2021 год: вечерняя подсветка", "credit": "Coquimbo58, CC BY-SA 4.0"}], "img": "img/b_toros-14.jpg", "credit": "Mx. Granger, CC0"}, {"audio": "pres/toros-08.mp3", "text": "Сегодня внутри музей, рестораны и зал для концертов. Музей открыли в феврале этого года, его называют музеем четвёртого поколения. Там есть голограммы, наушники с рассказами, проекции на макете арены, которые показывают, как менялось здание, и коды, которые можно навести телефоном.", "caption": "Музей четвёртого поколения: голограммы, наушники, проекции", "big": "2026", "imgs": [{"src": "img/b_toros-17.jpg", "cap": "Так выглядит проекция света на здание (пример из Барселоны)", "credit": "Jordiferrer, CC BY-SA 4.0"}, {"src": "img/b_toros-18.jpg", "cap": "Арена в синий час: тёплая подсветка арок", "credit": "Marcelo Campi, CC BY-SA 3.0"}], "img": "img/b_toros-17.jpg", "credit": "Jordiferrer, CC BY-SA 4.0"}, {"audio": "pres/toros-09.mp3", "text": "Задание для юного путешественника: пройди по кругу и сосчитай арки. Сколько у тебя получилось? А потом закрой глаза и представь, что вокруг тебя восемь тысяч зрителей и все они хлопают. Громко ли это? Попробуй хлопнуть в ладоши так же громко, как они.", "caption": "Задание: сосчитай арки и представь 8000 зрителей", "big": "", "imgs": [{"src": "img/toros-1.jpg", "cap": "Арена для боя быков в Реал-де-Сан-Карлос: стены с арками в форме замочной скважины", "credit": "Chzemog, CC BY-SA 3.0"}, {"src": "img/b_toros-19.jpg", "cap": "Арки арены изнутри: сосчитай их!", "credit": "AldoGT, CC BY-SA 3.0"}], "img": "img/toros-1.jpg", "credit": "Chzemog, CC BY-SA 3.0"}]}, "fronton": {"title": "Фронтон: самая быстрая игра", "kid": "Найди самую высокую стену. В неё бьют мячом? Покажи, как бросают мяч корзиной на руке.", "segs": [{"audio": "pres/fronton-01.mp3", "text": "Это Фронтон, площадка для баскской пелоты. Игра, которую здесь играют, называется хай-алаи, по-баскски «весёлый праздник». Придумали её баски, жители Страны Басков на севере Испании. Вместо ракетки у игрока длинная плетёная корзина, которая надевается на руку, она называется сеста. А мяч, пелоту, делают вручную: тугой клубок каучука, обшитый двумя слоями козьей кожи.", "caption": "Фронтон: площадка для хай-алаи, «весёлого праздника» басков", "big": "", "imgs": [{"src": "img/b_fronton-3.jpg", "cap": "Страна Басков: зелёные холмы над морем", "credit": "Josu, CC BY-SA 4.0"}, {"src": "img/b_fronton-2.jpg", "cap": "Игроки хай-алаи с плетёными корзинами: Гавана, начало XX века", "credit": "Charles Edward Doty, Public domain"}, {"src": "img/b_fronton-1.jpg", "cap": "Мячи для пелоты: слева валенсийский, справа баскский", "credit": "Casaforra, CC BY-SA 3.0"}], "img": "img/b_fronton-3.jpg", "credit": "Josu, CC BY-SA 4.0"}, {"audio": "pres/fronton-02.mp3", "text": "Игрок ловит мяч в корзину и сразу, одним движением, швыряет его в стену. Площадка с тремя стенами, передней, задней и левой, а справа стены нет. Мяч летит так быстро, что хай-алаи называют самой быстрой игрой с мячом. Рекорд скорости мяча в этой игре триста два километра в час.", "caption": "Рекорд скорости мяча: 302 км/ч", "big": "302 км/ч", "imgs": [{"src": "img/b_fronton-4.jpg", "cap": "Площадка для хай-алаи: стены и игроки", "credit": "Jesus Abizanda from Barbastro, Huesca, Spain, CC BY 2.0"}, {"src": "img/b_fronton-5.jpg", "cap": "Чемпионат мира по баскской пелоте, 2013 год", "credit": "Pierre-Yves Beaudouin, CC BY-SA 4.0"}], "img": "img/b_fronton-4.jpg", "credit": "Jesus Abizanda from Barbastro, Huesca, Spain, CC BY 2.0"}, {"audio": "pres/fronton-03.mp3", "text": "Фронтон появился на свет вместе с остальным курортом Михановича и открылся двадцать седьмого ноября тысяча девятьсот десятого года. Длина площадки шестьдесят четыре метра, ширина двадцать один, на трибунах помещалось три тысячи зрителей. Это самая большая такая площадка в Южной Америке. Её восстановили в тысяча девятьсот семьдесят четвёртом году, и здесь прошёл чемпионат мира, а ещё один в тысяча девятьсот восьмидесятом.", "caption": "27 ноября 1910: 64 на 21 метр и три тысячи зрителей", "big": "64 × 21 м", "imgs": [{"src": "img/fronton-2.jpg", "cap": "Тот же фронтон после реставрации: здание снова живёт", "credit": "Coquimbo58, CC0"}, {"src": "img/b_fronton-6.jpg", "cap": "Фронтон хай-алаи в Майами, 1945 год: большая стена и трибуны", "credit": "Unknown, Public domain"}, {"src": "img/b_fronton-7.jpg", "cap": "Современный фронтон хай-алаи в Мехико: огромная стена и зрители", "credit": "Gobierno CDMX, CC0"}], "img": "img/fronton-2.jpg", "credit": "Coquimbo58, CC0"}, {"audio": "pres/fronton-04.mp3", "text": "Потом Фронтон надолго замолчал. Было время, когда в нём держали конфискованные машины. Но жители о нём не забыли, и семнадцатого октября этого года Фронтон открылся заново. На церемонии по стенам показывали фильм, и здание будто само рассказывало о себе, начиная со слов «Я Фронтон». Игроки шли за школьниками Колонии, которые несли флаги, а первые матчи сыграли Испания со Страной Басков и Франция с Соединёнными Штатами.", "caption": "17 октября 2026: Фронтон открылся заново чемпионатом мира", "big": "2026", "imgs": [{"src": "img/fronton-1.jpg", "cap": "Фронтон Реал-де-Сан-Карлос до реставрации: здание стояло заброшенным", "credit": "Coquimbo58, CC0"}, {"src": "img/b_toros-17.jpg", "cap": "Так выглядит проекция света на здание (пример из Барселоны)", "credit": "Jordiferrer, CC BY-SA 4.0"}, {"src": "img/b_fronton-5.jpg", "cap": "Чемпионат мира по баскской пелоте, 2013 год", "credit": "Pierre-Yves Beaudouin, CC BY-SA 4.0"}], "img": "img/fronton-1.jpg", "credit": "Coquimbo58, CC0"}, {"audio": "pres/fronton-05.mp3", "text": "Рядом стояла гостиница с казино. Казино работало до тысяча девятьсот семнадцатого года. Среди причин упадка называют штраф: власти Аргентины наказывали каждый пароход, который заходил в порт, где играют на деньги. А в гостинице, как пишут, встретились три поэтессы Америки: аргентинка Альфонсина Сторни, чилийка Габриэла Мистраль и уругвайка Хуана де Ибарбуру. Точной даты встречи источники не называют.", "caption": "Гостиница с казино до 1917 года и встреча трёх поэтесс", "big": "1917", "imgs": [{"src": "img/b_fronton-8.jpg", "cap": "Гостиница-казино курорта и паровой трамвай: старая фотография", "credit": "Unknown photographer, Public domain"}, {"src": "img/b_fronton-12.jpg", "cap": "Три поэтессы: Альфонсина Сторни, Габриэла Мистраль, Хуана де Ибарбуру", "credit": "Unknown authors (three archival portraits, collage), Public domain"}], "img": "img/b_fronton-8.jpg", "credit": "Unknown photographer, Public domain"}, {"audio": "pres/fronton-06.mp3", "text": "Гостей доставляли необычным способом. От берега в реку уходил пирс длиной триста метров, и на нём лежали рельсы. По ним катили вагонетки, пассажирские до арены и гостиницы и отдельные для багажа. А вдоль берега ходил настоящий паровой трамвай системы Декавиль, узкоколейка шириной шестьсот миллиметров и около пяти километров длиной. Он возил гостей от причала Колонии к арене с тысяча девятьсот десятого по тысяча девятьсот двенадцатый год, как минимум. От пирса сегодня не осталось ничего: последние доски унесла буря.", "caption": "Пирс 300 метров, вагонетки и паровой трамвай Декавиль", "big": "300 метров", "imgs": [{"src": "img/b_fronton-9.jpg", "cap": "Вагонетки с пассажирами едут по пирсу к арене", "credit": "Unknown photographer, Public domain"}, {"src": "img/b_fronton-10.jpg", "cap": "Паровой трамвай Декавиль: паровозик с вагончиками, около 1910 года", "credit": "Unknown photographer, Public domain"}, {"src": "img/b_fronton-11.jpg", "cap": "Остатки пирса Реаль-де-Сан-Карлос: только сваи в воде", "credit": "AldoGT, CC BY-SA 3.0"}], "img": "img/b_fronton-9.jpg", "credit": "Unknown photographer, Public domain"}, {"audio": "pres/fronton-07.mp3", "text": "Следующим в Реаль-де-Сан-Карлос будут восстанавливать старую электростанцию, которую построили, чтобы дать свет и курорту, и городу. Задание для юного путешественника: найди самую высокую стену Фронтона. Как думаешь, в неё бьют мячом или нет? А потом покажи, как бросают мяч плетёной корзиной на руке. Только не отпускай воображаемый мяч слишком далеко!", "caption": "Задание: найди самую высокую стену", "big": "", "imgs": [{"src": "img/b_fronton-4.jpg", "cap": "Площадка для хай-алаи: стены и игроки", "credit": "Jesus Abizanda from Barbastro, Huesca, Spain, CC BY 2.0"}, {"src": "img/fronton-2.jpg", "cap": "Тот же фронтон после реставрации: здание снова живёт", "credit": "Coquimbo58, CC0"}, {"src": "img/b_fronton-2.jpg", "cap": "Игроки хай-алаи с плетёными корзинами: Гавана, начало XX века", "credit": "Charles Edward Doty, Public domain"}], "img": "img/b_fronton-4.jpg", "credit": "Jesus Abizanda from Barbastro, Huesca, Spain, CC BY 2.0"}]}, "ferry_uruguay": {"title": "Уругвай за пять минут", "kid": "Когда сойдёте на берег, считай, у скольких людей увидишь термос и мате. Найди флаг Уругвая с жёлтым солнцем.", "segs": [{"audio": "pres/ferry_uruguay-01.mp3", "text": "Скоро вы окажетесь в Уругвае. Это маленькая страна: чуть меньше трёх с половиной миллионов жителей, и больше половины из них живут в столице Монтевидео и вокруг неё. А ещё в Уругвае, по официальным данным, около одиннадцати с половиной миллионов коров и быков, то есть больше трёх на каждого жителя. Присматривают за стадами гаучо, пастухи-всадники. А Монтевидео, к слову, самая южная столица на всём американском континенте.", "caption": "Маленькая страна: 3,5 миллиона людей и 11,5 миллиона коров", "big": "3,5 млн", "imgs": [{"src": "img/c_ferry_uruguay-1.jpg", "cap": "Коровы на уругвайской ферме: их здесь больше, чем жителей", "credit": "Lux Valens, CC BY-SA 4.0"}, {"src": "img/c_ferry_uruguay-2.jpg", "cap": "Гаучо: пастух-всадник в пончо и шляпе", "credit": "Vince Alongi, CC BY 2.0"}, {"src": "img/c_ferry_uruguay-3.jpg", "cap": "Монтевидео на закате: самая южная столица Америки", "credit": "Vince Alongi from Delta, B.C., Canada, CC BY 2.0"}], "img": "img/c_ferry_uruguay-1.jpg", "credit": "Lux Valens, CC BY-SA 4.0"}, {"audio": "pres/ferry_uruguay-02.mp3", "text": "Раньше эту землю называли Банда-Ориенталь, Восточный берег, потому что она лежит на восточном берегу реки Уругвай. Здесь, в Монтевидео, в тысяча семьсот шестьдесят четвёртом году родился самый почитаемый герой страны, Хосе Хервасио Артигас. С юности он работал на семейных ранчо, научился у гаучо обращаться с лошадьми, а в тысяча восемьсот одиннадцатом году поднял восстание против испанской власти.", "caption": "Банда-Ориенталь: «Восточный берег» и герой Хосе Хервасио Артигас", "big": "1764", "imgs": [{"src": "img/c_ferry_uruguay-4.jpg", "cap": "Старая карта 1732 года: Банда-Ориенталь, «Восточный берег»", "credit": "Giovanni Petroschi, CC BY 4.0"}, {"src": "img/c_ferry_uruguay-5.jpg", "cap": "Хосе Артигас на картине Хуана Мануэля Бланеса", "credit": "Juan Manuel Blanes, Public domain"}, {"src": "img/c_ferry_uruguay-6.jpg", "cap": "Картина Бланеса: два гаучо у коновязи, у таких пастухов учился Артигас", "credit": "Juan Manuel Blanes, Public domain"}], "img": "img/c_ferry_uruguay-4.jpg", "credit": "Giovanni Petroschi, CC BY 4.0"}, {"audio": "pres/ferry_uruguay-03.mp3", "text": "Самая известная страница его жизни это исход. В начале тысяча восемьсот двенадцатого года около шестнадцати тысяч человек, целые семьи, ушли за Артигасом через реку Уругвай, увозя скот и пожитки на тысяче повозок. Представь такой обоз, малыш! А в тысяча восемьсот пятнадцатом году Артигас издал закон о земле, где сказано, что самые несчастные должны стать самыми привилегированными.", "caption": "Исход 1812 года: 16 000 человек и тысяча повозок", "big": "16 000", "imgs": [{"src": "img/c_ferry_uruguay-7.jpg", "cap": "Картина «Исход восточного народа»: семьи уходят за Артигасом", "credit": "Melchor Méndez Magariños, Public domain"}, {"src": "img/c_ferry_uruguay-8.jpg", "cap": "Старое фото: обоз повозок с быками на привале", "credit": "Jesús Cubela, Public domain"}, {"src": "img/c_ferry_uruguay-9.jpg", "cap": "Артигас в лагере, 1815 год: время закона о земле", "credit": "Luis Queirolo Repetto, Public domain"}], "img": "img/c_ferry_uruguay-7.jpg", "credit": "Melchor Méndez Magariños, Public domain"}, {"audio": "pres/ferry_uruguay-04.mp3", "text": "Но в сентябре тысяча восемьсот двадцатого года Артигас ушёл в изгнание в Парагвай и на родину не вернулся. Он прожил там тридцать лет и умер в тысяча восемьсот пятидесятом году, в восемьдесят шесть лет. А в апреле тысяча восемьсот двадцать пятого года, когда его уже не было, из Аргентины ночью переправилась через реку Уругвай небольшая группа во главе с Хуаном Антонио Лавалехой. Официально считается, что их было тридцать три, поэтому их зовут Тридцатью тремя ориенталями.", "caption": "1820: изгнание в Парагвай; 1825: тридцать три ориентала", "big": "33", "imgs": [{"src": "img/c_ferry_uruguay-10.jpg", "cap": "Единственный портрет Артигаса с натуры: старик в Парагвае", "credit": "Alfredo L. Demersay (Dead ca. 1870), Public domain"}, {"src": "img/c_ferry_uruguay-11.jpg", "cap": "Надгробная плита генерала Артигаса, 1850 год", "credit": "Unknown author, Public domain"}, {"src": "img/ferry_uruguay-2.jpg", "cap": "Картина Бланеса: «Тридцать три восточных» дают клятву освободить свою землю", "credit": "Juan Manuel Blanes, Public domain"}], "img": "img/c_ferry_uruguay-10.jpg", "credit": "Alfredo L. Demersay (Dead ca. 1870), Public domain"}, {"audio": "pres/ferry_uruguay-05.mp3", "text": "Они высадились на пляже Ла-Аграсиада девятнадцатого апреля и подняли флаг с красной, синей и белой полосами и надписью «Свобода или смерть». Четыре месяца спустя, двадцать пятого августа, собрание в городе Ла-Флорида объявило независимость от Бразилии. Эту дату в Уругвае теперь празднуют как День независимости. Началась война с Бразилией, и она шла около трёх лет.", "caption": "25 августа 1825: независимость от Бразилии", "big": "1825", "imgs": [{"src": "img/c_ferry_uruguay-12.jpg", "cap": "Пляж Ла-Аграсиада на реке Уругвай: здесь высадились «тридцать три»", "credit": "Efeland, CC BY-SA 4.0"}, {"src": "img/c_ferry_uruguay-13.jpg", "cap": "Флаг Тридцати трёх ориенталей: «Свобода или смерть»", "credit": "Gerardo Irazabal Valledor, CC BY-SA 3.0"}, {"src": "img/c_ferry_uruguay-14.jpg", "cap": "Акт о независимости 25 августа 1825 года (факсимиле)", "credit": "Unknown author, Public domain"}], "img": "img/c_ferry_uruguay-12.jpg", "credit": "Efeland, CC BY-SA 4.0"}, {"audio": "pres/ferry_uruguay-06.mp3", "text": "Война закончилась в тысяча восемьсот двадцать восьмом году договором, посредником в котором выступила Великобритания, а английский дипломат лорд Понсонби помогал сторонам договориться. Так появилось отдельное государство, Восточная Республика Уругвай. Колония, где вы скоро будете, окончательно стала уругвайской второго декабря того же года. А первую конституцию страны приняли восемнадцатого июля тысяча восемьсот тридцатого года.", "caption": "1828: мир при посредничестве Англии; 1830: первая конституция", "big": "1830", "imgs": [{"src": "img/c_ferry_uruguay-15.jpg", "cap": "Лорд Понсонби, английский дипломат, помогавший заключить мир", "credit": "John Frederick Lewis, Public domain"}, {"src": "img/c_ferry_uruguay-16.jpg", "cap": "Картина: народ празднует присягу первой конституции 1830 года", "credit": "Pedro Blanes Viale, Public domain"}, {"src": "img/c_ferry_uruguay-17.jpg", "cap": "Первая конституция Уругвая 1830 года в Законодательном дворце", "credit": "Andrea Mazza, CC BY 3.0"}], "img": "img/c_ferry_uruguay-15.jpg", "credit": "John Frederick Lewis, Public domain"}, {"audio": "pres/ferry_uruguay-07.mp3", "text": "Конституции исполнялось сто лет, и в тысяча девятьсот тридцатом году Уругвай устроил праздник: первый в истории чемпионат мира по футболу. Хозяев выбрали ещё и потому, что их сборная выиграла Олимпийские игры тысяча девятьсот двадцать восьмого года. К чемпионату построили стадион «Сентенарио», что значит «столетний». Команды из Европы плыли на пароходе около двух недель. Финал выиграл Уругвай, обыграв Аргентину со счётом четыре два.", "caption": "1930: Уругвай принимает и выигрывает первый чемпионат мира", "big": "1930", "imgs": [{"src": "img/c_ferry_uruguay-18.jpg", "cap": "Сборная Уругвая 1930 года, первые чемпионы мира", "credit": "Unknown author, Public domain"}, {"src": "img/ferry_uruguay-3.jpg", "cap": "Стадион Сентенарио с воздуха во время финала первого чемпионата мира по футболу 1930 года", "credit": "Unknown author, Public domain"}, {"src": "img/c_ferry_uruguay-19.jpg", "cap": "Пароход «Конте Верде»: на таком плыли команды из Европы", "credit": "Unknown author, Public domain"}], "img": "img/c_ferry_uruguay-18.jpg", "credit": "Unknown author, Public domain"}, {"audio": "pres/ferry_uruguay-08.mp3", "text": "Были и забавные детали. Две команды не смогли договориться, каким мячом играть, и решили так: в одном тайме играли мячом одной команды, в другом мячом другой. А тысячи аргентинцев переправлялись через ту самую реку, по которой вы сейчас плывёте, на любых лодках, какие удавалось найти, и многие опоздали к началу матча.", "caption": "Два мяча в одном матче и лодки через реку", "big": "4:2", "imgs": [{"src": "img/c_ferry_uruguay-20.jpg", "cap": "Два мяча финала 1930 года: в каждом тайме играли разным", "credit": "Ben Sutherland, CC BY 2.0"}, {"src": "img/c_ferry_uruguay-21.jpg", "cap": "Парусник на Ла-Плате: на любых лодках болельщики спешили на матч", "credit": "Marcos Anders, CC BY-SA 4.0"}, {"src": "img/c_ferry_uruguay-22.jpg", "cap": "Болельщики Уругвая празднуют победу 1930 года", "credit": "Unknown author, Public domain"}], "img": "img/c_ferry_uruguay-20.jpg", "credit": "Ben Sutherland, CC BY 2.0"}, {"audio": "pres/ferry_uruguay-09.mp3", "text": "Через двадцать лет, шестнадцатого июля тысяча девятьсот пятидесятого года, уругвайцы совершили второе чудо. В Бразилии, на стадионе Маракана, где собралось около ста семидесяти четырёх тысяч зрителей, бразильцам для победы хватало ничьей. Но Уругвай выиграл со счётом два один. Капитан Обдулио Варела потом сказал, что если бы они сыграли этот матч ещё девяносто девять раз, то проиграли бы все. Этот матч называют Мараканасо.", "caption": "16 июля 1950: Мараканасо, Уругвай 2:1 Бразилия", "big": "2:1", "imgs": [{"src": "img/c_ferry_uruguay-23.jpg", "cap": "Матч Бразилия, Уругвай на «Маракане», 1950 год", "credit": "TheGuyWhoShammars, CC BY-SA 4.0"}, {"src": "img/c_ferry_uruguay-24.jpg", "cap": "Капитан Обдулио Варела, герой Мараканасо", "credit": "Unknown author, Public domain"}, {"src": "img/c_ferry_uruguay-25.jpg", "cap": "Гол Альсидеса Гиггии, принёсший Уругваю победу 2:1", "credit": "Unknown author, Public domain"}], "img": "img/c_ferry_uruguay-23.jpg", "credit": "TheGuyWhoShammars, CC BY-SA 4.0"}, {"audio": "pres/ferry_uruguay-10.mp3", "text": "Ещё одна страсть уругвайцев это мате, горячий настой травы, который пьют через металлическую трубочку из чашки. Уругвайцы ходят по улицам с термосом под мышкой и мате в руке. По оценкам одного уругвайского издания, на человека выходит около десяти килограммов травы в год, больше, чем в Аргентине. А ещё в Уругвае звучит барабанный ритм кандомбе, и в две тысячи девятом году ЮНЕСКО внесла его в список нематериального наследия человечества.", "caption": "Мате и кандомбе: термос под мышкой и барабаны", "big": "10 кг в год", "imgs": [{"src": "img/c_ferry_uruguay-26.jpg", "cap": "Мате и термос: главные спутники уругвайца", "credit": "Unknown (see source page), CC BY 2.5"}, {"src": "img/c_ferry_uruguay-27.jpg", "cap": "Болельщики пьют мате прямо на стадионе", "credit": "Vince Alongi from Delta, B.C., Canada, CC BY 2.0"}, {"src": "img/ferry_uruguay-5.jpg", "cap": "Кандомбе: барабанщики на карнавальном параде Льямадас в Монтевидео", "credit": "Manzanita2203, CC BY-SA 4.0"}], "img": "img/c_ferry_uruguay-26.jpg", "credit": "Unknown (see source page), CC BY 2.5"}, {"audio": "pres/ferry_uruguay-11.mp3", "text": "Теперь вы знаете главное об Уругвае: коровы, гаучо, Артигас, футбол и мате. Задание для юного путешественника: когда мы сойдём на берег, считай, у скольких людей ты увидишь термос и мате. А ещё найди флаг Уругвая, на нём есть жёлтое солнце. Нашёл? Сосчитай, сколько на флаге полосок, и скажи, какого они цвета. Тогда ты будешь знать флаг Уругвая лучше многих взрослых.", "caption": "Задание: считай термосы и ищи флаг с солнцем", "big": "", "imgs": [{"src": "img/c_ferry_uruguay-28.jpg", "cap": "Флаг Уругвая с жёлтым Майским солнцем на ветру", "credit": "Alex Proimos from Sydney, Australia, CC BY 2.0"}, {"src": "img/c_ferry_uruguay-29.jpg", "cap": "Девять полос: пять белых и четыре голубых, в углу солнце", "credit": "Wikimedia Commons contributors, Public domain"}, {"src": "img/c_ferry_uruguay-30.jpg", "cap": "Мате на парапете у реки: считай, сколько таких увидишь", "credit": "Arcstur, CC BY-SA 4.0"}], "img": "img/c_ferry_uruguay-28.jpg", "credit": "Alex Proimos from Sydney, Australia, CC BY 2.0"}]}, "ferry_people": {"title": "Кто живёт в Уругвае: индейцы, переселенцы, мы сегодня", "kid": "Когда сойдёте на берег, слушай, не раздастся ли барабан. Постучи по коленкам три ритма: тихо, как чико, громче, как репике, низко, как пиано.", "segs": [{"audio": "pres/ferry_people-01.mp3", "text": "Вы уже слышали про коров, гаучо и Артигаса, а теперь давайте познакомимся с первыми жителями этой земли. Задолго до испанцев здесь жили индейцы чарруа, чана, гуарани и миньуаны, по оценкам учёных, всего десять или двадцать тысяч человек. Чарруа, как писали первые испанцы, были люди рослые и смелые. Они кочевали по степи: летом ловили рыбу у берегов, а зимой охотились на оленей и страусов нанду.", "caption": "Чарруа, чана, гуарани и миньуаны: первые жители этой земли", "big": "10–20 тысяч", "imgs": [{"src": "img/d1_1.jpg", "cap": "Вождь чарруа на коне, литография Дебре, около 1834 года", "credit": "Jean-Baptiste Debret, Public domain"}, {"src": "img/d1_2.jpg", "cap": "Пампасский олень в уругвайской степи: добыча чарруа", "credit": "Fedaro, CC BY-SA 4.0"}, {"src": "img/d1_3.jpg", "cap": "Нанду, южноамериканский страус: на него охотились чарруа", "credit": "Charles J. Sharp, CC BY-SA 4.0"}], "img": "img/d1_1.jpg", "credit": "Jean-Baptiste Debret, Public domain"}, {"audio": "pres/ferry_people-02.mp3", "text": "Главное оружие чарруа называется болеадорас: два или три тяжёлых камня на кожаных ремнях. Охотник раскручивает их и бросает, и ремни обвивают ноги бегущему нанду. Потом пришли испанцы и привезли лошадей и коров. В тысяча шестьсот одиннадцатом году губернатор Эрнандариас выпустил скот на острова реки Рио-Негро, и стада быстро разрослись. Индейцы сели на коней, ловили одичавших коров и торговали лошадьми.", "caption": "Болеадорас: камни на ремнях. Лошадей и коров привезли испанцы", "big": "1611", "imgs": [{"src": "img/d1_4.jpg", "cap": "Чарруа с лассо и болеадорас, литография Дебре, около 1834 года", "credit": "Jean-Baptiste Debret, Public domain"}, {"src": "img/d1_5.jpg", "cap": "Тяжёлые камни болеадорас в музее", "credit": "Carohv91, CC BY-SA 4.0"}, {"src": "img/d1_6.jpg", "cap": "Охота на диких лошадей с болеадорас, рисунок Паукке, 1752 год", "credit": "Florian Paucke, Public domain"}], "img": "img/d1_4.jpg", "credit": "Jean-Baptiste Debret, Public domain"}, {"audio": "pres/ferry_people-03.mp3", "text": "Чана жили на островах реки Уругвай, а гуарани были земледельцами и выращивали кукурузу и маниок. Многие гуарани поселились в иезуитских миссиях, больших селениях со школой, мастерскими, хором и оркестром. Всего таких селений было тридцать, и семь из них стояли на восточном берегу реки Уругвай, где теперь Бразилия. А в том же департаменте, что и Колония, в городе Кармело, до сих пор стоят руины церкви, которую построили иезуиты.", "caption": "Гуарани и иезуитские миссии: школа, мастерские, хор и оркестр", "big": "30 селений", "imgs": [{"src": "img/d1_7.jpg", "cap": "Гуарани на литографии Дебре, 1830-е годы", "credit": "Jean-Baptiste Debret (Arquivo Nacional do Brasil), Public domain"}, {"src": "img/d1_8.jpg", "cap": "Руины иезуитской миссии Сан-Мигель, где жили гуарани", "credit": "Nilson Cunha, CC BY-SA 4.0"}, {"src": "img/d1_9.jpg", "cap": "Калера-де-лас-Уэрфанас в Кармело: руины иезуитской церкви", "credit": "Fedaro, CC BY-SA 3.0"}], "img": "img/d1_7.jpg", "credit": "Jean-Baptiste Debret (Arquivo Nacional do Brasil), Public domain"}, {"audio": "pres/ferry_people-04.mp3", "text": "Испания и Португалия спорили за эту землю, и в тысяча семьсот двадцать третьем году португальцы построили форт на месте будущего Монтевидео. Испанцы их прогнали и начали строить город, а стены помогали возводить больше тысячи индейцев, в основном гуарани. Девятнадцатого ноября тысяча семьсот двадцать шестого года сюда приплыли семьи с Канарских островов, около ста человек. Канарцев вспоминают как основателей Монтевидео.", "caption": "Монтевидео, 1726: семьи с Канарских островов приплыли в бухту", "big": "1726", "imgs": [{"src": "img/d1_11.jpg", "cap": "Бруно Маурисио де Сабала, испанский губернатор и основатель Монтевидео", "credit": "unknown author (portrait of Bruno Mauricio de Zabala), Public domain"}, {"src": "img/d1_12.jpg", "cap": "Монтевидео конца восемнадцатого века за крепостными стенами", "credit": "Leonie Matthis, Public domain"}], "img": "img/d1_11.jpg", "credit": "unknown author (portrait of Bruno Mauricio de Zabala), Public domain"}, {"audio": "pres/ferry_people-05.mp3", "text": "Была в истории Монтевидео и печальная страница. Через его порт шли невольничьи корабли, и сюда против воли привезли тысячи людей из Африки. Закон тысяча восемьсот двадцать пятого года объявил свободными детей, которые родятся, а рабство окончательно отменили в тысяча восемьсот сорок шестом году. Но люди сохранили свою музыку: барабаны, ритм и танец стали основой кандомбе, а корни этого ритма уходят в Анголу и Конго.", "caption": "Порт Монтевидео и невольничьи корабли, закон 1825 года, конец рабства в 1846", "big": "1846", "imgs": [{"src": "img/d1_13.jpg", "cap": "Рейд Монтевидео с кораблями, рисунок Д'Астреля, 1840 год", "credit": "Adolphe d'Hastrel de Rivedoux, Public domain"}, {"src": "img/d1_14.jpg", "cap": "Касерио-де-лос-Негрос в Монтевидео, снимок 1902 года", "credit": "unknown author (Rojo y Blanco, 13 Dec 1902), Public domain"}, {"src": "img/d1_15.jpg", "cap": "Сцена кандомбе в Монтевидео, 1870 год", "credit": "unknown author (Archivo General de la Nación), Public domain"}], "img": "img/d1_13.jpg", "credit": "Adolphe d'Hastrel de Rivedoux, Public domain"}, {"audio": "pres/ferry_people-06.mp3", "text": "Кандомбе играют на трёх барабанах: маленьком чико, среднем репике и самом большом и низком, который почему-то зовут пиано. Вы уже слышали, что ЮНЕСКО признала его наследием человечества. А парад барабанщиков называется льямадас, то есть призывы. Каждый февраль в районах Сур и Пальермо по улицам Монтевидео шагают десятки групп, и в каждой не меньше пятидесяти барабанщиков.", "caption": "Кандомбе: три барабана и парад Льямадас каждый февраль", "big": "3 барабана", "imgs": [{"src": "img/d1_16.jpg", "cap": "Три барабана кандомбе: чико, репике и пиано", "credit": "Negromacondo, CC0"}, {"src": "img/d1_17.jpg", "cap": "Барабанщики на параде Льямадас в Монтевидео, 2010 год", "credit": "Latangocandombe, CC BY-SA 3.0"}, {"src": "img/d1_18.jpg", "cap": "Барабанщики группы «Ми Морена» на параде Льямадас", "credit": "Leovola, CC BY-SA 3.0"}], "img": "img/d1_16.jpg", "credit": "Negromacondo, CC0"}, {"audio": "pres/ferry_people-07.mp3", "text": "А в степях между реками появились гаучо. Первые гаучо были потомками испанцев и индейских женщин, а у некоторых были и африканские предки. Они ловили одичавший скот, укрощали лошадей, носили пончо и широкие штаны бомбачас, а в руках держали лассо и болеадорас. В тысяча восемьсот семидесятых годах степи к югу от реки Рио-Негро огородили проволокой, и вольной жизни пришёл конец.", "caption": "Гаучо: пончо, лассо, болеадорас, а потом колючая проволока", "big": "1870-е", "imgs": [{"src": "img/d1_19.jpg", "cap": "Гаучо с лассо, картина Хуана Мануэля Бланеса, 1865 год", "credit": "Juan Manuel Blanes, Public domain"}, {"src": "img/d1_20.jpg", "cap": "Укрощение лошади, картина Хуана Мануэля Бланеса, около 1875 года", "credit": "Juan Manuel Blanes, Public domain"}, {"src": "img/d1_21.jpg", "cap": "Охота на нанду с болеадорас, картина Морица Ругендаса, 1845 год", "credit": "Johann Moritz Rugendas, Public domain"}], "img": "img/d1_19.jpg", "credit": "Juan Manuel Blanes, Public domain"}, {"audio": "pres/ferry_people-08.mp3", "text": "Теперь грустная часть, малыш, но о ней нужно знать. Между скотоводами и чарруа давно шла вражда из-за скота. Одиннадцатого апреля тысяча восемьсот тридцать первого года у ручья Сальсипуэдес, что значит «выберись, если сможешь», военные напали на лагерь чарруа. Многие погибли, остальные разбежались, а около трёхсот человек взяли в плен. После этого много лет считалось, что чарруа больше нет. Но это неправда.", "caption": "Сальсипуэдес, 11 апреля 1831 года: чарруа не исчезли", "big": "1831", "imgs": [{"src": "img/d1_22.jpg", "cap": "Табличка Совета нации чарруа: «Мы остаёмся на ногах»", "credit": "Damiantorko, CC BY-SA 4.0"}, {"src": "img/d1_23.jpg", "cap": "Флаг народа чарруа", "credit": "Germenfer, Public domain"}, {"src": "img/d1_24.jpg", "cap": "Река Рио-Негро в Уругвае", "credit": "Mx. Granger, CC0"}], "img": "img/d1_22.jpg", "credit": "Damiantorko, CC BY-SA 4.0"}, {"audio": "pres/ferry_people-09.mp3", "text": "Четверо выживших, вождь Вайимака Пиру, лекарь Сенаке, воин Такуабе и молодая женщина Гуюнуса, в тысяча восемьсот тридцать третьем году оказались на корабле: их повезли в Париж, чтобы показывать публике. Домой никто из них не вернулся. Останки вождя около ста семидесяти лет хранили во Франции, и семнадцатого июля две тысячи второго года их вернули Уругваю и с почестями похоронили в Монтевидео. А одиннадцатое апреля теперь День нации чарруа.", "caption": "Париж, 1833: четверо чарруа. 2002: Вайимака Пиру вернулся домой", "big": "2002", "imgs": [{"src": "img/d1_25.jpg", "cap": "Четверо чарруа в Париже, рисунок 1833 года", "credit": "Delaunois, Public domain"}, {"src": "img/d1_26.jpg", "cap": "Дворец Шайо в Париже, где хранились останки", "credit": "Fred Romero from Paris, France, CC BY 2.0"}, {"src": "img/d1_27.jpg", "cap": "Памятник «Последние чарруа» в Монтевидео", "credit": "Marinna, CC BY-SA 4.0"}], "img": "img/d1_25.jpg", "credit": "Delaunois, Public domain"}, {"audio": "pres/ferry_people-10.mp3", "text": "Страну заселили переселенцы. С середины девятнадцатого до начала двадцатого века приплыли сотни тысяч европейцев, в основном итальянцев и испанцев, и в тысяча девятьсот восьмом году примерно каждый шестой житель родился за границей. Итальянцы принесли пасту, и до сих пор принято есть ньокки двадцать девятого числа каждого месяца. Швейцарцы основали Нуэва-Эльвесию в департаменте Колония, а русские семьи в тысяча девятьсот тринадцатом году основали посёлок Сан-Хавьер.", "caption": "Переселенцы: итальянцы, испанцы, швейцарцы, русские", "big": "1 из 6", "imgs": [{"src": "img/d1_28.jpg", "cap": "Порт Монтевидео, 1916 год: пароход и люди на причале", "credit": "Centro de Fotografía de Montevideo (Intendencia de Montevideo), Public domain"}, {"src": "img/d1_29.jpg", "cap": "Нуэва-Эльвесия: флаги стран поселенцев на площади основателей", "credit": "Rosina Peixoto, CC BY-SA 3.0"}, {"src": "img/d1_30.jpg", "cap": "Матрёшки в Сан-Хавьере: память о русских переселенцах", "credit": "Louis Lalaguna, CC BY-SA 3.0"}], "img": "img/d1_28.jpg", "credit": "Centro de Fotografía de Montevideo (Intendencia de Montevideo), Public domain"}, {"audio": "pres/ferry_people-11.mp3", "text": "Вы уже знаете, сколько здесь людей, а теперь узнаем, откуда они родом. По переписи две тысячи двадцать третьего года, около восьмидесяти восьми процентов уругвайцев назвали среди своих предков европейцев, почти одиннадцать процентов африканцев и больше шести процентов индейцев. Эти числа в сумме дают больше ста, потому что у многих сразу несколько корней. Так что Уругвай похож на большой пёстрый салат из народов.", "caption": "Предки уругвайцев по переписи 2023 года: 88% европейские, 11% африканские, 6% индейские", "big": "88%", "imgs": [{"src": "img/d1_31.jpg", "cap": "Уличный рынок Тристан-Нарваха в Монтевидео", "credit": "Jimmy Baikovicius from Montevideo, Uruguay, CC BY-SA 2.0"}, {"src": "img/d1_32.jpg", "cap": "Площадь Независимости в Монтевидео", "credit": "Mx. Granger, CC0"}, {"src": "img/d1_33.jpg", "cap": "Набережная Рамбла и пляж в Монтевидео", "credit": "FLASHPACKER TRAVELGUIDE, CC BY-SA 2.0"}], "img": "img/d1_31.jpg", "credit": "Jimmy Baikovicius from Montevideo, Uruguay, CC BY-SA 2.0"}, {"audio": "pres/ferry_people-12.mp3", "text": "Задание для юного путешественника: когда мы сойдём на берег, слушай, не раздастся ли где-нибудь барабан. Если услышишь, постучи по коленкам три ритма: тихо, как чико, чуть громче, как репике, и совсем низко, как пиано. А потом посмотри на людей вокруг и придумай, из какой страны могли приехать их прадедушки: из Италии, Испании, Швейцарии или России.", "caption": "Задание: послушай барабан и простучи три ритма кандомбе", "big": "", "imgs": [{"src": "img/d1_34.jpg", "cap": "Барабанщики кандомбе на улице Монтевидео", "credit": "Intendencia de Montevideo, CC BY-SA 4.0"}, {"src": "img/d1_35.jpg", "cap": "Танец кандомбе, картина Педро Фигари, 1921 год", "credit": "Pedro Figari, Public domain"}, {"src": "img/d1_36.jpg", "cap": "Роспись на стене в Монтевидео: кандомбе и Карлос Гардель", "credit": "Andrés Franchi Ugart…, CC BY-SA 3.0"}], "img": "img/d1_34.jpg", "credit": "Intendencia de Montevideo, CC BY-SA 4.0"}]}, "ferry_state": {"title": "Как Уругвай стал государством", "kid": "Найди в Колонии что-нибудь красное и что-нибудь белое, цвета колорадо и бланко, сосчитай, чего больше, и выбери свой любимый цвет.", "segs": [{"audio": "pres/ferry_state-01.mp3", "text": "Независимость Уругвай получил в тысяча восемьсот двадцать восьмом году, а первую конституцию принял в тысяча восемьсот тридцатом. Но страну мало объявить, её надо ещё построить. Первым президентом избрали Фруктуосо Риверу, соратника Артигаса. Он вступил в должность шестого ноября тысяча восемьсот тридцатого года. Но в юной стране нашлось слишком много людей, которые считали, что править должны именно они.", "caption": "6 ноября 1830: Фруктуосо Ривера вступает в должность первого президента", "big": "1830", "imgs": [{"src": "img/d2_1.jpg", "cap": "Фруктуосо Ривера, первый президент Уругвая: портрет Хуана Мануэля Бланеса", "credit": "Juan Manuel Blanes, Public domain"}, {"src": "img/c_ferry_uruguay-16.jpg", "cap": "Картина: народ празднует присягу первой конституции 1830 года", "credit": "Pedro Blanes Viale, Public domain"}, {"src": "img/d2_2.jpg", "cap": "Ривера в старости: дагеротип, настоящая фотография XIX века", "credit": "Unknown author, Public domain"}], "img": "img/d2_1.jpg", "credit": "Juan Manuel Blanes, Public domain"}, {"audio": "pres/ferry_state-02.mp3", "text": "Вторым президентом стал Мануэль Орибе, которого Ривера сам поддерживал. Но в тысяча восемьсот тридцать шестом году Ривера поднял мятеж. У Карпинтерии сошлись два войска, и солдаты повязали на головы ленты, чтобы не путать своих с чужими. У людей Орибе они были белые, а у людей Риверы красные. Так появились бланко, белые, и колорадо, красные. Есть и предание, будто сначала ленты были голубые, но выцветали на солнце.", "caption": "1836: Ривера против Орибе. Белые ленты у бланко, красные у колорадо", "big": "1836", "imgs": [{"src": "img/d2_3.jpg", "cap": "Мануэль Орибе, второй президент Уругвая: портрет Эдуардо Карбахаля", "credit": "Eduardo Dionisio Carbajal, Public domain"}, {"src": "img/d2_4.jpg", "cap": "Партийные ленты, белые и красные, в музее города Такуарембо", "credit": "Tano4595, CC BY-SA 2.5"}, {"src": "img/d2_5.jpg", "cap": "Карта мятежа Риверы 1836 года, с которого пошли белые и красные", "credit": "Vicente.r345, CC0"}], "img": "img/d2_3.jpg", "credit": "Eduardo Dionisio Carbajal, Public domain"}, {"audio": "pres/ferry_state-03.mp3", "text": "Ссора разрослась в Большую войну, которая шла с тысяча восемьсот тридцать девятого по тысяча восемьсот пятьдесят первый год. Шестнадцатого февраля тысяча восемьсот сорок третьего года войска Орибе окружили Монтевидео. Осада тянулась почти девять лет. Среди защитников было много приезжих: французов, итальянцев, басков. А писатель Александр Дюма, автор «Трёх мушкетёров», назвал книгу об этой осаде «Новая Троя», хотя в Уругвае никогда не бывал.", "caption": "Осада Монтевидео с 1843 по 1851 год: Дюма назвал её «Новой Троей»", "big": "почти 9 лет", "imgs": [{"src": "img/d2_6.jpg", "cap": "План Монтевидео во время осады: город на мысу и лагерь осаждающих", "credit": "Charly75, CC BY-SA 4.0"}, {"src": "img/d2_7.jpg", "cap": "Солдаты армии Орибе у Монтевидео: рисунок Думика, 1844 год", "credit": "Doumic, Museo Histórico Nacional (Argentina), CC BY-SA 4.0"}, {"src": "img/d2_8.jpg", "cap": "Титул книги Дюма «Монтевидео, или Новая Троя»", "credit": "Alexandre Dumas, Public domain"}], "img": "img/d2_6.jpg", "credit": "Charly75, CC BY-SA 4.0"}, {"audio": "pres/ferry_state-04.mp3", "text": "Был среди них и итальянец Джузеппе Гарибальди, которого здесь зовут Хосе. Он командовал флотом и собрал Итальянский легион. По одной из версий, красные рубашки легионерам достались из партии дешёвой ткани, купленной для рабочих мясных заводов. Скорее всего, это легенда. В тысяча восемьсот сорок пятом году его отряд занял Колонию, куда вы плывёте, и теперь в Колонии стоит памятник Гарибальди.", "caption": "Гарибальди в Уругвае: Итальянский легион, красные рубашки и взятие Колонии", "big": "1845", "imgs": [{"src": "img/d2_9.jpg", "cap": "Молодой Гарибальди в красной шапке: портрет Кайетано Галлино", "credit": "Cayetano Gallino, Public domain"}, {"src": "img/d2_10.jpg", "cap": "Красная рубашка гарибальдийца", "credit": "Assianir, CC BY-SA 3.0"}, {"src": "img/d2_11.jpg", "cap": "Памятник Гарибальди в Колонии-дель-Сакраменто", "credit": "Florencia Vittori, CC BY-SA 4.0"}], "img": "img/d2_9.jpg", "credit": "Cayetano Gallino, Public domain"}, {"audio": "pres/ferry_state-05.mp3", "text": "Война закончилась восьмого октября тысяча восемьсот пятьдесят первого года соглашением без побеждённых и без победителей. Но бланко и колорадо никуда не исчезли. Национальная партия, бланко, и партия Колорадо до сих пор считаются традиционными. Много десятилетий выборы выигрывали только они, пока в две тысячи четвёртом году не победил Широкий фронт. А шоссе из Колонии в Монтевидео носит имя Орибе.", "caption": "8 октября 1851: мир без победителей. Бланко и колорадо живут до сих пор", "big": "1851", "imgs": [{"src": "img/d2_12.jpg", "cap": "Герб Национальной партии, бланко: «Мы идея, союз даёт нам силу»", "credit": "Escudo del Partido Nacional (Uruguay).jpg: Juan José de Herrera y Luis Alberto de Herrera; derivative work: ecelan, Nessa los, Public domain"}, {"src": "img/d2_13.jpg", "cap": "Флаг партии Колорадо: красное полотнище с жёлтым солнцем", "credit": "Froztbyte (vector), CC BY-SA 3.0"}, {"src": "img/d2_14.jpg", "cap": "Старый марш партии Колорадо на площади Независимости", "credit": "Centro de Fotografía de Montevideo (Intendencia de Montevideo), Public domain"}], "img": "img/d2_12.jpg", "credit": "Escudo del Partido Nacional (Uruguay).jpg: Juan José de Herrera y Luis Alberto de Herrera; derivative work: ecelan, Nessa los, Public domain"}, {"audio": "pres/ferry_state-06.mp3", "text": "Теперь перенесёмся в начало двадцатого века. Хосе Батлье-и-Ордоньес, журналист из партии Колорадо, которого все звали дон Пепе, основал газету «Эль Диа», такую дешёвую, что её читали все. Президентом он был дважды: с тысяча девятьсот третьего по тысяча девятьсот седьмой год и с тысяча девятьсот одиннадцатого по тысяча девятьсот пятнадцатый. Побывав в Швейцарии, он решил, что страной лучше управлять советом, а не одним человеком.", "caption": "Дон Пепе: Хосе Батлье-и-Ордоньес, президент в 1903 и в 1911 годах", "big": "1903", "imgs": [{"src": "img/d2_15.jpg", "cap": "Хосе Батлье-и-Ордоньес с президентской лентой", "credit": "Bain News Service, Public domain"}, {"src": "img/d2_16.jpg", "cap": "Памятник дону Пепе Батлье в Монтевидео", "credit": "Ignacio Turell, CC BY-SA 4.0"}, {"src": "img/d2_17.jpg", "cap": "Дом-музей Батлье: гостиная с портретами", "credit": "Nicolas Barriola, CC BY-SA 3.0"}], "img": "img/d2_15.jpg", "credit": "Bain News Service, Public domain"}, {"audio": "pres/ferry_state-07.mp3", "text": "Батлье считал, что государство должно заботиться обо всех. В эти годы церковь отделили от государства, в больницах убрали кресты, появился закон о разводе. Учёба в лицеях и университете стала бесплатной, возникли государственные банки и электрокомпания. А в тысяча девятьсот пятнадцатом году закон ограничил рабочий день восемью часами. Представь, малыш: взрослым больше не надо работать с утра до ночи!", "caption": "Реформы Батлье: развод, светское государство, бесплатная учёба, восьмичасовой день", "big": "8 часов", "imgs": [{"src": "img/d2_18.jpg", "cap": "Одна из первых рабочих демонстраций Уругвая: «Народ против дороговизны»", "credit": "Unknown author, Public domain"}, {"src": "img/d2_19.jpg", "cap": "Здание Университета Республики в Монтевидео, старый снимок", "credit": "Centro de Fotografía de Montevideo (Intendencia de Montevideo), Public domain"}, {"src": "img/d2_20.jpg", "cap": "Здание государственного Банка Республики, старый снимок", "credit": "Centro de Fotografía de Montevideo (Intendencia de Montevideo), Public domain"}], "img": "img/d2_18.jpg", "credit": "Unknown author, Public domain"}, {"audio": "pres/ferry_state-08.mp3", "text": "Жители городка Серро-Чато в тысяча девятьсот двадцать седьмом году голосовали, к какому департаменту им присоединиться. Третьего июля к урнам впервые в Уругвае пришли и женщины. Табличка в городке называет это первым разом в Южной Америке, но историки напоминают: в Эквадоре женщина проголосовала ещё в тысяча девятьсот двадцать четвёртом. За женское право голоса боролась врач Паулина Луиси. На общенациональных выборах женщины проголосовали в тысяча девятьсот тридцать восьмом году.", "caption": "3 июля 1927: в Серро-Чато к урнам впервые в Уругвае пришли женщины", "big": "1927", "imgs": [{"src": "img/d2_21.jpg", "cap": "Табличка в Серро-Чато: здесь 3 июля 1927 года голосовала женщина", "credit": "Pepe_piton, CC BY-SA 4.0"}, {"src": "img/d2_22.jpg", "cap": "Паулина Луиси, врач и борец за право голоса женщин, 1919 год", "credit": "Unknown author (1919 publication), Public domain"}, {"src": "img/d2_23.jpg", "cap": "Плакат 1938 года: женщина опускает бюллетень в урну", "credit": "Unknown author, Public domain"}], "img": "img/d2_21.jpg", "credit": "Pepe_piton, CC BY-SA 4.0"}, {"audio": "pres/ferry_state-09.mp3", "text": "Так что в первой половине двадцатого века Уругвай процветал, и его называли Швейцарией Америки. В тысяча девятьсот двадцать пятом году открыли Законодательный дворец, начатый ещё при Батлье, со стенами из мрамора, добытого в самой стране. В тысяча девятьсот двадцать восьмом году вырос Дворец Сальво, одно время самое высокое здание Латинской Америки. А столетие конституции в тысяча девятьсот тридцатом году город встретил морем огней.", "caption": "«Швейцария Америки»: Законодательный дворец 1925 года и Дворец Сальво 1928 года", "big": "1925", "imgs": [{"src": "img/d2_24.jpg", "cap": "Законодательный дворец в день открытия, 1925 год", "credit": "Centro de Fotografía de Montevideo (Intendencia de Montevideo), Public domain"}, {"src": "img/d2_25.jpg", "cap": "Дворец Сальво на площади Независимости в Монтевидео", "credit": "Herr stahlhoefer, Public domain"}, {"src": "img/d2_26.jpg", "cap": "Проспект 18 июля в огнях к столетию конституции, 1930 год", "credit": "Centro de Fotografía de Montevideo (Intendencia de Montevideo), Public domain"}], "img": "img/d2_24.jpg", "credit": "Centro de Fotografía de Montevideo (Intendencia de Montevideo), Public domain"}, {"audio": "pres/ferry_state-10.mp3", "text": "Но и в благополучной стране бывают тяжёлые времена. В тысяча девятьсот семьдесят третьем году власть захватили военные, и почти двенадцать лет многих людей арестовывали за взгляды, а многие уехали. В тысяча девятьсот восьмидесятом году военные предложили народу свою конституцию, уверенные, что он скажет «да». Но примерно пятьдесят семь человек из ста ответили «нет». Первого марта тысяча девятьсот восемьдесят пятого года у страны снова появился избранный президент.", "caption": "1973–1985: тяжёлые годы. В 1980 году народ сказал военным «нет»", "big": "«НЕТ»", "imgs": [{"src": "img/d2_27.jpg", "cap": "Законодательный дворец сегодня: здесь заседает парламент", "credit": "GameOfLight, CC BY-SA 3.0"}, {"src": "img/d2_28.jpg", "cap": "Бюллетень «НЕТ» на плебисците 30 ноября 1980 года", "credit": "Sfs90, Public domain"}, {"src": "img/d2_29.jpg", "cap": "Плакат Хулио Марии Сангинетти на выборах 1984 года", "credit": "Partido Colorado (Uruguay), CC BY 2.0"}], "img": "img/d2_27.jpg", "credit": "GameOfLight, CC BY-SA 3.0"}, {"audio": "pres/ferry_state-11.mp3", "text": "Сегодня Уругвай считается одной из самых устойчивых демократий Америки: аналитики журнала «Экономист» ставят его в первую двадцатку стран мира. Хосе Мухика, который в годы диктатуры больше десяти лет провёл в тюрьме, потом стал президентом. Он жил на маленькой ферме, ездил на стареньком «Фольксвагене» и отдавал бедным большую часть зарплаты. Мухика умер в мае две тысячи двадцать пятого года, а сегодня страной руководит Яманду Орси.", "caption": "Сегодня: одна из самых устойчивых демократий Америки; Мухика и Орси", "big": "", "imgs": [{"src": "img/d2_30.jpg", "cap": "Монтевидео сегодня: центр города со стороны набережной", "credit": "Felipe Restrepo Acosta, CC BY-SA 4.0"}, {"src": "img/d2_31.jpg", "cap": "Хосе Мухика в своём стареньком голубом «Фольксвагене»", "credit": "Palácio do Planalto from Brasilia, Brasil, CC BY 2.0"}, {"src": "img/d2_32.jpg", "cap": "Плакат Яманду Орси на доме в Монтевидео, выборы 2024 года", "credit": "Maxox25, CC BY-SA 4.0"}], "img": "img/d2_30.jpg", "credit": "Felipe Restrepo Acosta, CC BY-SA 4.0"}, {"audio": "pres/ferry_state-12.mp3", "text": "Задание для юного путешественника: когда сойдёшь на берег, поищи в Колонии что-нибудь красное и что-нибудь белое, цвета колорадо и бланко. Это может быть флаг, футболка, цветок или лента на шляпе. Сосчитай, чего вокруг больше, а потом выбери свой любимый цвет и расскажи, почему он тебе нравится. Сегодня уругвайцы спорят не войной, а голосами у урны.", "caption": "Задание: найди в Колонии красное и белое, цвета колорадо и бланко", "big": "", "imgs": [{"src": "img/d2_33.jpg", "cap": "Лоток с флагами партий в центре Колонии-дель-Сакраменто", "credit": "Pulguita07, CC BY-SA 4.0"}, {"src": "img/a_suspiros-4.jpg", "cap": "Улица Вздохов: каменные дома с красной штукатуркой", "credit": "Fabio Mincarelli Monfrin, CC BY 2.0"}, {"src": "img/a_plaza-6.jpg", "cap": "Муниципальный музей Колонии на площади: белый дом под деревьями", "credit": "Fulviusbsas, CC BY-SA 3.0"}], "img": "img/d2_33.jpg", "credit": "Pulguita07, CC BY-SA 4.0"}]}, "ferry_famous": {"title": "Чем знаменит Уругвай и чем уругвайцы отличаются", "kid": "Найди в Колонии старую машину с цветами и, услышав слово «та», подними большой палец; ещё поищи голубого жука, как у Мухики.", "segs": [{"audio": "pres/ferry_famous-01.mp3", "text": "Уругвай называют Швейцарией Америки. И не из-за гор, их здесь почти нет, а из-за характера: страна небольшая, спокойная и надёжная. По международным рейтингам это одна из самых честных и демократичных стран Латинской Америки. А вечерами, малыш, весь Монтевидео выходит на Рамбле, набережную длиннее двадцати двух километров: люди гуляют, удят рыбу и смотрят на закат. Никто никуда не торопится.", "caption": "Швейцария Америки: тихая и честная страна, а Рамбла длиннее 22 км", "big": "Швейцария Америки", "imgs": [{"src": "img/d3_1.jpg", "cap": "Рамбла Монтевидео: набережная, где гуляют, удят рыбу и смотрят на реку", "credit": "Ermell, CC BY-SA 4.0"}, {"src": "img/d3_2.jpg", "cap": "Законодательный дворец в Монтевидео: здесь работает парламент страны", "credit": "GameOfLight, CC BY-SA 3.0"}, {"src": "img/c_ferry_uruguay-28.jpg", "cap": "Флаг Уругвая с жёлтым Майским солнцем на ветру", "credit": "Alex Proimos from Sydney, Australia, CC BY 2.0"}], "img": "img/d3_1.jpg", "credit": "Ermell, CC BY-SA 4.0"}, {"audio": "pres/ferry_famous-02.mp3", "text": "При этом Уругвай очень светская страна: церковь здесь отделена от государства уже больше ста лет. Поэтому праздники в календаре называются по-своему. Страстная неделя здесь Неделя туризма, и многие едут отдыхать. Рождество официально День семьи, а шестое января, день волхвов, День детей. Так что, малыш, в Уругвае есть официальный праздник именно для тебя. Правда, в жизни многие всё равно говорят по-старому.", "caption": "Неделя туризма, День семьи, День детей: праздники без церкви", "big": "День детей", "imgs": [{"src": "img/d3_3.jpg", "cap": "Кафедральный собор Монтевидео: церковь живёт отдельно от государства", "credit": "Diegoocampoh, CC BY-SA 3.0"}, {"src": "img/d3_4.jpg", "cap": "Пляж Поситос в Монтевидео: в Неделю туризма уругвайцы едут к воде", "credit": "Ypsilon from Finland, CC0"}, {"src": "img/d3_5.jpg", "cap": "Фигуры трёх волхвов на площади Монтевидео: шестого января День детей", "credit": "Ganímedes, CC BY-SA 4.0"}], "img": "img/d3_3.jpg", "credit": "Diegoocampoh, CC BY-SA 3.0"}, {"audio": "pres/ferry_famous-03.mp3", "text": "Уругвайцы любят быть первыми. В тысяча девятьсот седьмом году они приняли закон о разводе, а в тысяча девятьсот пятнадцатом ввели восьмичасовой рабочий день, одними из первых в регионе. Считается, что женщины впервые проголосовали в городке Серро-Чато в тысяча девятьсот двадцать седьмом году. А в две тысячи тринадцатом году Уругвай разрешил браки между людьми одного пола.", "caption": "Первыми: развод в 1907, восьмичасовой день в 1915, голоса женщин", "big": "1907", "imgs": [{"src": "img/d3_6.jpg", "cap": "Хосе Батлье-и-Ордоньес на рисунке 1904 года: при нём приняли реформы", "credit": "Автор неизвестен, Public domain"}, {"src": "img/d3_7.jpg", "cap": "Плакат о голосовании женщин: на выборах 1938 года они голосовали впервые", "credit": "Автор неизвестен, Public domain"}, {"src": "img/d3_8.jpg", "cap": "Площадь 3 июля 1927 года в Серро-Чато: считается, что здесь голосовали женщины", "credit": "Pepe_piton, CC BY-SA 4.0"}], "img": "img/d3_6.jpg", "credit": "Автор неизвестен, Public domain"}, {"audio": "pres/ferry_famous-04.mp3", "text": "А ещё Уругвай любит технологии. В две тысячи седьмом году запустили План Сейбал, названный в честь дерева сейбо с красными цветами: каждый школьник государственной начальной школы получил зелёный ноутбук. А электричество здесь делают в основном вода, ветер и растительные отходы. В две тысячи двадцать пятом году на такие источники пришлось девяносто восемь процентов. Представь, малыш: свет в твоей лампе почти не пахнет нефтью.", "caption": "План Сейбал: ноутбук каждому школьнику и почти весь свет без нефти", "big": "98 %", "imgs": [{"src": "img/d3_9.jpg", "cap": "Школьники из департамента Флорида получают зелёные ноутбуки, 2007 год", "credit": "Автор неизвестен, Public domain"}, {"src": "img/d3_10.jpg", "cap": "Ветряки на севере Уругвая: ветер крутит турбины прямо в поле", "credit": "Mx. Granger, CC0"}, {"src": "img/d3_11.jpg", "cap": "Плотина Ринкон-дель-Бонете: вода — главный источник электричества", "credit": "Goldmanspecial, CC0"}], "img": "img/d3_9.jpg", "credit": "Автор неизвестен, Public domain"}, {"audio": "pres/ferry_famous-05.mp3", "text": "А вот человек, которого знал весь мир. Хосе Мухика, или просто Пепе, был президентом с две тысячи десятого по две тысячи пятнадцатый год. Его называли самым бедным президентом планеты: около девяноста процентов зарплаты он отдавал нуждающимся, жил на скромной ферме и ездил на стареньком голубом Фольксвагене-жуке тысяча девятьсот восемьдесят седьмого года. Пепе не стало в мае две тысячи двадцать пятого года, но его вспоминают тепло.", "caption": "Президент Пепе Мухика и его голубой Фольксваген-жук", "big": "Пепе Мухика", "imgs": [{"src": "img/d3_12.jpg", "cap": "Хосе «Пепе» Мухика, президент Уругвая с 2010 по 2015 год", "credit": "Fotografía oficial de la Presidencia de Colombia, Public domain"}, {"src": "img/d3_13.jpg", "cap": "Голубой Фольксваген-жук Мухики, январь 2023 года", "credit": "Palácio do Planalto from Brasilia, Brasil, CC BY 2.0"}, {"src": "img/d3_14.jpg", "cap": "Мухика в салоне своего жука: рядом гость, президент Бразилии Лула", "credit": "Palácio do Planalto from Brasilia, Brasil, CC BY 2.0"}], "img": "img/d3_12.jpg", "credit": "Fotografía oficial de la Presidencia de Colombia, Public domain"}, {"audio": "pres/ferry_famous-06.mp3", "text": "Теперь о еде, малыш. Любимое семейное блюдо здесь асадо: мясо, которое часами жарят над углями, пока все разговаривают. В Монтевидео его пробуют на рынке Меркадо дель Пуэрто. А национальным блюдом считают чивито, и это слово значит «козлёнок». Не бойся, козлёнка внутри нет: там говяжий стейк, ветчина, сыр, яйцо и помидор в булке. По преданию, его придумали в Пунта-дель-Эсте, когда гостья из Аргентины попросила козлятину, а козлятины не нашлось.", "caption": "Асадо и чивито: «козлёнок» без козлёнка", "big": "Чивито", "imgs": [{"src": "img/d3_15.jpg", "cap": "Асадо: мясо жарят над раскалёнными углями", "credit": "Fadesga, CC BY-SA 4.0"}, {"src": "img/d3_16.jpg", "cap": "Старый рынок Меркадо дель Пуэрто в Монтевидео: здесь жарят асадо", "credit": "Mverocai, CC BY-SA 3.0"}, {"src": "img/d3_17.jpg", "cap": "Чивито: говядина, ветчина, сыр и овощи в булке, рядом картошка фри", "credit": "mattrubens (Flickr), CC BY-SA 2.0"}], "img": "img/d3_15.jpg", "credit": "Fadesga, CC BY-SA 4.0"}, {"audio": "pres/ferry_famous-07.mp3", "text": "Соседи спорят и о сладком. Кто придумал дульсе-де-лече, молочную карамель? Аргентинцы рассказывают, что в тысяча восемьсот двадцать девятом году служанка правителя Росаса забыла молоко с сахаром на огне. Уругвайцы отвечают, что варили её ещё в колониальные времена. А певец Карлос Гардель, по документам, родился в Тулузе, во Франции, но в уругвайском городе Такуарембо уверены, что он их земляк, и даже открыли музей.", "caption": "Дульсе-де-лече и Гардель: чьи они, аргентинские или уругвайские?", "big": "Чьё?", "imgs": [{"src": "img/d3_18.jpg", "cap": "Дульсе-де-лече: густая молочная карамель", "credit": "audinou from Paris, France, CC BY 2.0"}, {"src": "img/d3_19.jpg", "cap": "Карлос Гардель в 1923 году: певца считают своим две страны", "credit": "Unidentified photographer, Public domain"}, {"src": "img/d3_20.jpg", "cap": "Музей Гарделя в Такуарембо: на стене слова «Я родился здесь»", "credit": "AnselmiJuan, CC BY-SA 3.0"}], "img": "img/d3_18.jpg", "credit": "audinou from Paris, France, CC BY 2.0"}, {"audio": "pres/ferry_famous-08.mp3", "text": "С футболом спор тоже по-соседски. Про чемпионаты мира я уже рассказывал, а вот Кубок Америки: у Уругвая пятнадцать побед, и долго это был рекорд. Но аргентинцы догнали, а в две тысячи двадцать четвёртом году ушли вперёд, шестнадцать. Кстати, на футболке уругвайцев четыре звезды, хотя чемпионатов мира два: международная федерация засчитывает и олимпийское золото тысяча девятьсот двадцать четвёртого и двадцать восьмого годов.", "caption": "Кубок Америки: у Уругвая 15 побед, у Аргентины 16", "big": "15 : 16", "imgs": [{"src": "img/d3_21.jpg", "cap": "Кубок Америки: главный трофей сборных континента", "credit": "Casa Escasany de Buenos Aires (trophy) Hazaña17 (photo), Public domain"}, {"src": "img/d3_22.jpg", "cap": "Матч Аргентина, Уругвай на Кубке Америки 2011 года", "credit": "mikeb2012, CC BY 2.0"}, {"src": "img/d3_23.jpg", "cap": "Футболки сборной Уругвая и флаги в лавке для болельщиков в Монтевидео", "credit": "Fadesga, CC BY-SA 4.0"}], "img": "img/d3_21.jpg", "credit": "Casa Escasany de Buenos Aires (trophy) Hazaña17 (photo), Public domain"}, {"audio": "pres/ferry_famous-09.mp3", "text": "Реку Ла-Плата и аргентинцы, и уругвайцы ласково зовут лужей, по-испански чарко. Пересечь чарко значит поехать на другой берег, как вы сегодня. Аргентинцы делают это постоянно: за одиннадцать месяцев две тысячи двадцать пятого года их приехало больше двух миллионов. Они отдыхают в Пунта-дель-Эсте, где из песка торчит огромная Рука, и в Колонии. А ещё, говорят, многие держат сбережения в уругвайских банках.", "caption": "Пересечь чарко: аргентинцы едут в Пунта-дель-Эсте и Колонию", "big": "2 млн", "imgs": [{"src": "img/ferry_boats-2.jpg", "cap": "Паром Buquebus у пирса в Колонии: через несколько часов он отправится в Буэнос-Айрес", "credit": "Jaan-Cornelius K. from Buenos Aires, Argentina, CC BY-SA 2.0"}, {"src": "img/d3_24.jpg", "cap": "Ла-Мано в Пунта-дель-Эсте: пальцы гигантской руки торчат из песка", "credit": "María Cecilia, CC0"}, {"src": "img/d3_25.jpg", "cap": "Улочка Колонии с кафе под деревьями: сюда приезжают отдыхать", "credit": "Liam Quinn from Canada, CC BY-SA 2.0"}], "img": "img/ferry_boats-2.jpg", "credit": "Jaan-Cornelius K. from Buenos Aires, Argentina, CC BY-SA 2.0"}, {"audio": "pres/ferry_famous-10.mp3", "text": "Говорят в обеих странах почти одинаково, на рио-платском испанском. Вместо «ты» здесь «вос», а двойное «л» шипит как «ш»: курица, «пойо», превращается в «пошо». Кстати, обе стороны уверены, что шипит именно сосед. А вот уругвайское: «бо», как «эй, дружище», «та», то есть «хорошо, договорились», а ребёнка зовут «гури» или «ботиха». Так что здесь тебя, малыш, назовут гури.", "caption": "Один язык на двух берегах: вос, пошо, бо, та, гури", "big": "та", "imgs": [{"src": "img/d3_26.jpg", "cap": "Ла-Плата из космоса: Буэнос-Айрес и Монтевидео на разных берегах", "credit": "Earth Sciences and Image Analysis Laboratory, NASA Johnson Space Center, Public domain"}, {"src": "img/d3_27.jpg", "cap": "Площадь Независимости в Монтевидео с башней дворца Сальво", "credit": "Mx. Granger, CC0"}, {"src": "img/d3_28.jpg", "cap": "Школьники в белых халатах складывают бумажные фигурки: по-уругвайски они гури", "credit": "Nani1153, CC BY-SA 4.0"}], "img": "img/d3_26.jpg", "credit": "Earth Sciences and Image Analysis Laboratory, NASA Johnson Space Center, Public domain"}, {"audio": "pres/ferry_famous-11.mp3", "text": "Музыка у соседей общая. В две тысячи девятом году ЮНЕСКО внесла танго в список наследия по общей заявке двух стран: оно родилось в портовых кварталах Буэнос-Айреса и Монтевидео. Одно из самых знаменитых танго, «Ла Кумпарсита», в тысяча девятьсот шестнадцатом году сочинил восемнадцатилетний уругвайский студент. А в танго, говорят, слышен и ритм кандомбе. На одной доске в Монтевидео аргентинцы написали: «Нашим братьям уругвайцам, спасибо».", "caption": "Танго и кандомбе: музыка двух берегов", "big": "2009", "imgs": [{"src": "img/d3_29.jpg", "cap": "Танго на улице Монтевидео: пара танцует перед зрителями", "credit": "Coquimbo58, CC BY-SA 4.0"}, {"src": "img/d3_30.jpg", "cap": "Барабанщики и танцоры кандомбе на параде Льямадас в Монтевидео", "credit": "Jimmy Baikovicius from Montevideo, Uruguay, CC BY-SA 2.0"}, {"src": "img/d3_31.jpg", "cap": "Доска в Монтевидео: аргентинцы пишут уругвайцам «спасибо» за Ла Кумпарситу", "credit": "Fedaro, CC BY-SA 4.0"}], "img": "img/d3_29.jpg", "credit": "Coquimbo58, CC BY-SA 4.0"}, {"audio": "pres/ferry_famous-12.mp3", "text": "Задание для юного путешественника: в Колонии на узких улочках стоят старые машины, а в некоторых растут цветы, словно на клумбе. Найди такую машину и сосчитай её колёса. Если услышишь, что кто-то сказал «та», подними большой палец: это значит «хорошо, договорились». И поищи голубого жука, как у президента Мухики. Потом расскажешь, сколько всего нашёл.", "caption": "Задание: старые машины Колонии, цветы и слово «та»", "big": "", "imgs": [{"src": "img/d3_32.jpg", "cap": "Старая машина в Колонии: из окон растут цветы", "credit": "Ypsilon from Finland, CC0"}, {"src": "img/d3_33.jpg", "cap": "Ещё одна старая машина на брусчатке Колонии", "credit": "Liam Quinn from Canada, CC BY-SA 2.0"}, {"src": "img/d3_34.jpg", "cap": "Старый грузовичок в тени платанов в Колонии", "credit": "Embajada de los Estados Unidos en Uruguay from Montevideo, Uruguay, Public domain"}], "img": "img/d3_32.jpg", "credit": "Ypsilon from Finland, CC0"}]}, "ferry_river": {"title": "Река, похожая на море", "kid": "Посмотри на воду за бортом. Какого она цвета? На что похожа: на какао, чай или кофе с молоком? Придумай цвету название.", "segs": [{"audio": "pres/ferry_river-01.mp3", "text": "Посмотрите за борт. Берега уже не видно, вокруг только вода, и кажется, что вы плывёте по морю. Но это река. Её зовут Рио-де-ла-Плата, по-русски река Ла-Плата, и вы пересекаете
