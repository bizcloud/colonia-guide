<!doctype html>
<html lang="ru"><head>
<meta charset="utf-8">

<title>Колония — карта поездки</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
:root{--ink:#2b2622;--muted:#6f655c;--ochre:#c9772b;--blue:#2a5c8a;--paper:#fbf6ee;--line:#eadfce;--love:#c2185b}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{font:16px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;color:var(--ink);background:var(--paper);display:flex;flex-direction:column}
header{background:#1d3f61;color:#fff;padding:10px 12px 0}
header h1{font-size:17px;margin:0 0 8px;font-weight:600}
.tabs{display:flex;gap:6px;overflow-x:auto}
.tabs button{flex:0 0 auto;border:0;border-radius:10px 10px 0 0;padding:8px 14px;font-size:15px;background:#2a5c8a;color:#dfe9f3}
.tabs button.on{background:var(--paper);color:var(--ink);font-weight:600}
#map{height:42vh;min-height:250px;flex:0 0 auto}
.mapbtns{position:absolute;right:10px;top:10px;z-index:900;display:flex;flex-direction:column;gap:6px}
.mapbtns button{border:0;border-radius:10px;padding:8px 10px;font-size:14px;background:#fff;box-shadow:0 1px 5px rgba(0,0,0,.3)}
.mapbtns button.on{background:var(--blue);color:#fff}
#mapwrap{position:relative}
#list{flex:1 1 auto;overflow-y:auto;padding:8px 10px 120px}
.daytitle{font-weight:600;margin:6px 2px 8px;color:var(--ochre)}
.step{display:flex;gap:10px;background:#fff;border:1px solid var(--line);border-radius:12px;padding:10px;margin-bottom:8px}
.step.cur{border-color:var(--blue);box-shadow:0 0 0 2px rgba(42,92,138,.25)}
.step.done{opacity:.55}
.badge{flex:0 0 34px;height:34px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:700;font-size:15px}
.k-audio{background:var(--ochre)} .k-food{background:#7a4b9c} .k-ferry{background:#555} .k-move{background:#888} .k-hotel{background:#2a8a5c} .k-kids{background:#1f8a9e} .k-walk{background:#5d7b2f} .k-love{background:var(--love)}
.body{flex:1;min-width:0}
.time{font-size:13px;color:var(--muted)}
.ttl{font-weight:600;margin:1px 0 3px}
.txt{font-size:14.5px}
.kid{font-size:14px;background:#fff4e0;border-radius:8px;padding:5px 8px;margin-top:6px}
.acts{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.acts button,.acts a{border:1px solid var(--line);background:#f6f1e9;border-radius:8px;padding:6px 10px;font-size:14px;color:var(--ink);text-decoration:none}
.acts .play{background:var(--ochre);border-color:var(--ochre);color:#fff;font-weight:600}
.pin{border-radius:50%;width:28px;height:28px;display:flex;align-items:center;justify-content:center;color:#fff;font:bold 13px sans-serif;border:2px solid #fff;box-shadow:0 1px 4px rgba(0,0,0,.45)}
.pin.sel{transform:scale(1.25)}
.me{width:18px;height:18px;border-radius:50%;background:#1a73e8;border:3px solid #fff;box-shadow:0 0 0 2px rgba(26,115,232,.4)}
#player{position:fixed;left:0;right:0;bottom:0;z-index:1000;background:#1d3f61;color:#fff;padding:8px 12px calc(8px + env(safe-area-inset-bottom));display:none}
#player .row{display:flex;align-items:center;gap:10px}
#player button{border:0;background:#fff;color:#1d3f61;border-radius:50%;width:42px;height:42px;font-size:18px;flex:0 0 42px}
#ptitle{flex:1;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#pbar{height:4px;background:rgba(255,255,255,.25);border-radius:2px;margin-top:6px}
#pbar div{height:4px;background:var(--ochre);border-radius:2px;width:0}
#near{position:fixed;left:10px;right:10px;bottom:76px;z-index:1001;background:#fff;border:2px solid var(--ochre);border-radius:14px;padding:10px 12px;box-shadow:0 4px 14px rgba(0,0,0,.25);display:none}
#near .acts{margin-top:6px}
.allaudio .step{align-items:center}
.small{font-size:13px;color:var(--muted);margin:10px 2px}
</style></head><body>
<header><h1>Колония-дель-Сакраменто · 5–7 ноября</h1>

<div id="near"></div>
<div id="player"><div class="row"><button id="pp">▶</button><div id="ptitle"></div><button id="px" style="width:32px;height:32px;flex-basis:32px;font-size:14px">✕</button></div><div id="pbar"><div></div></div></div>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
const DATA={"days": [{"id": "thu", "tab": "Чт 5", "title": "Четверг, 5 ноября — приезд", "steps": [{"time": "08:30", "kind": "move", "title": "Выезд из дома", "text": "Такси, Uber или Cabify до терминала Colonia Express, около 14 км, 30–40 минут. Таксисту: «Terminal Colonia Express, Dársena Sur».", "gmaps": "https://www.google.com/maps/dir/?api=1&destination=Colonia+Express,+Av.+Elvira+Rawson+de+Dellepiane+155,+Buenos+Aires"}, {"time": "09:00", "kind": "ferry", "title": "Регистрация и граница", "text": "Регистрация начинается за 1,5 часа до отхода. Нужны пластиковые DNI всех четверых, свидетельства о рождении детей и распечатанные ваучеры. Аргентинскую и уругвайскую границу проходите сразу, здесь же."}, {"time": "10:30", "kind": "ferry", "title": "Паром 10:30 → 11:45", "text": "Пока плывёте — запись «Добро пожаловать в Колонию», а для сына — «Игра на все выходные».", "audio": "intro"}, {"time": "11:45", "kind": "ferry", "title": "Паромный терминал Колонии", "lat": -34.47404, "lon": -57.84416, "text": "Прибытие. До старого города 15–20 минут пешком или такси. Если плыли Colonia Express, по билету 24 часа бесплатно ходит городской автобус."}, {"time": "12:15", "kind": "hotel", "title": "Отель", "hotel": true, "text": "Оставить вещи, заселение обычно с 14:00. Отель отметьте кнопкой «Мой отель» над картой."}, {"time": "12:45", "kind": "food", "title": "Casa Viera", "lat": -34.470517, "lon": -57.852638, "text": "Обед. Google 4,7, ежедневно 12:30–15:00."}, {"time": "14:00", "kind": "hotel", "title": "Отель", "hotel": true, "text": "Заселение и тихий час."}, {"time": "16:00", "kind": "audio", "title": "Ворота Портон-де-Кампо", "rec": 1, "lat": -34.472695, "lon": -57.850452, "audio": "porton", "text": "Начало прогулки. Рядом детская площадка и туалет. Рядом туристический центр (Manuel Lobo 224), туалет и детская площадка. Отсюда ежедневно в 11:00 и 15:00 уходит городская прогулка с гидом «Camina Colonia» на испанском: 250 песо (≈$6) с человека, дети до 10 лет бесплатно.", "kid": "Представь, что ты стражник. Найди ров и мост. Как думаешь, зачем мост делали подъёмным?"}, {"time": "16:15", "kind": "audio", "title": "Улица Вздохов", "rec": 2, "lat": -34.472833, "lon": -57.851115, "audio": "suspiros", "text": "Брусчатка крупная и неровная, тротуаров нет: малыша удобнее нести в слинге, а не катить в коляске.", "kid": "Встань в желобок посередине улицы. Куда побежит вода, если пойдёт дождь: вверх или вниз, к реке?"}, {"time": "16:30", "kind": "audio", "title": "Пласа-Майор и музеи", "rec": 3, "lat": -34.472318, "lon": -57.851447, "audio": "plaza", "text": "Музеи открыты до 16:30, в четверг их лучше не планировать. Касса музеев: Espacio Rebuffo, Del Comercio 77. Билет 150 песо (≈$4), дети до 12 лет бесплатно, 11:30–16:30. Часть музеев закрыта в отдельные дни, список ниже, в разделе «Музеи».", "kid": "В музее лежат осколки старой посуды, которые нашли прямо в земле. Как думаешь, кто из неё ел триста лет назад?"}, {"time": "16:40", "kind": "audio", "title": "Маяк и руины монастыря", "rec": 4, "lat": -34.472818, "lon": -57.852269, "audio": "faro", "text": "Маяк открыт до 17:00: поднимитесь по очереди, детей младше 8 лет не пускают. Подъём: 118 ступеней, чт–вс 10:00–12:00 и 15:00–17:00, 50 песо. Детей младше 8 лет наверх не пускают; в дождь и сильный ветер закрыто. Поднимайтесь по очереди.", "kid": "Посмотри на маяк: снизу он квадратный или круглый? А сверху? Сосчитай красные полосы."}, {"time": "17:15", "kind": "audio", "title": "Набережная Сан-Габриэль", "rec": 5, "lat": -34.472665, "lon": -57.853683, "audio": "sangabriel", "text": "Неподалёку руины «Дома вице-короля» (Casa del Virrey). Музей азулежу на этой набережной сейчас закрыт.", "kid": "Посмотри на реку. Какого она цвета? Видишь вдали остров?"}, {"time": "19:00", "kind": "audio", "title": "Мыс Санта-Рита: закат", "rec": 6, "lat": -34.470452, "lon": -57.853765, "audio": "santarita", "text": "Закат около 19:25. Закат 6–8 ноября около 19:25. Рядом ресторан Amor Amor (Calle Santa Rita 40).", "kid": "Когда солнце будет садиться, загадайте одно желание на всю семью. Только никому не рассказывай!"}, {"time": "20:00", "kind": "food", "title": "La Bodeguita", "lat": -34.471222, "lon": -57.8527, "text": "Ужин: пицца и закуски на террасе над рекой. +598 4522 5329."}]}, {"id": "fri", "tab": "Пт 6 ♥", "title": "Пятница, 6 ноября — годовщина", "steps": [{"time": "10:00", "kind": "food", "title": "Albertine Pan y Café", "lat": -34.471435, "lon": -57.849783, "text": "Завтрак, кофе и торты (чт–сб с 10:00)."}, {"time": "10:45", "kind": "move", "title": "Такси в Реаль-де-Сан-Карлос", "text": "Около 10 минут, стоянки такси на Av. General Flores. По билету Colonia Express можно на бесплатном городском автобусе (остановка у Plaza de Toros).", "gmaps": "https://www.google.com/maps/dir/?api=1&destination=-34.439047,-57.859002"}, {"time": "11:00", "kind": "audio", "title": "Музей древних животных", "rec": 10, "lat": -34.439047, "lon": -57.859002, "audio": "paleo", "text": "Работает пт–вс. Входит в систему городских музеев: билет 150 песо, дети до 12 лет бесплатно.", "kid": "Найди панцирь глиптодонта. Как думаешь, ты бы поместился под ним, как под крышей?"}, {"time": "11:45", "kind": "audio", "title": "Арена Пласа-де-Торос", "rec": 11, "lat": -34.436551, "lon": -57.865214, "audio": "toros", "text": "Экскурсии каждый час с 11:00. Вс–пт 10:00–18:30, сб 10:00–19:00. Вход 250 песо, экскурсия 350 (каждый час с 11:00), дети до 5 лет бесплатно. В субботу 7.11 вечером здесь концерт.", "kid": "Пройди по кругу и сосчитай арки. Сколько у тебя получилось?"}, {"time": "12:45", "kind": "audio", "title": "Фронтон", "rec": 12, "lat": -34.437885, "lon": -57.867778, "audio": "fronton", "text": "Фронтон заново открыли в октябре 2026 года; часы посещения после реставрации не опубликованы, смотрите на месте.", "kid": "Найди самую высокую стену. Как думаешь, в неё бьют мячом или нет?"}, {"time": "13:00", "kind": "walk", "title": "Набережная Реаль-де-Сан-Карлос", "lat": -34.441718, "lon": -57.867807, "text": "Набережная, парк и бывший причал Михановича. Обед можно в ресторане на арене."}, {"time": "14:30", "kind": "hotel", "title": "Отель", "hotel": true, "text": "Тихий час."}, {"time": "16:30", "kind": "audio", "title": "Бастион-дель-Кармен", "rec": 8, "lat": -34.469291, "lon": -57.85028, "audio": "carmen", "text": "Рядом аквариум (до 18:00) — следующий пункт. В пятницу 6.11 в 21:00 здесь спектакль (билет 250 песо). Рядом туалет. Рядом — аквариум местных рыб (чт–вс 14:00–18:00, дети до 10 лет бесплатно).", "kid": "Задери голову и посмотри на трубу. Как думаешь, она выше маяка или ниже? А сколько в ней кирпичей?"}, {"time": "16:45", "kind": "kids", "title": "Аквариум местных рыб", "lat": -34.46984, "lon": -57.850706, "text": "Аквариум местных рыб: чт–вс 14:00–18:00, 100 песо, дети до 10 лет бесплатно."}, {"time": "17:30", "kind": "kids", "title": "Музей телеграфа", "lat": -34.470838, "lon": -57.852493, "text": "Музей телеграфа (пт открыт): азбука Морзе, видео. Если успеете до закрытия."}, {"time": "19:00", "kind": "love", "title": "♥ Charco Bistró", "lat": -34.473163, "lon": -57.851909, "text": "Ужин в честь годовщины на террасе над рекой, закат в 19:25. Бронь: +598 98 502 130."}]}, {"id": "sat", "tab": "Сб 7", "title": "Суббота, 7 ноября — отъезд", "steps": [{"time": "09:30", "kind": "hotel", "title": "Отель", "hotel": true, "text": "Завтрак, выезд из номера, вещи оставить на ресепшене."}, {"time": "11:00", "kind": "walk", "title": "Яхт-порт: катер Tour Náutico", "lat": -34.468251, "lon": -57.852302, "text": "По желанию: часовая прогулка на катере. Взрослые 850 песо, дети 5–12 лет 750, до 5 лет бесплатно."}, {"time": "12:00", "kind": "audio", "title": "Старый причал", "rec": 7, "lat": -34.468659, "lon": -57.851909, "audio": "muelle", "text": "Прогулка на катере «Tour Náutico» от яхт-порта: 1 час, 11:00, 13:30 и 17:00; взрослые 850 песо (≈$21), дети 5–12 лет 750, до 5 лет бесплатно.", "kid": "Найди лодку с самой высокой мачтой. Сколько всего мачт ты насчитал?"}, {"time": "12:20", "kind": "audio", "title": "Базилика Святейшего Таинства", "rec": 9, "lat": -34.471099, "lon": -57.85073, "audio": "basilica", "text": "Рядом Испанский музей (чт–вс) и Португальский дом (ср–пн), касса — Del Comercio 77. Рядом — Пласа-де-Армас и фундаменты Дома губернаторов. Отсюда до ворот, где маршрут начинался, пара минут пешком.", "kid": "Посмотри на стены церкви. Найди места, где камни разные: где-то старые, а где-то новые. Сколько разных видов камня ты увидишь?"}, {"time": "13:00", "kind": "food", "title": "Mesón de la Plaza", "lat": -34.47118, "lon": -57.85105, "text": "Обед: классическая уругвайская кухня (≈ Vasconcellos 153)."}, {"time": "14:15", "kind": "food", "title": "Helados Papito", "lat": -34.47075, "lon": -57.85165, "text": "Мороженое."}, {"time": "14:30", "kind": "hotel", "title": "Отель", "hotel": true, "text": "Забрать вещи."}, {"time": "14:45", "kind": "ferry", "title": "Паромный терминал Колонии", "lat": -34.47404, "lon": -57.84416, "text": "Регистрация с 14:45. Паром 16:15 → 17:30 в Буэнос-Айрес, дома около 18:15–18:30."}]}], "audio": {"intro": ["00-intro.mp3", "Добро пожаловать в Колонию"], "igra": ["00-igra.mp3", "Игра на все выходные"], "porton": ["01-porton.mp3", "1. Ворота Портон-де-Кампо"], "suspiros": ["02-suspiros.mp3", "2. Улица Вздохов"], "plaza": ["03-plaza.mp3", "3. Пласа-Майор и музеи"], "faro": ["04-faro.mp3", "4. Маяк и руины монастыря"], "sangabriel": ["05-sangabriel.mp3", "5. Набережная Сан-Габриэль"], "santarita": ["06-santarita.mp3", "6. Мыс Санта-Рита: закат"], "muelle": ["07-muelle.mp3", "7. Старый причал"], "carmen": ["08-carmen.mp3", "8. Бастион-дель-Кармен"], "basilica": ["09-basilica.mp3", "9. Базилика Святейшего Таинства"], "paleo": ["10-paleo.mp3", "10. Музей древних животных"], "toros": ["11-toros.mp3", "11. Арена Пласа-де-Торос"], "fronton": ["12-fronton.mp3", "12. Фронтон"]}, "stops": {"porton": {"n": 1, "title": "Ворота Портон-де-Кампо", "sub": "Portón de Campo · начало маршрута", "lat": -34.472695, "lon": -57.850452, "kid": "Представь, что ты стражник. Найди ров и мост. Как думаешь, зачем мост делали подъёмным?", "info": "Рядом туристический центр (Manuel Lobo 224), туалет и детская площадка. Отсюда ежедневно в 11:00 и 15:00 уходит городская прогулка с гидом «Camina Colonia» на испанском: 250 песо (≈$6) с человека, дети до 10 лет бесплатно.", "text": ["Перед вами ворота Портон-де-Кампо. Через эти ворота из крепости выходили в поле. Их построил португальский губернатор Антониу Педру ди Васконселуш, примерно в тысяча семьсот сорок пятом году. При нём Колония стала самым богатым и самым укреплённым городом в округе.", "Посмотрите вниз. Перед воротами ров, а через него деревянный подъёмный мост. Когда мост поднимали, враг оставался по ту сторону рва.", "И маленький секрет. Стена, которую вы видите, почти вся восстановлена. Испанцы снесли укрепления в тысяча семьсот семьдесят седьмом году, и к середине двадцатого века от стены почти ничего не осталось. Ворота собрали заново после тысяча девятьсот шестьдесят восьмого года, частью из старых камней, частью из новых.", "Рядом с воротами есть туристический центр, туалет и детская площадка. Отсюда каждый день в одиннадцать и в три часа дня уходит недорогая прогулка с городским гидом на испанском языке. Детям до десяти лет бесплатно."]}, "suspiros": {"n": 2, "title": "Улица Вздохов", "sub": "Calle de los Suspiros", "lat": -34.472833, "lon": -57.851115, "kid": "Встань в желобок посередине улицы. Куда побежит вода, если пойдёт дождь: вверх или вниз, к реке?", "info": "Брусчатка крупная и неровная, тротуаров нет: малыша удобнее нести в слинге, а не катить в коляске.", "text": ["Это самая знаменитая улица города, Калье-де-лос-Суспирос, улица Вздохов. Она спускается от главной площади прямо к реке.", "Посмотрите под ноги. Тротуаров нет, а мостовая с обеих сторон наклонена к середине. Посередине получается желоб, по которому дождевая вода стекает к реке. Так строили португальцы.", "Дома здесь первой половины восемнадцатого века: каменные стены, черепичные крыши, маленькие деревянные двери и окна. Это одна из немногих улиц, которые выглядят почти как триста лет назад.", "Почему улица Вздохов? Этого точно никто не знает. Ещё в середине прошлого века она называлась иначе. Есть три легенды. По первой, здесь были таверны, и моряки вздыхали по местным красавицам. По второй, по этой улице к реке вели приговорённых, и они вздыхали в последний раз. А по третьей, здесь девушка ждала возлюбленного, да так и не дождалась. Выбирайте ту, что вам больше нравится.", "Внизу, на углу с улицей Сан-Педро, стоит дом, где когда-то работала телеграфная компания. Отсюда по дну реки на другой берег протянули первый в Южной Америке телеграфный кабель."]}, "plaza": {"n": 3, "title": "Пласа-Майор и музеи", "sub": "Plaza Mayor 25 de Mayo", "lat": -34.472318, "lon": -57.851447, "kid": "В музее лежат осколки старой посуды, которые нашли прямо в земле. Как думаешь, кто из неё ел триста лет назад?", "info": "Касса музеев: Espacio Rebuffo, Del Comercio 77. Билет 150 песо (≈$4), дети до 12 лет бесплатно, 11:30–16:30. Часть музеев закрыта в отдельные дни, список ниже, в разделе «Музеи».", "text": ["Вы на Пласа-Майор, главной площади старого города. Вокруг стоят старые португальские дома, а в углу площади руины монастыря, из которых вырастает маяк.", "Если хотите в музеи, касса находится в доме на улице Дель-Комерсио, семьдесят семь, напротив площади. Это Эспасио Ребуффо, самый первый музей города, его открыли в тысяча девятьсот пятьдесят первом году. Наверху там есть зал природы. Билет стоит сто пятьдесят песо, дети до двенадцати лет проходят бесплатно.", "На площади стоит и Португальский музей: старинная мебель, карты, оружие и вещи, найденные при раскопках дома губернаторов. Фундамент этого дома можно увидеть рядом с базиликой, это последняя остановка нашего маршрута."]}, "faro": {"n": 4, "title": "Маяк и руины монастыря", "sub": "Faro y Convento de San Francisco", "lat": -34.472818, "lon": -57.852269, "kid": "Посмотри на маяк: снизу он квадратный или круглый? А сверху? Сосчитай красные полосы.", "info": "Подъём: 118 ступеней, чт–вс 10:00–12:00 и 15:00–17:00, 50 песо. Детей младше 8 лет наверх не пускают; в дождь и сильный ветер закрыто. Поднимайтесь по очереди.", "text": ["Перед вами маяк и руины монастыря Сан-Франсиско семнадцатого века. Присмотритесь: снизу у маяка квадратное каменное основание. Это остаток одной из башен монастыря. А сверху круглая башня с красно-белыми полосами.", "Маяк начали строить в тысяча восемьсот сорок пятом году, потом война остановила работы, и открыли его только в январе тысяча восемьсот пятьдесят седьмого года. Достроить его помог налог с кораблей, которые заходили в порты Колонии и Монтевидео.", "Наверх ведут сто восемнадцать ступеней. Маяк открыт с четверга по воскресенье, с десяти до двенадцати и с трёх до пяти. Детей младше восьми лет наверх не пускают, а в дождь и сильный ветер маяк закрыт. Поэтому поднимайтесь по очереди: один взрослый идёт наверх, второй с детьми считает полосы внизу. Говорят, сверху открывается лучший вид на город и реку."]}, "sangabriel": {"n": 5, "title": "Набережная Сан-Габриэль", "sub": "Paseo de San Gabriel · Punta de San Pedro", "lat": -34.472665, "lon": -57.853683, "kid": "Посмотри на реку. Какого она цвета? Видишь вдали остров?", "info": "Неподалёку руины «Дома вице-короля» (Casa del Virrey). Музей азулежу на этой набережной сейчас закрыт.", "text": ["Вы на набережной Пасео-де-Сан-Габриэль. Посмотрите на реку. Где-то впереди лежит остров Сан-Габриэль, в ясную погоду его видно. Именно к этому острову в январе тысяча шестьсот восьмидесятого года подошли корабли Мануэла Лобу, а через несколько дней на берегу начали строить крепость.", "Мыс рядом называется Пунта-де-Сан-Педро. Здесь стоял бастион Сан-Педро, один из шести бастионов, которые португальцы построили вдоль воды в тысяча семьсот двадцатых годах.", "А руины неподалёку называют Домом вице-короля. Забавно, но ни один вице-король здесь не жил. Возможно, имя появилось в честь испанского генерала Педро де Севальоса, который взял Колонию и стал первым вице-королём Ла-Платы. Но документов об этом нет, так что это загадка."]}, "santarita": {"n": 6, "title": "Мыс Санта-Рита: закат", "sub": "Calle Santa Rita · Bastión de Santa Rita", "lat": -34.470452, "lon": -57.853765, "kid": "Когда солнце будет садиться, загадайте одно желание на всю семью. Только никому не рассказывай!", "info": "Закат 6–8 ноября около 19:25. Рядом ресторан Amor Amor (Calle Santa Rita 40).", "text": ["Это мыс Санта-Рита. Здесь тоже стоял португальский бастион, а сейчас это одно из лучших мест, чтобы встретить закат. Солнце садится прямо над рекой. В начале ноября закат около половины восьмого вечера.", "Здесь вдоль воды стоят скамейки. Можно просто сесть, никуда не спешить и посмотреть, как река становится золотой."]}, "muelle": {"n": 7, "title": "Старый причал", "sub": "Muelle de madera · Puerto de Yates", "lat": -34.468659, "lon": -57.851909, "kid": "Найди лодку с самой высокой мачтой. Сколько всего мачт ты насчитал?", "info": "Прогулка на катере «Tour Náutico» от яхт-порта: 1 час, 11:00, 13:30 и 17:00; взрослые 850 песо (≈$21), дети 5–12 лет 750, до 5 лет бесплатно.", "text": ["Это старый деревянный причал, а рядом пристань для яхт. Когда-то сюда приходили парусники и пароходы из Буэнос-Айреса.", "Если хочется посмотреть на город с воды, от яхт-порта уходит часовая прогулка на катере: в одиннадцать, в половине второго и в пять. Детям до пяти лет бесплатно."]}, "carmen": {"n": 8, "title": "Бастион-дель-Кармен", "sub": "Centro Cultural Bastión del Carmen", "lat": -34.469291, "lon": -57.85028, "kid": "Задери голову и посмотри на трубу. Как думаешь, она выше маяка или ниже? А сколько в ней кирпичей?", "info": "В пятницу 6.11 в 21:00 здесь спектакль (билет 250 песо). Рядом туалет. Рядом — аквариум местных рыб (чт–вс 14:00–18:00, дети до 10 лет бесплатно).", "text": ["Высокая кирпичная труба осталась от старой мыльной фабрики. Сейчас в её зданиях культурный центр и театр, а вокруг лужайка у самой воды. Название досталось от португальского бастиона, который стоял на этом берегу.", "Здания фабрики и труба охраняются государством как национальный памятник. Днём здесь хорошо посидеть на траве у реки, пока дети бегают.", "А совсем рядом есть небольшой аквариум с рыбами, которые живут в местных реках. Дети до десяти лет проходят бесплатно."]}, "basilica": {"n": 9, "title": "Базилика Святейшего Таинства", "sub": "Basílica del Santísimo Sacramento · Plaza de Armas", "lat": -34.471099, "lon": -57.85073, "kid": "Посмотри на стены церкви. Найди места, где камни разные: где-то старые, а где-то новые. Сколько разных видов камня ты увидишь?", "info": "Рядом — Пласа-де-Армас и фундаменты Дома губернаторов. Отсюда до ворот, где маршрут начинался, пара минут пешком.", "text": ["Это Базилика Святейшего Таинства, самая старая церковь Уругвая. Приход основали в феврале тысяча шестьсот восьмидесятого года, сразу после прихода португальцев. Первая церковь была хижиной из соломы и глины. Потом её много раз перестраивали.", "Самая драматичная история случилась воскресным утром, в декабре тысяча восемьсот двадцать третьего года. Под ризницей хранили порох. Во время грозы в церковь ударила молния, и порох взорвался. Большая часть здания была разрушена. Через десять лет здесь побывал Чарльз Дарвин и записал, что от церкви остались любопытные руины, памятник силе молнии и пороха.", "Церковь восстановили в тысяча восемьсот тридцатых годах, а в двадцатом веке реставраторы оставили на виду старые части стен рядом с новыми. Внутри есть купель, которой около трёхсот лет, и распятие, вырезанное индейцами из иезуитских миссий.", "Перед базиликой площадь Пласа-де-Армас, а в паре десятков шагов видны каменные фундаменты Дома губернаторов. Вместе с церковью это было главное здание города. На этом маршрут по старому городу закончен. Спасибо, что гуляли с нами!"]}, "paleo": {"n": 10, "title": "Музей древних животных", "sub": "Espacio Paleontológico Armando Calcaterra", "lat": -34.439047, "lon": -57.859002, "kid": "Найди панцирь глиптодонта. Как думаешь, ты бы поместился под ним, как под крышей?", "info": "Работает пт–вс. Входит в систему городских музеев: билет 150 песо, дети до 12 лет бесплатно.", "text": ["Мы в районе Реаль-де-Сан-Карлос. В этом небольшом музее хранятся кости и панцири животных, которые жили здесь больше десяти тысяч лет назад.", "Главные звёзды музея — глиптодонты, древние родственники броненосцев. Их панцирь был размером с маленький автомобиль, а сами они весили как бегемот. Представьте такого зверя на берегу реки!"]}, "toros": {"n": 11, "title": "Арена Пласа-де-Торос", "sub": "Plaza de Toros Real de San Carlos", "lat": -34.436551, "lon": -57.865214, "kid": "Пройди по кругу и сосчитай арки. Сколько у тебя получилось?", "info": "Вс–пт 10:00–18:30, сб 10:00–19:00. Вход 250 песо, экскурсия 350 (каждый час с 11:00), дети до 5 лет бесплатно. В субботу 7.11 вечером здесь концерт.", "text": ["Название Реаль-де-Сан-Карлос дали испанцы. Отсюда они осаждали португальскую крепость и назвали лагерь в честь короля Карла Третьего.", "В начале двадцатого века сюда пришёл Николас Миханович, судовладелец родом из Хорватии. Его пароходы возили людей между Буэнос-Айресом и Колонией, и он задумал здесь курорт для гостей с того берега: отель, казино, площадку для баскской пелоты и арену для корриды.", "Арену построили всего за восемь месяцев и открыли в январе тысяча девятьсот десятого года. На первую корриду пришли тысячи зрителей. Но уже в тысяча девятьсот двенадцатом году корриду в Уругвае запретили, и здесь успели провести всего восемь боёв.", "Потом арена почти сто лет стояла заброшенной и разрушалась. В две тысячи двенадцатом году обрушилась часть фасада. Её отреставрировали и в декабре две тысячи двадцать первого года открыли снова, через сто одиннадцать лет после открытия. Сейчас внутри музей, рестораны и концертная площадка."]}, "fronton": {"n": 12, "title": "Фронтон", "sub": "Frontón Real de San Carlos", "la const LS={get:(k,d)=>{try{return JSON.parse(localStorage.getItem('col_'+k))??d}catch(e){return d}},set:(k,v)=>localStorage.setItem('col_'+k,JSON.stringify(v))};
const ICON={audio:'🎧',food:'🍽',ferry:'⛴',move:'🚕',hotel:'⌂',kids:'🐟',walk:'🚶',love:'♥'};
let day=LS.get('day',null), me=null, meMk=null, meAcc=null, follow=false, watch=null, markers=[], line=null, selIdx=-1;
let hotel=LS.get('hotel',null), done=LS.get('done',{}), heard=LS.get('heard',{}), snooze={};
const map=L.map('map',{zoomControl:false}).setView([-34.4715,-57.8505],15);
L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,crossOrigin:true,attribution:'© OpenStreetMap'}).addTo(map);
const layer=L.layerGroup().addTo(map); let hotelMk=null;
function pin(txt,k,sel){return L.divIcon({className:'',html:`<div class="pin k-${k}${sel?' sel':''}">${txt}</div>`,iconSize:[28,28],iconAnchor:[14,14]})}
function todayDefault(){const d=new Date(), m=d.getMonth()+1, dd=d.getDate(); if(m===11&&dd===6)return 'fri'; if(m===11&&dd===7)return 'sat'; return 'thu'}
if(!day) day=todayDefault();
function stepPos(s){ if(s.hotel) return hotel?[hotel.lat,hotel.lon]:null; return (s.lat!=null)?[s.lat,s.lon]:null }
function dist(a,b){const R=6371000,t=Math.PI/180,dl=(b[0]-a[0])*t,dn=(b[1]-a[1])*t,x=Math.sin(dl/2)**2+Math.cos(a[0]*t)*Math.cos(b[0]*t)*Math.sin(dn/2)**2;return 2*R*Math.asin(Math.sqrt(x))}
function fmtD(m){return m<1000?Math.round(m/10)*10+' м':(m/1000).toFixed(1)+' км'}

function renderTabs(){
  const t=document.getElementById('tabs'); t.innerHTML='';
  [...DATA.days.map(d=>[d.id,d.tab]),['all','🎧 Все записи']].forEach(([id,lab])=>{
    const b=document.createElement('button'); b.textContent=lab; b.className=id===day?'on':''; b.onclick=()=>{day=id;LS.set('day',id);selIdx=-1;render(true)}; t.appendChild(b)});
}
function render(fit){
  renderTabs(); layer.clearLayers(); markers=[];
  const list=document.getElementById('list'); list.innerHTML='';
  if(day==='all'){ renderAll(list,fit); return }
  const D=DATA.days.find(d=>d.id===day);
  list.insertAdjacentHTML('beforeend',`<div class="daytitle">${D.title}</div>`);
  const pts=[]; let mapN=0;
  if(DATA.routes[day]) L.polyline(DATA.routes[day].map(p=>[p[1],p[0]]),{color:'#2a5c8a',weight:4,opacity:.45}).addTo(layer);
  D.steps.forEach((s,i)=>{
    const pos=stepPos(s), k=s.kind, num=pos?++mapN:null;
    if(pos){ const m=L.marker(pos,{icon:pin(num,k,i===selIdx),zIndexOffset:i===selIdx?1000:0}).addTo(layer).on('click',()=>select(i,true)); m.bindTooltip(s.time+' '+s.title); markers[i]=m; pts.push(pos) }
    const key=day+':'+i, isDone=done[key];
    const dd=(me&&pos)?` · ${fmtD(dist(me,pos))} от вас`:'';
    const el=document.createElement('div'); el.className='step'+(isDone?' done':'')+(i===selIdx?' cur':''); el.id='st'+i;
    let acts='';
    if(s.audio){const a=DATA.audio[s.audio]; acts+=`<button class="play" data-a="${s.audio}">▶ ${heard[s.audio]?'Ещё раз':'Слушать'}</button>`}
    if(pos){acts+=`<button data-show="${i}">На карте</button><a target="_blank" rel="noopener" href="https://www.google.com/maps/dir/?api=1&destination=${pos[0]},${pos[1]}&travelmode=walking">Пешком ↗</a>`}
    else if(s.gmaps){acts+=`<a target="_blank" rel="noopener" href="${s.gmaps}">Маршрут ↗</a>`}
    if(s.hotel&&!hotel){acts+=`<button data-hotel="1">Отметить отель</button>`}
    acts+=`<button data-done="${key}">${isDone?'↺ Вернуть':'✓ Готово'}</button>`;
    el.innerHTML=`<div class="badge k-${k}">${pos?num:(ICON[k]||'•')}</div><div class="body"><div class="time">${s.time}${s.rec?` · 🎧 запись ${s.rec}`:''}${dd}</div><div class="ttl">${ICON[k]||''} ${s.title}</div><div class="txt">${s.text||''}</div>${s.kid?`<div class="kid"><b>Для ребёнка:</b> ${s.kid}</div>`:''}<div class="acts">${acts}</div></div>`;
    list.appendChild(el);
  });
  list.insertAdjacentHTML('beforeend',`<div class="small">Время ориентировочное. Цены и часы проверены 01–04.11.2026. Карта © OpenStreetMap.</div>`);
  drawHotel(); drawMe();
  if(fit&&pts.length) map.fitBounds(pts,{padding:[30,30],maxZoom:17});
}
function renderAll(list,fit){
  list.insertAdjacentHTML('beforeend',`<div class="daytitle">Все записи аудиогида</div>`);
  const pts=[];
  Object.entries(DATA.audio).forEach(([id,[f,t]])=>{
    const s=DATA.stops[id]; const pos=s?[s.lat,s.lon]:null;
    if(pos){ L.marker(pos,{icon:pin(s.n,'audio')}).addTo(layer).bindTooltip(t).on('click',()=>play(id)); pts.push(pos) }
    const dd=(me&&pos)?` · ${fmtD(dist(me,pos))} от вас`:'';
    list.insertAdjacentHTML('beforeend',`<div class="step"><div class="badge k-audio">${s?s.n:'🎧'}</div><div class="body"><div class="ttl">${t}</div><div class="time">${s?s.sub:'можно слушать где угодно'}${dd}</div>${s&&s.kid?`<div class="kid"><b>Для ребёнка:</b> ${s.kid}</div>`:''}<div class="acts"><button class="play" data-a="${id}">▶ ${heard[id]?'Ещё раз':'Слушать'}</button>${pos?`<a target="_blank" rel="noopener" href="https://www.google.com/maps/dir/?api=1&destination=${pos[0]},${pos[1]}&travelmode=walking">Пешком ↗</a>`:''}</div>${s?`<details><summary class="small">Текст записи</summary>${s.text.map(p=>`<p class="txt">${p}</p>`).join('')}</details>`:''}</div></div>`);
  });
  drawHotel(); drawMe();
  if(fit&&pts.length) map.fitBounds(pts,{padding:[30,30]});
}
function select(i,scroll){ selIdx=i; render(false); const s=DATA.days.find(d=>d.id===day).steps[i]; const p=stepPos(s); if(p) map.setView(p,Math.max(map.getZoom(),16)); if(scroll){const e=document.getElementById('st'+i); e&&e.scrollIntoView({behavior:'smooth',block:'center'})} }
document.getElementById('list').addEventListener('click',e=>{
  const b=e.target.closest('button'); if(!b) return;
  if(b.dataset.a) play(b.dataset.a);
  if(b.dataset.show) select(+b.dataset.show,false);
  if(b.dataset.done){ done[b.dataset.done]=!done[b.dataset.done]; LS.set('done',done); render(false) }
  if(b.dataset.hotel) chooseHotel();
});
// ---- плеер
const A=new Audio(); A.preload='none'; let cur=null;
const P=document.getElementById('player'), PP=document.getElementById('pp'), PT=document.getElementById('ptitle'), PB=document.querySelector('#pbar div');
function play(id){ const [f,t]=DATA.audio[id]; if(cur!==id){A.src='audio/'+f; cur=id} A.play(); P.style.display='block'; PT.textContent=t; hideNear(); }
PP.onclick=()=>{ A.paused?A.play():A.pause() };
document.getElementById('px').onclick=()=>{A.pause(); P.style.display='none'};
A.onplay=()=>PP.textContent='❚❚'; A.onpause=()=>PP.textContent='▶';
A.ontimeupdate=()=>{ if(A.duration) PB.style.width=(100*A.currentTime/A.duration)+'%' };
A.onended=()=>{ heard[cur]=1; LS.set('heard',heard); PP.textContent='▶'; render(false) };
// ---- геолокация
const BME=document.getElementById('bme');
BME.onclick=()=>{
  if(!navigator.geolocation){alert('Телефон не отдаёт геопозицию');return}
  if(watch===null){ follow=true; BME.classList.add('on'); BME.textContent='◎ Слежу';
    watch=navigator.geolocation.watchPosition(onPos,err=>{alert('Нет доступа к геопозиции: разрешите её для этой страницы в настройках браузера'); stopWatch()},{enableHighAccuracy:true,maximumAge:5000,timeout:20000});
  } else if(!follow){ follow=true; me&&map.setView(me,17) } else stopWatch();
};
function stopWatch(){ if(watch!==null) navigator.geolocation.clearWatch(watch); watch=null; follow=false; BME.classList.remove('on'); BME.textContent='◎ Где я' }
map.on('dragstart',()=>{ if(watch!==null){follow=false; BME.textContent='◎ К себе'} });
let lastRender=0;
function onPos(p){ me=[p.coords.latitude,p.coords.longitude]; drawMe(p.coords.accuracy); if(follow) map.setView(me,Math.max(map.getZoom(),16)); checkNear(); if(Date.now()-lastRender>15000){lastRender=Date.now(); render(false)} }
function drawMe(acc){ if(!me) return; if(!meMk){ meMk=L.marker(me,{icon:L.divIcon({className:'',html:'<div class="me"></div>',iconSize:[18,18],iconAnchor:[9,9]}),zIndexOffset:2000}).addTo(map); meAcc=L.circle(me,{radius:acc||30,color:'#1a73e8',weight:1,fillOpacity:.1}).addTo(map) } else { meMk.setLatLng(me); meAcc.setLatLng(me); if(acc) meAcc.setRadius(acc) } }
// ---- рядом с остановкой
const NEAR=document.getElementById('near');
function checkNear(){
  if(!me) return; let best=null;
  for(const [id,s] of Object.entries(DATA.stops)){ const d=dist(me,[s.lat,s.lon]); if(d<60&&(!best||d<best.d)) best={id,s,d} }
  if(!best||heard[best.id]||cur===best.id&&!A.paused||(snooze[best.id]&&Date.now()<snooze[best.id])) { if(!best) hideNear(); return }
  NEAR.innerHTML=`<b>Вы рядом: ${best.s.n}. ${best.s.title}</b><div class="small" style="margin:2px 0">${fmtD(best.d)} · запись ${DATA.audio[best.id][1]}</div><div class="acts"><button class="play" onclick="play('${best.id}')">▶ Слушать</button><button onclick="snooze['${best.id}']=Date.now()+600000;hideNear()">Позже</button></div>`;
  NEAR.style.display='block';
}
function hideNear(){ NEAR.style.display='none' }
// ---- отель
function drawHotel(){ if(hotelMk){map.removeLayer(hotelMk);hotelMk=null} if(hotel) hotelMk=L.marker([hotel.lat,hotel.lon],{icon:pin('⌂','hotel')}).addTo(map).bindTooltip(hotel.name) }
function chooseHotel(){
  const opts=DATA.hotels.map((h,i)=>`${i+1} — ${h.name}`).join('\n');
  const a=prompt(`Где вы живёте? Введите номер:\n${opts}\n${DATA.hotels.length+1} — поставить в центр карты\n0 — убрать отметку`, '');
  if(a===null) return; const n=parseInt(a,10);
  if(n===0){hotel=null} else if(n>=1&&n<=DATA.hotels.length){hotel=DATA.hotels[n-1]} else if(n===DATA.hotels.length+1){const c=map.getCenter(); hotel={name:'Мой отель',lat:c.lat,lon:c.lng}} else return;
  LS.set('hotel',hotel); render(false);
}
document.getElementById('bhotel').onclick=()=>{ if(hotel&&!confirm(`Отель: ${hotel.name}. Поменять?`)){map.setView([hotel.lat,hotel.lon],17);return} chooseHotel() };
// ---- офлайн
document.getElementById('boff').onclick=async()=>{
  if(!('caches' in window)){alert('Браузер не умеет офлайн');return}
  const b=document.getElementById('boff'); const c=await caches.open('colonia-v3');
  const list=['./','index.html','https://unpkg.com/leaflet@1.9.4/dist/leaflet.css','https://unpkg.com/leaflet@1.9.4/dist/leaflet.js',...Object.values(DATA.audio).map(a=>'audio/'+a[0])];
  let n=0; for(const u of list){ try{await c.add(u); n++; b.textContent=`⇩ ${n}/${list.length}`}catch(e){} }
  b.textContent=n===list.length?'✓ Офлайн':'⇩ '+n+'/'+list.length;
  alert(n===list.length?'Готово: страница и все записи сохранены в телефоне. Карту полистайте по Wi-Fi — просмотренные места тоже запомнятся.':'Сохранилось не всё, повторите при хорошем интернете.');
};
if('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js');
render(true);
</script></body></html>
